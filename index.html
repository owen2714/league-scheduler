  advanceDoubleElim();
}
function advanceDoubleElim(){
  const t=App.current, b=t.playoffBracket;
  if(!b || b.format!=='double') return;
  if(!b._wbFolded) b._wbFolded={}; if(!b._lbFolded) b._lbFolded={};
  let progressed=true, guard=0;
  while(progressed && guard++<100){
    progressed=false;

    const wbCur = b.series.filter(s=>s.bracket==='winners' && s.round===b.wbRound);
    const wbCurDone = wbCur.length===0 || wbCur.every(s=>seriesWinnerId(s)!=null);
    if(wbCurDone && b.wbRound>0 && !b._wbFolded[b.wbRound]){
      wbCur.forEach(s=>{
        const w=seriesWinnerId(s);
        const l = s.isByeSlot ? null : (s.teamA===w? s.teamB : s.teamA);
        if(w && !b.wbPool.includes(w) && b.wbChamp!==w) b.wbPool.push(w);
        if(l && !b.lbPool.includes(l)) b.lbPool.push(l);
      });
      b._wbFolded[b.wbRound]=true;
      progressed=true;
    }
    if(wbCurDone){
      const nextExists = b.series.some(s=>s.bracket==='winners' && s.round===b.wbRound+1);
      if(!nextExists && b.wbPool.length>1){
        b.wbRound++;
        const {series:ns, carry} = pairPoolIntoSeries(b.wbPool, 'winners', b.wbRound, 'Winners Round '+b.wbRound);
        b.wbPool = carry? [carry] : [];
        ns.forEach(s=>{ b.series.push(s); generateSeriesGames(s); });
        if(ns.length) progressed=true;
      } else if(!nextExists && b.wbPool.length===1 && !b.wbChamp){
        b.wbChamp = b.wbPool[0]; b.wbPool=[];
        progressed=true;
      }
    }

    const lbCur = b.series.filter(s=>s.bracket==='losers' && s.round===b.lbRound);
    const lbCurDone = lbCur.length===0 || lbCur.every(s=>seriesWinnerId(s)!=null);
    if(lbCurDone && b.lbRound>0 && !b._lbFolded[b.lbRound]){
      lbCur.forEach(s=>{
        const w=seriesWinnerId(s);
        if(w && !b.lbPool.includes(w) && b.lbChamp!==w) b.lbPool.push(w);
      });
      b._lbFolded[b.lbRound]=true;
      progressed=true;
    }
    if(lbCurDone){
      const nextExists = b.series.some(s=>s.bracket==='losers' && s.round===b.lbRound+1);
      const wbStillFeeding = b.wbPool.length>0 || !wbCurDone;
      if(!nextExists && b.lbPool.length>1){
        b.lbRound++;
        const {series:ns, carry} = pairPoolIntoSeries(b.lbPool, 'losers', b.lbRound, 'Losers Round '+b.lbRound);
        b.lbPool = carry? [carry] : [];
        ns.forEach(s=>{ b.series.push(s); generateSeriesGames(s); });
        if(ns.length) progressed=true;
      } else if(!nextExists && b.lbPool.length===1 && b.wbChamp && !wbStillFeeding && !b.lbChamp){
        b.lbChamp = b.lbPool[0]; b.lbPool=[];
        progressed=true;
      }
    }

    if(b.wbChamp && b.lbChamp){
      const gf = b.series.find(s=>s.bracket==='grand');
      if(!gf){
        const roundDef = t.settings.playoffs.rounds[t.settings.playoffs.rounds.length-1];
        const sObj={id:uid('series'), round:9000, roundName:'Grand Finals', bracket:'grand', confLabel:'',
          teamA:b.wbChamp, teamB:b.lbChamp, seedA:null, seedB:null,
          gamesToWin:roundDef.gamesToWin, homeAway:roundDef.homeAway, mode:roundDef.mode||'bestof', numGames:roundDef.numGames,
          lowerSeedHostsFirst: !!roundDef.lowerSeedHostsFirst,
          gameIds:[], nextSeriesId:null, isByeSlot:false};
        b.series.push(sObj); generateSeriesGames(sObj);
        progressed=true;
      } else {
        const gfWinner = seriesWinnerId(gf);
        if(gfWinner && gfWinner===b.lbChamp && !b.series.some(s=>s.bracket==='grandReset')){
          const roundDef = t.settings.playoffs.rounds[t.settings.playoffs.rounds.length-1];
          const sObj={id:uid('series'), round:9001, roundName:'Grand Finals (Bracket Reset)', bracket:'grandReset', confLabel:'',
            teamA:b.wbChamp, teamB:b.lbChamp, seedA:null, seedB:null,
            gamesToWin:roundDef.gamesToWin, homeAway:roundDef.homeAway, mode:roundDef.mode||'bestof', numGames:roundDef.numGames,
            lowerSeedHostsFirst: !!roundDef.lowerSeedHostsFirst,
            gameIds:[], nextSeriesId:null, isByeSlot:false};
          b.series.push(sObj); generateSeriesGames(sObj);
          progressed=true;
        }
      }
    }
  }
}
function doubleElimChampion(){
  const t=App.current, b=t.playoffBracket;
  if(!b || b.format!=='double') return null;
  const reset = b.series.find(s=>s.bracket==='grandReset');
  if(reset) return seriesWinnerId(reset);
  const gf = b.series.find(s=>s.bracket==='grand');
  if(gf){
    const w = seriesWinnerId(gf);
    if(w && w===b.wbChamp) return b.wbChamp;
    return null;
  }
  return null;
}
function generateSeriesGames(sObj){
  const t=App.current;
  if(!sObj.teamA || !sObj.teamB) return;
  const pattern = (sObj.homeAway||'1-1').split('-').map(x=>+x).filter(n=>n>0);
  const maxGames = sObj.mode==='aggregate' ? Math.max(1, sObj.numGames||2) : sObj.gamesToWin*2-1;
  let higherIsA;
  if(sObj.seedA!=null && sObj.seedB!=null && sObj.seedA!==sObj.seedB){
    higherIsA = sObj.seedA < sObj.seedB;
  } else {
    higherIsA = betterSeedTeamId(sObj.teamA, sObj.teamB) === sObj.teamA;
  }
  if(sObj.lowerSeedHostsFirst) higherIsA = !higherIsA;
  let gi=0, patIdx=0, homeIsA=higherIsA;
  const games=[];
  while(gi<maxGames){
    const blockLen = pattern.length? pattern[patIdx % pattern.length] : 1;
    for(let k=0;k<blockLen && gi<maxGames;k++,gi++){
      const home = homeIsA? sObj.teamA : sObj.teamB;
      const away = homeIsA? sObj.teamB : sObj.teamA;
      games.push({id:uid('g'), week:null, home, away, homeScore:null, awayScore:null, ot:false, otPointsHome:0, otPointsAway:0, pk:false, neutralSite:false, isPlayoff:true, seriesId:sObj.id, gameNum:gi+1});
    }
    homeIsA=!homeIsA; patIdx++;
  }
  t.games.push(...games);
  sObj.gameIds = games.map(g=>g.id);
}
/* ---------------------------- running series score ---------------------------- */
function seriesScoreInfo(g){
  if(!g || !g.isPlayoff || !g.seriesId) return null;
  const {sObj}=findSeriesAnyBracket(g.seriesId);
  if(!sObj || !sObj.teamA || !sObj.teamB) return null;
  const t=App.current;
  const games=t.games.filter(x=>x.seriesId===g.seriesId).sort((a,b)=>(a.gameNum||0)-(b.gameNum||0));
  const agg = sObj.mode==='aggregate';
  let a=0,b=0;
  const upto = g.homeScore!=null ? (x=>(x.gameNum||0)<=(g.gameNum||0)) : (x=>(x.gameNum||0)<(g.gameNum||0));
  games.forEach(x=>{
    if(x.homeScore==null || !upto(x)) return;
    const aHome=x.home===sObj.teamA, as=aHome?x.homeScore:x.awayScore, bs=aHome?x.awayScore:x.homeScore;
    if(agg){ a+=as; b+=bs; } else if(as>bs) a++; else if(bs>as) b++;
  });
  return {a,b,agg,teamA:sObj.teamA,teamB:sObj.teamB,played:g.homeScore!=null};
}
function seriesScoreText(a,b,teamA,teamB,agg){
  if(a===b) return `${a}-${b}`;
  const lead=a>b?teamA:teamB, hi=Math.max(a,b), lo=Math.min(a,b);
  return `${hi}-${lo} ${teamName(lead)}`;
}
function seriesScorePill(g){
  const i=seriesScoreInfo(g); if(!i) return '';
  const txt=seriesScoreText(i.a,i.b,i.teamA,i.teamB,i.agg);
  return `<span class="pill series-score" title="${i.played?'Series score after this game':'Series score going into this game'}">${i.played?'':'Series '}${esc(txt)}</span>`;
}
function seriesHeadline(sObj){
  if(!sObj || !sObj.teamA || !sObj.teamB || sObj.isByeSlot) return '';
  const rec=seriesRecord(sObj);
  const w=seriesWinnerId(sObj);
  const txt=seriesScoreText(rec.aWins, rec.bWins, sObj.teamA, sObj.teamB, sObj.mode==='aggregate');
  return `<div class="row" style="margin-top:8px;align-items:center;"><span class="pill series-score" style="font-size:13px;">Series: ${esc(txt)}</span>${w?`<span class="pill" style="border-color:var(--good,#3ecf8e);">\ud83c\udfc6 ${esc(teamName(w))} advance</span>`:''}</div>`;
}
function seriesRecord(sObj){
  const t=App.current;
  const games = t.games.filter(g=>g.seriesId===sObj.id).sort((a,b)=>a.gameNum-b.gameNum);
  if(sObj.mode==='aggregate'){
    let aPts=0,bPts=0,decidedCount=0;
    games.forEach(g=>{
      if(g.homeScore==null) return;
      decidedCount++;
      const aIsHome=g.home===sObj.teamA;
      aPts += aIsHome?g.homeScore:g.awayScore;
      bPts += aIsHome?g.awayScore:g.homeScore;
    });
    return {aWins:aPts, bWins:bPts, games, decidedCount};
  }
  let aWins=0,bWins=0;
  games.forEach(g=>{
    if(g.homeScore==null) return;
    const aIsHome = g.home===sObj.teamA;
    const aScore=aIsHome?g.homeScore:g.awayScore, bScore=aIsHome?g.awayScore:g.homeScore;
    if(aScore>bScore) aWins++; else if(bScore>aScore) bWins++;
  });
  return {aWins,bWins,games,decidedCount:games.filter(g=>g.homeScore!=null).length};
}
function seriesWinnerId(sObj){
  if(sObj.isByeSlot) return sObj.teamA;
  if(!sObj.teamA || !sObj.teamB) return null;
  const rec=seriesRecord(sObj);
  if(sObj.mode==='aggregate'){
    const totalGames = sObj.numGames||2;
    if(rec.decidedCount < totalGames) return null;
    if(rec.aWins>rec.bWins) return sObj.teamA;
    if(rec.bWins>rec.aWins) return sObj.teamB;
    return null;
  }
  if(rec.aWins>=sObj.gamesToWin) return sObj.teamA;
  if(rec.bWins>=sObj.gamesToWin) return sObj.teamB;
  return null;
}
function seriesLoserId(sObj){
  if(sObj.isByeSlot || !sObj.teamA || !sObj.teamB) return null;
  const w=seriesWinnerId(sObj);
  if(!w) return null;
  return sObj.teamA===w ? sObj.teamB : sObj.teamA;
}
function findSeriesAnyBracket(seriesId){
  const t=App.current;
  let s = t.playoffBracket && t.playoffBracket.series.find(x=>x.id===seriesId);
  if(s) return {sObj:s, isSub:false, isReleg:false, groupName:null};
  if(t.subPlayoffBrackets){
    for(const g in t.subPlayoffBrackets){
      const f=t.subPlayoffBrackets[g].series.find(x=>x.id===seriesId);
      if(f) return {sObj:f, isSub:true, isReleg:false, groupName:g};
    }
  }
  if(t.relegationPlayoffBrackets){
    for(const k in t.relegationPlayoffBrackets){
      const f=t.relegationPlayoffBrackets[k].series.find(x=>x.id===seriesId);
      if(f) return {sObj:f, isSub:false, isReleg:true, groupName:k};
    }
  }
  return {sObj:null, isSub:false, isReleg:false, groupName:null};
}
function pruneDecidedSeriesGames(seriesId){
  const t=App.current; if(!t.playoffBracket) return;
  const sObj=t.playoffBracket.series.find(s=>s.id===seriesId); if(!sObj) return;
  if(sObj.mode!=='aggregate'){
    const {aWins,bWins}=seriesRecord(sObj);
    if(aWins>=sObj.gamesToWin || bWins>=sObj.gamesToWin){
      t.games = t.games.filter(g=> !(g.seriesId===seriesId && g.homeScore==null));
    }
  }
  if(t.playoffBracket.format==='double'){
    advanceDoubleElim();
    checkForChampion();
    return;
  }
  reconcileDownstream(sObj);
  advanceBracket();
  checkForChampion();
}
function reconcileDownstream(sObj){
  const t=App.current;
  if(!sObj) return;
  let cur=sObj;
  while(cur && cur.nextSeriesId){
    const next = t.playoffBracket.series.find(s=>s.id===cur.nextSeriesId);
    if(!next) break;
    const winnerOfCur = seriesWinnerId(cur);
    const wasA = next.feedsFrom && next.feedsFrom[0]===cur.id;
    const wasB = next.feedsFrom && next.feedsFrom[1]===cur.id;
    let changed=false;
    if(wasA && next.teamA && next.teamA!==winnerOfCur){ next.teamA=null; next.seedA=null; changed=true; }
    if(wasB && next.teamB && next.teamB!==winnerOfCur){ next.teamB=null; next.seedB=null; changed=true; }
    if(!changed) break;
    t.games = t.games.filter(g=>g.seriesId!==next.id);
    next.gameIds=[];
    if(t.playoffBracket.victoryShownFor) t.playoffBracket.victoryShownFor=null;
    cur = next;
  }
}
function advanceBracket(){
  const t=App.current; if(!t.playoffBracket) return;
  if(t.settings.playoffs.reseedEachRound){ advanceBracketReseeded(); return; }
  let changed=true, guard=0;
  while(changed && guard++<20){
    changed=false;
    t.playoffBracket.series.forEach(sObj=>{
      if(sObj.feedsFromLosers && !(sObj.teamA && sObj.teamB)){
        const [la,lb]=sObj.feedsFromLosers;
        const sa=t.playoffBracket.series.find(s=>s.id===la), sb=t.playoffBracket.series.find(s=>s.id===lb);
        const loserA = sa?seriesLoserId(sa):null, loserB = sb?seriesLoserId(sb):null;
        if(loserA && !sObj.teamA){ sObj.teamA=loserA; changed=true; }
        if(loserB && !sObj.teamB){ sObj.teamB=loserB; changed=true; }
        if(sObj.teamA && sObj.teamB && sObj.gameIds.length===0){ generateSeriesGames(sObj); changed=true; }
      }
      if(!sObj.feedsFrom) return;
      if(sObj.teamA && sObj.teamB) return;
      const [fa,fb]=sObj.feedsFrom;
      const sa=t.playoffBracket.series.find(s=>s.id===fa);
      const sb=t.playoffBracket.series.find(s=>s.id===fb);
      let winnerA = sa ? seriesWinnerId(sa) : null;
      let winnerB = sb ? seriesWinnerId(sb) : null;
      if(winnerA && !sObj.teamA){
        sObj.teamA=winnerA;
        sObj.seedA = sa.teamA===winnerA ? sa.seedA : sa.seedB;
        changed=true;
      }
      if(winnerB && !sObj.teamB){
        sObj.teamB=winnerB;
        sObj.seedB = sb.teamA===winnerB ? sb.seedA : sb.seedB;
        changed=true;
      }
      if(sObj.teamA && sObj.teamB && sObj.gameIds.length===0){ generateSeriesGames(sObj); changed=true; }
    });
  }
}
function advanceBracketReseeded(){
  const t=App.current, roundDefs=t.settings.playoffs.rounds;
  const series=t.playoffBracket.series;
  const maxRound = Math.max(...series.map(s=>s.round));
  const currentRoundSeries = series.filter(s=>s.round===maxRound);
  if(series.some(s=>s.round===maxRound+1)) return;
  const allDecided = currentRoundSeries.every(s=>seriesWinnerId(s)!=null);
  if(!allDecided || currentRoundSeries.length<=1) return;
  const winners = currentRoundSeries.map(s=>{
    const wid = seriesWinnerId(s);
    const seed = (s.teamA===wid) ? s.seedA : s.seedB;
    return {id:wid, seed: seed!=null?seed:9999, confLabel:s.confLabel};
  }).sort((a,b)=>a.seed-b.seed);
  const isFinal = winners.length===2;
  const roundDef = roundDefs[maxRound+1] || roundDefs[roundDefs.length-1] || {name:isFinal?'Finals':'Round '+(maxRound+2), mode:'bestof', gamesToWin:1, homeAway:'1-1'};
  const half = winners.length/2;
  for(let i=0;i<half;i++){
    const top = winners[i], bottom = winners[winners.length-1-i];
    const sid=uid('series');
    const sObj={id:sid, round:maxRound+1, roundName:roundDef.name,
      confLabel: top.confLabel===bottom.confLabel?top.confLabel:'Championship',
      teamA: top.id, teamB: bottom.id, seedA: top.seed, seedB: bottom.seed,
      gamesToWin:roundDef.gamesToWin, homeAway:roundDef.homeAway, mode:roundDef.mode||'bestof', numGames:roundDef.numGames,
      lowerSeedHostsFirst: !!roundDef.lowerSeedHostsFirst,
      gameIds:[], nextSeriesId:null, isByeSlot:false};
    series.push(sObj);
    generateSeriesGames(sObj);
  }
}

function renderDoubleElimColumns(){

function seriesTeamRowHtml(teamId, seed, name, score, isWinner, isBye){

function renderSeriesCard(sObj){
  const rec=seriesRecord(sObj);

  const isBye = sObj.isByeSlot;
  const rv = (!isBye && sObj.teamA && sObj.teamB) ? rivalryFor(sObj.teamA, sObj.teamB) : null;
  const nameA = sObj.teamA? teamName(sObj.teamA) : 'TBD';
  const nameB = isBye ? 'BYE' : (sObj.teamB? teamName(sObj.teamB) : 'TBD');
  const singleGame = sObj.mode!=='aggregate' && sObj.gamesToWin===1;
  // One game or an aggregate score: show the actual point total right next to each name.
  // A real multi-game series: show the series win count (e.g. 3 wins to 1) instead, since
  // that's the number that actually matters there.
  let scoreA='', scoreB='', otPkNote='';
  if(!isBye){
    if(sObj.mode==='aggregate'){
      scoreA = rec.aWins; scoreB = rec.bWins;
    } else if(singleGame){
      const gm = App.current.games.find(x=>x.seriesId===sObj.id);
      if(gm && gm.homeScore!=null){
        const aIsHome = gm.home===sObj.teamA;
        scoreA = aIsHome?gm.homeScore:gm.awayScore;
        scoreB = aIsHome?gm.awayScore:gm.homeScore;
        if(gm.ot) otPkNote='OT';
        if(gm.pk) otPkNote = otPkNote? otPkNote+' \u00b7 PK' : 'PK';
      }
    } else {
      scoreA = rec.aWins; scoreB = rec.bWins;
    }
  }
  const winA = winnerId ? winnerId===sObj.teamA : null;
  const winB = winnerId ? winnerId===sObj.teamB : null;
  const topLabel = sObj.confLabel==='Third Place' ? '\ud83e\udd49 Third place' : (sObj.mode==='aggregate' && !isBye ? 'Aggregate score' : '');
  return `<div class="series-card${rv?' rival':''}" id="s_${sObj.id}" onclick="openSeriesModal('${sObj.id}')">

    ${seriesTeamRowHtml(sObj.teamB, sObj.seedB, nameB, scoreB, winB, isBye)}

}

function randomizeSeries(seriesId){
  const t=App.current, s=t.settings;

  if(!sObj || !sObj.teamA || !sObj.teamB) return;
  t.games = t.games.filter(g=>g.seriesId!==seriesId);
  sObj.gameIds=[];
  if(isSub) generateSubPlayoffSeriesGames(sObj);
  else if(isReleg) generateRelegationPlayoffGames(sObj);
  else generateSeriesGames(sObj);
  const games=t.games.filter(g=>g.seriesId===seriesId).sort((a,b)=>a.gameNum-b.gameNum);
  for(const g of games){
    if(sObj.mode!=='aggregate'){
      const rec=seriesRecord(sObj);
      if(rec.aWins>=sObj.gamesToWin || rec.bWins>=sObj.gamesToWin) break;
    }
    const r=computeRandomScoreForPlayoffGame(g,s,sObj);
    g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk;
    g.otPointsHome = r.ot?r.otPointsHome:0; g.otPointsAway = r.ot?r.otPointsAway:0;
  }
  if(isSub) pruneDecidedSubPlayoffGames(seriesId, groupName);

/* ================================ DIVISION/CONFERENCE PLAYOFFS ================================ */
function generateSubPlayoffSeriesGames(sObj){
  const t=App.current;
  if(!sObj.teamA || !sObj.teamB) return;
  const pattern=(sObj.homeAway||'1').split('-').map(x=>+x).filter(n=>n>0);
  const maxGames = sObj.gamesToWin*2-1;
  const higherIsA = betterSeedTeamId(sObj.teamA, sObj.teamB)===sObj.teamA;
  let gi=0, patIdx=0, homeIsA=higherIsA;
  const games=[];
  while(gi<maxGames){
    const blockLen = pattern.length?pattern[patIdx%pattern.length]:1;
    for(let k=0;k<blockLen && gi<maxGames;k++,gi++){
      const home=homeIsA?sObj.teamA:sObj.teamB, away=homeIsA?sObj.teamB:sObj.teamA;
      games.push({id:uid('g'), week:null, home, away, homeScore:null, awayScore:null, ot:false, otPointsHome:0, otPointsAway:0, pk:false, neutralSite:false, isPlayoff:true, isSubPlayoff:true, subPlayoffGroup:sObj.groupName, seriesId:sObj.id, gameNum:gi+1});
    }
    homeIsA=!homeIsA; patIdx++;
  }
  t.games.push(...games);
  sObj.gameIds=games.map(g=>g.id);
}
function advanceSubPlayoffBracket(groupName){
  const t=App.current; const b=t.subPlayoffBrackets && t.subPlayoffBrackets[groupName];
  if(!b) return;
  let changed=true, guard=0;
  while(changed && guard++<20){
    changed=false;
    b.series.forEach(sObj=>{
      if(sObj.feedsFrom && !(sObj.teamA&&sObj.teamB)){
        const [fa,fb]=sObj.feedsFrom;
        const sa=b.series.find(s=>s.id===fa), sb=b.series.find(s=>s.id===fb);
        const wa=sa?seriesWinnerId(sa):null, wb=sb?seriesWinnerId(sb):null;
        if(wa && !sObj.teamA){ sObj.teamA=wa; sObj.seedA=sa.teamA===wa?sa.seedA:sa.seedB; changed=true; }
        if(wb && !sObj.teamB){ sObj.teamB=wb; sObj.seedB=sb.teamA===wb?sb.seedA:sb.seedB; changed=true; }
        if(sObj.teamA && sObj.teamB && sObj.gameIds.length===0){ generateSubPlayoffSeriesGames(sObj); changed=true; }
      }
      if(sObj.feedsFromLosers && !(sObj.teamA&&sObj.teamB)){
        const [fa,fb]=sObj.feedsFromLosers;
        const sa=b.series.find(s=>s.id===fa), sb=b.series.find(s=>s.id===fb);
        const la=sa?seriesLoserId(sa):null, lb=sb?seriesLoserId(sb):null;
        if(la && !sObj.teamA){ sObj.teamA=la; changed=true; }
        if(lb && !sObj.teamB){ sObj.teamB=lb; changed=true; }
        if(sObj.teamA && sObj.teamB && sObj.gameIds.length===0){ generateSubPlayoffSeriesGames(sObj); changed=true; }
      }
    });
  }
}
function pruneDecidedSubPlayoffGames(seriesId, groupName){
  const t=App.current; const b=t.subPlayoffBrackets && t.subPlayoffBrackets[groupName];
  if(!b) return;
  const sObj=b.series.find(s=>s.id===seriesId); if(!sObj) return;
  const {aWins,bWins}=seriesRecord(sObj);
  if(aWins>=sObj.gamesToWin || bWins>=sObj.gamesToWin){
    t.games = t.games.filter(g=> !(g.seriesId===seriesId && g.homeScore==null));
  }
  advanceSubPlayoffBracket(groupName);
}
function subPlayoffCfgFor(groupName){
  const sp=App.current.settings.subPlayoffs;
  return sp.uniform ? sp.uniformConfig : (sp.configs[groupName]||sp.uniformConfig);
}
function buildSubPlayoffBracket(groupName){
  const t=App.current, s=t.settings, sp=s.subPlayoffs;
  const cfg = subPlayoffCfgFor(groupName);
  if(cfg.playoffEnabled===false){ showToast('This group has no playoff enabled'); return; }
  const keyFn = sp.basis==='conference' ? (x=>x.conference) : (x=>x.division);
  const poolTeams = t.teams.filter(x=>keyFn(x)===groupName);
  const rows = standingsRows(poolTeams, t.games, false);
  const n = Math.min(cfg.teamsCount, rows.length);
  if(n<2){ showToast('Not enough teams in '+groupName); return; }
  const qualified = rows.slice(0,n).map(r=>r.team);
  t.games = t.games.filter(g=>!(g.isSubPlayoff && g.subPlayoffGroup===groupName));
  let size=1; while(size<qualified.length) size*=2;
  const seedOrder = standardSeedOrder(size);
  const slots = seedOrder.map(seedNum=> seedNum<=qualified.length ? {team:qualified[seedNum-1], seed:seedNum} : {team:null, seed:null});
  const series=[]; let roundSeries=[];
  for(let i=0;i<slots.length;i+=2){
    const A=slots[i], B=slots[i+1];
    if(!A.team && !B.team) continue;
    const sObj={id:uid('sp_series'), round:0, roundName:'Round 1', groupName, teamA:A.team?A.team.id:null, teamB:B.team?B.team.id:null, seedA:A.seed, seedB:B.seed,
      gamesToWin:cfg.gamesToWin, homeAway:cfg.homeAway, mode:'bestof', numGames:cfg.gamesToWin*2-1, lowerSeedHostsFirst:false,
      gameIds:[], nextSeriesId:null, isByeSlot:false, isSubPlayoff:true};
    if(sObj.teamA && !sObj.teamB) sObj.isByeSlot=true;
    else if(!sObj.teamA && sObj.teamB){ sObj.teamA=sObj.teamB; sObj.teamB=null; sObj.seedA=sObj.seedB; sObj.seedB=null; sObj.isByeSlot=true; }
    series.push(sObj); roundSeries.push(sObj);
    if(sObj.teamA && sObj.teamB) generateSubPlayoffSeriesGames(sObj);
  }
  let r=1;
  while(roundSeries.length>1){
    const isFinal = roundSeries.length===2;
    const nextRound=[];
    for(let i=0;i<roundSeries.length;i+=2){
      const sA=roundSeries[i], sB=roundSeries[i+1];
      const sObj={id:uid('sp_series'), round:r, roundName:isFinal?'Final':'Round '+(r+1), groupName, teamA:null, teamB:null, seedA:null, seedB:null,
        gamesToWin:cfg.gamesToWin, homeAway:cfg.homeAway, mode:'bestof', numGames:cfg.gamesToWin*2-1, lowerSeedHostsFirst:false,
        gameIds:[], nextSeriesId:null, feedsFrom:[sA.id,sB.id], isByeSlot:false, isSubPlayoff:true};
      series.push(sObj); nextRound.push(sObj);
      sA.nextSeriesId=sObj.id; sB.nextSeriesId=sObj.id;
    }
    roundSeries=nextRound; r++;
    if(r>20) break;
  }
  if(cfg.thirdPlace && series.length>=3){
    const finalSeries = series[series.length-1];
    if(finalSeries.feedsFrom){
      const semiA=series.find(x=>x.id===finalSeries.feedsFrom[0]), semiB=series.find(x=>x.id===finalSeries.feedsFrom[1]);
      if(semiA && semiB && !semiA.isByeSlot && !semiB.isByeSlot){
        series.push({id:uid('sp_series'), round:finalSeries.round, roundName:'Third Place', groupName, teamA:null, teamB:null, seedA:null, seedB:null,
          gamesToWin:cfg.gamesToWin, homeAway:cfg.homeAway, mode:'bestof', numGames:cfg.gamesToWin*2-1, lowerSeedHostsFirst:false,
          gameIds:[], nextSeriesId:null, feedsFromLosers:[semiA.id,semiB.id], isByeSlot:false, isSubPlayoff:true});
      }
    }
  }
  if(!t.subPlayoffBrackets) t.subPlayoffBrackets={};
  t.subPlayoffBrackets[groupName] = {series};
  advanceSubPlayoffBracket(groupName);
  scheduleSave(); renderTab();
}
function seedAllSubPlayoffBrackets(){
  const s=App.current.settings.subPlayoffs;
  const groupNames = s.basis==='conference' ? App.current.settings.conferenceNames : App.current.settings.divisionNames;
  let count=0;
  groupNames.forEach(name=>{

function renderSubPlayoffGamesByRound(groupName, b){
  const t=App.current;
  const games = t.games.filter(g=>g.isSubPlayoff && g.subPlayoffGroup===groupName);
  if(!games.length) return '';
  const seriesOrderIndex={}; b.series.forEach((sr,i)=>{ seriesOrderIndex[sr.id]=i; });
  const rounds=[...new Set(b.series.map(sr=>sr.round))].sort((a,c)=>a-c);
  const byRound={};
  games.forEach(g=>{
    const sr=b.series.find(x=>x.id===g.seriesId);
    const rn = sr?sr.roundName:'Other';
    (byRound[rn]=byRound[rn]||[]).push(g);
  });
  Object.keys(byRound).forEach(rn=>{
    byRound[rn].sort((a,c)=>{
      const ia=seriesOrderIndex[a.seriesId]!=null?seriesOrderIndex[a.seriesId]:999999;
      const ic=seriesOrderIndex[c.seriesId]!=null?seriesOrderIndex[c.seriesId]:999999;
      if(ia!==ic) return ia-ic;
      return (a.gameNum||0)-(c.gameNum||0);
    });
  });
  const roundNames = rounds.map(r=>{ const sr=b.series.find(x=>x.round===r); return sr?sr.roundName:null; }).filter((v,i,a)=>v && a.indexOf(v)===i);

    ${roundNames.map(rn=>`
      <div class="card" style="padding:0;overflow:hidden;">
        <h4 style="padding:8px 12px 0 12px;font-size:12.5px;">${esc(rn)}</h4>
        <div>${(byRound[rn]||[]).map(g=>gameRow(g)).join('')}</div>
      </div>
    `).join('')}
  </div>`;
}

/* ================================ PROMOTION / RELEGATION PLAYOFFS ================================ */
function generateRelegationPlayoffGames(sObj){
  const t=App.current;
  if(!sObj.teamA || !sObj.teamB) return;
  const pattern=(sObj.homeAway||'1').split('-').map(x=>+x).filter(n=>n>0);
  const maxGames = sObj.gamesToWin*2-1;
  const higherIsA = betterSeedTeamId(sObj.teamA, sObj.teamB)===sObj.teamA;
  let gi=0, patIdx=0, homeIsA=higherIsA;
  const games=[];
  while(gi<maxGames){
    const blockLen = pattern.length?pattern[patIdx%pattern.length]:1;
    for(let k=0;k<blockLen && gi<maxGames;k++,gi++){
      const home=homeIsA?sObj.teamA:sObj.teamB, away=homeIsA?sObj.teamB:sObj.teamA;
      games.push({id:uid('g'), week:null, home, away, homeScore:null, awayScore:null, ot:false, otPointsHome:0, otPointsAway:0, pk:false, neutralSite:false, isPlayoff:true, isRelegationPlayoff:true, relegationPlayoffKey:sObj.relKey, seriesId:sObj.id, gameNum:gi+1});
    }
    homeIsA=!homeIsA; patIdx++;
  }
  t.games.push(...games);
  sObj.gameIds=games.map(g=>g.id);
}
function advanceRelegationPlayoff(key){
  const t=App.current; const b=t.relegationPlayoffBrackets && t.relegationPlayoffBrackets[key];
  if(!b) return;
  let changed=true, guard=0;
  while(changed && guard++<20){
    changed=false;
    b.series.forEach(sObj=>{
      if(!sObj.feedsFrom || (sObj.teamA && sObj.teamB)) return;
      const [fa,fb]=sObj.feedsFrom;
      const sa=b.series.find(s=>s.id===fa), sb=b.series.find(s=>s.id===fb);
      const wa=sa?seriesWinnerId(sa):null, wb=sb?seriesWinnerId(sb):null;
      if(wa && !sObj.teamA){ sObj.teamA=wa; sObj.seedA=sa.teamA===wa?sa.seedA:sa.seedB; changed=true; }
      if(wb && !sObj.teamB){ sObj.teamB=wb; sObj.seedB=sb.teamA===wb?sb.seedA:sb.seedB; changed=true; }
      if(sObj.teamA && sObj.teamB && sObj.gameIds.length===0){ generateRelegationPlayoffGames(sObj); changed=true; }
    });
  }
}
function pruneDecidedRelegationPlayoffGames(seriesId, key){
  const t=App.current; const b=t.relegationPlayoffBrackets && t.relegationPlayoffBrackets[key];
  if(!b) return;
  const sObj=b.series.find(s=>s.id===seriesId); if(!sObj) return;
  const {aWins,bWins}=seriesRecord(sObj);
  if(aWins>=sObj.gamesToWin || bWins>=sObj.gamesToWin){
    t.games = t.games.filter(g=> !(g.seriesId===seriesId && g.homeScore==null));
  }
  advanceRelegationPlayoff(key);
}
function relegationPlayoffFinalSeries(b){
  if(!b || !b.series.length) return null;
  return b.series.find(s=>!s.nextSeriesId) || null;
}
function relegationPlayoffChampion(b){
  const fs = relegationPlayoffFinalSeries(b);
  return fs ? seriesWinnerId(fs) : null;
}
function relegationPlayoffLoser(b){
  const fs = relegationPlayoffFinalSeries(b);
  return fs ? seriesLoserId(fs) : null;
}
function buildRelegationPlayoff(tierName, kind){
  const t=App.current, s=t.settings;
  const rp = s.relegation.playoff;
  const pool = t.teams.filter(x=>x.division===tierName);
  const rows = standingsRows(pool, t.games, false);
  const numMoving = s.relegation.numMoving||0;
  let candidates;
  if(kind==='promo'){
    candidates = rows.slice(Math.max(0,numMoving-1), Math.max(0,numMoving-1)+rp.promoTeams).map(r=>r.team);
  } else {
    const n = rows.length;
    const autoCount = Math.max(0,numMoving-1);
    candidates = rows.slice(Math.max(0,n-autoCount-rp.relegTeams), Math.max(0,n-autoCount)).map(r=>r.team);
  }
  if(candidates.length<2){ showToast('Not enough teams in '+tierName+' for that playoff'); return; }
  const key = tierName+':'+kind;
  t.games = t.games.filter(g=>!(g.isRelegationPlayoff && g.relegationPlayoffKey===key));
  let size=1; while(size<candidates.length) size*=2;
  const seedOrder = standardSeedOrder(size);
  const slots = seedOrder.map(seedNum=> seedNum<=candidates.length ? {team:candidates[seedNum-1], seed:seedNum} : {team:null, seed:null});
  const gamesToWin = kind==='promo'? rp.promoGamesToWin : rp.relegGamesToWin;
  const homeAway = kind==='promo'? rp.promoHomeAway : rp.relegHomeAway;
  const series=[]; let roundSeries=[];
  for(let i=0;i<slots.length;i+=2){
    const A=slots[i], B=slots[i+1];
    if(!A.team && !B.team) continue;
    const sObj={id:uid('rp_series'), round:0, roundName:'Round 1', relKey:key, teamA:A.team?A.team.id:null, teamB:B.team?B.team.id:null, seedA:A.seed, seedB:B.seed,
      gamesToWin, homeAway, mode:'bestof', numGames:gamesToWin*2-1, lowerSeedHostsFirst:false, gameIds:[], nextSeriesId:null, isByeSlot:false, isRelegationPlayoff:true, relegationPlayoffKey:key};
    if(sObj.teamA && !sObj.teamB) sObj.isByeSlot=true;
    else if(!sObj.teamA && sObj.teamB){ sObj.teamA=sObj.teamB; sObj.teamB=null; sObj.seedA=sObj.seedB; sObj.seedB=null; sObj.isByeSlot=true; }
    series.push(sObj); roundSeries.push(sObj);
    if(sObj.teamA && sObj.teamB) generateRelegationPlayoffGames(sObj);
  }
  let r=1;
  while(roundSeries.length>1){
    const isFinal = roundSeries.length===2;
    const nextRound=[];
    for(let i=0;i<roundSeries.length;i+=2){
      const sA=roundSeries[i], sB=roundSeries[i+1];
      const sObj={id:uid('rp_series'), round:r, roundName:isFinal?'Final':'Round '+(r+1), relKey:key, teamA:null, teamB:null, seedA:null, seedB:null,
        gamesToWin, homeAway, mode:'bestof', numGames:gamesToWin*2-1, lowerSeedHostsFirst:false, gameIds:[], nextSeriesId:null, feedsFrom:[sA.id,sB.id], isByeSlot:false, isRelegationPlayoff:true, relegationPlayoffKey:key};
      series.push(sObj); nextRound.push(sObj);
      sA.nextSeriesId=sObj.id; sB.nextSeriesId=sObj.id;
    }
    roundSeries=nextRound; r++;
    if(r>20) break;
  }
  if(!t.relegationPlayoffBrackets) t.relegationPlayoffBrackets={};
  t.relegationPlayoffBrackets[key] = {series, kind, tierName};
  advanceRelegationPlayoff(key);
  scheduleSave(); renderTab();
  showToast((kind==='promo'?'Promotion':'Relegation')+' playoff seeded for '+tierName);
}

function mergeTeamIntoCareer(teamId){
  const t=App.current;
  if(!t.legacy) t.legacy={enabled:false, seasons:[], teamCareer:{}};
  const tm = t.teams.find(x=>x.id===teamId);
  const existing = t.legacy.teamCareer[teamId];
  const name = tm ? tm.name : (existing ? existing.name : teamName(teamId));
  const rec = computeRecord(teamId, t.games);
  const career = existing || {name, seasons:0, championships:0, runnerUps:0, semifinalists:0, playoffAppearances:0, placementSum:0, w:0,l:0,t:0,pf:0,pa:0, deleted:false};
  career.name = name;
  career.w += rec.w; career.l += rec.l; career.t += rec.t; career.pf += rec.pf; career.pa += rec.pa;
  t.legacy.teamCareer[teamId] = career;
  return career;
}
function archiveTeamCareerStats(teamId){

  t.legacy.teamCareer[teamId].deleted = true;

function getSemifinalSeries(bracket, finalSeries){
  if(!bracket || !finalSeries) return [];
  if(finalSeries.feedsFrom) return finalSeries.feedsFrom.map(id=>bracket.series.find(s=>s.id===id)).filter(Boolean);
  return bracket.series.filter(s=>s.round===finalSeries.round-1 && s.confLabel!=='Third Place');
}
function recordSeasonInLegacy(movements){
  const t=App.current;
  if(!t.legacy) t.legacy={enabled:false, seasons:[], teamCareer:{}};
  const seasonNum = t.legacy.seasons.length+1;
  const standingsSnap = standingsRows(t.teams, t.games, false, t.settings.subPlayoffs.countsAsRegularSeason).map(r=>({
    teamId:r.team.id, name:r.team.name, w:r.w,l:r.l,t:r.t,pf:r.pf,pa:r.pa,points:r.points,pct:r.pct
  }));
  let tierChampions=null;
  if(t.settings.relegation.enabled){
    tierChampions = t.settings.divisionNames.map(tierName=>{
      const rows = standingsRows(t.teams.filter(x=>x.division===tierName), t.games, false);
      return rows[0] ? {tier:tierName, teamId:rows[0].team.id, name:rows[0].team.name} : null;
    }).filter(Boolean);
  }
  const champId = (!t.settings.relegation.enabled && t.settings.playoffs.enabled) ? championTeamId() : null;
  const champTm = champId ? t.teams.find(x=>x.id===champId) : null;
  let runnerUp=null, semifinalists=[];
  const isDoubleElim = t.playoffBracket && t.playoffBracket.format==='double';
  if(isDoubleElim && champId){
    const b=t.playoffBracket;
    const runnerUpId = b.wbChamp===champId ? b.lbChamp : b.wbChamp;
    if(runnerUpId) runnerUp = {teamId:runnerUpId, name: teamName(runnerUpId)};
  } else if(!t.settings.relegation.enabled) {
    const finalSeries = t.settings.playoffs.enabled ? championSeries() : null;
    if(finalSeries && champId){
      const runnerUpId = finalSeries.teamA===champId ? finalSeries.teamB : finalSeries.teamA;
      if(runnerUpId) runnerUp = {teamId:runnerUpId, name: teamName(runnerUpId)};
      getSemifinalSeries(t.playoffBracket, finalSeries).forEach(sr=>{
        const w = seriesWinnerId(sr);
        [sr.teamA, sr.teamB].forEach(id=>{
          if(id && id!==w) semifinalists.push({teamId:id, name: teamName(id)});
        });
      });
    }
  }
  const participants=[]; const seenP=new Set();
  if(t.playoffBracket && !t.settings.relegation.enabled){
    t.playoffBracket.series.forEach(sr=>{
      [sr.teamA, sr.teamB].forEach(id=>{ if(id && !seenP.has(id)){ seenP.add(id); participants.push({teamId:id, name: teamName(id)}); } });
    });
  }
  const bracketSnap = (t.playoffBracket && !t.settings.relegation.enabled) ? { series: t.playoffBracket.series.map(sr=>({
    round:sr.round, roundName:sr.roundName, bracket:sr.bracket||'main', confLabel:sr.confLabel,
    teamAName: sr.teamA? teamName(sr.teamA):null, teamBName: sr.teamB? teamName(sr.teamB):null,
    seedA:sr.seedA, seedB:sr.seedB, isByeSlot:!!sr.isByeSlot,
    score: (()=>{ const rec=seriesRecord(sr); return {aWins:rec.aWins,bWins:rec.bWins}; })(),
    winnerName: (()=>{ const w=seriesWinnerId(sr); return w?teamName(w):null; })()
  })) } : null;

  const idsThisSeason = t.teams.map(tm=>tm.id);
  const placementByTeam = {}; standingsSnap.forEach((r,i)=>{ placementByTeam[r.teamId]=i+1; });
  idsThisSeason.forEach(id=>{
    mergeTeamIntoCareer(id);
    t.legacy.teamCareer[id].seasons += 1;
    t.legacy.teamCareer[id].placementSum = (t.legacy.teamCareer[id].placementSum||0) + (placementByTeam[id]||0);
  });
  if(champId && t.legacy.teamCareer[champId]) t.legacy.teamCareer[champId].championships += 1;
  if(runnerUp && t.legacy.teamCareer[runnerUp.teamId]) t.legacy.teamCareer[runnerUp.teamId].runnerUps += 1;
  semifinalists.forEach(sf=>{ if(t.legacy.teamCareer[sf.teamId]) t.legacy.teamCareer[sf.teamId].semifinalists += 1; });
  participants.forEach(p=>{ if(t.legacy.teamCareer[p.teamId]) t.legacy.teamCareer[p.teamId].playoffAppearances += 1; });
  if(tierChampions){
    tierChampions.forEach(tc=>{ if(t.legacy.teamCareer[tc.teamId]) t.legacy.teamCareer[tc.teamId].championships += 1; });
  }

  t.legacy.seasons.push({
    number: seasonNum, name: t.name, sport: t.sport, endedAt: Date.now(),
    standings: standingsSnap,
    champion: champTm ? {teamId:champId, name:champTm.name} : (champId?{teamId:champId,name:teamName(champId)}:null),
    runnerUp, semifinalists, participants, bracket: bracketSnap,
    tierChampions, movements: movements||[]
  });
}
function startNewSeason(){
  const t=App.current, s=t.settings;
  confirmAction('Archive this season to Legacy and start a brand new season? This clears the schedule, scores, and playoff bracket \u2014 teams, divisions, and settings stay (teams move tiers automatically if relegation is on).', ()=>{
    let movements=[];
    if(s.relegation.enabled){
      const numMoving = s.relegation.numMoving||0;
      const rp = s.relegation.playoff;
      const moves = {};
      s.divisionNames.forEach((tierName,tierIdx)=>{
        const pool = t.teams.filter(x=>x.division===tierName);
        const rows = standingsRows(pool, t.games, false);
        const usePromoPlayoff = rp && rp.enabled && rp.promoTeams>0;
        const useRelegPlayoff = rp && rp.enabled && rp.relegTeams>0;
        if(tierIdx>0){
          const autoCount = usePromoPlayoff ? Math.max(0,numMoving-1) : numMoving;
          rows.slice(0,autoCount).forEach(r=>{ moves[r.team.id]=s.divisionNames[tierIdx-1]; movements.push({teamId:r.team.id, name:r.team.name, from:tierName, to:s.divisionNames[tierIdx-1], type:'promoted'}); });
          if(usePromoPlayoff){
            const key = tierName+':promo';
            const b = t.relegationPlayoffBrackets && t.relegationPlayoffBrackets[key];
            const champ = b ? relegationPlayoffChampion(b) : null;
            const fallback = rows[autoCount] ? rows[autoCount].team.id : null;
            const winnerId = champ || fallback;
            if(winnerId && !moves[winnerId]){ moves[winnerId]=s.divisionNames[tierIdx-1]; movements.push({teamId:winnerId, name:teamName(winnerId), from:tierName, to:s.divisionNames[tierIdx-1], type:'promoted'}); }
          }
        }
        if(tierIdx<s.divisionNames.length-1){
          const autoCount = useRelegPlayoff ? Math.max(0,numMoving-1) : numMoving;
          const n = rows.length;
          rows.slice(Math.max(0,n-autoCount)).forEach(r=>{
            if(moves[r.team.id]) return;
            moves[r.team.id]=s.divisionNames[tierIdx+1]; movements.push({teamId:r.team.id, name:r.team.name, from:tierName, to:s.divisionNames[tierIdx+1], type:'relegated'});
          });
          if(useRelegPlayoff){
            const key = tierName+':releg';
            const b = t.relegationPlayoffBrackets && t.relegationPlayoffBrackets[key];
            const loserId = b ? relegationPlayoffLoser(b) : null;
            const fallback = rows[Math.max(0,n-autoCount-1)] ? rows[Math.max(0,n-autoCount-1)].team.id : null;
            const dropId = loserId || fallback;
            if(dropId && !moves[dropId]){ moves[dropId]=s.divisionNames[tierIdx+1]; movements.push({teamId:dropId, name:teamName(dropId), from:tierName, to:s.divisionNames[tierIdx+1], type:'relegated'}); }
          }
        }
      });
      recordSeasonInLegacy(movements);
      t.teams.forEach(tm=>{ if(moves[tm.id]) tm.division = moves[tm.id]; });
    } else {
      recordSeasonInLegacy([]);
    }
    t.games=[]; t.playoffBracket=null; t.subPlayoffBrackets={}; t.relegationPlayoffBrackets={};
    scheduleSave(); renderTab();
    showToast(s.relegation.enabled ? `New season started \u2014 ${movements.length} team(s) changed tiers` : 'New season started \u2014 previous season saved to Legacy');
  });
}
function ordinal(n){
  const sfx=['th','st','nd','rd'], v=n%100;
  return n + (sfx[(v-20)%10] || sfx[v] || sfx[0]);
}
function sortLegacy(key){
  if(App.legacySort.key===key) App.legacySort.dir*=-1; else { App.legacySort.key=key; App.legacySort.dir=-1; }
  renderTab();
}

function submitBulkLegacy(){
  const t=App.current;
  if(!t.legacy) t.legacy={enabled:false, seasons:[], teamCareer:{}};
  if(!t.legacy.manualSeasons) t.legacy.manualSeasons=[];
  const champion = document.getElementById('mlChampion').value.trim();
  if(!champion){ showToast('Enter at least a champion'); return; }
  const label = document.getElementById('mlSeasonLabel').value.trim() || `Historical season ${t.legacy.manualSeasons.length+1}`;
  const runnerUp = document.getElementById('mlRunnerUp').value.trim();
  const semis = document.getElementById('mlSemis').value.split(',').map(x=>x.trim()).filter(Boolean);
  const standingsLines = document.getElementById('mlStandings').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const DASH_RE = /\s+[-\u2013\u2014]\s+/;
  const standings = standingsLines.map(line=>{
    const parts = line.split(DASH_RE);
    if(parts.length<2) return {name:line, record:''};
    return {name:parts[0].trim(), record:parts.slice(1).join(' - ').trim()};
  });
  t.legacy.manualSeasons.push({id:uid('mlseason'), label, champion, runnerUp, semifinalists:semis, standings, addedAt:Date.now()});
  closeModal(); scheduleSave(); renderTab();
  showToast('Historical season added');
}

function renderLegacy(){
  const t=App.current;
  if(!t.legacy || !t.legacy.enabled) return `<div class="empty">Legacy mode is off \u2014 enable it in Settings to start tracking all-time history.</div>`;
  let career = Object.entries(t.legacy.teamCareer).map(([id,c])=>({id,...c, placementSum:c.placementSum||0}));
  const valueFor = (c,key)=>{
    const gp=c.w+c.l+c.t, pct= gp? ((c.w+c.t*0.5)/gp) : 0;
    if(key==='pct') return pct;
    if(key==='diff') return c.pf-c.pa;
    if(key==='avgPlace') return c.seasons? c.placementSum/c.seasons : 999;
    if(key==='name') return c.name.toLowerCase();
    return c[key]!=null ? c[key] : 0;
  };
  if(App.legacySort.key){
    const key=App.legacySort.key, dir=App.legacySort.dir;
    career.sort((a,b)=>{
      const va=valueFor(a,key), vb=valueFor(b,key);
      if(key==='avgPlace') return (va-vb)*(dir*-1);
      if(key==='name') return va<vb? -dir : va>vb? dir : 0;
      return (vb-va)*dir;
    });
  } else {
    career.sort((a,b)=> b.championships-a.championships || (b.w/(Math.max(1,b.w+b.l+b.t))) - (a.w/(Math.max(1,a.w+a.l+a.t))) || b.w-a.w);

const GRAPH_PALETTE = ['#4f8cff','#f59e0b','#22c58a','#ef4444','#a855f7','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6','#eab308','#8b5cf6'];

const LIST_METRICS = {pf:'Points For', pa:'Points Against', diff:'Point Differential', pct:'Win %', ppg:'Points Per Game', papg:'Points Allowed Per Game', points:'Standings Points', wins:'Wins', losses:'Losses'};

function niceTicks(min,max,n){
  if(min===max){ min-=1; max+=1; }
  const span=max-min, raw=span/Math.max(1,n);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag; const step=(norm<=1?1:norm<=2?2:norm<=5?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const ticks=[]; for(let v=lo; v<=hi+step/2; v+=step) ticks.push(+v.toFixed(10));
  return ticks;
}
function fmtVal(metric,v){
  if(v==null||isNaN(v)) return '-';
  if(metric==='place') return ordinal(Math.round(v));
  if(metric==='pct') return (v*100).toFixed(1)+'%';
  if(Number.isInteger(v) && metric!=='sos' && metric!=='pct') return String(v);
  if(metric==='ppg'||metric==='papg'||metric==='dpg'||metric==='sos') return Math.abs(v)>=100? v.toFixed(0) : (metric==='sos'? v.toFixed(3) : v.toFixed(1));
  if(metric==='diff') return (v>0?'+':'')+Math.round(v);
  return String(Math.round(v*10)/10);
}
/* Season-to-date numbers after every week (cached until a score changes) */
function weeklySeries(){
  const t=App.current, s=t.settings;
  if(App._wkSeries && App._wkSeries.version===App.dataVersion && App._wkSeries.scope===App.statsSel.placeScope) return App._wkSeries.data;
  const reg=t.games.filter(g=>!g.isPlayoff && !g.isTiebreakerGame);
  const played=reg.filter(g=>g.homeScore!=null);
  const lastWeek=played.length? Math.max(...played.map(g=>g.week||0)) : 0;
  const weeks=[...new Set(reg.map(g=>g.week).filter(w=>w!=null && w<=lastWeek))].sort((a,b)=>a-b);
  const byTeam={}; t.teams.forEach(tm=>{ byTeam[tm.id]={place:[],points:[],ppg:[],papg:[],pf:[],pa:[],diff:[],dpg:[],pct:[],wins:[]}; });
  const scope=App.statsSel.placeScope;
  const groupOf=tm=> scope==='division'?tm.division : scope==='conference'?(tm.conference||'') : '*';
  weeks.forEach(w=>{
    const upto=played.filter(g=>g.week<=w);
    const rows=standingsRows(t.teams, upto, false);
    const counter={};
    rows.forEach(r=>{
      const gk=groupOf(r.team); counter[gk]=(counter[gk]||0)+1;
      const m=byTeam[r.team.id], gp=r.gp;
      m.place.push(counter[gk]); m.points.push(r.points); m.pf.push(r.pf); m.pa.push(r.pa); m.diff.push(r.diff);
      m.wins.push(r.w); m.pct.push(gp?r.pct:null);
      m.ppg.push(gp? r.pf/gp : null); m.papg.push(gp? r.pa/gp : null); m.dpg.push(gp? r.diff/gp : null);
    });
  });
  const data={weeks, byTeam};
  App._wkSeries={version:App.dataVersion, scope:App.statsSel.placeScope, data};
  return data;
}

  g+=`<text x="${L+iw/2}" y="${H-6}" text-anchor="middle" font-size="${F}" style="fill:var(--sub)">${esc(o.xTitle)}</text>`;
  g+=`<text transform="translate(12 ${T+ih/2}) rotate(-90)" text-anchor="middle" font-size="${F}" style="fill:var(--sub)">${esc(o.yTitle)}${o.invertY?' (1st at top)':''}</text>`;

function scatterSvg(o){

  if(pts.length<2) return '<div class="empty">Not enough data to plot yet.</div>';
  const ext=(arr,inv)=>{ let mn=Math.min(...arr), mx=Math.max(...arr); const pad=(mx-mn)*0.08||1; mn-=pad; mx+=pad; const tk=niceTicks(mn,mx,5); return {tk, lo:tk[0], hi:tk[tk.length-1]}; };

  if(o.invertX){ const mx=Math.max(...pts.map(p=>p.x)); const step=Math.max(1,Math.ceil(mx/8)); const tk=[]; for(let v=1; v<=mx; v+=step) tk.push(v); xe={tk, lo:Math.max(0.5,1)-0.5, hi:mx+0.5}; } else xe=ext(pts.map(p=>p.x));

  const X=v=> L + iw*( o.invertX ? (xe.hi-v)/(xe.hi-xe.lo) : (v-xe.lo)/(xe.hi-xe.lo) );
  const Y=v=> T + ih*( o.invertY ? (v-ye.lo)/(ye.hi-ye.lo) : 1-(v-ye.lo)/(ye.hi-ye.lo) );
  let g='';
  ye.tk.forEach(v=>{ const y=Y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="${F}" style="fill:var(--sub)">${o.yFmt(v)}</text>`; });
  xe.tk.forEach(v=>{ const x=X(v); g+=`<line y1="${T}" y2="${H-B}" x1="${x}" x2="${x}" style="stroke:var(--line)" stroke-dasharray="2 4"/><text x="${x}" y="${H-B+16}" text-anchor="middle" font-size="${F}" style="fill:var(--sub)">${o.xFmt(v)}</text>`; });
  g+=`<text x="${L+iw/2}" y="${H-8}" text-anchor="middle" font-size="${F}" style="fill:var(--sub)">${esc(o.xTitle)}${o.invertX?' (1st at left)':''}</text>`;
  g+=`<text transform="translate(12 ${T+ih/2}) rotate(-90)" text-anchor="middle" font-size="${F}" style="fill:var(--sub)">${esc(o.yTitle)}${o.invertY?' (1st at top)':''}</text>`;

  const n=pts.length, mx=pts.reduce((a,p)=>a+p.x,0)/n, my=pts.reduce((a,p)=>a+p.y,0)/n;
  let sxx=0, syy=0, sxy=0; pts.forEach(p=>{ sxx+=(p.x-mx)**2; syy+=(p.y-my)**2; sxy+=(p.x-mx)*(p.y-my); });

  }
  pts.forEach(p=>{
    const tip=`${p.name}: ${o.xTitle} ${o.xFmt(p.x)} \u00b7 ${o.yTitle} ${o.yFmt(p.y)}`;
    g+=`<g style="cursor:pointer" onclick="chartInfo('${o.infoId}',this.getAttribute('data-t'));" ondblclick="openTeamModal('${p.id}')" data-t="${esc(tip)}"><circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="6.5" fill="${p.color}" style="stroke:var(--panel)" stroke-width="1.5"><title>${esc(tip)}</title></circle>`
       + (pts.length<=24 ? `<text x="${(X(p.x)+9).toFixed(1)}" y="${(Y(p.y)+4).toFixed(1)}" font-size="${F-1}" style="fill:var(--text)" opacity=".85">${esc(p.name.length>12?p.name.slice(0,11)+'\u2026':p.name)}</text>`:'')

}

function scatterValue(teamId, metric, rows){
  const t=App.current;
  const games=statGamesFor(teamId).filter(g=>g.homeScore!=null && !g.isTiebreakerGame);
  const rec=computeRecord(teamId, games), gp=games.length;
  switch(metric){
    case 'place': { const i=rows.findIndex(r=>r.team.id===teamId); return i>=0? i+1 : null; }
    case 'points': return rec.points;
    case 'ppg': return gp? rec.pf/gp : null;
    case 'papg': return gp? rec.pa/gp : null;
    case 'pf': return rec.pf; case 'pa': return rec.pa; case 'diff': return rec.diff;
    case 'dpg': return gp? rec.diff/gp : null;
    case 'pct': return gp? rec.pct : null;
    case 'wins': return rec.w; case 'losses': return rec.l;
    case 'skill': { const tm=teamById(teamId); return tm? (tm.skillLevel||500) : null; }
    case 'sos': { const m=regPctMap(); const opp=games.map(g=>g.home===teamId?g.away:g.home); return opp.length? opp.reduce((a,id)=>a+(m[id]||0),0)/opp.length : null; }
  }
  return null;
}

function renderRecordsLists(){
  const t=App.current, S=App.statsSel, pool=recordsGamePool();
  if(!pool.length) return '<div class="empty">Play some games and the records will fill in here.</div>';
  const N=5, nm=id=>esc(teamName(id)), badge=id=>teamBadgeHtml(id);
  const gm=(g)=>{ const aw=g.awayScore>g.homeScore; return {w:aw?g.away:g.home, l:aw?g.home:g.away, ws:aw?g.awayScore:g.homeScore, ls:aw?g.homeScore:g.awayScore, margin:Math.abs(g.homeScore-g.awayScore), total:g.homeScore+g.awayScore, tie:g.homeScore===g.awayScore}; };

    }

  // season-long team rankings
  const agg=t.teams.map(tm=>{ const gs=pool.filter(g=>g.home===tm.id||g.away===tm.id); const rec=computeRecord(tm.id, gs);
    const home=computeRecord(tm.id, gs.filter(g=>g.home===tm.id)), away=computeRecord(tm.id, gs.filter(g=>g.away===tm.id));
    let ot=0, clean=0, close=0, closeW=0; gs.forEach(g=>{ const my=g.home===tm.id?g.homeScore:g.awayScore, op=g.home===tm.id?g.awayScore:g.homeScore; if(g.ot||g.pk) ot++; if(op===0) clean++; if(Math.abs(my-op)<=1 && my!==op){ close++; if(my>op) closeW++; } });
    return {tm, rec, home, away, gp:gs.length, ot, clean, close, closeW}; }).filter(a=>a.gp>0);
  const recStr=r=>`${r.w}-${r.l}${r.t?'-'+r.t:''}`;
  const topOff=agg.slice().sort((a,b)=>b.rec.pf/b.gp-a.rec.pf/a.gp).slice(0,N).map(a=>({left:`${badge(a.tm.id)}${nm(a.tm.id)}`, right:(a.rec.pf/a.gp).toFixed(1)+' / g', click:tmClick(a.tm.id)}));
  const topDef=agg.slice().sort((a,b)=>a.rec.pa/a.gp-b.rec.pa/b.gp).slice(0,N).map(a=>({left:`${badge(a.tm.id)}${nm(a.tm.id)}`, right:(a.rec.pa/a.gp).toFixed(1)+' / g', click:tmClick(a.tm.id)}));
  const bestHome=agg.filter(a=>a.home.gp>0).sort((a,b)=>b.home.pct-a.home.pct || b.home.w-a.home.w).slice(0,N).map(a=>({left:`${badge(a.tm.id)}${nm(a.tm.id)}`, right:recStr(a.home), click:tmClick(a.tm.id)}));
  const bestAway=agg.filter(a=>a.away.gp>0).sort((a,b)=>b.away.pct-a.away.pct || b.away.w-a.away.w).slice(0,N).map(a=>({left:`${badge(a.tm.id)}${nm(a.tm.id)}`, right:recStr(a.away), click:tmClick(a.tm.id)}));
  const clutch=agg.filter(a=>a.close>=2).sort((a,b)=>b.closeW/b.close-a.closeW/a.close || b.close-a.close).slice(0,N).map(a=>({left:`${badge(a.tm.id)}${nm(a.tm.id)}`, right:`${a.closeW}-${a.close-a.closeW}`, click:tmClick(a.tm.id)}));
  const shutouts=agg.filter(a=>a.clean>0).sort((a,b)=>b.clean-a.clean).slice(0,N).map(a=>({left:`${badge(a.tm.id)}${nm(a.tm.id)}`, right:a.clean, click:tmClick(a.tm.id)}));
  const otKings=agg.filter(a=>a.ot>0).sort((a,b)=>b.ot-a.ot).slice(0,N).map(a=>({left:`${badge(a.tm.id)}${nm(a.tm.id)}`, right:a.ot+' games', click:tmClick(a.tm.id)}));
  // luck: actual win% vs. Pythagorean expectation
  const totPts=agg.reduce((s,a)=>s+a.rec.pf,0), totG=agg.reduce((s,a)=>s+a.gp,0);
  const exp=Math.max(1, Math.pow(totG? (2*totPts/totG) : 1, 0.287));
  const luck=agg.filter(a=>a.gp>=3 && (a.rec.pf+a.rec.pa)>0).map(a=>{ const e=Math.pow(a.rec.pf,exp)/(Math.pow(a.rec.pf,exp)+Math.pow(a.rec.pa,exp)); return {a, e, diff:a.rec.pct-e}; });
  const lucky=luck.slice().sort((x,y)=>y.diff-x.diff).filter(x=>x.diff>0.001).slice(0,N).map(x=>({left:`${badge(x.a.tm.id)}${nm(x.a.tm.id)} <span class="muted" style="font-size:11px;">${recStr(x.a.rec)}, expected ${(x.e*100).toFixed(0)}%</span>`, right:'+'+(x.diff*100).toFixed(0)+'%', click:tmClick(x.a.tm.id)}));
  const unlucky=luck.slice().sort((x,y)=>x.diff-y.diff).filter(x=>x.diff<-0.001).slice(0,N).map(x=>({left:`${badge(x.a.tm.id)}${nm(x.a.tm.id)} <span class="muted" style="font-size:11px;">${recStr(x.a.rec)}, expected ${(x.e*100).toFixed(0)}%</span>`, right:(x.diff*100).toFixed(0)+'%', click:tmClick(x.a.tm.id)}));
  // biggest weekly moves in the standings
  let climbs=[], falls=[];
  if(S.recScope!=='playoffs'){
    const ser=weeklySeries();
    const moves=[]; t.teams.forEach(tm=>{ const p=ser.byTeam[tm.id]?ser.byTeam[tm.id].place:[]; for(let i=1;i<p.length;i++) moves.push({tm, delta:p[i-1]-p[i], from:p[i-1], to:p[i], wk:ser.weeks[i]}); });
    const fmt=m=>({left:`${badge(m.tm.id)}${nm(m.tm.id)} <span class="muted" style="font-size:11px;">${ordinal(m.from)} \u2192 ${ordinal(m.to)} \u00b7 Wk ${m.wk}</span>`, right:(m.delta>0?'\u25b2 ':'\u25bc ')+Math.abs(m.delta), click:tmClick(m.tm.id)});
    climbs=moves.filter(m=>m.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,N).map(fmt);
    falls=moves.filter(m=>m.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,N).map(fmt);
  }
  const grid=cards=>`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(${currentDevice()==='iphone'?260:320}px,1fr));gap:10px;">${cards.join('')}</div>`;
  return `
    <div class="row" style="align-items:center;"><label style="margin:0;">Records from</label>
      <select onchange="App.statsSel.recScope=this.value;renderTab();"><option value="regular" ${S.recScope==='regular'?'selected':''}>Regular season</option><option value="playoffs" ${S.recScope==='playoffs'?'selected':''}>Playoffs only</option><option value="all" ${S.recScope==='all'?'selected':''}>All games</option></select>
      <span class="muted" style="font-size:11.5px;">Tap a row to open that game or team.</span></div>
    <h4 style="margin:6px 0 0;">Streaks &amp; form</h4>
    ${grid([listCard('\ud83d\udd25 Longest win streaks',winStreaks,'No wins yet.'), listCard('\ud83e\uddca Longest losing streaks',loseStreaks,'No losses yet.'), listCard('\ud83d\udcc8 Hottest right now (last 5)',hot,'Need a few games first.')])}
    <h4 style="margin:6px 0 0;">Best games</h4>
    ${grid([listCard('\ud83d\udca5 Largest margins of victory',blowouts,'No decided games.'), listCard('\ud83d\ude2c Closest finishes',closest,'No decided games.'), listCard('\ud83c\udfaf Biggest upsets',upsetRows,'No upsets yet (needs 3+ games for both teams).','Measured by the gap in the two teams\' win % going into the game.'), listCard('\ud83c\udf86 Highest-scoring games',shootouts), listCard('\ud83e\uddf1 Lowest-scoring games',lowest), listCard('\ud83d\ude80 Best single-game offense',bestOff), listCard('\ud83d\udee1\ufe0f Best single-game defense',bestDef)])}
    <h4 style="margin:6px 0 0;">Teams</h4>
    ${grid([listCard('\u2694\ufe0f Best offense (per game)',topOff), listCard('\ud83e\uddf1 Best defense (per game)',topDef), listCard('\ud83c\udfe0 Best home records',bestHome), listCard('\u2708\ufe0f Best road records',bestAway), listCard('\ud83e\udde0 Clutch (decided by 1 point/goal)',clutch,'No one-score games yet.'), listCard('\u23f1\ufe0f Most overtime/shootout games',otKings,'No overtime games.'), listCard('\ud83e\udde4 Most clean sheets',shutouts,'No shutouts yet.'), listCard('\ud83c\udf40 Luckiest (record beats the scoring)',lucky,'Nothing stands out yet.','Actual win % vs. what points for/against would predict.'), listCard('\ud83d\ude2d Unluckiest',unlucky,'Nothing stands out yet.')])}
    ${climbs.length?`<h4 style="margin:6px 0 0;">Movers</h4>${grid([listCard('\ud83d\ude80 Biggest one-week climbs',climbs), listCard('\ud83d\udcc9 Biggest one-week drops',falls)])}`:''}
  `;
}

function renderPlayoffStandingsTable(){
  const t=App.current;
  if(!t.playoffBracket || !t.playoffBracket.series.length) return '<div class="empty">No playoff bracket yet \u2014 seed one from the Playoffs tab.</div>';
  const poGames = t.games.filter(g=>g.isPlayoff && !g.isSubPlayoff);
  const participantIds = new Set();
  t.playoffBracket.series.forEach(sr=>{ if(sr.teamA) participantIds.add(sr.teamA); if(sr.teamB) participantIds.add(sr.teamB); });
  const champId = championTeamId();
  const rows = [...participantIds].map(id=>{
    const rec = computeRecord(id, poGames);
    const seriesForTeam = t.playoffBracket.series.filter(sr=>sr.teamA===id||sr.teamB===id);
    const maxRoundSeries = seriesForTeam.sort((a,b)=>b.round-a.round)[0];
    let status='';
    if(champId===id) status='\ud83c\udfc6 Champion';
    else if(maxRoundSeries){
      const winner = seriesWinnerId(maxRoundSeries);
      if(maxRoundSeries.isByeSlot && maxRoundSeries.teamA===id) status = 'Bye';
      else if(winner===id) status = `Won ${esc(maxRoundSeries.roundName)}`;
      else if(winner) status = `Eliminated \u2014 ${esc(maxRoundSeries.roundName)}`;
      else status = `Playing \u2014 ${esc(maxRoundSeries.roundName)}`;
    }
    return {id, name:teamName(id), rec, status};
  });
  rows.sort((a,b)=> b.rec.points-a.rec.points || b.rec.pf-a.rec.pf);
  return `<div class="card" style="overflow-x:auto;">
    <h4>Playoff standings</h4>
    <table><thead><tr><th class="team-cell">Team</th><th>Record</th><th>PF</th><th>PA</th><th>Status</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td class="team-cell" style="cursor:pointer;" onclick="openTeamModal('${r.id}')">${teamBadgeHtml(r.id)}${esc(r.name)}</td>
      <td>${formatRecord(r.rec)}</td><td>${r.rec.pf}</td><td>${r.rec.pa}</td><td>${r.status}</td>
    </tr>`).join('')}</tbody></table>
  </div>`;
}
function applyStatTeams(){
  App.statsSel.teams=[...document.getElementById('statTeams').selectedOptions].map(o=>o.value);
  renderTab();
}
function statGamesFor(teamId){
  const t=App.current; let games=t.games.filter(g=>g.home===teamId||g.away===teamId);
  const scope=App.statsSel.scope;
  if(scope==='regular') games=games.filter(isRegularSeasonGame);
  if(scope==='playoffs') games=games.filter(g=>g.isPlayoff);
  if(scope==='home') games=games.filter(g=>g.home===teamId);
  if(scope==='away') games=games.filter(g=>g.away===teamId);
  return games;
}
function statValue(teamId, metric){
  const games = statGamesFor(teamId).filter(g=>g.homeScore!=null && !g.isTiebreakerGame);
  const rec = computeRecord(teamId, games);
  if(metric==='pf') return rec.pf;
  if(metric==='pa') return rec.pa;
  if(metric==='diff') return rec.diff;
  if(metric==='pct') return +(rec.pct*100).toFixed(1);
  if(metric==='points') return rec.points;
  if(metric==='wins') return rec.w;
  if(metric==='losses') return rec.l;
  if(metric==='ppg') return games.length? +(rec.pf/games.length).toFixed(1) : 0;
  if(metric==='papg') return games.length? +(rec.pa/games.length).toFixed(1) : 0;
  return 0;
}

function mergeDeep(base, over){
  if(!over || typeof over!=='object') return base;
  Object.keys(over).forEach(k=>{
    const v=over[k];
    if(v && typeof v==='object' && !Array.isArray(v) && base[k] && typeof base[k]==='object') mergeDeep(base[k], v);
    else base[k]=v;
  });
  return base;
}

/* Copy only the unplayed games (they get simulated); already-played games are shared, never mutated. */
function simClone(games){
  const out=[];
  for(const g of games){ if(g.isPlayoff) continue; if(g.isTiebreakerGame){ if(g.homeScore!=null) out.push(g); continue; } out.push(g.homeScore==null ? {...g} : g); }
  return out;
}
function cachedHtml(key, fn){
  if(!App.htmlCache) App.htmlCache={};
  const c=App.htmlCache[key];
  if(c && c.version===App.dataVersion) return c.html;
  const html=fn();
  App.htmlCache[key]={version:App.dataVersion, html};
  return html;
}
function cachedLeagueRows(){
  const t=App.current;
  if(!App._leagueRowsCache || App._leagueRowsCache.version!==App.dataVersion){
    App._leagueRowsCache={version:App.dataVersion, rows:standingsRows(t.teams, t.games, false)};
  }

}
function regPctMap(){
  const t=App.current;
  if(!App._pctMap || App._pctMap.version!==App.dataVersion){
    const by={};
    t.games.forEach(g=>{ if(g.isPlayoff) return; (by[g.home]=by[g.home]||[]).push(g); (by[g.away]=by[g.away]||[]).push(g); });
    const map={}; t.teams.forEach(tm=>{ map[tm.id]=computeRecord(tm.id, by[tm.id]||[]).pct; });
    App._pctMap={version:App.dataVersion, map};
  }
  return App._pctMap.map;
}
function hasPlayedRegularGame(){ return App.current.games.some(g=>!g.isPlayoff && g.homeScore!=null); }
function ensureSimCache(){
  if(!App.simCache || App.simCache.version!==App.dataVersion){
    App.simCache = Object.assign({version:App.dataVersion}, computeStandingsSimMaps());
  }
  return App.simCache;
}
function byeSettledFor(teamId){
  const cache=ensureStandingsCache();
  if(cache.byeMap[teamId] || cache.byeOutMap[teamId]) return true;
  if(cache.byeAnalytic) return false;

/* ---------------------------- schedule: shuffle + randomize order ---------------------------- */
function regularGamesForShuffle(){ return App.current.games.filter(g=>!g.isPlayoff && !g.isTiebreakerGame); }
function snapshotWeeks(games){
  const snap={}; games.forEach(g=>{ snap[g.id]={week:g.week, date:g.date||'', time:g.time||''}; });
  return snap;
}
function undoScheduleShuffle(){
  const snap=App._undoSchedule; if(!snap) return;
  App.current.games.forEach(g=>{ const s=snap[g.id]; if(s){ g.week=s.week; g.date=s.date; g.time=s.time; } });
  App._undoSchedule=null; scheduleSave(); renderTab(); showToast('Schedule order restored');
}
function shuffleWeeks(){
  const reg=regularGamesForShuffle();
  const weekNums=[...new Set(reg.map(g=>g.week))].sort((a,b)=>a-b);
  const movable=weekNums.filter(w=>reg.filter(g=>g.week===w).every(g=>g.homeScore==null));
  if(movable.length<2){ showToast('Need at least two weeks with no scores entered'); return; }
  confirmAction(`Shuffle ${movable.length} unplayed weeks into a random order? Each week's games stay together \u2014 only the week they land in changes. Weeks that already have scores stay where they are, and dates/times on moved games are cleared. You can undo right after.`, ()=>{
    const reg2=regularGamesForShuffle();
    App._undoSchedule=snapshotWeeks(reg2);
    let shuffled=movable.slice();
    for(let tries=0; tries<12; tries++){
      shuffled=shuffleArr(movable.slice());
      if(shuffled.some((w,i)=>w!==movable[i])) break;
    }
    const map={}; movable.forEach((w,i)=>{ map[w]=shuffled[i]; });
    let moved=0;
    reg2.forEach(g=>{
      const nw=map[g.week];
      if(nw!=null && nw!==g.week){ g.week=nw; if(g.date||g.time){ g.date=''; g.time=''; } moved++; }
    });
    scheduleSave(); renderTab();
    showToast(`Shuffled weeks \u2014 ${moved} game${moved===1?'':'s'} moved`);
  });
}
function randomizeGameOrder(){
  const reg=regularGamesForShuffle();
  const pool=reg.filter(g=>g.homeScore==null);
  const weeks=[...new Set(pool.map(g=>g.week))];
  if(pool.length<2 || weeks.length<2){ showToast('Need unplayed games in at least two weeks'); return; }
  confirmAction(`Randomly re-deal ${pool.length} unplayed games across their weeks? Every week keeps the same number of games and no team is put in two games in one week. Played games don't move, and dates/times on moved games are cleared. You can undo right after.`, ()=>{
    const reg2=regularGamesForShuffle();
    const pool2=reg2.filter(g=>g.homeScore==null);
    App._undoSchedule=snapshotWeeks(reg2);
    // cnt[week][team] = how many games that team already has that week
    const cnt={};
    reg2.forEach(g=>{ const w=g.week; (cnt[w]=cnt[w]||{}); cnt[w][g.home]=(cnt[w][g.home]||0)+1; cnt[w][g.away]=(cnt[w][g.away]||0)+1; });
    const fits=(w,g,leaving)=>{
      const c=cnt[w]||{};
      for(const id of [g.home,g.away]){
        let n=c[id]||0;
        if(leaving && (leaving.home===id || leaving.away===id)) n--;
        if(n>0) return false;
      }
      return true;
    };
    const move=(g,to)=>{
      const from=g.week;
      cnt[from][g.home]--; cnt[from][g.away]--;
      (cnt[to]=cnt[to]||{}); cnt[to][g.home]=(cnt[to][g.home]||0)+1; cnt[to][g.away]=(cnt[to][g.away]||0)+1;
      g.week=to;
    };
    const origWeek={}; pool2.forEach(g=>{ origWeek[g.id]=g.week; });
    // Random swaps between two games in different weeks; a swap is kept only if it leaves both weeks conflict-free.
    const attempts=Math.min(60000, pool2.length*60);
    for(let i=0;i<attempts;i++){
      const g1=pool2[Math.floor(Math.random()*pool2.length)];
      const g2=pool2[Math.floor(Math.random()*pool2.length)];
      if(g1===g2 || g1.week===g2.week) continue;
      if(fits(g2.week, g1, g2) && fits(g1.week, g2, g1)){
        const w1=g1.week, w2=g2.week;
        move(g1,w2); move(g2,w1);
      }
    }
    let moved=0;
    pool2.forEach(g=>{ if(g.week!==origWeek[g.id]){ moved++; if(g.date||g.time){ g.date=''; g.time=''; } } });
    scheduleSave(); renderTab();
    showToast(moved ? `Randomized game order \u2014 ${moved} game${moved===1?'':'s'} moved` : 'Nothing could move without creating a conflict');
  });
}

function limitScheduleGames(games, fmt){

function runInsightStages(boxId, stages, token){
  const box=document.getElementById(boxId); if(!box) return;
  if(!stages.length){ box.innerHTML=''; return; }
  box.innerHTML = stages.map((s,i)=>`<div id="${boxId}_${i}"></div>`).join('')
    + `<div id="${boxId}_status" class="muted" style="font-size:11.5px;margin-top:10px;">Loading matchup insights\u2026</div>`;
  let i=0;
  function step(){
    if(App._insightToken!==token || !document.getElementById(boxId)) return;   // window closed or replaced
    if(i>=stages.length){ const st=document.getElementById(boxId+'_status'); if(st) st.remove(); return; }
    const slot=document.getElementById(boxId+'_'+i);
    try{ if(slot) slot.innerHTML=stages[i](); }catch(e){ console.error(e); }
    i++; setTimeout(step, 12);
  }
  setTimeout(step, 30);
}

/* ---------------------------- legacy: bulk past winners ---------------------------- */
function legacyKey(label){
  const m=String(label||'').match(/(\d{1,4})/);
  return m ? +m[1] : null;
}
function openBulkWinnersModal(){
  openModal(`
    <div class="modal-head"><h3 style="margin:0;">Bulk add past winners</h3><button class="xbtn" onclick="closeModal()">\u2715</button></div>
    <div class="modal-body">
      <div class="muted" style="font-size:11.5px;">One winner per line as <strong>Winner \u2013 Year or Season number</strong>. They're saved as plain history in the Legacy tab (they don't change the all-time standings table, which is built from games played in this app).</div>
      <label style="margin-top:8px;">Past winners</label>
      <textarea id="bwText" rows="10" placeholder="Riverside Hawks - 2019
City Eagles - 2020
Wolves - Season 3
Lions - 4"></textarea>
      <label style="margin-top:8px;">A bare number like "4" means</label>
      <select id="bwKind">
        <option value="auto">Auto \u2014 1900 or higher is a year, anything smaller is a season number</option>
        <option value="year">Always a year</option>
        <option value="season">Always a season number</option>
      </select>
      <div class="muted" style="font-size:11px;margin-top:6px;">"Year \u2013 Winner" order also works. Lines already in Legacy with the same year/season and winner are skipped.</div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitBulkWinners()">Add winners</button></div>
  `,'wide');
}
function submitBulkWinners(){
  const t=App.current;
  if(!t.legacy) t.legacy={enabled:false, seasons:[], teamCareer:{}, manualSeasons:[]};
  if(!t.legacy.manualSeasons) t.legacy.manualSeasons=[];
  const kind=document.getElementById('bwKind').value;
  const lines=document.getElementById('bwText').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const looksLikeSeason=x=>/^(?:season|szn|s|year|yr)?\s*#?\s*\d{1,4}(?:\s*[\/\u2013-]\s*\d{1,4})?$/i.test(x.trim());
  const split=line=>{
    let parts=line.split(/\s+[-\u2013\u2014]\s+|\s*[\u2013\u2014]\s*|\t|\s*[|:]\s*/).map(x=>x.trim()).filter(Boolean);
    if(parts.length!==2) parts=line.split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean);
    if(parts.length!==2){ const m=line.match(/^(.*\S)-(\S+)$/); if(m) parts=[m[1].trim(), m[2].trim()]; }
    return parts.length===2 ? parts : null;
  };
  let added=0, dupes=0; const skipped=[];
  lines.forEach((line,idx)=>{
    const parts=split(line);
    if(!parts){ skipped.push(line); return; }
    let winner=parts[0], label=parts[1];
    if(looksLikeSeason(parts[0]) && !looksLikeSeason(parts[1])){ winner=parts[1]; label=parts[0]; }
    const bare=label.match(/^(?:season|szn|s|year|yr)?\s*#?\s*(\d{1,4})$/i);
    if(bare){
      const n=+bare[1], word=/season|szn|^s/i.test(label);
      if(kind==='year') label=String(n);
      else if(kind==='season' || word) label='Season '+n;
      else label = n>=1900 ? String(n) : 'Season '+n;
    }
    if(!winner || !label){ skipped.push(line); return; }
    const dupe=t.legacy.manualSeasons.some(m=>String(m.label).toLowerCase()===label.toLowerCase() && String(m.champion).toLowerCase()===winner.toLowerCase());
    if(dupe){ dupes++; return; }
    t.legacy.manualSeasons.push({id:uid('mlseason'), label, champion:winner, runnerUp:'', semifinalists:[], standings:[], addedAt:Date.now()+idx, isBulk:true, sortKey:legacyKey(label)});
    added++;
  });
  closeModal(); scheduleSave(); renderTab();
  showToast(added ? `Added ${added} past winner${added===1?'':'s'}${dupes?` (${dupes} duplicate${dupes===1?'':'s'} skipped)`:''}${skipped.length?` (${skipped.length} line${skipped.length===1?'':'s'} couldn't be read)`:''}` : (dupes? 'Those winners are already in Legacy' : 'Nothing added \u2014 use "Winner - Year"'));
}
function renderChampionsRoll(){
  const t=App.current;
  const manual=(t.legacy.manualSeasons||[]).filter(m=>m.champion);
  const archived=(t.legacy.seasons||[]).map(s=>s.champion ? s.champion.name : null).filter(Boolean);
  if(!manual.length) return '';
  const list=manual.slice().sort((a,b)=>{
    const ka=a.sortKey!=null?a.sortKey:legacyKey(a.label), kb=b.sortKey!=null?b.sortKey:legacyKey(b.label);
    if(ka!=null && kb!=null && ka!==kb) return kb-ka;
    if((ka==null)!==(kb==null)) return ka==null?1:-1;
    return (b.addedAt||0)-(a.addedAt||0);
  });
  const counts={};
  manual.map(m=>m.champion).concat(archived).forEach(n=>{ const k=n.toLowerCase(); counts[k]=counts[k]||{name:n,n:0}; counts[k].n++; });
  const top=Object.values(counts).sort((a,b)=>b.n-a.n || a.name.localeCompare(b.name));
  return `<div class="card">
    <h4>\ud83c\udfc6 Past champions</h4>
    <div class="row" style="margin-bottom:8px;">${top.map(c=>`<span class="pill">${esc(c.name)} \u00d7 ${c.n}</span>`).join('')}</div>
    <table><thead><tr><th class="team-cell" style="cursor:default;">Year / Season</th><th style="cursor:default;text-align:left;">Winner</th><th style="cursor:default;"></th></tr></thead>
    <tbody>${list.map(m=>`<tr><td class="team-cell">${esc(m.label)}</td><td style="text-align:left;">\ud83c\udfc6 ${esc(m.champion)}</td><td><button class="xbtn" title="Remove" onclick="deleteManualLegacySeason('${m.id}')">\u2715</button></td></tr>`).join('')}</tbody></table>
  </div>`;
}

function recordFirst(defs){
  const i=defs.findIndex(d=>d[0]==='compact');
  if(i>0){ const d=defs.splice(i,1)[0]; defs.unshift(d); }
}
/* Team window: the playoff-outlook simulation loads after the window is already open */
function teamOutlookPlaceholder(teamId){
  const G=App.prefs.perf.game;
  if(!G.outlook || G.mode==='off') return '';
  if(G.mode==='manual') return `<div class="row" style="margin-top:10px;"><button class="btn small" onclick="loadTeamOutlook('${teamId}')">\ud83d\udcca Load playoff outlook</button></div>`;
  return '';
}
function loadTeamOutlook(teamId){
  const box=document.getElementById('tmOutlook'); if(!box) return;
  box.innerHTML='<div class="muted" style="font-size:11.5px;margin-top:10px;">Loading outlook\u2026</div>';
  const token=App._tmToken=(App._tmToken||0)+1;
  setTimeout(()=>{
    const b=document.getElementById('tmOutlook');
    if(!b || App._tmToken!==token) return;
    try{ b.innerHTML=teamOutlookTable(teamId); }catch(e){ console.error(e); b.innerHTML=''; }
  }, 30);
}
function startTeamOutlook(teamId){
  const G=App.prefs.perf.game;
  if(G.outlook && G.mode==='auto') loadTeamOutlook(teamId);
}
