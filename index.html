50 4 L90 16 V50 C90 76 70 92 50 98 C30 92 10 76 10 50 V16 Z\"',\n  circle:'<circle cx=\"50\" cy=\"50\" r=\"45\"',\n  hex:'<polygon points=\"26,6 74,6 98,50 74,94 26,94 2,50\"',\n  diamond:'<polygon points=\"50,2 98,50 50,98 2,50\"',\n  star:'<polygon points=\"50,4 62,37 97,37 69,58 80,93 50,72 20,93 31,58 3,37 38,37\"',\n  badge:'<rect x=\"6\" y=\"14\" width=\"88\" height=\"72\" rx=\"18\"'\n};\nfunction logo(t,size){\n  size=size||56;\n  if(t.img)return '<img class=\"logo\" src=\"'+t.img+'\" style=\"width:'+size+'px;height:'+size+'px;object-fit:contain\" alt=\"\">';\n  const tc=ratio(t.c1,t.c2)>=3?t.c2:ink(t.c1);\n  const ab=esc((t.abbr||'').slice(0,4));\n  const fs=ab.length>=4?24:ab.length===3?30:ab.length===2?38:46;\n  const ty=t.shape==='star'?60:54;\n  return '<svg class=\"logo\" viewBox=\"0 0 100 100\" width=\"'+size+'\" height=\"'+size+'\">'+(SHAPES[t.shape]||SHAPES.shield)+' fill=\"'+t.c1+'\" stroke=\"'+t.c2+'\" stroke-width=\"6\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"'+ty+'\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Oswald,Arial Narrow,Impact,sans-serif\" font-weight=\"700\" font-size=\"'+fs+'\" fill=\"'+tc+'\">'+ab+'<\/text><\/svg>';\n}\n\n/* ---------- game logic ---------- */\nconst oppOf=s=>s==='home'?'away':'home';\nconst bbBat=g=>g.half==='top'?'away':'home';\nfunction getScore(sp,side){\n  const g=S.g[sp];\n  if(sp==='baseball')return (g.runs[side]||[]).reduce((a,b)=>a+(b||0),0);\n  return g.score[side];\n}\nfunction addRuns(g,side,n){\n  const idx=g.inning-1;\n  ['away','home'].forEach(s=>{while(g.runs[s].length<g.inning)g.runs[s].push(0);});\n  if(n>0)g.runs[side][idx]+=n;\n  else{let left=-n;for(let i=idx;i>=0&&left>0;i--){while(g.runs[side][i]>0&&left>0){g.runs[side][i]--;left--;}}}\n}\nfunction bbOut(g){g.outs++;g.balls=0;g.strikes=0;if(g.outs>=3)bbNextHalf(g);}\nfunction bbNextHalf(g){\n  g.balls=g.strikes=g.outs=0;g.bases=[false,false,false];\n  if(g.half==='top')g.half='bottom';else{g.half='top';g.inning++;}\n  ['away','home'].forEach(s=>{while(g.runs[s].length<g.inning)g.runs[s].push(0);});\n}\nfunction bbWalk(g){\n  g.balls=0;g.strikes=0;let r=0;const b=g.bases;\n  if(b[0]){if(b[1]){if(b[2])r++;b[2]=true;}b[1]=true;}\n  b[0]=true;return r;\n}\nfunction bbHit(g,n){\n  g.balls=0;g.strikes=0;let r=0;const nb=[false,false,false];\n  for(let i=2;i>=0;i--){if(g.bases[i]){const dst=i+n;if(dst>=3)r++;else nb[dst]=true;}}\n  if(n>=4)r++;else nb[n-1]=true;\n  g.bases=nb;return r;\n}\nfunction bbAct(a,d){\n  const g=S.g.baseball,bat=bbBat(g);let runs=0,kind='';\n  switch(a){\n    case 'ball':g.balls++;if(g.balls>=4)runs=bbWalk(g);break;\n    case 'walk':runs=bbWalk(g);break;\n    case 'strike':g.strikes++;if(g.strikes>=3)bbOut(g);break;\n    case 'foul':if(g.strikes<2)g.strikes++;break;\n    case 'out':bbOut(g);break;\n    case 'clearcount':g.balls=0;g.strikes=0;break;\n    case 'hit':{const n=+d.n;runs=bbHit(g,n);g.hits[bat]++;kind=n===4?'hr':'';break;}\n    case 'err':g.errors[oppOf(bat)]++;break;\n    case 'nexthalf':bbNextHalf(g);break;\n    case 'clearbases':g.bases=[false,false,false];break;\n    case 'base':g.bases[+d.i]=!g.bases[+d.i];break;\n    case 'box':g.box=!g.box;break;\n    default:return false;\n  }\n  if(runs>0){addRuns(g,bat,runs);render();celebrateScore('baseball',bat,runs,kind);}else render();\n  return true;\n}\n\n/* timed sports */\nfunction lenFor(sp,p){const c=S.cfg[sp];return (p>c.periods?c.ot:c.len)*1000;}\nfunction sStart(p){const c=S.cfg.soccer;return p===1?0:p===2?c.len:p===3?2*c.len:2*c.len+c.etLen;}\nfunction sEnd(p){const c=S.cfg.soccer;return p<=2?p*c.len:p===3?2*c.len+c.etLen:2*c.len+2*c.etLen;}\nfunction interLen(sp,p){\n  const c=S.cfg[sp];\n  if(sp==='soccer')return p===1?c.half:p===3?c.etBrk:0;\n  if(p>=c.periods)return 0;\n  if(sp==='hockey')return c.brk;\n  return p===Math.floor(c.periods/2)?c.half:c.brk;\n}\nfunction interLabel(sp,p){\n  const c=S.cfg[sp];\n  if(sp==='soccer')return p===1?'HALFTIME':'EXTRA-TIME BREAK';\n  if(sp==='hockey')return 'INTERMISSION';\n  return p===Math.floor(c.periods/2)?'HALFTIME':'END OF '+(c.periods===2?'HALF ':'QUARTER ')+p;\n}\nfunction startInter(sp){const g=S.g[sp],len=interLen(sp,g.period);if(len>0)g.inter={ms:len*1000,label:interLabel(sp,g.period)};}\nfunction nextPeriod(sp){\n  const g=S.g[sp],c=S.cfg[sp];\n  g.period++;g.inter=null;g.ended=false;g.running=false;g.timeout=null;g.final=false;\n  if(g.period===(sp==='soccer'?2:c.periods)+1&&g.score)g.otFrom={away:g.score.away,home:g.score.home};\n  if(sp==='soccer'){g.clock=sStart(g.period)*1000;g.added=0;}else g.clock=lenFor(sp,g.period);\n  if(sp==='basketball')g.fouls={away:0,home:0};\n  if(sp==='football'&&(g.period===Math.floor(c.periods/2)+1||g.period>c.periods))g.to={away:c.timeouts,home:c.timeouts};\n}\nfunction endInter(sp){const g=S.g[sp];g.inter=null;if(g.ended)nextPeriod(sp);}\nfunction periodEnded(sp){\n  const g=S.g[sp],c=S.cfg[sp];\n  g.running=false;g.timeout=null;g.ended=true;\n  tone([[190,0,1.1,'sawtooth']]);\n  const p=g.period;\n  if(sp==='soccer'){if(p===1||p===3)startInter(sp);return;}\n  if(p<c.periods)startInter(sp);\n}\nfunction decPens(g,d){\n  const n=g.pens.length;\n  g.pens.forEach(p=>{p.ms-=d;});\n  g.pens=g.pens.filter(p=>p.ms>0);\n  return g.pens.length!==n;\n}\nfunction hockeyGoal(side){\n  const g=S.g.hockey,c=S.cfg.hockey,opp=oppOf(side);\n  const mine=g.pens.filter(p=>p.side===side).length,theirs=g.pens.filter(p=>p.side===opp);\n  if(theirs.length>mine){\n    const cand=theirs.filter(p=>p.eog).sort((a,b)=>a.ms-b.ms)[0];\n    if(cand){const m=c.minor*1000;if(cand.ms<=m)g.pens=g.pens.filter(p=>p!==cand);else cand.ms-=m;}\n  }\n}\nfunction tickGame(sp,d){\n  const g=S.g[sp];\n  if(g.inter){g.inter.ms-=d;if(g.inter.ms<=0){endInter(sp);return true;}return false;}\n  if(g.timeout){g.timeout.ms-=d;if(g.timeout.ms<=0){g.timeout=null;tone([[440,0,.35],[440,.5,.35]]);return true;}return false;}\n  if(!g.running)return false;\n  if(sp==='soccer'){g.clock+=d;return false;}\n  g.clock-=d;let ch=false;\n  if(sp==='hockey'&&decPens(g,d))ch=true;\n  if(g.clock<=0){g.clock=0;periodEnded(sp);return true;}\n  return ch;\n}\n\n/* shootouts */\nconst newSO=r=>({rounds:r,away:[],home:[],first:'away',log:[]});\nconst soScore=(so,s)=>so[s].filter(x=>x==='g').length;\nfunction soNext(so){return so.away.length===so.home.length?so.first:oppOf(so.first);}\nfunction soKick(so,res){const s=soNext(so);so[s].push(res);so.log.push(s);}\nfunction soWinner(so){\n  const a=soScore(so,'away'),h=soScore(so,'home'),na=so.away.length,nh=so.home.length,R=so.rounds;\n  if(na<=R&&nh<=R){if(a>h+(R-nh))return 'away';if(h>a+(R-na))return 'home';}\n  if(na===nh&&na>=R&&a!==h)return a>h?'away':'home';\n  return null;\n}\n\n/* ---------- labels ---------- */\nfunction plabel(sp,g){\n  const c=S.cfg[sp],p=g.period,ot=p-c.periods;\n  if(sp==='soccer')return ['','1ST HALF','2ND HALF','EXTRA TIME 1','EXTRA TIME 2'][p]||'PERIOD '+p;\n  if(p<=c.periods)return sp==='hockey'?ordn(p)+' PERIOD':(c.periods===2?ordn(p)+' HALF':ordn(p)+' QUARTER');\n  return ot===1?'OVERTIME':ordn(ot)+' OVERTIME';\n}\nconst clockText=(sp,g)=>fmt(g.clock,sp==='basketball'||sp==='hockey');\nfunction clk2Text(sp,g){\n  if(sp!=='soccer')return '';\n  const over=g.clock-sEnd(g.period)*1000;\n  return over>0?'+'+fmt(over):'';\n}\nfunction bonusTxt(g,c,side){\n  const f=g.fouls[oppOf(side)];\n  if(c.bonus2>0&&f>=c.bonus2)return 'DOUBLE BONUS';\n  if(c.bonus1>0&&f>=c.bonus1)return 'BONUS';\n  return '';\n}\nfunction ppText(g,side){\n  const opp=oppOf(side),mine=g.pens.filter(p=>p.side===side),theirs=g.pens.filter(p=>p.side===opp);\n  if(theirs.length<=mine.length)return null;\n  const sk=a=>Math.max(3,5-a.length);\n  return 'POWER PLAY '+sk(mine)+'v'+sk(theirs)+' · '+fmt(Math.min.apply(null,theirs.map(p=>p.ms)));\n}\n\n/* ---------- celebration ---------- */\nfunction celebrateScore(sp,side,pts,kind){\n  const t=S.teams[sp][side];\n  let text='SCORE!',big=false,fx='';\n  if(sp==='baseball'){text=kind==='hr'?'HOME RUN!':pts>1?pts+' RUNS SCORE!':'RUN SCORES!';big=kind==='hr'||pts>=3;fx=kind==='hr'?'hr':'';}\n  else if(sp==='basketball'){text=pts===3?'THREE-POINTER!':pts===2?'BUCKET!':'FREE THROW';big=pts===3;}\n  else if(sp==='football'){text=({td:'TOUCHDOWN!',fg:'FIELD GOAL!',pat:'EXTRA POINT',saf:'SAFETY!'})[kind]||(kind==='2pt'?'2-POINT CONVERSION':'SCORE!');big=kind==='td';}\n  else if(sp==='hockey'){text='GOAL!';big=true;fx='siren';}\n  else if(sp==='soccer'){text='GOOOAL!';big=true;}\n  celebrate(sp,side,text,t.name,{big,fx});\n}\n/* ===================== v3 modules ===================== */\n/* ---------- settings sync with the scheduling app ---------- */\nlet lastSent='';\nfunction syncSettings(){\n  if(!EMB.on)return;\n  const s=JSON.stringify({cfg:S.cfg,opts:S.opts});\n  if(s===lastSent)return;\n  lastSent=s;\n  post({type:'sb-settings',cfg:S.cfg,opts:S.opts});\n}\nfunction applySettings(st){\n  if(!st)return;\n  if(st.cfg)Object.keys(SP).forEach(k=>{if(st.cfg[k])Object.assign(S.cfg[k],st.cfg[k]);});\n  if(st.opts)mergeOpts(st.opts);\n  lastSent=JSON.stringify({cfg:S.cfg,opts:S.opts});\n}\n\n/* ---------- scores by period ---------- */\nfunction periodNames(sp){\n  const c=S.cfg[sp];\n  if(sp==='baseball')return [];\n  if(sp==='soccer')return ['1H','2H','ET1','ET2'];\n  const n=[];for(let i=1;i<=c.periods;i++)n.push(sp==='hockey'?String(i):(c.periods===2?'H'+i:'Q'+i));\n  return n;\n}\nfunction periodLabels(sp,count){\n  const names=periodNames(sp),out=[];\n  for(let i=1;i<=count;i++){\n    if(i<=names.length)out.push(names[i-1]);\n    else{const k=i-names.length;out.push(k===1?'OT':'OT'+k);}\n  }\n  return out;\n}\nfunction ensureLines(g){if(!g.lines)g.lines={away:[],home:[]};return g.lines;}\nfunction bumpLine(sp,g,side,pts){\n  if(sp==='baseball')return;\n  const L=ensureLines(g),i=Math.max(0,g.period-1);\n  ['away','home'].forEach(s=>{while(L[s].length<g.period)L[s].push(0);});\n  L[side][i]=Math.max(0,(L[side][i]||0)+pts);\n}\nfunction lineData(sp,g){\n  if(sp==='baseball'){\n    const c=S.cfg.baseball,n=Math.max(c.innings,g.inning);\n    const cols=[];for(let i=1;i<=n;i++)cols.push(String(i));\n    const val=(side,i)=>(i<g.inning-1||(i===g.inning-1&&(side==='away'||g.half==='bottom')))?(g.runs[side][i]||0):'';\n    return {labels:cols,cur:g.inning-1,rows:{away:cols.map((x,i)=>val('away',i)),home:cols.map((x,i)=>val('home',i))}};\n  }\n  const L=ensureLines(g);\n  let count=Math.max(g.period,sp==='soccer'?2:S.cfg[sp].periods);\n  if(sp==='soccer'&&g.period<=2)count=2;\n  const labels=periodLabels(sp,count);\n  const row=side=>labels.map((x,i)=>i<g.period?(L[side][i]||0):'');\n  return {labels,cur:g.period-1,rows:{away:row('away'),home:row('home')}};\n}\nfunction lineScoreHtml(sp,g){\n  const D=lineData(sp,g),T=S.teams[sp];\n  const head='<tr><th class=\"tm\"><\/th>'+D.labels.map(x=>'<th>'+x+'<\/th>').join('')+'<th class=\"t\">T<\/th>'+(sp==='baseball'?'<th>H<\/th><th>E<\/th>':'')+'<\/tr>';\n  const row=side=>'<tr><td class=\"tm\"><i style=\"background:'+T[side].c1+'\"><\/i>'+esc(T[side].abbr||T[side].name)+'<\/td>'\n    +D.rows[side].map((v,i)=>'<td class=\"'+(i===D.cur&&!g.final?'cur':'')+'\">'+v+'<\/td>').join('')\n    +'<td class=\"t\">'+getScore(sp,side)+'<\/td>'+(sp==='baseball'?'<td>'+g.hits[side]+'<\/td><td>'+g.errors[side]+'<\/td>':'')+'<\/tr>';\n  return '<div class=\"tbl\"><table class=\"ls\">'+head+row('away')+row('home')+'<\/table><\/div>';\n}\nfunction statsPanel(sp,g){\n  const T=S.teams[sp],srow=(l,a,h)=>'<div class=\"statrow\"><b>'+a+'<\/b><span>'+l+'<\/span><b>'+h+'<\/b><\/div>';\n  let extra='';\n  if(sp==='basketball')extra=srow('Team fouls',g.fouls.away,g.fouls.home)+srow('Timeouts left',g.to.away,g.to.home);\n  else if(sp==='football')extra=srow('Timeouts left',g.to.away,g.to.home);\n  else if(sp==='hockey')extra=srow('Shots on goal',g.shots.away,g.shots.home)+srow('Penalties on the clock',g.pens.filter(p=>p.side==='away').length,g.pens.filter(p=>p.side==='home').length);\n  else if(sp==='soccer')extra=srow('Yellow cards',g.cards.away.y,g.cards.home.y)+srow('Red cards',g.cards.away.r,g.cards.home.r);\n  else if(sp==='baseball')extra=srow('Hits',g.hits.away,g.hits.home)+srow('Errors',g.errors.away,g.errors.home);\n  return '<div class=\"panel\"><h3>Scores by period<\/h3>'+lineScoreHtml(sp,g)+(extra?'<div style=\"margin-top:8px\">'+extra+'<\/div>':'')+'<\/div>';\n}\nfunction periodPanel(sp,g,c){\n  const word=sp==='soccer'?'half':sp==='hockey'?'period':'quarter';\n  const reg=sp==='soccer'?2:c.periods,tied=g.score.away===g.score.home;\n  const nextDis=sp==='soccer'&&(g.period>=4||(g.period>=2&&!c.et));\n  let more='';\n  if(sp==='basketball'||sp==='football')more+='<div class=\"row\"><button class=\"btn\" data-a=\"flip\">⇄ Flip possession<\/button><button class=\"btn\" data-a=\"poss\" data-side=\"none\">No possession<\/button><\/div>';\n  if(sp==='soccer')more+='<div class=\"row\"><button class=\"btn\" data-a=\"so_start\">🥅 Penalties<\/button><\/div>';\n  if(sp==='hockey')more+='<div class=\"row\"><button class=\"btn\" data-a=\"so_start\">🥅 Shootout<\/button><\/div>';\n  return '<div class=\"panel\"><h3>Game progress<\/h3><div class=\"plabel big\" style=\"text-align:center;color:var(--text)\">'+plabel(sp,g)+'<\/div>'\n    +'<div class=\"row\"><button class=\"btn\" data-a=\"prevperiod\" '+(g.period<=1?'disabled':'')+'>◀ Previous '+word+'<\/button><button class=\"btn pri\" data-a=\"nextperiod\" '+(nextDis?'disabled':'')+'>'+(g.period>=reg?(tied?'Start overtime ▶':'Next ▶'):'Next '+word+' ▶')+'<\/button><\/div>'\n    +'<div class=\"row\"><button class=\"btn '+(g.final?'pri':'')+'\" data-a=\"final\">'+(g.final?'Reopen game':'Mark final')+'<\/button><\/div>'+more+'<\/div>';\n}\n\n/* ---------- graphic packages ---------- */\nconst PKGS={\n  classic:{label:'Classic',desc:'Dark glass, gold edge',sw:'linear-gradient(90deg,#111826,#ffb020)'},\n  broadcast:{label:'Broadcast',desc:'Bold network bar',sw:'linear-gradient(90deg,#0b2a5b,#e8112d)'},\n  neon:{label:'Neon',desc:'Glowing outlines',sw:'linear-gradient(90deg,#05060c,#00e5ff)'},\n  minimal:{label:'Minimal',desc:'Clean and flat',sw:'linear-gradient(90deg,#e9edf4,#9aa7bd)'},\n  retro:{label:'Retro LED',desc:'Amber scoreboard',sw:'linear-gradient(90deg,#0a0a0a,#ff9a1f)'}\n};\nconst imgCache={};\nfunction cachedImg(src){\n  if(!src)return null;\n  let e=imgCache[src];\n  if(!e){e=imgCache[src]={im:new Image(),ok:false};e.im.onload=()=>{e.ok=true;};e.im.src=src;}\n  return e.ok?e.im:null;\n}\nfunction rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}\nfunction fitText(ctx,txt,maxW,px,weight,fam){\n  let s=px;ctx.font=weight+' '+s+'px '+fam;\n  while(ctx.measureText(txt).width>maxW&&s>8){s-=1;ctx.font=weight+' '+s+'px '+fam;}\n}\n/* The score bug that sits in the top-right of the camera picture (and so ends up in the saved video) */\nfunction drawBug(ctx,W,H){\n  const sp=S.sport,g=S.g[sp],T=S.teams[sp],pk=S.opts.pkg||'classic';\n  const u=Math.min(W,H)/720,pad=18*u,pw=330*u,hh=30*u,rh=50*u,x=W-pw-pad,y=pad;\n  const cs=getComputedStyle(document.documentElement);\n  const nf=cs.getPropertyValue('--nfont')||'Orbitron,monospace',bf=cs.getPropertyValue('--bfont')||'Oswald,sans-serif';\n  const rad=pk==='broadcast'||pk==='retro'?4*u:pk==='minimal'?10*u:14*u;\n  const th={\n    classic:{bg:'rgba(10,14,24,.82)',head:'#ffb020',headInk:'#1b1300',row:'rgba(255,255,255,.06)',scoreBg:'rgba(0,0,0,.35)',scoreInk:'#fff',edge:'#ffb020'},\n    broadcast:{bg:'rgba(8,12,22,.92)',head:'#e8112d',headInk:'#fff',row:'rgba(255,255,255,.04)',scoreBg:'#ffffff',scoreInk:'#0b0f18',edge:'#ffffff'},\n    neon:{bg:'rgba(3,4,10,.88)',head:'#00e5ff',headInk:'#021014',row:'rgba(255,255,255,.04)',scoreBg:'rgba(0,0,0,.5)',scoreInk:'#00e5ff',edge:'#00e5ff'},\n    minimal:{bg:'rgba(255,255,255,.88)',head:'#1c2536',headInk:'#fff',row:'rgba(0,0,0,.05)',scoreBg:'rgba(0,0,0,.08)',scoreInk:'#10131a',edge:'#c5cddb'},\n    retro:{bg:'#0a0a0a',head:'#3a2a12',headInk:'#ff9a1f',row:'rgba(255,154,31,.06)',scoreBg:'#000',scoreInk:'#ff9a1f',edge:'#3a2a12'}\n  }[pk]||{};\n  const top=sp==='baseball'?(g.half==='top'?'▲ ':'▼ ')+ordn(g.inning):plabel(sp,g);\n  const clk=(sp!=='baseball'&&S.opts.timer)?clockText(sp,g):'';\n  ctx.save();\n  if(pk==='neon'){ctx.shadowColor=th.edge;ctx.shadowBlur=18*u;}else{ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=14*u;ctx.shadowOffsetY=3*u;}\n  rr(ctx,x,y,pw,hh+rh*2,rad);ctx.fillStyle=th.bg;ctx.fill();\n  ctx.shadowColor='transparent';\n  if(pk==='neon'||pk==='retro'||pk==='minimal'||pk==='broadcast'){rr(ctx,x,y,pw,hh+rh*2,rad);ctx.lineWidth=2*u;ctx.strokeStyle=th.edge;ctx.stroke();}\n  ctx.save();rr(ctx,x,y,pw,hh+rh*2,rad);ctx.clip();\n  ctx.fillStyle=th.head;ctx.fillRect(x,y,pw,hh);\n  ctx.fillStyle=th.headInk;ctx.textBaseline='middle';\n  fitText(ctx,top,pw*0.6,15*u,'800',bf);ctx.textAlign='left';ctx.fillText(top,x+12*u,y+hh/2+1*u);\n  if(clk){fitText(ctx,clk,pw*0.34,17*u,'800',nf);ctx.textAlign='right';ctx.fillText(clk,x+pw-12*u,y+hh/2+1*u);}\n  ['away','home'].forEach((side,i)=>{\n    const t=T[side],ry=y+hh+i*rh;\n    ctx.fillStyle=th.row;ctx.fillRect(x,ry,pw,rh);\n    ctx.fillStyle=t.c1;ctx.fillRect(x,ry,10*u,rh);\n    const im=cachedImg(t.img);\n    if(im){const s=rh-14*u;ctx.drawImage(im,x+18*u,ry+7*u,s,s);}\n    const nx=x+(im?18*u+rh-4*u:22*u);\n    ctx.fillStyle=pk==='minimal'?'#10131a':'#fff';ctx.textAlign='left';\n    fitText(ctx,String(t.abbr||t.name),pw-(nx-x)-86*u,21*u,'800',bf);ctx.fillText(String(t.abbr||t.name).toUpperCase(),nx,ry+rh/2+1*u);\n    const sw=70*u;rr(ctx,x+pw-sw-8*u,ry+7*u,sw,rh-14*u,6*u);ctx.fillStyle=th.scoreBg;ctx.fill();\n    ctx.fillStyle=th.scoreInk;ctx.textAlign='center';fitText(ctx,String(getScore(sp,side)),sw-10*u,28*u,'800',nf);\n    ctx.fillText(String(getScore(sp,side)),x+pw-sw/2-8*u,ry+rh/2+2*u);\n  });\n  ctx.restore();ctx.restore();\n  // lower-third when someone just scored\n  const c= eturn;}\n  const w=document.createElement('div');w.id='cam';w.innerHTML=camShell();document.body.appendChild(w);\n  document.body.style.overflow='hidden';\n  CAM.cv=w.querySelector('#camCv');CAM.ctx=CAM.cv.getContext('2d');CAM.video=w.querySelector('#camVid');\n  CAM.on=true;CAM.buf=[];\n  try{await camStream();}catch(e){camClose();toast('Could not start the camera. Check that camera access is allowed.');return;}\n  camRefreshUI();camLoop();loadClips();\n}\nasync function camStream(){\n  if(CAM.stream)CAM.stream.getTracks().forEach(t=>t.stop());\n  const v={facingMode:{ideal:CAM.facing},width:{ideal:1280},height:{ideal:720}};\n  let st;\n  try{st=await navigator.mediaDevices.getUserMedia({video:v,audio:true});}\n  catch(e){st=await navigator.mediaDevices.getUserMedia({video:v,audio:false});}\n  CAM.stream=st;CAM.video.srcObject=st;\n  try{await CAM.video.play();}catch(e){}\n}\nfunction camLoop(){\n  if(!CAM.on)return;\n  CAM.raf=requestAnimationFrame(camLoop);\n  const v=CAM.video;if(!v||v.readyState<2||!v.videoWidth)return;\n  const portrait=v.videoHeight>v.videoWidth,W=portrait?720:1280,H=portrait?1280:720;\n  if(CAM.cv.width!==W||CAM.cv.height!==H){CAM.cv.width=W;CAM.cv.height=H;}\n  const ctx=CAM.ctx,s=Math.max(W/v.videoWidth,H/v.videoHeight),dw=v.videoWidth*s,dh=v.videoHeight*s;\n  ctx.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);\n  drawBug(ctx,W,H);\n  const now=performance.now();\n  if(now-CAM.lastBuf>=66){CAM.lastBuf=now;camBuffer(now,W,H);}\n}\nfunction camBuffer(now,W,H){\n  const bw=W>H?640:360,bh=W>H?360:640;\n  if(!CAM.bufCv){CAM.bufCv=document.createElement('canvas');}\n  if(CAM.bufCv.width!==bw){CAM.bufCv.width=bw;CAM.bufCv.height=bh;}\n  const b=CAM.bufCv.getContext('2d');b.drawImage(CAM.cv,0,0,bw,bh);\n  CAM.bufCv.toBlob(bl=>{\n    if(!bl)return;\n    CAM.buf.push({t:now,blob:bl});\n    const cut=performance.now()-10600;\n    while(CAM.buf.length&&CAM.buf[0].t<cut)CAM.buf.shift();\n  },'image/jpeg',0.62);\n}\nfunction camScoreHtml(){\n  const sp=S.sport,g=
