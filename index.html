n '';\n}\nfunction camRecToggle(){\n  if(CAM.rec&&CAM.rec.state==='recording'){CAM.rec.stop();return;}\n  if(!window.MediaRecorder){toast('Recording is not supported in this browser.');return;}\n  const cs=CAM.cv.captureStream(30);\n  if(CAM.stream)CAM.stream.getAudioTracks().forEach(t=>cs.addTrack(t));\n  const mime=pickMime();CAM.chunks=[];\n  try{CAM.rec=new MediaRecorder(cs,mime?{mimeType:mime,videoBitsPerSecond:5000000}:undefined);}\n  catch(e){toast('Could not start recording.');return;}\n  CAM.rec.ondataavailable=e=>{if(e.data&&e.data.size)CAM.chunks.push(e.data);};\n  CAM.rec.onstop=()=>{\n    clearInterval(CAM.recTimer);\n    const r=document.getElementById('camRec'),b=document.getElementById('camRecBtn');\n    if(r)r.classList.remove('on');if(b)b.classList.remove('on');\n    const type=(CAM.rec&&CAM.rec.mimeType)||mime||'video/webm';\n    const blob=new Blob(CAM.chunks,{type});CAM.chunks=[];\n    if(blob.size)camSaveSheet(blob,'game');\n  };\n  CAM.rec.start(1000);CAM.recT0=Date.now();\n  const r=document.getElementById('camRec'),b=document.getElementById('camRecBtn');\n  if(r)r.classList.add('on');if(b)b.classList.add('on');\n  CAM.recTimer=setInterval(()=>{const s=Math.floor((Date.now()-CAM.recT0)/1000),t=document.getElementById('camT');if(t)t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},500);\n}\nfunction fileFor(blob,base){\n  const ext=/mp4/.test(blob.type)?'mp4':'webm';\n  const d=new Date(),p=n=>String(n).padStart(2,'0');\n  return new File([blob],base+'-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.'+ext,{type:blob.type});\n}\nfunction camSaveSheet(blob,base){\n  const old=document.getElementById('camSave');if(old)old.remove();\n  const file=fileFor(blob,base),url=URL.createObjectURL(blob);\n  const o=document.createElement('div');o.className='ovl';o.id='camSave';\n  const mb=(blob.size/1048576).toFixed(1);\n  o.innerHTML='<div class=\"box\"><h2>'+(base==='game'?'Recording saved':'Replay ready')+'<\/h2><video src=\"'+url+'\" controls playsinline style=\"width:100%;max-height:44vh;border-radius:12px;background:#000\"><\/video>'\n    +'<p style=\"font-size:13px;color:#9fb0cc;margin:10px 0\">'+mb+' MB. On iPhone choose <b>Save Video<\/b> in the share sheet to put it in your camera roll. On Android and computers it downloads to your device.<\/p>'\n    +'<div class=\"row\" style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn pri\" style=\"flex:1\" data-sv=\"share\">⬇ Save to camera roll<\/button><button class=\"btn\" data-sv=\"dl\">Download file<\/button><button class=\"btn\" data-sv=\"close\">Done<\/button><\/div><\/div>';\n  document.body.appendChild(o);\n  o.addEventListener('click',async e=>{\n    const k=e.target.closest('[data-sv]');if(!k)return;\n    const a=k.dataset.sv;\n    if(a==='close'){o.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);return;}\n    if(a==='share'&&navigator.canShare&&navigator.canShare({files:[file]})){\n      try{await navigator.share({files:[file],title:'Game video'});return;}catch(x){if(x&&x.name==='AbortError')return;}\n    }\n    const l=document.createElement('a');l.href=url;l.download=file.name;document.body.appendChild(l);l.click();l.remove();\n  });\n}\nasync function camReplay(){\n  if(!CAM.on){toast('Open the camera first, then tap Replay.');return;}\n  const now=performance.now(),fr=CAM.buf.filter(f=>f.t>=now-10000);\n  if(fr.length<6){toast('Keep the camera running a few seconds, then try again.');return;}\n  const span=Math.max(1,(fr[fr.length-1].t-fr[0].t)/1000),fps=Math.max(4,Math.min(30,Math.round((fr.length-1)/span)));\n  const blobs=fr.map(f=>f.blob);\n  const clip={id:'c'+Date.now(),created:Date.now(),label:scoreText(),fps,n:blobs.length,thumb:blobs[Math.floor(blobs.length/2)]};\n  clip.thumbUrl=URL.createObjectURL(clip.thumb);\n  CAM.clips.unshift(clip);\n  saveClip(clip,blobs);\n  openPlayer(clip,blobs);\n}\nasync function openPlayer(clip,frames){\n  closePlayer();\n  frames=frames||await clipFrames(clip);\n  if(!frames.length){toast('That replay is no longer available.');return;}\n  const urls=frames.map(b=>URL.createObjectURL(b));\n  const p=document.createElement('div');p.id='rp';\n  p.innerHTML='<div class=\"stage\"><img id=\"rpImg\" alt=\"Replay\"><\/div><div class=\"rpc\"><div style=\"text-align:center;font-weight:800\">⏪ REPLAY · '+esc(clip.label)+'<\/div>'\n    +'<input type=\"range\" id=\"rpSeek\" min=\"0\" max=\"'+(urls.length-1)+'\" value=\"0\">'\n    +'<div class=\"row2\"><button class=\"cbtn sm\" data-rp=\"play\" id=\"rpPlay\">⏸<\/button><button class=\"cbtn sm\" data-rp=\"s1\" data-s=\"1\">1×<\/button><button class=\"cbtn sm\" data-rp=\"s2\" data-s=\"0.5\">½×<\/button><button class=\"cbtn sm\" data-rp=\"s3\" data-s=\"0.25\">¼×<\/button>'\n    +'<button class=\"cbtn sm\" data-rp=\"save\">⬇ Save video<\/button><button class=\"cbtn sm\" data-rp=\"close\">Close<\/button><\/div><\/div>';\n  document.body.appendChild(p);\n  const P=CAM.player={clip,urls,i:0,speed:1,playing:true,timer:0,p};\n  const img=p.querySelector('#rpImg'),seek=p.querySelector('#rpSeek');\n  const show=()=>{img.src=urls[P.i];seek.value=P.i;};\n  const tick=()=>{\n    if(!CAM.player||CAM.player!==P)return;\n    if(P.playing){P.i++;if(P.i>=urls.length){P.i=0;}show();}\n    P.timer=setTimeout(tick,1000/(clip.fps*P.speed));\n  };\n  show();tick();\n  seek.addEventListener('input',()=>{P.i=+seek.value;P.playing=false;p.querySelector('#rpPlay').textContent='▶';show();});\n  p.addEventListener('click',async e=>{\n    const k=e.target.closest('[data-rp]');if(!k)return;\n    const a=k.dataset.rp;\n    if(a==='play'){P.playing=!P.playing;k.textContent=P.playing?'⏸':'▶';}\n    else if(a[0]==='s'&&k.dataset.s){P.speed=+k.dataset.s;P.playing=true;p.querySelector('#rpPlay').textContent='⏸';}\n    else if(a==='close')closePlayer();\n    else if(a==='save'){k.textContent='Rendering…';k.disabled=true;try{const blob=await renderClip(clip,urls);camSaveSheet(blob,'replay');}catch(x){toast('Could not make the video.');}k.textContent='⬇ Save video';k.disabled=false;}\n  });\n}\nfunction closePlayer(){\n  const P=CAM.player;if(!P)return;\n  clearTimeout(P.timer);P.urls.forEach(u=>URL.revokeObjectURL(u));P.p.remove();CAM.player=null;\n}\nfunction renderClip(clip,urls){\n  return new Promise(async(res,rej)=>{\n    try{\n      const first=await loadImg2(urls[0]),cv=document.createElement('canvas');\n      cv.width=first.naturalWidth;cv.height=first.naturalHeight;\n      const ctx=cv.getContext('2d'),cs=cv.captureStream(clip.fps),mime=pickMime();\n      const rec=new MediaRecorder(cs,mime?{mimeType:mime,videoBitsPerSecond:3000000}:undefined),ch=[];\n      rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};\n      rec.onstop=()=>res(new Blob(ch,{type:rec.mimeType||mime||'video/webm'}));\n      rec.start();\n      for(const u of urls){const im=await loadImg2(u);ctx.drawImage(im,0,0);await new Promise(r=>setTimeout(r,1000/clip.fps));}\n      rec.stop();\n    }catch(e){rej(e);}\n  });\n}\nfunction loadImg2(u){return new Promise((r,j)=>{const im=new Image();im.onload=()=>r(im);im.onerror=j;im.src=u;});}\nfunction replaysForm(){\n  loadClips();\n  const list=CAM.clips;\n  return '<p class=\"muted\">The camera keeps the last 10 seconds ready. Tap <b>Replay 10s<\/b> in the camera and the clip lands here. They stay saved on this device.<\/p>'\n    +'<div class=\"row\"><button class=\"btn pri\" data-a=\"cam\">📷 Open camera<\/button><\/div>'\n    +(list.length?list.map(c=>'<div class=\"clip\">'+(c.thumbUrl?'<img src=\"'+c.thumbUrl+'\" alt=\"\">':'<img alt=\"\">')\n      +'<div class=\"meta\"><b>'+esc(c.label)+'<\/b><span class=\"muted\">'+new Date(c.created).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' · '+Math.round(c.n/c.fps)+'s<\/span><\/div>'\n      +'<button class=\"btn sm pri\" data-a=\"clipplay\" data-id=\"'+c.id+'\">▶ Play<\/button><button class=\"btn sm\" data-a=\"clipdel\" data-id=\"'+c.id+'\" aria-label=\"Delete replay\">🗑<\/button><\/div>').join('')\n      :'<p class=\"muted\" style=\"margin-top:14px\">No replays yet.<\/p>');\n}\n\n/* ---------- presentation settings ---------- */\nfunction showForm(){\n  const o=S.opts,C=o.cel;\n  const sel=(k,opts)=>'<select data-c=\"'+k+'\">'+opts.map(x=>'<option value=\"'+x[0]+'\" '+(C[k]===x[0]?'selected':'')+'>'+x[1]+'<\/option>').join('')+'<\/select>';\n  const rng=(k,min,max,step,unit)=>'<div class=\"rng\"><input type=\"range\" data-c=\"'+k+'\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+C[k]+'\"><b id=\"cl-'+k+'\">'+C[k]+unit+'<\/b><\/div>';\n  return '<div class=\"panel\"><h3>Graphic package<\/h3><div class=\"pkgs\">'+Object.keys(PKGS).map(k=>'<button class=\"pk '+(o.pkg===k?'on':'')+'\" data-a=\"pkg\" data-v=\"'+k+'\"><i style=\"background:'+PKGS[k].sw+'\"><\/i><b>'+PKGS[k].label+'<\/b><span>'+PKGS[k].desc+'<\/span><\/button>').join('')+'<\/div>'\n    +'<p class=\"muted\" style=\"margin:8px 0 0\">Used on the board, in board mode and in the camera overlay.<\/p><\/div>'\n    +'<div class=\"panel\"><h3>Display<\/h3>'\n    +'<label class=\"rrow\"><span>Show the game clock<\/span><input type=\"checkbox\" data-o=\"timer\" '+(o.timer?'checked':'')+'><\/label>'\n    +'<label class=\"rrow\"><span>Show scores by period on the board<\/span><input type=\"checkbox\" data-o=\"lines\" '+(o.lines?'checked':'')+'><\/label>'\n    +'<label class=\"rrow\"><span>Sounds<\/span><input type=\"checkbox\" data-o=\"sound\" '+(o.sound?'checked':'')+'><\/label><\/div>'\n    +'<div class=\"panel\"><h3>Scoring celebration<\/h3>'\n    +'<label class=\"rrow\"><span>Show a celebration when a team scores<\/span><input type=\"checkbox\" data-o=\"celebrate\" '+(o.celebrate?'checked':'')+'><\/label>'\n    +'<label class=\"rrow\"><span>How long it lasts<\/span><span style=\"flex:1;max-width:60%\">'+rng('dur',1,10,0.5,'s')+'<\/span><\/label>'\n    +'<label class=\"rrow\"><span>Style<\/span>'+sel('style',[['burst','Burst (full screen)'],['banner','Banner (lower third)'],['spotlight','Spotlight'],['fireworks','Fireworks'],['minimal','Minimal pill']])+'<\/label>'\n    +'<label class=\"rrow\"><span>Size<\/span>'+sel('size',[['sm','Small'],['md','Medium'],['lg','Large']])+'<\/label>'\n    +'<label class=\"rrow\"><span>Colors<\/span>'+sel('color',[['team','Team colors'],['accent','Gold'],['mono','White']])+'<\/label>'\n    +'<label class=\"rrow\"><span>Confetti / sparks<\/span><input type=\"checkbox\" data-c=\"confetti\" '+(C.confetti?'checked':'')+'><\/label>'\n    +'<label class=\"rrow\"><span>Amount of confetti<\/span><span style=\"flex:1;max-width:60%\">'+rng('intensity',20,250,10,'%')+'<\/span><\/label>'\n    +'<label class=\"rrow\"><span>Show team logo<\/span><input type=\"checkbox\" data-c=\"logo\" '+(C.logo?'checked':'')+'><\/label>'\n    +'<label class=\"rrow\"><span>Show the score<\/span><input type=\"checkbox\" data-c=\"tally\" '+(C.tally?'checked':'')+'><\/label>'\n    +'<label class=\"rrow\"><span>Custom headline<\/span><input type=\"text\" data-c=\"custom\" placeholder=\"Automatic\" value=\"'+esc(C.custom||'')+'\" style=\"max-width:55%\"><\/label>'\n    +'<div class=\"row\"><button class=\"btn pri\" data-a=\"testcel\">▶ Preview<\/button><button class=\"btn\" data-a=\"celreset\">Reset celebration<\/button><\/div><\/div>';\n}\n\n/* ---------- celebration (customisable) ---------- */\nfunction fireworks(cv,colors,ms,amt){\n  const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.width=Math.round(innerWidth*dpr),H=cv.height=Math.round(innerHeight*dpr),ctx=cv.getContext('2d');\n  let ps=[],nextB=0;const t0=performance.now();\n  (function f(){\n    const t=performance.now()-t0;\n    ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(0,0,W,H);\n    if(t>=nextB&&t<ms-700){\n      nextB=t+330;const bx=W*(.15+Math.random()*.7),by=H*(.12+Math.random()*.4),col=colors[(Math.random()*colors.length)|0],n=Math.round(46*amt);\n      for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(2+Math.random()*7)*dpr;ps.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col});}\n    }\n    ps.forEach(p=>{p.vy+=.06*dpr;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.l-=.011;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.4*dpr,0,6.283);ctx.fill();});\n    ctx.globalAlpha=1;ps=ps.filter(p=>p.l>0);\n    if(t<ms&&document.body.contains(cv))requestAnimationFrame(f);\n  })();\n}\nfunction confetti(cv,colors,n,emoji,ms){\n  const dpr=Math.min(2,window.devicePixelRatio||1);\n  const W=cv.width=Math.round(innerWidth*dpr),H=cv.height=Math.round(innerHeight*dpr);\n  const ctx=cv.getContext('2d'),ps=[];\n  for(let i=0;i<n;i++){\n    const a=Math.random()*Math.PI*2,sp=(4+Math.random()*13)*dpr;\n    ps.push({x:W/2,y:H*.45,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-7*dpr,w:(6+Math.random()*9)*dpr,h:(4+Math.random()*6)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[(Math.random()*colors.length)|0],e:Math.random()<.12});\n  }\n  const t0=performance.now();\n  (function f(){\n    const dt=performance.now()-t0;\n    ctx.clearRect(0,0,W,H);\n    ps.forEach(p=>{\n      p.vy+=.34*dpr;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;\n      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);\n      if(p.e){ctx.font=(24*dpr)+'px serif';ctx.fillText(emoji,0,0);}\n      else{ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}\n      ctx.restore();\n    });\n    if(dt<ms&&document.body.contains(cv))requestAnimationFrame(f);\n  })();\n}\nfunction celebrate(sp,side,text,sub,o){\n  o=o||{};\n  const t=S.teams[sp][side],C=S.opts.cel;\n  const el=document.querySelector('.sc-'+side);\n  if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}\n  tone(o.big?[[523,0,.14],[659,.14,.14],[784,.28,.14],[1047,.42,.4]]:[[523,0,.12],[784,.12,.25]]);\n  const ms=Math.max(700,(C.dur+(o.big?0.9:0))*1000);\n  const headline=(C.custom&&C.custom.trim())?C.custom.trim():text;\n  if(CAM.on)camCelebrate(headline,sub,t,ms);\n  if(!S.opts.celebrate)return;\n  const old=document.querySelector('.celeb');if(old)old.remove();\n  const pal=C.color==='accent'?{c1:'#ffb020',c2:'#ffffff',k:'#1b1300'}:C.color==='mono'?{c1:'#f4f6fb',c2:'#9fb0cc',k:'#10131a'}:{c1:t.c1,c2:t.c2,k:ink(t.c1)};\n  const d=document.createElement('div');\n  d.className='celeb st-'+C.style+' sz-'+C.size+' '+(o.fx||'');\n  d.style.setProperty('--c1',pal.c1);d.style.setProperty('--c2',pal.c2);d.style.setProperty('--ink',pal.k);\n  const T=S.teams[sp],tally=C.tally?'<div class=\"ctally\">'+esc(T.away.abbr||'AWY')+' '+getScore(sp,'away')+' – '+getScore(sp,'home')+' '+esc(T.home.abbr||'HME')+'<\/div>':'';\n  const lg=C.logo?logo(t,150):'';\n  const fxHtml=(C.style==='burst'||C.style==='fireworks'?'<div class=\"beams\"><\/div><div class=\"ring\"><\/div><div class=\"ring r2\"><\/div>':'');\n  const cvHtml=(C.confetti&&C.style!=='banner'&&C.style!=='minimal')?'<canvas><\/canvas>':'';\n  d.innerHTML=fxHtml+cvHtml+(o.fx==='hr'&&C.style==='burst'?'<div class=\"flyball\">⚾<\/div>':'')\n    +'<div class=\"cc\">'+lg+'<div class=\"ctx\"><div class=\"ct\">'+esc(headline)+'<\/div><div class=\"cs\">'+esc(sub)+'<\/div><\/div>'+tally+'<\/div>';\n  document.body.appendChild(d);\n  const cv=d.querySelector('canvas'),amt=(C.intensity||100)/100;\n  if(cv){\n    const cols=[pal.c1,pal.c2,'#ffffff'];\n    if(C.style==='fireworks')fireworks(cv,cols,ms,amt);\n    else confetti(cv,cols,Math.round((o.big?220:120)*amt),SP[sp].icon,ms);\n  }\n  const kill=()=>{d.classList.add('out');setTimeout(()=>d.remove(),360);};\n  d.addEventListener('click',kill);\n  setTimeout(kill,ms);\n}\n\nfunction mergeOpts(o){if(!o)return;const cel=Object.assign({},S.opts.cel,o.cel||{});Object.assign(S.opts,o);S.opts.cel=cel;}\n/* ---------- rendering ---------- */\nconst chip=(txt,cls,attr)=>'<span class=\"chip '+(cls||'')+'\" '+(attr||'')+'>'+txt+'<\/span>';\nfunction teamCard(side){\n  const sp=S.sport,g=S.g[sp],c=S.cfg[sp],t=S.teams[sp][side];\n  let active=false;const ch=[];\n  if(sp==='baseball'){\n    active=bbBat(g)===side;if(active)ch.push(chip('AT BAT','warn'));\n    ch.push(chip('H '+g.hits[side]));ch.push(chip('E '+g.errors[side]));\n  }else{\n    if((sp==='basketball'||sp==='football')&&g.poss===side){active=true;ch.push(chip(sp==='football'?'🏈 BALL':'🏀 BALL','warn'));}\n    if(sp==='basketball'){const bo=bonusTxt(g,c,side);if(bo)ch.push(chip(bo,'red'));ch.push(chip('FOULS '+g.fouls[side]));}\n    if(sp==='basketball'||sp==='football')ch.push(chip('T/O '+g.to[side]));\n    if(sp==='hockey'){ch.push(chip('SOG '+g.shots[side]));const pp=ppText(g,side);if(pp){active=true;ch.push(chip(pp,'warn','data-pp=\"'+side+'\"'));}}\n    if(sp==='soccer'){const k=g.cards[side];if(k.y)ch.push(chip('🟨 '+k.y));if(k.r)ch.push(chip('🟥 '+k.r,'red'));}\n  }\n  const so=g.so?'<div class=\"tc-so\">Penalties '+soScore(g.so,side)+'<\/div>':'';\n  return '<div class=\"tcard '+(active?'active':'')+'\" style=\"--c1:'+t.c1+';--c2:'+t.c2+';--ink:'+ink(t.c1)+';background:linear-gradient(135deg,'+t.c1+','+shade(t.c1,-.42)+')\">'\n    +'<div class=\"tc-top\" data-bt=\"team\" data-side=\"'+side+'\">'+logo(t,52)+'<div class=\"tc-name\"><div class=\"nm\">'+esc(t.name)+'<\/div><div class=\"side\">'+(side==='away'?'Away':'Home')+(t.tag?' · '+esc(t.tag):'')+'<\/div><\/div><\/div>'\n    +'<div class=\"tc-score sc-'+side+'\" data-bt=\"score\" data-side=\"'+side+'\">'+getScore(sp,side)+'<\/div>'+so+'<div class=\"tc-chips\">'+ch.join('')+'<\/div><\/div>';\n}\nfunction diamond(g){\n  const base=(i,x,y)=>'<g data-a=\"base\" data-i=\"'+i+'\" class=\"base '+(g.bases[i]?'on':'')+'\" transform=\"translate('+x+' '+y+') rotate(45)\"><rect x=\"-13\" y=\"-13\" width=\"26\" height=\"26\" rx=\"3\"/><\/g>';\n  return '<svg class=\"dia\" viewBox=\"0 0 120 100\"><polygon points=\"60,82 92,52 60,22 28,52\" class=\"dline\"/>'+base(1,60,22)+base(0,92,52)+base(2,28,52)+'<polygon points=\"60,76 66,82 60,90 54,82\" class=\"home\"/><\/svg>';\n}\nconst dots=(n,max,cls)=>Array.from({length:max},(_,i)=>'<i class=\"dot '+cls+' '+(i<n?'on':'')+'\"><\/i>').join('');\nfunction midBaseball(g){\n  return '<div class=\"mid bbmid\"><div class=\"inn\" data-bt=\"bbinn\"><div class=\"arrow\">'+(g.half==='top'?'▲':'▼')+'<\/div><div class=\"num\">'+g.inning+'<\/div><div class=\"lab\">'+(g.half==='top'?'Top':'Bottom')+'<\/div><\/div>'\n    +diamond(g)+'<div class=\"bso\"><div class=\"r\" data-bt=\"ball\"><b>B<\/b>'+dots(g.balls,3,'b')+'<\/div><div class=\"r\" data-bt=\"strike\"><b>S<\/b>'+dots(g.strikes,2,'s')+'<\/div><div class=\"r\" data-bt=\"out\"><b>O<\/b>'+dots(g.outs,2,'o')+'<\/div><\/div><\/div>';\n}\nfunction midTimed(sp,g){\n  const low=sp!=='soccer'&&g.clock>0&&g.clock<60000;\n  let extra='';\n  if(sp==='basketball'||sp==='football'){\n    extra+='<div class=\"posrow\"><button class=\"parr '+(g.poss==='away'?'on':'')+'\" data-a=\"poss\" data-side=\"away\" aria-label=\"Away possession\">◀<\/button><span>POSSESSION<\/span><button class=\"parr '+(g.poss==='home'?'on':'')+'\" data-a=\"poss\" data-side=\"home\" aria-label=\"Home possession\">▶<\/button><\/div>';\n  }\n  if(sp==='football'&&g.showDD)extra+='<div class=\"dd\" data-bt=\"dd\">'+ordn(g.down)+' &amp; '+(g.goal?'GOAL':g.dist)+'<\/div>';\n  if(sp==='soccer'&&g.added>0)extra+='<div class=\"addedtag\" data-bt=\"period\">+'+g.added+' MIN ADDED<\/div>';\n  if(!S.opts.timer)return '<div class=\"mid\"><div class=\"plabel big\" data-bt=\"period\">'+plabel(sp,g)+'<\/div>'+extra+'<\/div>';\n  return '<div class=\"mid\"><div class=\"plabel\" data-bt=\"period\">'+plabel(sp,g)+'<\/div><div id=\"clk\" data-bt=\"clock\" class=\"clock'+(g.running?' run':'')+(low?' low':'')+'\">'+clockText(sp,g)+'<\/div><div id=\"clk2\" class=\"clk2\">'+clk2Text(sp,g)+'<\/div>'+extra+'<\/div>';\n}\nfunction banners(sp,g){\n  const c=S.cfg[sp];let h='';\n  const T=s=>S.teams[sp][s];\n  if(g.final){\n    let txt='FINAL';\n    if(g.so){const w=soWinner(g.so);if(w)txt='FINAL · '+esc(T(w).name)+' win '+soScore(g.so,w)+'–'+soScore(g.so,oppOf(w))+' on penalties';}\n    h+='<div class=\"banner fin\">'+txt+'<\/div>';\n  }\n  if(g.inter)h+='<div class=\"banner inter\"><b>'+g.inter.label+'<\/b><span id=\"intr\" class=\"mono\">'+fmt(g.inter.ms)+'<\/span><button class=\"btn sm\" data-a=\"skipinter\">Skip<\/button><\/div>';\n  if(g.timeout)h+='<div class=\"banner to\"><b>TIMEOUT<\/b> '+esc(T(g.timeout.side).name)+' <span id=\"tor\" class=\"mono\">'+fmt(g.timeout.ms)+'<\/span><button class=\"btn sm\" data-a=\"endto\">End<\/button><\/div>';\n  if(g.ended&&!g.inter&&!g.final&&!g.so){\n    const tied=g.score.away===g.score.home;\n    if(sp==='soccer'){\n      const p=g.period;\n      const nextLbl=p===1?'Start 2nd half':p===3?'Start extra time 2':p===2?'Start extra time':'';\n      h+='<div class=\"banner end\"><b>'+(p===2?'FULL TIME':p===4?'END OF EXTRA TIME':'END OF PERIOD')+'<\/b>'\n        +((p===1||p===3||(p===2&&c.et))?'<button class=\"btn sm pri\" data-a=\"nextperiod\">'+nextLbl+'<\/button>':'')\n        +((p===2||p===4)?'<button class=\"btn sm\" data-a=\"so_start\">Penalties<\/button><button class=\"btn sm\" data-a=\"final\">Final<\/button>':'')+'<\/div>';\n    }else if(g.period>=c.periods){\n      h+='<div class=\"banner end\"><b>'+(g.period>c.periods?'END OF OVERTIME':'END OF REGULATION')+'<\/b>'+(tied?'<span>TIED<\/span>':'')\n        +'<button class=\"btn sm '+(tied?'pri':'')+'\" data-a=\"nextperiod\">Start overtime<\/button>'\n        +(sp==='hockey'?'<button class=\"btn sm\" data-a=\"so_start\">Shootout<\/button>':'')\n        +'<button class=\"btn sm '+(tied?'':'pri')+'\" data-a=\"final\">Final<\/button><\/div>';\n    }\n  }\n  return h;\n}\nfunction boxScore(g){\n  const c=S.cfg.baseball,n=Math.max(c.innings,g.inning),T=S.teams.baseball;\n  const cols=[];for(let i=0;i<n;i++)cols.push(i+1);\n  const played=(side,i)=>i<g.inning-1||(i===g.inning-1&&(side==='away'||g.half==='bottom'));\n  const row=side=>'<tr class=\"'+(bbBat(g)===side&&!g.final?'bat':'')+'\"><th>'+esc(T[side].abbr||T[side].name)+'<\/th>'\n    +cols.map((x,i)=>'<td class=\"'+(i===g.inning-1?'cur':'')+'\">'+(played(side,i)?(g.runs[side][i]||0):'')+'<\/td>').join('')\n    +'<td class=\"rhe\">'+getScore('baseball',side)+'<\/td><td class=\"rhe\">'+g.hits[side]+'<\/td><td class=\"rhe\">'+g.errors[side]+'<\/td><\/tr>';\n  return '<div class=\"panel\"><h3>Box score<\/h3><div class=\"tbl\"><table class=\"bs\"><tr><th><\/th>'+cols.map(x=>'<th>'+x+'<\/th>').join('')+'<th class=\"rhe\">R<\/th><th class=\"rhe\">H<\/th><th class=\"rhe\">E<\/th><\/tr>'+row('away')+row('home')+'<\/table><\/div><\/div>';\n}\nfunction stepper(label,k,side,val,extra){\n  return '<div class=\"stat\"><span>'+label+(extra||'')+'<\/span><div class=\"stp\"><button data-a=\"stat\" data-k=\"'+k+'\" data-side=\"'+side+'\" data-v=\"-1\" aria-label=\"Decrease '+label+'\">−<\/button><b>'+val+'<\/b><button data-a=\"stat\" data-k=\"'+k+'\" data-side=\"'+side+'\" data-v=\"1\" aria-label=\"Increase '+label+'\">+<\/button><\/div><\/div>';\n}\nfunction teamPanel(sp,side){\n  const t=S.teams[sp][side],g=S.g[sp],c=S.cfg[sp];\n  const hdr='<div class=\"tp-h\" style=\"background:linear-gradient(135deg,'+t.c1+','+shade(t.c1,-.42)+');color:'+ink(t.c1)+'\">'+logo(t,30)+'<b>'+esc(t.name)+'<\/b><\/div>';\n  const sb=(pts,label,kind,cls)=>'<button class=\"btn sc '+(cls||'')+'\" data-a=\"score\" data-side=\"'+side+'\" data-pts=\"'+pts+'\" data-kind=\"'+kind+'\">'+label+'<\/button>';\n  let b='';\n  if(sp==='baseball'){\n    b='<div class=\"grid3\">'+sb(1,'+1 run','run','pri')+sb(2,'+2','run')+sb(-1,'−1','sub')+'<\/div>'+stepper('Hits','hits',side,g.hits[side])+stepper('Errors','errors',side,g.errors[side]);\n  }else if(sp==='basketball'){\n    const bo=bonusTxt(g,c,oppOf(side));\n    b='<div class=\"grid4\">'+sb(1,'+1','ft','pri')+sb(2,'+2','fg','pri')+sb(3,'+3','tp','pri')+sb(-1,'−1','sub')+'<\/div>'\n     +stepper('Team fouls','fouls',side,g.fouls[side],bo?' <span class=\"tag\">Opp in '+bo.toLowerCase()+'<\/span>':'')\n     +stepper('Timeouts left','to',side,g.to[side])\n     +'<button class=\"btn wide\" data-a=\"to\" data-side=\"'+side+'\" '+(g.to[side]<1?'disabled':'')+'>⏱ Call timeout<\/button>'\n     +'<button class=\"btn wide '+(g.poss===side?'pri':'')+'\" data-a=\"poss\" data-side=\"'+side+'\">🏀 Has possession<\/button>';\n  }else if(sp==='football'){\n    b='<div class=\"grid3\">'+sb(6,'TD +6','td','pri')+sb(3,'FG +3','fg','pri')+sb(1,'PAT +1','pat')+sb(2,'2PT +2','2pt')+sb(2,'Safety +2','saf')+sb(-1,'−1','sub')+'<\/div>'\n     +stepper('Timeouts left','to',side,g.to[side])\n     +'<button class=\"btn wide\" data-a=\"to\" data-side=\"'+side+'\" '+(g.to[side]<1?'disabled':'')+'>⏱ Call timeout<\/button>'\n     +'<button class=\"btn wide '+(g.poss===side?'pri':'')+'\" data-a=\"poss\" data-side=\"'+side+'\">🏈 Has ball<\/button>';\n  }else if(sp==='hockey'){\n    const pens=g.pens.filter(p=>p.side===side);\n    const pb=(label,secs,eog)=>'<button class=\"btn sm\" data-a=\"pen\" data-side=\"'+side+'\" data-secs=\"'+secs+'\" data-eog=\"'+(eog?1:0)+'\" data-label=\"'+label+'\">'+label+'<br><span class=\"mono\" style=\"font-size:11px\">'+fmtS(secs)+'<\/span><\/button>';\n    b='<div class=\"grid3\">'+sb(1,'Goal +1','goal','pri')+sb(-1,'−1','sub')+'<\/div>'+stepper('Shots on goal','shots',side,g.shots[side])\n     +'<div class=\"stat\"><span>Add penalty<\/span><\/div><div class=\"grid3\" style=\"margin-top:6px\">'+pb('Minor',c.minor,true)+pb('Double',c.minor*2,true)+pb('Major',c.major,false)+'<\/div>'\n     +'<div class=\"pens\">'+pens.map(p=>'<div class=\"pen\"><span>'+esc(p.label)+'<\/span><span class=\"mono\" data-pen=\"'+p.id+'\">'+fmt(p.ms)+'<\/span><button data-a=\"rmpen\" data-id=\"'+p.id+'\" aria-label=\"Remove penalty\">✕<\/button><\/div>').join('')+'<\/div>';\n  }else if(sp==='soccer'){\n    const k=g.cards[side];\n    const cs=(label,key,val)=>'<div class=\"stat\"><span>'+label+'<\/span><div class=\"stp\"><button data-a=\"card\" data-side=\"'+side+'\" data-k=\"'+key+'\" data-v=\"-1\">−<\/button><b>'+val+'<\/b><button data-a=\"card\" data-side=\"'+side+'\" data-k=\"'+key+'\" data-v=\"1\">+<\/button><\/div><\/div>';\n    b='<div class=\"grid3\">'+sb(1,'Goal +1','goal','pri')+sb(-1,'−1','sub')+'<\/div>'+cs('🟨 Yellow cards','y',k.y)+cs('🟥 Red cards','r',k.r);\n  }\n  return '<div class=\"tp\">'+hdr+'<div class=\"tp-b\">'+b+'<\/div><\/div>';\n}\nfunction clockPanel(sp,g,c){\n  if(!S.opts.timer)return periodPanel(sp,g,c);\n  const lock=g.final||g.inter;\n  const word=sp==='soccer'?'half':sp==='hockey'?'period':c.periods===2?'half':'quarter';\n  const nextDis=sp==='soccer'&&(g.period>=4||(g.period>=2&&!c.et));\n  const adj=[-60000,-10000,-1000,1000,10000,60000].map(ms=>'<button class=\"btn sm\" data-a=\"adj\" data-ms=\"'+ms+'\">'+(ms<0?'−':'+')+(Math.abs(ms)>=60000?'1m':Math.abs(ms)/1000+'s')+'<\/button>').join('');\n  let more='';\n  if(sp==='basketball')more='<div class=\"row\"><button class=\"btn\" data-a=\"flip\">⇄ Flip possession<\/button><button class=\"btn\" data-a=\"poss\" data-side=\"none\">No possession<\/button><\/div>';\n  if(sp==='soccer')more='<div class=\"row\"><span class=\"lbl\">Added time<\/span><button class=\"btn sm\" data-a=\"added\" data-v=\"-1\">−1<\/button><b>+'+g.added+'<\/b><button class=\"btn sm\" data-a=\"added\" data-v=\"1\">+1<\/button><button class=\"btn\" data-a=\"so_start\">🥅 Penalties<\/button><\/div>';\n  if(sp==='hockey')more='<div class=\"row\"><button class=\"btn\" data-a=\"so_start\">🥅 Penalty shootout<\/button><\/div>';\n  return '<div class=\"panel\"><h3>Game clock<\/h3><div class=\"row\">'\n    +'<button class=\"btn big '+(g.running?'stop':'go')+'\" data-a=\"clock\" '+(lock?'disabled':'')+'>'+(g.running?'⏸ Stop clock':'▶ Start clock')+'<\/button>'\n    +'<button class=\"btn\" data-a=\"endperiod\" '+(lock||g.ended?'disabled':'')+'>End '+word+'<\/button>'\n    +'<button class=\"btn\" data-a=\"nextperiod\" '+(nextDis?'disabled':'')+'>Next ➜<\/button><\/div>'\n    +'<div class=\"cap\">Adjust clock<\/div><div class=\"adjgrid\">'+adj+'<\/div>'\n    +'<div class=\"cap\">Set clock<\/div><div class=\"row\"><span class=\"lbl\">Min · Sec<\/span><input id=\"cm\" type=\"number\" min=\"0\" inputmode=\"numeric\" value=\"'+Math.floor(g.clock/60000)+'\" aria-label=\"Minutes\"><b>:<\/b><input id=\"cs\" type=\"number\" min=\"0\" max=\"59\" inputmode=\"numeric\" value=\"'+Math.floor(g.clock/1000)%60+'\" aria-label=\"Seconds\"><button class=\"btn sm\" data-a=\"setclock\">Set<\/button><button class=\"btn sm '+(g.final?'pri':'')+'\" data-a=\"final\">'+(g.final?'Reopen':'Final')+'<\/button><\/div>'\n    +more+'<\/div>';\n}\nfunction ddPanel(g){\n  const dn=[1,2,3,4].map(n=>'<button class=\"btn sm '+(g.down===n?'pri':'')+'\" data-a=\"down\" data-v=\"'+n+'\">'+ordn(n)+'<\/button>').join('');\n  return '<div class=\"panel\"><h3>Down &amp; distance<\/h3><div class=\"row\">'+dn+'<\/div>'\n    +'<div class=\"row\"><span class=\"lbl\">To go<\/span><button class=\"btn sm\" data-a=\"dist\" data-v=\"-1\">−1<\/button><input type=\"number\" min=\"0\" inputmode=\"numeric\" data-g=\"dist\" value=\"'+g.dist+'\" aria-label=\"Yards to go\"><button class=\"btn sm\" data-a=\"dist\" data-v=\"1\">+1<\/button><button class=\"btn sm '+(g.goal?'pri':'')+'\" data-a=\"goalto\">Goal to go<\/button><\/div>'\n    +'<div class=\"row\"><button class=\"btn pri\" data-a=\"first10\">1st &amp; 10<\/button><button class=\"btn\" data-a=\"nextdown\">Next down<\/button><button class=\"btn\" data-a=\"flip\">Change possession<\/button><\/div>'\n    +'<div class=\"row\"><button class=\"btn '+(g.showDD?'pri':'')+'\" data-a=\"ddtoggle\">'+(g.showDD?'Showing on board':'Hidden from board')+'<\/button><\/div><\/div>';\n}\nfunction soPanel(sp,g){\n  const so=g.so,win=soWinner(so),nx=soNext(so),R=so.rounds,T=S.teams[sp];\n  const row=side=>{\n    const n=Math.max(R,so.away.length,so.home.length);\n    const marks=Array.from({length:n},(_,i)=>{const v=so[side][i];return '<i class=\"mk '+(v==='g'?'g':v==='m'?'m':'')+'\">'+(v==='g'?'●':v==='m'?'✕':'○')+'<\/i>';}).join('');\n    return '<div class=\"sorow '+(!win&&nx===side?'next':'')+'\">'+logo(T[side],30)+'<b class=\"soname\">'+esc(T[side].abbr||T[side].name)+'<\/b><div class=\"marks\">'+marks+'<\/div><b class=\"sosc\">'+soScore(so,side)+'<\/b><\/div>';\n  };\n  const started=so.log.length>0;\n  return '<div class=\"panel\"><h3>Penalty shootout · '+R+' rounds<\/h3>'+row('away')+row('home')\n    +(win?'<div class=\"banner fin\">'+esc(T[win].name)+' win '+soScore(so,win)+'–'+soScore(so,oppOf(win))+' on penalties<\/div>':'<div class=\"muted ctr\">'+esc(T[nx].name)+' to shoot<\/div>')\n    +'<div class=\"row\"><button class=\"btn go\" data-a=\"so_res\" data-res=\"g\" '+(win?'disabled':'')+'>Scores<\/button><button class=\"btn stop\" data-a=\"so_res\" data-res=\"m\" '+(win?'disabled':'')+'>Misses<\/button><button class=\"btn\" data-a=\"so_undo\" '+(started?'':'disabled')+'>Undo<\/button><button class=\"btn\" data-a=\"so_close\">Close<\/button><\/div>'\n    +(started?'':'<div class=\"row\"><span class=\"lbl\">Shoots first<\/span><button class=\"btn sm '+(so.first==='away'?'pri':'')+'\" data-a=\"so_first\" data-side=\"away\">Away<\/button><button class=\"btn sm '+(so.first==='home'?'pri':'')+'\" data-a=\"so_first\" data-side=\"home\">Home<\/button><\/div>')\n    +'<\/div>';\n}\nfunction baseballControls(g){\n  const b=(a,l,cls,extra)=>'<button class=\"btn '+(cls||'')+'\" data-a=\"'+a+'\" '+(extra||'')+'>'+l+'<\/button>';\n  return '<div class=\"panel\"><h3>Count<\/h3><div class=\"row\">'+b('ball','Ball')+b('strike','Strike')+b('foul','Foul')+b('out','Out')+b('clearcount','Clear count')+'<\/div>'\n    +'<h3 style=\"margin-top:14px\">Ball in play<\/h3><div class=\"row\">'+b('hit','Single','','data-n=\"1\"')+b('hit','Double','','data-n=\"2\"')+b('hit','Triple','','data-n=\"3\"')+b('hit','Home run','pri','data-n=\"4\"')+b('walk','Walk')+b('err','Error')+'<\/div>'\n    +'<div class=\"row\" style=\"margin-top:14px\">'+b('nexthalf','Next half-inning ➜','pri')+b('clearbases','Clear bases')+b('box',g.box?'Hide box score':'Box score',g.box?'pri':'')+b('final',g.final?'Reopen':'Final',g.final?'pri':'')+'<\/div>'\n    +'<div class=\"muted\" style=\"margin-top:8px\">Tap a base on the diamond to place or clear a runner. Hits advance runners automatically.<\/div><\/div>';\n}\nfunction header(){\n  const gm=EMB.on&&EMB.mode==='game';\n  const brand=gm?(EMB.label?esc(EMB.label):'Scoreboard'):'Scoreboard';\n  const nrep=CAM.clips.length;\n  return '<header class=\"top\"><div class=\"brand'+(gm?' game':'')+'\"><span class=\"ball\">'+SP[S.sport].icon+'<\/span><span class=\"bt\">'+brand+'<\/span><\/div><div class=\"hbtns\">'\n    +(gm?'<button class=\"btn sm use\" data-a=\"usescore\">✓ Use score<\/button>':'')\n    +'<button class=\"btn sm pri\" data-a=\"board\">⛶ Board<\/button>'\n    +(EMB.on?'<button class=\"btn sm\" data-a=\"closeemb\" aria-label=\"Close scoreboard\">✕<\/button>':'')\n    +'<\/div><\/header>'\n    +'<nav class=\"tools\"><button class=\"tl hot\" data-a=\"cam\">📷 Camera<\/button><button class=\"tl\" data-a=\"modal\" data-v=\"replays\">🎞 Replays'+(nrep?'<span class=\"n\">'+nrep+'<\/span>':'')+'<\/button><button class=\"tl\" data-a=\"modal\" data-v=\"show\">🎬 Show<\/button><button class=\"tl\" data-a=\"modal\" data-v=\"fonts\">Aa Fonts<\/button>'\n    +(gm?'':'<button class=\"tl\" data-a=\"modal\" data-v=\"teams\">Teams<\/button>')\n    +'<button class=\"tl\" data-a=\"modal\" data-v=\"rules\">⚙ Settings<\/button><button class=\"tl\" data-a=\"theme\">◐ Theme<\/button><\/nav>'\n    +(gm?'':'<nav class=\"tabs\">'+Object.keys(SP).map(k=>'<button class=\"tab '+(k===S.sport?'on':'')+'\" data-a=\"sport\" data-v=\"'+k+'\"><span>'+SP[k].icon+'<\/span>'+SP[k].label+'<\/button>').join('')+'<\/nav>');\n}\nfunction teamEditor(side){\n  const t=S.teams[S.sport][side];\n  const opts=Object.keys(SHAPES).map(s=>'<option value=\"'+s+'\" '+(t.shape===s?'selected':'')+'>'+s[0].toUpperCase()+s.slice(1)+'<\/option>').join('');\n  return '<div class=\"ted\"><div class=\"ted-h\"><div id=\"prev-'+side+'\">'+logo(t,64)+'<\/div><b>'+(side==='away'?'Away team':'Home team')+'<\/b><\/div>'\n    +'<label>Name<input type=\"text\" data-t=\"name\" data-side=\"'+side+'\" value=\"'+esc(t.name)+'\" maxlength=\"24\"><\/label>'\n    +'<label>Abbreviation<input type=\"text\" data-t=\"abbr\" data-side=\"'+side+'\" value=\"'+esc(t.abbr)+'\" maxlength=\"4\"><\/label>'\n    +'<div class=\"two\"><label>Primary color<input type=\"color\" data-t=\"c1\" data-side=\"'+side+'\" value=\"'+t.c1+'\"><\/label><label>Secondary color<input type=\"color\" data-t=\"c2\" data-side=\"'+side+'\" value=\"'+t.c2+'\"><\/label><\/div>'\n    +'<label>Logo shape<select data-t=\"shape\" data-side=\"'+side+'\">'+opts+'<\/select><\/label>'\n    +'<div class=\"row\"><label class=\"btn filebtn\">Upload logo<input type=\"file\" accept=\"image/*\" data-t=\"img\" data-side=\"'+side+'\"><\/label><button class=\"btn\" data-a=\"clearimg\" data-side=\"'+side+'\" '+(t.img?'':'disabled')+'>Remove upload<\/button><\/div><\/div>';\n}\nfunction rulesForm(){\n  const sp=S.sport,c=S.cfg[sp];\n  const rows=RULES[sp].map(r=>{\n    const lab=r[0],key=r[1],type=r[2];\n    if(type==='bool')return '<label class=\"rrow\"><span>'+lab+'<\/span><input type=\"checkbox\" data-r=\"'+key+'\" data-rt=\"bool\" '+(c[key]?'checked':'')+'><\/label>';\n    const val=type==='time'?fmtS(c[key]):c[key];\n    const inp=(type==='int'||type==='secs')?'type=\"number\" min=\"0\" inputmode=\"numeric\"':'type=\"text\" placeholder=\"m:ss\"';\n    return '<label class=\"rrow\"><span>'+lab+'<\/span><input '+inp+' data-r=\"'+key+'\" data-rt=\"'+type+'\" value=\"'+val+'\"><\/label>';\n  }).join('');\n  return '<p class=\"muted\">Times use m:ss. A plain number means minutes.<\/p>'+rows\n    +'<div class=\"panel\" style=\"margin-top:14px\"><h3>Display and sound<\/h3>'\n    +'<label class=\"rrow\"><span>Scoring celebrations<\/span><input type=\"checkbox\" data-o=\"celebrate\" '+(S.opts.celebrate?'checked':'')+'><\/label>'\n    +'<label class=\"rrow\"><span>Sounds<\/span><input type=\"checkbox\" data-o=\"sound\" '+(S.opts.sound?'checked':'')+'><\/label>'\n    +'<div class=\"row\"><button class=\"btn\" data-a=\"testcel\">Preview celebration<\/button><\/div><\/div>'\n    +'<div class=\"panel\"><h3>Reset<\/h3><div class=\"row\"><button class=\"btn '+(S.ui.confirm?'stop':'')+'\" data-a=\"reset\">'+(S.ui.confirm?'Tap again to start a new game':'New '+SP[sp].label.toLowerCase()+' game')+'<\/button><button class=\"btn\" data-a=\"resetteams\">Reset team names and colors<\/button><\/div><\/div>';\n}\nfunction modalHtml(){\n  if(!S.ui.modal)return '';\n  const m=S.ui.modal,teams=m==='teams';\n  const body=m==='fonts'?fontsForm():m==='show'?showForm():m==='replays'?replaysForm():teams?teamEditor('away')+teamEditor('home'):rulesForm();\n  const title=m==='fonts'?'Fonts':m==='show'?'Presentation':m==='replays'?'Replays':(teams?'Teams':'Settings')+' · '+SP[S.sport].label;\n  return '<div class=\"modal\"><div class=\"scrim\" data-a=\"closemodal\"><\/div><div class=\"sheet\"><div class=\"sh-head\"><h2>'+title+'<\/h2><button class=\"btn pri\" data-a=\"closemodal\">Done<\/button><\/div>'+body+'<\/div><\/div>';\n}\n/* ---------- board mode ---------- */\nfunction toast(msg){\n  const old=document.querySelector('.toast');if(old)old.remove();\n  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);\n  setTimeout(()=>t.remove(),6000);\n}\nfunction fitEl(el){\n  el.style.fontSize='';\n  let fs=parseFloat(getComputedStyle(el).fontSize),n=0;\n  while(el.scrollWidth>el.clientWidth+1&&fs>9&&n++<45){fs*=.93;el.style.fontSize=fs+'px';}\n}\nfunction fit(){\n  document.querySelectorAll('.sb .clock,.sb .dd').forEach(fitEl);\n  // keep the two team names (and the two scores) the same size so the board looks balanced\n  ['.sb .nm','.sb .tc-score'].forEach(sel=>{\n    const els=[...document.querySelectorAll(sel)];els.forEach(fitEl);\n    if(els.length>1){const m=Math.min.apply(null,els.map(e=>parseFloat(getComputedStyle(e).fontSize)));els.forEach(e=>{e.style.fontSize=m+'px';});}\n  });\n}\nwindow.addEventListener('resize',fit);\nwindow.addEventListener('orientationchange',()=>setTimeout(fit,200));\nif(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',fit);\nfunction fontCss(name){const f=FONTS.find(x=>x[0]===name)||FONTS[0];return {fam:'\"'+f[0]+'\",Impact,\"Arial Narrow\",sans-serif',w:f[2]};}\nfunction applyFonts(){\n  const r=document.documentElement.style,n=fontCss(S.opts.fontNum),b=fontCss(S.opts.fontName);\n  r.setProperty('--nfont',n.fam);r.setProperty('--nw',n.w);r.setProperty('--bfont',b.fam);r.setProperty('--bw',b.w);\n  loadFont(S.opts.fontNum);loadFont(S.opts.fontName);\n}\nfunction fontsForm(){\n  const o=S.opts;\n  const sec=(title,key,sample)=>'<h3 class=\"fh\">'+title+'<\/h3><div class=\"fgrid\">'+FONTS.map(f=>`<button class=\"fbtn ${o[key]===f[0]?'on':''}\" data-a=\"font\" data-k=\"${key}\" data-v=\"${esc(f[0])}\" style=\"font-family:'${f[0]}',Impact,sans-serif;font-weight:${f[2]}\">${sample||esc(f[0])}<\/button>`).join('')+'<\/div>';\n  const nm=String(S.teams[S.sport].home.name).split(' ').pop().toUpperCase();\n  return '<div class=\"sb fprev\"><span class=\"n\">'+esc(nm)+'<\/span><span class=\"s\">87<\/span><span class=\"s\" style=\"color:#8dffb0\">8:42<\/span><\/div>'\n    +sec('Numbers (scores and clock)','fontNum','12:34 87')\n    +sec('Names and labels','fontName')\n    +'<div class=\"row\"><button class=\"btn\" data-a=\"fontreset\">Reset fonts<\/button><\/div>';\n}\nfunction fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}\nfunction enterFS(){\n  const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;\n  if(!rq){toast('Full screen is not available in this browser. On iPhone, use Share, then Add to Home Screen.');return;}\n  try{const p=rq.call(el);if(p&&p.catch)p.catch(()=>toast('Full screen is blocked in this view. Open the page in its own browser tab to use it.'));}catch(e){}\n}\nfunction leaveFS(){try{if(fsOn())(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}}\nlet wl=null;\nfunction wake(on){\n  try{\n    if(on&&navigator.wakeLock){navigator.wakeLock.request('screen').then(l=>{wl=l;}).catch(()=>{});}\n    else if(!on&&wl){wl.release();wl=null;}\n  }catch(e){}\n}\nfunction toolbar(){\n  if(!S.ui.tbar)return '<div class=\"btool\"><button class=\"tb\" data-a=\"tbar\" aria-label=\"Show menu\">⋯<\/button><\/div>';\n  const gmode=EMB.on&&EMB.mode==='game';\n  return '<div class=\"btool open\">'+(gmode?'':Object.keys(SP).map(k=>'<button class=\"tb '+(k===S.sport?'on':'')+'\" data-a=\"sport\" data-v=\"'+k+'\" aria-label=\"'+SP[k].label+'\">'+SP[k].icon+'<\/button>').join(''))\n    +'<button class=\"tb\" data-a=\"cam\">📷<\/button><button class=\"tb\" data-a=\"modal\" data-v=\"show\">🎬<\/button><button class=\"tb\" data-a=\"modal\" data-v=\"fonts\">Aa<\/button>'+(gmode?'':'<button class=\"tb\" data-a=\"modal\" data-v=\"teams\">Teams<\/button>')+'<button class=\"tb\" data-a=\"modal\" data-v=\"rules\">Settings<\/button>'+(gmode?'<button class=\"tb\" data-a=\"usescore\">✓ Use score<\/button>':'')+(EMB.on?'<button class=\"tb\" data-a=\"closeemb\">Close<\/button>':'')\n    +'<button class=\"tb\" data-a=\"rot\" aria-label=\"Lock landscape\">⟲<\/button><button class=\"tb\" data-a=\"fs\" aria-label=\"Full screen\">⛶<\/button><button class=\"tb\" data-a=\"exitboard\" aria-label=\"Exit scoreboard mode\">✕<\/button><button class=\"tb\" data-a=\"tbar\" aria-label=\"Hide menu\">⋯<\/button><\/div>';\n}\nfunction boardMode(){\n  const sp=S.sport,g=S.g[sp];\n  let mid;\n  if(sp==='baseball')mid=midBaseball(g)+(g.final?'<div class=\"banner fin\">FINAL<\/div>':'')+(g.box?boxScore(g):'');\n  else mid=midTimed(sp,g)+banners(sp,g)+(S.opts.lines?'<div class=\"blines\">'+lineScoreHtml(sp,g)+'<\/div>':'')+(g.so?soPanel(sp,g):'');\n  return '<div class=\"bmode sb\"><div class=\"bm\"><div class=\"ba\">'+teamCard('away')+'<\/div><div class=\"bc\">'+mid+'<\/div><div class=\"bh\">'+teamCard('home')+'<\/div><\/div>'+toolbar()+'<\/div>';\n}\nfunction qsHtml(){\n  const q=S.ui.qs;if(!q||!S.ui.board)return '';\n  const sp=S.sport,g=S.g[sp],c=S.cfg[sp],T=S.teams[sp],side=q.side;\n  const B=(a,l,at,cls)=>'<button class=\"btn '+(cls||'')+'\" data-a=\"'+a+'\" '+(at||'')+'>'+l+'<\/button>';\n  const keep='data-keep=\"1\"';\n  const sd='data-side=\"'+side+'\"';\n  const pm=(label,a,k,val)=>'<div class=\"qpm\"><span>'+label+' <b>'+val+'<\/b><\/span><div>'+B(a,'−','data-k=\"'+k+'\" '+sd+' data-v=\"-1\" '+keep)+B(a,'+','data-k=\"'+k+'\" '+sd+' data-v=\"1\" '+keep)+'<\/div><\/div>';\n  let title='',body='';\n  if(q.type==='score'){\n    title=T[side].name+' scores';\n    const sb=(pts,l,kind,cls)=>B('score',l,sd+' data-pts=\"'+pts+'\" data-kind=\"'+kind+'\"',cls);\n    body=sp==='basketball'\n      ?sb(1,'Free throw +1','ft','pri')+sb(2,'Basket +2','fg','pri')+sb(3,'Three +3','tp','pri')+sb(-1,'Take away 1','sub')\n      :sb(6,'Touchdown +6','td','pri')+sb(3,'Field goal +3','fg','pri')+sb(1,'Extra point +1','pat')+sb(2,'2-pt conversion +2','2pt')+sb(2,'Safety +2','saf')+sb(-1,'Take away 1','sub');\n  }else if(q.type==='team'){\n    title=T[side].name;\n    if(sp==='baseball'){\n      body=B('score','+1 run',sd+' data-pts=\"1\" data-kind=\"run\"','pri')+B('score','−1 run',sd+' data-pts=\"-1\" data-kind=\"sub\"')+pm('Hits','stat','hits',g.hits[side])+pm('Errors','stat','errors',g.errors[side]);\n    }else if(sp==='basketball'){\n      body=pm('Team fouls','stat','fouls',g.fouls[side])+pm('Timeouts left','stat','to',g.to[side])+B('to','⏱ Call timeout',sd+(g.to[side]<1?' disabled':''),'pri')+B('poss','🏀 Has possession',sd);\n    }else if(sp==='football'){\n      body=pm('Timeouts left','stat','to',g.to[side])+B('to','⏱ Call timeout',sd+(g.to[side]<1?' disabled':''),'pri')+B('poss','🏈 Has ball',sd);\n    }else if(sp==='hockey'){\n      const pb=(l,secs,eog)=>B('pen',l+' '+fmtS(secs),sd+' data-secs=\"'+secs+'\" data-eog=\"'+(eog?1:0)+'\" data-label=\"'+l+'\"');\n      body=pm('Shots on goal','stat','shots',g.shots[side])+pb('Minor',c.minor,true)+pb('Double',c.minor*2,true)+pb('Major',c.major,false)\n        +g.pens.filter(p=>p.side===side).map(p=>B('rmpen','✕ '+esc(p.label)+' '+fmt(p.ms),'data-id=\"'+p.id+'\" '+keep)).join('');\n    }else{\n      body=pm('🟨 Yellow cards','card','y',g.cards[side].y)+pm('🟥 Red cards','card','r',g.cards[side].r);\n    }\n  }else if(q.type==='period'){\n    title=plabel(sp,g);\n    const lock=g.final||g.inter;\n    const nextDis=sp==='soccer'&&(g.period>=4||(g.period>=2&&!c.et));\n    body=B('clock',g.running?'⏸ Stop clock':'▶ Start clock',lock?'disabled':'',g.running?'stop':'go')\n      +B('endperiod','End period',(lock||g.ended)?'disabled':'')\n      +B('nextperiod','Next period',nextDis?'disabled':'')\n      +B('final',g.final?'Reopen game':'Final',' ',g.final?'pri':'')\n      +[-60000,-10000,-1000,1000,10000,60000].map(ms=>B('adj',(ms<0?'−':'+')+(Math.abs(ms)>=60000?'1m':Math.abs(ms)/1000+'s'),'data-ms=\"'+ms+'\" '+keep)).join('');\n    if(sp==='soccer')body+='<div class=\"qpm\"><span>Added time <b>+'+g.added+'<\/b><\/span><div>'+B('added','−','data-v=\"-1\" '+keep)+B('added','+','data-v=\"1\" '+keep)+'<\/div><\/div>'+B('so_start','🥅 Penalties');\n    if(sp==='hockey')body+=B('so_start','🥅 Shootout');\n    if(sp==='basketball'||sp==='football')body+=B('flip','⇄ Flip possession');\n    if(!S.opts.timer){body=B('prevperiod','◀ Previous',g.period<=1?'disabled':'')+B('nextperiod','Next period ▶','','pri')+B('final',g.final?'Reopen game':'Final',' ',g.final?'pri':'');if(sp==='soccer')body+=B('so_start','🥅 Penalties');if(sp==='hockey')body+=B('so_start','🥅 Shootout');if(sp==='basketball'||sp==='football')body+=B('flip','⇄ Flip possession');}\n  }else if(q.type==='dd'){\n    title='Down &amp; distance';\n    body=[1,2,3,4].map(n=>B('down',ordn(n),'data-v=\"'+n+'\" '+keep,g.down===n?'pri':'')).join('')\n      +'<div class=\"qpm\"><span>To go <b>'+(g.goal?'Goal':g.dist)+'<\/b><\/span><div>'+B('dist','−1','data-v=\"-1\" '+keep)+B('dist','+1','data-v=\"1\" '+keep)+B('dist','+5','data-v=\"5\" '+keep)+'<\/div><\/div>'\n      +B('goalto','Goal to go',keep,g.goal?'pri':'')+B('nextdown','Next down',keep)+B('first10','1st &amp; 10','','pri')+B('flip','Change possession')+B('ddtoggle',g.showDD?'Hide on board':'Show on board',keep);\n  }else if(q.type==='bb'){\n    title='Ball in play';\n    body=B('hit','Single','data-n=\"1\"')+B('hit','Double','data-n=\"2\"')+B('hit','Triple','data-n=\"3\"')+B('hit','Home run','data-n=\"4\"','pri')+B('walk','Walk')+B('err','Error')\n      +B('nexthalf','Next half-inning','','pri')+B('clearbases','Clear bases')+B('clearcount','Clear count')+B('box',g.box?'Hide box score':'Box score')+B('final',g.final?'Reopen game':'Final');\n  }\n  return '<div class=\"modal qs\"><div class=\"scrim\" data-a=\"closeqs\"><\/div><div class=\"qbox\"><div class=\"qh\"><b>'+title+'<\/b><button class=\"btn sm pri\" data-a=\"closeqs\">Done<\/button><\/div><div class=\"qg\">'+body+'<\/div><\/div><\/div>';\n}\nfunction handleBT(el){\n  const k=el.dataset.bt,side=el.dataset.side,sp=S.sport;\n  if(k==='score'){\n    if(sp==='basketball'||sp==='football'){S.ui.qs={type:'score',side:side};render();}\n    else addScore(side,1,sp==='baseball'?'run':'goal');\n  }else if(k==='team'){S.ui.qs={type:'team',side:side};render();}\n  else if(k==='clock')act('clock',{});\n  else if(k==='period'){S.ui.qs={type:'period'};render();}\n  else if(k==='dd'){S.ui.qs={type:'dd'};render();}\n  else if(k==='bbinn'){S.ui.qs={type:'bb'};render();}\n  else if(k==='ball'||k==='strike'||k==='out')act(k,{});\n}\nfunction render(){\n  const sp=S.sport,g=S.g[sp],c=S.cfg[sp];\n  const sh=document.querySelector('.sheet'),st=sh?sh.scrollTop:0;\n  let h=header()+'<section class=\"sb\"><div class=\"two\">'+teamCard('away')+teamCard('home')+'<\/div>';\n  if(sp==='baseball'){\n    h+=midBaseball(g)+(g.final?'<div class=\"banner fin\">FINAL<\/div>':'')+(g.box?boxScore(g):'')+'<\/section>'+baseballControls(g)+(g.box?'':boxScore(g))+'<div class=\"two\">'+teamPanel(sp,'away')+teamPanel(sp,'home')+'<\/div>';\n  }else{\n    h+=midTimed(sp,g)+banners(sp,g)+(S.opts.lines?'<div class=\"blines\">'+lineScoreHtml(sp,g)+'<\/div>':'')+'<\/section>'+clockPanel(sp,g,c);\n    if(sp==='football')h+=ddPanel(g);\n    if(g.so)h+=soPanel(sp,g);\n    h+=statsPanel(sp,g);\n    h+='<div class=\"two\">'+teamPanel(sp,'away')+teamPanel(sp,'home')+'<\/div>';\n  }\n  document.getElementById('app').innerHTML=(S.ui.board?boardMode():h)+modalHtml()+qsHtml();\n  const sh2=document.querySelector('.sheet');if(sh2)sh2.scrollTop=st;\n  applyTheme();applyFonts();document.body.style.overflow=(S.ui.board||CAM.on)?'hidden':'';fit();save();camRefreshUI();\n}\nfunction updateLive(){\n  const sp=S.sport;if(sp==='baseball')return;\n  const g=S.g[sp];\n  const clk=document.getElementById('clk');\n  if(clk){const tx=clockText(sp,g);const ch=clk.textContent.length!==tx.length;clk.textContent=tx;if(ch)fitEl(clk);clk.classList.toggle('low',sp!=='soccer'&&g.clock>0&&g.clock<60000);}\n  const c2=document.getElementById('clk2');if(c2)c2.textContent=clk2Text(sp,g);\n  const i=document.getElementById('intr');if(i&&g.inter)i.textContent=fmt(g.inter.ms);\n  const t=document.getElementById('tor');if(t&&g.timeout)t.textContent=fmt(g.timeout.ms);\n  if(sp==='hockey'){\n    document.querySelectorAll('[data-pen]').forEach(el=>{const p=g.pens.find(x=>String(x.id)===el.dataset.pen);if(p)el.textContent=fmt(p.ms);});\n    document.querySelectorAll('[data-pp]').forEach(el=>{const tx=ppText(g,el.dataset.pp);if(tx)el.textContent=tx;});\n  }\n}\nfunction applyTheme(){\n  const r=document.documentElement;r.setAttribute('data-pkg',S.opts.pkg||'classic');\n  if(S.opts.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.opts.theme);\n}\n\n/* ---------- actions ---------- */\nfunction addScore(side,pts,kind){\n  const sp=S.sport,g=S.g[sp];\n  if(sp==='baseball')addRuns(g,side,pts);\n  else{g.score[side]=Math.max(0,g.score[side]+pts);bumpLine(sp,g,side,pts);}\n  if(pts>0&&sp==='hockey')hockeyGoal(side);\n  render();\n  if(pts>0)celebrateScore(sp,side,pts,kind);\n}\nfunction act(a,d){\n  const sp=S.sport,g=S.g[sp],c=S.cfg[sp],side=d.side,opp=oppOf(side);\n  if(sp==='baseball'&&bbAct(a,d))return;\n  switch(a){\n    case 'sport':S.sport=d.v;S.ui.qs=null;break;\n    case 'board':S.ui.board=true;S.ui.tbar=false;S.ui.qs=null;enterFS();wake(true);toast('Tap a score to add. Hold a score to take one away. Tap the clock to start or stop. Tap a team name for more.');break;\n    case 'exitboard':S.ui.board=false;S.ui.qs=null;leaveFS();wake(false);break;\n    case 'fs':if(fsOn())leaveFS();else enterFS();return;\n    case 'rot':\n      try{\n        if(S.ui.locked){screen.orientation.unlock();S.ui.locked=false;toast('Rotation unlocked.');}\n        else screen.orientation.lock('landscape').then(()=>{S.ui.locked=true;}).catch(()=>toast('Turn your phone sideways. Locking needs full screen on Android.'));\n      }catch(e){toast('Turn your phone sideways to switch to landscape.');}\n      return;\n    case 'tbar':S.ui.tbar=!S.ui.tbar;break;\n    case 'usescore':post({type:'sb-final',gameId:EMB.gameId,result:resultNow()});return;\n    case 'closeemb':camClose();leaveFS();post({type:'sb-close'});return;\n    case 'pkg':S.opts.pkg=d.v;break;\n    case 'cam':S.ui.modal=null;render();camOpen();return;\n    case 'clipplay':{const c=CAM.clips.find(x=>x.id===d.id);const ov=document.getElementById('camList');if(ov)ov.remove();if(c)openPlayer(c);return;}\n    case 'clipdel':{const i=CAM.clips.findIndex(x=>x.id===d.id);if(i>=0){const c=CAM.clips.splice(i,1)[0];idbTx('meta','readwrite',st=>st.delete(c.id)).catch(()=>{});idbTx('frames','readwrite',st=>st.delete(c.id)).catch(()=>{});delete CAM.mem[c.id];if(c.thumbUrl)URL.revokeObjectURL(c.thumbUrl);}refreshClipOverlay();break;}\n    case 'celreset':S.opts.cel=clone(DEF_CEL);break;\n    case 'prevperiod':if(g.period>1){g.period--;g.ended=false;g.final=false;g.inter=null;g.running=false;g.clock=sp==='soccer'?sStart(g.period)*1000:lenFor(sp,g.period);}break;\n    case 'closeqs':S.ui.qs=null;break;\n    case 'font':S.opts[d.k]=d.v;break;\n    case 'fontreset':S.opts.fontNum='Orbitron';S.opts.fontName='Oswald';break;\n    case 'modal':S.ui.modal=d.v;S.ui.confirm=false;if(d.v==='fonts')FONTS.forEach(f=>loadFont(f[0]));break;\n    case 'closemodal':S.ui.modal=null;S.ui.confirm=false;break;\n    case 'theme':S.opts.theme=S.opts.theme==='auto'?'dark':S.opts.theme==='dark'?'light':'auto';break;\n    case 'score':addScore(side,+d.pts,d.kind);return;\n    case 'stat':g[d.k][side]=Math.max(0,g[d.k][side]+(+d.v));break;\n    case 'card':g.cards[side][d.k]=Math.max(0,g.cards[side][d.k]+(+d.v));break;\n    case 'added':g.added=Math.max(0,g.added+(+d.v));break;\n    case 'clock':\n      if(g.final||g.inter)break;\n      if(!g.running&&sp!=='soccer'&&g.clock<=0)break;\n      g.running=!g.running;if(g.running)g.timeout=null;break;\n    case 'adj':g.clock=Math.max(0,g.clock+(+d.ms));break;\n    case 'setclock':{\n      const m=+document.getElementById('cm').value||0,s=+document.getElementById('cs').value||0;\n      g.clock=Math.max(0,(m*60+s)*1000);break;}\n    case 'endperiod':if(sp!=='soccer')g.clock=0;periodEnded(sp);break;\n    case 'nextperiod':nextPeriod(sp);break;\n    case 'skipinter':endInter(sp);break;\n    case 'final':g.final=!g.final;g.running=false;g.inter=null;g.timeout=null;break;\n    case 'to':\n      if(g.to[side]>0){g.to[side]--;g.running=false;g.timeout={side:side,ms:c.toSecs*1000};tone([[330,0,.25],[330,.3,.25]]);}\n      break;\n    case 'endto':g.timeout=null;break;\n    case 'poss':g.poss=side==='none'?null:(g.poss===side?null:side);if(sp==='football'&&g.poss){g.down=1;g.dist=10;g.goal=false;}break;\n    case 'flip':g.poss=g.poss==='home'?'away':'home';if(sp==='football'){g.down=1;g.dist=10;g.goal=false;}break;\n    case 'down':g.down=+d.v;break;\n    case 'dist':g.dist=Math.max(0,g.dist+(+d.v));g.goal=false;break;\n    case 'goalto':g.goal=!g.goal;break;\n    case 'first10':g.down=1;g.dist=10;g.goal=false;break;\n    case 'nextdown':g.down=g.down>=4?1:g.down+1;break;\n    case 'ddtoggle':g.showDD=!g.showDD;break;\n    case 'pen':g.pid=(g.pid||0)+1;g.pens.push({id:g.pid,side:side,ms:(+d.secs)*1000,eog:d.eog==='1',label:d.label});break;\n    case 'rmpen':g.pens=g.pens.filter(p=>String(p.id)!==d.id);break;\n    case 'so_start':g.so=g.so||newSO(c.so);g.running=false;break;\n    case 'so_close':g.so=null;break;\n    case 'so_first':if(g.so&&!g.so.log.length)g.so.first=side;break;\n    case 'so_undo':{const s=g.so.log.pop();if(s)g.so[s].pop();break;}\n    case 'so_res':{\n      if(!g.so||soWinner(g.so))break;\n      const who=soNext(g.so);soKick(g.so,d.res);render();\n      const w=soWinner(g.so);\n      if(w)celebrate(sp,w,'WINS ON PENALTIES!',S.teams[sp][w].name,{big:true,fx:sp==='hockey'?'siren':''});\n      else if(d.res==='g')celebrate(sp,who,'SCORES!','Penalty',{});\n      return;}\n    case 'clearimg':S.teams[sp][side].img=null;break;\n    case 'testcel':celebrateScore(sp,'home',sp==='baseball'?1:3,sp==='football'?'td':'');return;\n    case 'reset':\n      if(!S.ui.confirm){S.ui.confirm=true;setTimeout(()=>{if(S.ui.confirm){S.ui.confirm=false;render();}},3500);}\n      else{S.g[sp]=newGame(sp);S.ui.confirm=false;S.ui.modal=null;}\n      break;\n    case 'resetteams':S.teams[sp]=clone(DEF_TEAMS[sp]);break;\n    default:return;\n  }\n  render();\n}\n\n\nfunction resultNow(){\n  const sp=S.sport,g=S.g[sp],c=S.cfg[sp];\n  const r={sport:sp,away:getScore(sp,'away'),home:getScore(sp,'home'),ot:false,pk:false,otAway:0,otHome:0,final:!!g.final};\n  if(sp!=='baseball'){\n    const reg=sp==='soccer'?2:c.periods;\n    if(g.period>reg){\n      r.ot=true;\n      if(g.otFrom){r.otAway=Math.max(0,r.away-g.otFrom.away);r.otHome=Math.max(0,r.home-g.otFrom.home);}\n    }\n    if(g.so){\n      const w=soWinner(g.so);\n      if(w){r.pk=true;r.ot=true;r[w]+=1;if(w==='away')r.otAway+=1;else r.otHome+=1;}\n    }\n  }\n  const D=lineData(sp,g),nz=a=>a.map(v=>v===''?0:v);\n  r.lines={away:nz(D.rows.away),home:nz(D.rows.home),labels:D.labels};\n  return r;\n}\nwindow.addEventListener('message',e=>{\n  const d=e.data;if(!d||d.type!=='sb-init')return;\n  EMB.on=true;EMB.mode=d.mode||'free';EMB.gameId=d.gameId||null;EMB.label=d.label||'';\n  S.ui={modal:null,confirm:false,board:false,tbar:false,qs:null,locked:false};\n  applySettings(d.settings);\n  if(EMB.mode==='game'){\n    EMB.key='scoreboard-pro-game:'+d.gameId;\n    const sp=SP[d.sport]?d.sport:'basketball';\n    S.sport=sp;\n    Object.assign(S.teams[sp].away,d.away||{});Object.assign(S.teams[sp].home,d.home||{});\n    let saved=null;try{saved=JSON.parse(localStorage.getItem(EMB.key)||'null');}catch(x){}\n    S.g[sp]=saved&&saved.g?Object.assign(newGame(sp),saved.g,{running:false}):newGame(sp);\n  }else if(d.sport&&SP[d.sport]){S.sport=d.sport;}\n  document.documentElement.classList.remove('sb-pending');\n  render();\n});\n/* ---------- events ---------- */\nlet lpFired=false,lpT=null;\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('[data-a]');\n  if(b){\n    if(b.disabled)return;\n    if(b.closest('.qs')&&!b.dataset.keep)S.ui.qs=null;\n    act(b.dataset.a,b.dataset);return;\n  }\n  if(S.ui.board&&!S.ui.modal){\n    const t=e.target.closest('[data-bt]');\n    if(t){if(lpFired){lpFired=false;return;}handleBT(t);}\n  }\n});\ndocument.addEventListener('pointerdown',e=>{\n  lpFired=false;clearTimeout(lpT);\n  if(!S.ui.board||S.ui.qs||S.ui.modal)return;\n  const el=e.target.closest('[data-bt=\"score\"]');if(!el)return;\n  lpT=setTimeout(()=>{lpFired=true;addScore(el.dataset.side,-1,'sub');try{if(navigator.vibrate)navigator.vibrate(40);}catch(x){}},600);\n});\n['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>clearTimeout(lpT)));\ndocument.addEventListener('contextmenu',e=>{if(S.ui.board)e.preventDefault();});\ndocument.addEventListener('keydown',e=>{\n  if(e.key!=='Escape')return;\n  if(S.ui.qs){S.ui.qs=null;render();}\n  else if(S.ui.modal){S.ui.modal=null;render();}\n  else if(S.ui.board){act('exitboard',{});}\n});\nfunction refreshPrev(side){const p=document.getElementById('prev-'+side);if(p)p.innerHTML=logo(S.teams[S.sport][side],64);}\ndocument.addEventListener('input',e=>{\n  const el=e.target,k=el.dataset.t;\n  if(!k||k==='img')return;\n  const t=S.teams[S.sport][el.dataset.side];\n  t[k]=k==='abbr'?el.value.toUpperCase():el.value;\n  refreshPrev(el.dataset.side);save();\n});\nfunction loadImg(file,side){\n  const fr=new FileReader();\n  fr.onload=()=>{\n    const im=new Image();\n    im.onload=()=>{\n      const s=Math.min(1,256/Math.max(im.width,im.height));\n      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));\n      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);\n      S.teams[S.sport][side].img=cv.toDataURL('image/png');\n      render();\n    };\n    im.src=fr.result;\n  };\n  fr.readAsDataURL(file);\n}\ndocument.addEventListener('change',e=>{\n  const el=e.target,sp=S.sport,c=S.cfg[sp],g=S.g[sp];\n  if(el.dataset.t==='img'){if(el.files&&el.files[0])loadImg(el.files[0],el.dataset.side);return;}\n  if(el.dataset.o){S.opts[el.dataset.o]=el.checked;save();return;}\n  if(el.dataset.g){g[el.dataset.g]=Math.max(0,+el.value||0);render();return;}\n  if(el.dataset.r){\n    const key=el.dataset.r,type=el.dataset.rt;let v;\n    if(type==='bool')v=el.checked;\n    else if(type==='time')v=parseTime(el.value);\n    else v=Math.max(0,Math.round(+el.value||0));\n    if(v===null||isNaN(v))return;\n    const old=c[key];c[key]=v;\n    if(TIMED.indexOf(sp)>-1&&sp!=='soccer'){\n      if(key==='len'&&g.period===1&&!g.running&&g.clock===old*1000)g.clock=v*1000;\n      if(key==='ot'&&g.period>c.periods&&!g.running&&g.clock===old*1000)g.clock=v*1000;\n      if(key==='timeouts')g.to={away:v,home:v};\n    }\n    if(type==='time')el.value=fmtS(v);\n    save();\n  }\n});\ndocument.addEventListener('keydown',e=>{\n  if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)&&TIMED.indexOf(S.sport)>-1&&!S.ui.modal){\n    e.preventDefault();act('clock',{});\n  }\n});\n\n\nfunction openClipOverlay(){\n  const old=document.getElementById('camList');if(old)old.remove();\n  const o=document.createElement('div');o.className='ovl';o.id='camList';\n  o.innerHTML='<div class=\"box\"><h2>🎞 Replays<\/h2><div id=\"camListBody\"><\/div><div style=\"margin-top:12px\"><button class=\"btn pri\" data-cam=\"closelist\" style=\"width:100%\">Done<\/button><\/div><\/div>';\n  document.body.appendChild(o);refreshClipOverlay();\n}\nfunction refreshClipOverlay(){\n  const b=document.getElementById('camListBody');\n  if(b){const l=CAM.clips;b.innerHTML=l.length?l.map(c=>'<div class=\"clip\">'+(c.thumbUrl?'<img src=\"'+c.thumbUrl+'\" alt=\"\">':'<img alt=\"\">')+'<div class=\"meta\"><b>'+esc(c.label)+'<\/b><span class=\"muted\">'+new Date(c.created).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' · '+Math.round(c.n/c.fps)+'s<\/span><\/div><button class=\"btn sm pri\" data-a=\"clipplay\" data-id=\"'+c.id+'\">▶ Play<\/button><button class=\"btn sm\" data-a=\"clipdel\" data-id=\"'+c.id+'\" aria-label=\"Delete replay\">🗑<\/button><\/div>').join(''):'<p class=\"muted\">No replays yet. Tap Replay 10s while filming.<\/p>';}\n}\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('[data-cam]');if(!b)return;\n  const a=b.dataset.cam;\n  if(a==='close')camClose();\n  else if(a==='flip'){CAM.facing=CAM.facing==='environment'?'user':'environment';camStream().catch(()=>toast('Could not switch cameras.'));}\n  else if(a==='rec')camRecToggle();\n  else if(a==='replay')camReplay();\n  else if(a==='list'){loadClips().then(openClipOverlay);openClipOverlay();}\n  else if(a==='closelist'){const o=document.getElementById('camList');if(o)o.remove();}\n});\ndocument.addEventListener('input',e=>{\n  const el=e.target,k=el.dataset.c;if(!k)return;\n  if(el.type==='range'){S.opts.cel[k]=+el.value;const l=document.getElementById('cl-'+k);if(l)l.textContent=el.value+(k==='dur'?'s':'%');save();}\n  else if(el.type==='text'){S.opts.cel[k]=el.value;save();}\n});\ndocument.addEventListener('change',e=>{\n  const el=e.target,k=el.dataset.c;\n  if(k&&el.type!=='range'&&el.type!=='text'){S.opts.cel[k]=el.type==='checkbox'?el.checked:el.value;render();return;}\n  if(el.dataset.o==='timer'||el.dataset.o==='lines'){\n    if(el.dataset.o==='timer'&&!el.checked)Object.keys(S.g).forEach(x=>{S.g[x].running=false;});\n    render();\n  }\n});\ndocument.addEventListener('keydown',e=>{\n  if(e.key!=='Escape')return;\n  if(CAM.player)closePlayer();\n  else if(CAM.on&&!document.getElementById('camSave')&&!document.getElementById('camList'))camClose();\n});\n\n/* ---------- clock loop ---------- */\nlet last=performance.now();\nsetInterval(()=>{\n  const now=performance.now(),d=Math.min(now-last,5000);last=now;\n  let ch=false;\n  TIMED.forEach(sp=>{if(tickGame(sp,d))ch=true;});\n  if(ch)render();else updateLive();\n},100);\nsetInterval(save,5000);\n\nrender();\nloadClips().then(()=>{if(CAM.clips.length)render();});\n})();\n<\/script>\n<\/body>\n<\/html>\n";
/* =====================================================================
   Scoreboard: score any game live, or just keep score with no league

function sbAbbr(name){
  const w=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(w.length>=2) return (w.map(x=>x[0]).join('')+w[w.length-1].slice(1)).slice(0,3).toUpperCase();
  return (w[0]||'TM').slice(0,3).toUpperCase();
}
function sbTeamPayload(teamId, side){
  const tm=teamById(teamId)||{name:'Team'};
  const okHex=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
  const c1 = (tm.color && okHex.test(tm.color.trim())) ? tm.color.trim() : (side==='away'?'#6a1b9a':'#0d47a1');
  const n=parseInt(c1.replace('#','').length===3?c1.replace('#','').split('').map(x=>x+x).join(''):c1.replace('#',''),16);
  const lum=(0.2126*((n>>16)&255)+0.7152*((n>>8)&255)+0.0722*(n&255))/255;
  const c2 = (tm.color2 && okHex.test(String(tm.color2).trim())) ? tm.color2.trim() : (lum>0.55?'#111827':'#ffd54f');
  let h=0; String(teamId||tm.name).split('').forEach(ch=>{ h=(h*31+ch.charCodeAt(0))>>>0; });
  const shapes=['shield','hex','star','circle','diamond','badge'];
  const img = (tm.logo && (/^data:image\//.test(tm.logo) || /^https?:\/\//.test(tm.logo))) ? tm.logo : null;
  return {name:tm.name, abbr:sbAbbr(tm.name), c1, c2, shape:shapes[h%shapes.length], img};
}
function sbOpen(init){
  closeScoreboard(true);
  const ov=document.createElement('div');
  ov.id='sbOverlay';
  ov.style.cssText='position:fixed;inset:0;z-index:100000;background:#000;';
  const fr=document.createElement('iframe');
  fr.style.cssText='width:100%;height:100%;border:0;display:block;background:#0b0f18;';
  fr.setAttribute('allow','camera; microphone; fullscreen; screen-wake-lock');
  fr.setAttribute('allowfullscreen','');
  fr.title='Scoreboard';
  fr.addEventListener('load',()=>{ try{ fr.contentWindow.postMessage(Object.assign({type:'sb-init', settings:App.prefs.scoreboard||null},init),'*'); }catch(e){} });
  fr.srcdoc=SCOREBOARD_HTML;
  ov.appendChild(fr);
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
  App._sbFrame=fr;
}
function closeScoreboard(silent){

}
function openScoreboard(gameId){
  const t=App.current, g=t.games.find(x=>x.id===gameId); if(!g) return;
  if(!g.home || !g.away){ showToast('Both teams need to be set first'); return; }
  closeModal();
  const sport = SPORTS[t.sport] ? t.sport : 'basketball';
  const where = g.isTiebreakerGame ? 'Tiebreaker' : g.isPlayoff ? ('Playoffs'+(g.gameNum?' G'+g.gameNum:'')) : ('Week '+g.week);
  sbOpen({mode:'game', gameId:g.id, sport, label:`${teamName(g.away)} @ ${teamName(g.home)} \u00b7 ${where}`, away:Object.assign(sbTeamPayload(g.away,'away'),{tag:sbTagText(g.away,g)}), home:Object.assign(sbTeamPayload(g.home,'home'),{tag:sbTagText(g.home,g)})});
}
function openScoreboardFree(){
  const sport = (App.current && SPORTS[App.current.sport]) ? App.current.sport : undefined;
  sbOpen({mode:'free', sport});
}
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d || !d.sb || !App._sbFrame || e.source!==App._sbFrame.contentWindow) return;
  if(d.type==='sb-close'){ closeScoreboard(); return; }
  if(d.type==='sb-settings'){ App.prefs.scoreboard={cfg:d.cfg, opts:d.opts}; clearTimeout(App._sbPrefT); App._sbPrefT=setTimeout(savePrefs,600); return; }
  if(d.type==='sb-final'){
    if(!d.gameId){ closeScoreboard(); return; }
    const res=d.result||{};
    const apply=()=>sbApplyResult(d.gameId,res);
    if(!res.final){
      // let the person confirm on top of the scoreboard
      closeScoreboard();
      confirmAction("This game isn't marked Final on the scoreboard yet. Use the current score anyway?", apply);
    } else { closeScoreboard(); apply(); }
  }
});
function sbApplyResult(gameId,res){
  const t=App.current, g=t.games.find(x=>x.id===gameId); if(!g) return;
  if(res.lines && res.lines.away) g.periodScores={away:res.lines.away, home:res.lines.home, labels:res.lines.labels, pk:!!res.pk};
  openGameModal(gameId);
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.value=v; return el; };
  set('gmAway', res.away); set('gmHome', res.home);
  const otEl=document.getElementById('gmOT');
  if(otEl && res.ot){ otEl.checked=true; otEl.dispatchEvent(new Event('change')); set('gmOTAway', res.otAway||''); set('gmOTHome', res.otHome||''); }
  const pkEl=document.getElementById('gmPK'); if(pkEl && res.pk) pkEl.checked=true;
  const tied=res.away===res.home;
  const tiesOk=!g.isPlayoff && t.settings.allowTiesRegular;
  if(tied && !tiesOk && !res.pk){
    showToast('Scores are tied \u2014 add the overtime/shootout details, then Save');
    return;
  }
  submitGameScore(gameId);
  showToast('Score saved from the scoreboard');
}

function ensureDeviceId(){
  try{
    let id = localStorage.getItem('leagueScheduler:deviceId');
    if(!id){ id = 'dev_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem('leagueScheduler:deviceId', id); }
    return id;
  }catch(e){ return 'dev_temp_'+Math.random().toString(36).slice(2,8); }
}
async function boot(){
  App.deviceId = ensureDeviceId();
  App.tournamentList = await Store.listTournaments();
  App.customTemplateList = await Store.listTemplates();
  try{ const saved = await Store.loadPrefs(); if(saved) mergeDeep(App.prefs, saved); }catch(e){}
  applyDeviceClasses();
  render();
  if(!App.prefs.askedFormat){ App.prefs.askedFormat=true; savePrefs(); openViewModal(); }
}
boot();

</script>
