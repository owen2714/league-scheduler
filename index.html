<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League Scheduler</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e7e9ee; --sub:#96a0b3; --accent:#4f8cff; --accent2:#22c58b;
    --warn:#ffb454; --danger:#ff5d6c; --gold:#e8c25a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; -webkit-tap-highlight-color:transparent;
  }
  #app{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  a{color:var(--accent);}
  .btn{background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:13px;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .btn.good{background:var(--accent2); border-color:var(--accent2); color:#06231a; font-weight:600;}
  .btn.warn{background:var(--warn); border-color:var(--warn); color:#332200; font-weight:600;}
  .btn.danger{background:var(--danger); border-color:var(--danger); color:#2a0508; font-weight:600;}
  .btn.small{padding:4px 8px; font-size:12px;}
  .btn.ghost{background:transparent;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .col{display:flex; flex-direction:column; gap:6px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px;}
  .grid{display:grid; gap:12px;}
  .muted{color:var(--sub);}
  .pill{display:inline-block; padding:2px 8px; border-radius:99px; background:var(--panel2); border:1px solid var(--line); font-size:11px;}
  h1,h2,h3,h4{margin:0 0 8px 0;}
  label{font-size:12px; color:var(--sub); display:block; margin-bottom:2px;}
  table{border-collapse:collapse; width:100%;}
  th,td{padding:6px 8px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap; font-size:12.5px;}
  th{position:sticky; top:0; background:var(--panel); z-index:2; cursor:pointer;}
  td.team-cell,th.team-cell{text-align:left; position:sticky; left:0; background:var(--panel); z-index:1;}
  tr:hover td{background:rgba(255,255,255,.03);}

  .topbar{flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); overflow-x:auto;}
  .tabbar{flex:0 0 auto; display:flex; gap:4px; padding:6px 10px; background:#12141a; border-bottom:1px solid var(--line); overflow-x:auto;}
  .tabbtn{flex:0 0 auto; background:transparent; border:1px solid transparent; color:var(--sub); padding:7px 12px; border-radius:8px; font-size:13px; white-space:nowrap;}
  .tabbtn.active{background:var(--panel2); color:var(--text); border-color:var(--line);}
  .content{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:14px;}
  .content.noscroll-guard{overscroll-behavior:contain;}

  #miniNav{position:fixed; top:8px; right:8px; z-index:50; background:rgba(23,26,33,.95); border:1px solid var(--line); border-radius:10px; padding:6px; display:flex; gap:4px; flex-wrap:wrap; max-width:220px; box-shadow:0 4px 14px rgba(0,0,0,.4);}
  #miniNav button{font-size:11px; padding:4px 7px;}
  #miniNavToggle{position:fixed; top:8px; right:8px; z-index:51; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:13px; line-height:1;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:4vh 12px; overflow-y:auto;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:12px; width:100%; max-width:640px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .modal.wide{max-width:1000px;}
  .modal-head{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--line); cursor:grab; user-select:none;}
  .modal-body{flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px;}
  .modal-foot{flex:0 0 auto; padding:10px 14px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
  .xbtn{background:transparent; border:none; color:var(--sub); font-size:18px; padding:2px 8px; border-radius:6px;}
  .xbtn:hover{color:var(--text); background:var(--panel2);}

  .team-chip{display:inline-flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:5px 9px; cursor:pointer;}
  .team-chip:hover{border-color:var(--accent);}
  .divcol{background:var(--panel2); border:1px dashed var(--line); border-radius:10px; padding:8px; min-height:70px; min-width:170px; flex:1;}
  .divcol.dragover{border-color:var(--accent); background:rgba(79,140,255,.08);}
  .drag-team{padding:5px 8px; margin:4px 0; background:var(--panel); border:1px solid var(--line); border-radius:7px; cursor:grab; font-size:12.5px;}

  .gamebox{background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:12.5px; cursor:pointer; display:flex; flex-direction:column; gap:2px; min-height:70px; justify-content:center;}
  .gamebox:hover{border-color:var(--accent);}
  .gamebox.sel{outline:2px solid var(--accent);}
  .gamegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px;}
  .letter{font-weight:700; font-size:10px; padding:1px 4px; border-radius:4px; margin-left:4px;}
  .letter.Z{background:var(--gold); color:#332400;}
  .letter.Y{background:#c9a3ff; color:#2b0a4a;}
  .letter.X{background:#7fd9ff; color:#032a36;}
  .letter.P{background:var(--accent2); color:#06231a;}
  .letter.E{background:var(--danger); color:#2a0508;}
  .letter.B{background:#7fa8ff; color:#0a1a3a;}

  .bracket-wrap{overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel2); padding:20px;}
  .bracket-wrap.full{position:fixed; inset:0; z-index:90; border-radius:0; padding:24px;}
  .bracket{display:flex; gap:46px;}
  .bracket-round{display:flex; flex-direction:column; justify-content:space-around; gap:18px; min-width:200px;}
  .bracket-round h4{text-align:center; color:var(--sub); font-weight:600; font-size:12px;}
  .series-card{background:linear-gradient(180deg, var(--panel), var(--panel2)); border:1px solid var(--line); border-radius:10px; padding:0; font-size:12.5px; cursor:pointer; position:relative; z-index:1; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.28); transition:border-color .15s ease, transform .15s ease;}
  .series-card:hover{border-color:var(--accent); transform:translateY(-1px);}
  .sc-label{text-align:center; font-size:9.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--sub); padding:5px 8px 0 8px;}
  .series-team{display:flex; align-items:center; gap:7px; padding:7px 9px; border-bottom:1px solid var(--line);}
  .series-team:last-of-type{border-bottom:none;}
  .series-team.winner{background:rgba(34,197,138,.13);}
  .series-team.winner .series-name{font-weight:700; color:var(--accent2);}
  .series-team.loser .series-name{opacity:.65;}
  .series-team.loser .series-score{opacity:.65;}
  .series-seed{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:var(--panel2); border:1px solid var(--line); font-size:9.5px; color:var(--sub); flex:0 0 auto;}
  .series-seed-blank{visibility:hidden;}
  .series-name{flex:1; min-width:0; white-space:normal; word-break:break-word; line-height:1.25;}
  .series-score{font-weight:700; min-width:20px; text-align:right; flex:0 0 auto;}
  .sc-footer{text-align:center; font-size:10.5px; color:var(--sub); padding:5px 8px 7px 8px;}

  .barchart{display:flex; align-items:flex-end; gap:8px; height:220px; border-bottom:1px solid var(--line); padding:6px 0;}
  .bar{flex:1; background:linear-gradient(180deg,var(--accent),#2a5fd0); border-radius:4px 4px 0 0; min-width:14px; position:relative;}
  .bar span{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:10px; color:var(--sub);}
  .bar label{position:absolute; bottom:-18px; left:0; right:0; text-align:center; font-size:10px; color:var(--sub); transform:rotate(0deg);}

  .empty{padding:30px; text-align:center; color:var(--sub);}
  .gamerow{display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); font-size:12.5px; cursor:pointer;}
  .gamerow:hover{background:rgba(255,255,255,.03);}
  .gamerow .matchup{flex:1; min-width:140px;}
  .gamerow .meta{color:var(--sub); font-size:11px; width:150px;}
  .gamerow .status{width:120px; text-align:right;}
  .status-final{color:var(--accent2); font-weight:600;}
  #backTop{position:fixed; bottom:56px; right:14px; z-index:60; display:none; border-radius:50%; width:38px; height:38px; background:var(--accent); color:#fff; border:none; font-size:16px;}
  th.sortable::after{content:'\21C5'; color:var(--sub); font-size:9px; margin-left:3px;}
  th.sorted-asc::after{content:'\2191'; color:var(--accent); font-size:9px; margin-left:3px;}
  th.sorted-desc::after{content:'\2193'; color:var(--accent); font-size:9px; margin-left:3px;}
  .stat-compare{display:grid; grid-template-columns:1fr auto 1fr; gap:4px 12px; align-items:center; font-size:12.5px;}
  .stat-compare .lbl{text-align:center; color:var(--sub); font-size:11px;}
  .teams-grid{grid-template-columns:340px 1fr;}
  .odds-table{width:100%; border-collapse:collapse; margin:6px 0;}
  .odds-table th,.odds-table td{padding:5px 7px; font-size:11.5px; border-bottom:1px solid var(--line); text-align:center;}
  .odds-table th{position:static;}
  .week-actions{display:flex; gap:6px; padding:8px 12px 0 12px;}
  .gamerow2{border-bottom:1px solid var(--line); padding:8px 10px; cursor:pointer; font-size:12.5px;}
  .gamerow2:hover{background:rgba(255,255,255,.03);}
  .gamerow2 .teamline{display:flex; justify-content:space-between; align-items:center; padding:2px 0;}
  .gamerow2 .teamline.winner{color:var(--accent2); font-weight:700;}
  .gamerow2 .toprow{display:flex; justify-content:space-between; align-items:center;}
  @media (max-width:640px){
    .divcol{min-width:100%;}
    .row.div-row{flex-direction:column;}
    .gamerow{flex-wrap:wrap;}
    .teams-grid{grid-template-columns:1fr;}
  }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:#333846; border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .toast{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:8px 14px; border-radius:8px; font-size:12.5px; z-index:200; opacity:0; transition:opacity .25s;}
  .toast.show{opacity:1;}
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg); opacity:.9; }
  }
  @media (max-width:640px){
    .modal{max-width:100%;}
    th,td{font-size:11px; padding:5px 5px;}
    .bracket-round{min-width:140px;}
  }

  /* ===== device formats (iPhone / iPad / computer) ===== */
  body{touch-action:manipulation; -webkit-text-size-adjust:100%;}
  .btn,.gamerow2,.tabbtn,.team-chip{touch-action:manipulation;}
  body.dev-iphone, body.dev-ipad{background:#07080b;}
  body.dev-iphone #app, body.dev-ipad #app{margin:0 auto; background:var(--bg); box-shadow:0 0 0 1px var(--line);}
  body.dev-iphone-v #app{max-width:430px;}
  body.dev-iphone-h #app{max-width:940px;}
  body.dev-ipad #app{max-width:1100px;}
  body.dev-iphone #app{padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  body.dev-iphone .btn, body.dev-ipad .btn{min-height:38px;}
  body.dev-iphone .btn.small, body.dev-ipad .btn.small{min-height:32px;}
  body.dev-iphone input, body.dev-iphone select, body.dev-iphone textarea{font-size:16px;}
  body.dev-ipad input, body.dev-ipad select, body.dev-ipad textarea{font-size:15px;}
  body.dev-ipad .gamerow2{padding:11px 12px;}
  body.dev-ipad .modal.wide{max-width:820px;}
  body.dev-ipad .teams-grid{grid-template-columns:320px 1fr;}
  /* iPhone, vertical */
  body.dev-iphone-v .content{padding:10px;}
  body.dev-iphone-v .teams-grid{grid-template-columns:1fr;}
  body.dev-iphone-v .divcol{min-width:100%;}
  body.dev-iphone-v .row.div-row{flex-direction:column;}
  body.dev-iphone-v .gamerow{flex-wrap:wrap;}
  body.dev-iphone-v th, body.dev-iphone-v td{font-size:11px; padding:5px 5px;}
  body.dev-iphone-v .bracket-round{min-width:140px;}
  body.dev-iphone-v .overlay{padding:6px;}
  body.dev-iphone-v .modal, body.dev-iphone-v .modal.wide{max-width:100%; max-height:96vh; max-height:96dvh;}
  body.dev-iphone-v .topbar{padding-top:calc(8px + env(safe-area-inset-top));}
  body.dev-iphone-v .gamegrid{grid-template-columns:repeat(2,1fr);}
  /* iPhone, horizontal: short screen, wide layout -> tighter chrome, two-column grids */
  body.dev-iphone-h .topbar{padding:4px 10px;}
  body.dev-iphone-h .tabbar{padding:3px 8px;}
  body.dev-iphone-h .tabbtn{padding:5px 10px;}
  body.dev-iphone-h .content{padding:8px 12px;}
  body.dev-iphone-h .teams-grid{grid-template-columns:280px 1fr;}
  body.dev-iphone-h .gamegrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
  body.dev-iphone-h .overlay{padding:6px 12px;}
  body.dev-iphone-h .modal{max-height:96vh; max-height:96dvh;}
  body.dev-iphone-h th, body.dev-iphone-h td{padding:5px 7px;}
  body.dev-iphone-h .card{padding:10px;}

  /* ===== rivalries ===== */
  .rival-game{border-left:4px solid #ff7a3d; background:linear-gradient(90deg, rgba(255,122,61,.16), rgba(255,122,61,0) 65%);}
  .pill.rival-pill{background:rgba(255,122,61,.18); border-color:#ff7a3d; color:#ffb48a; font-weight:600;}
  .series-card.rival{border-color:#ff7a3d; box-shadow:0 0 0 1px rgba(255,122,61,.55), 0 2px 8px rgba(0,0,0,.28);}
  .sc-label.rival{color:#ffb48a;}
  .pill.series-score{background:rgba(79,140,255,.16); border-color:#4f8cff; color:#bcd3ff; font-weight:600; white-space:nowrap;}
  /* ===== team-colour fades, scoreboard, tiebreak marks ===== */
  .gamerow2 .teamline.tc{padding:6px 10px; border-radius:7px; margin:3px 0;}
  .series-team{position:relative;}
  sup.tb-mark{color:var(--accent2); font-weight:700; margin-left:2px; cursor:help;}
  .scoreboard{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:10px 0; background:linear-gradient(180deg,var(--panel),var(--panel2)); box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .sb-team{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); min-height:74px;}
  .sb-team:last-child{border-bottom:none;}
  .sb-team.lost .sb-name, .sb-team.lost .sb-score{opacity:.6;}
  .sb-name{font-size:18px; font-weight:700; letter-spacing:.2px; display:flex; align-items:center; flex-wrap:wrap; gap:4px;}
  .sb-team.won .sb-name{color:#fff;}
  .sb-side{font-size:9.5px; font-weight:700; letter-spacing:1px; color:var(--sub); border:1px solid var(--line); border-radius:4px; padding:1px 5px; margin-left:4px;}
  .sb-rec{font-size:12.5px; font-weight:600; margin-top:3px; color:var(--text); opacity:.92; display:flex; flex-wrap:wrap; gap:0 6px;}
  .sb-dot{opacity:.5;}
  .sb-sub{font-size:11px; color:var(--sub); margin-top:2px;}
  .sb-score{font-size:42px; font-weight:800; line-height:1; min-width:64px; text-align:right; font-variant-numeric:tabular-nums;}
  .sb-team.won .sb-score{color:var(--accent2);}
  body.dev-iphone-v .sb-name{font-size:15px;} body.dev-iphone-v .sb-score{font-size:34px; min-width:46px;}

  /* ===== v3 look ===== */
  body{background:radial-gradient(900px 420px at 15% -120px,rgba(79,140,255,.14),transparent 60%),radial-gradient(800px 380px at 100% -80px,rgba(34,197,139,.09),transparent 60%),var(--bg); background-attachment:fixed;}
  .topbar{background:linear-gradient(180deg,rgba(30,34,43,.92),rgba(23,26,33,.92)); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
  .tabbar{background:rgba(14,16,22,.85); backdrop-filter:blur(8px);}
  .tabbtn{transition:all .15s ease; font-weight:600;}
  .tabbtn:hover{color:var(--text); background:rgba(255,255,255,.04);}
  .tabbtn.active{background:linear-gradient(180deg,rgba(79,140,255,.22),rgba(79,140,255,.08)); border-color:rgba(79,140,255,.55); color:#fff; box-shadow:0 0 0 1px rgba(79,140,255,.15),0 4px 14px rgba(79,140,255,.18);}
  .btn{transition:transform .08s ease,border-color .15s ease,box-shadow .15s ease,background .15s ease;}
  .btn:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.28);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn.primary{background:linear-gradient(180deg,#6aa0ff,#3f78e8); box-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 16px rgba(79,140,255,.28);}
  .btn.good{background:linear-gradient(180deg,#3fd9a0,#1fb67e);}
  .btn.warn{background:linear-gradient(180deg,#ffc56e,#f0a02d);}
  .btn.danger{background:linear-gradient(180deg,#ff7d89,#ec4a5a);}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.22);}
  .card h3,.card h4{letter-spacing:.01em;}
  .pill{background:rgba(255,255,255,.05);}
  th{background:linear-gradient(180deg,#1e222b,#171a21); color:var(--sub); font-size:11px; text-transform:uppercase; letter-spacing:.06em;}
  td.team-cell,th.team-cell{background:var(--panel);}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,.015);} tbody tr:nth-child(even) td.team-cell{background:#191c24;}
  tr:hover td{background:rgba(79,140,255,.07)!important;}
  .overlay{backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); background:rgba(4,6,10,.62);}
  .modal{border-radius:18px; border:1px solid rgba(255,255,255,.09); box-shadow:0 24px 70px rgba(0,0,0,.6); animation:mrise .22s cubic-bezier(.2,.9,.3,1.1);}
  @keyframes mrise{from{opacity:0; transform:translateY(14px) scale(.98);}to{opacity:1; transform:none;}}
  .gamerow2{border-radius:12px; transition:transform .1s ease,box-shadow .15s ease,border-color .15s ease;}
  .gamerow2:hover{transform:translateY(-1px); box-shadow:0 8px 22px rgba(0,0,0,.35);}
  .series-card{border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,.28);}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#303644;border-radius:9px;} ::-webkit-scrollbar-track{background:transparent;}
  .empty{border:1px dashed rgba(255,255,255,.14); border-radius:14px; background:rgba(255,255,255,.02);}
  /* game scoreboard (ESPN-style card) */
  .scoreboard{position:relative; border:1px solid rgba(255,255,255,.1); border-radius:18px; overflow:hidden; margin:10px 0; background:linear-gradient(180deg,#1a1e28,#11141b); box-shadow:0 14px 36px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);}
  .scoreboard::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold)); z-index:2;}
  .sb-team{display:flex; align-items:center; gap:12px; padding:14px 16px 14px 12px; border-bottom:1px solid rgba(255,255,255,.07); min-height:92px; position:relative; transition:opacity .2s;}
  .sb-team:last-of-type{border-bottom:none;}
  .sb-team.lost{opacity:.78;} .sb-team.lost .sb-score{color:var(--sub);}
  .sb-lead{width:34px; flex:0 0 34px; display:flex; justify-content:center;}
  .sb-seed{width:30px; height:30px; border-radius:50%; background:linear-gradient(180deg,#f6d77a,#d9a93a); color:#2b1d00; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);}
  .sb-id{flex:1; min-width:0;}
  .sb-name{font-size:19px; font-weight:800; letter-spacing:.01em; display:flex; align-items:center; flex-wrap:wrap; gap:6px; line-height:1.15;}

<div id="app"></div>
<div id="miniNavToggle" onclick="toggleMiniNav()" title="Toggle quick nav">&#8801;</div>
<div id="miniNav" style="display:none"></div>
<button id="backTop" title="Back to top" onclick="document.getElementById('content').scrollTo({top:0,behavior:'smooth'})">&#8593;</button>
<div class="toast" id="toast"></div>
<script>
/* =========================================================================
   LEAGUE SCHEDULER — single-file app
   Persistence via window.storage (per-user, personal). Falls back to
   in-memory only if storage is unavailable.
   ========================================================================= */

const SPORTS = {
  basketball:{label:"Basketball", scoreMin:70, scoreMax:130, allowTies:false, hasOT:true, hasShootout:false},
  football:{label:"Football", scoreMin:0, scoreMax:45, allowTies:true, hasOT:true, hasShootout:false},
  baseball:{label:"Baseball", scoreMin:0, scoreMax:12, allowTies:false, hasOT:false, hasShootout:false},
  hockey:{label:"Hockey", scoreMin:0, scoreMax:7, allowTies:true, hasOT:true, hasShootout:true},
  soccer:{label:"Soccer", scoreMin:0, scoreMax:6, allowTies:true, hasOT:true, hasShootout:true},
};

function uid(prefix){ return prefix+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h); showToast._h=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------------------------- storage layer ----------------------------
   Prefers window.storage (Claude artifact sandbox). If that's unavailable
   or throws for any reason, falls back to real browser localStorage so
   this file also works as a standalone .html opened in any browser. Which
   backend works is discovered per call, so it degrades gracefully either way. ---------------------------- */
const LS_PREFIX = 'leagueScheduler:';
function lsGet(key){
  try{ const v = localStorage.getItem(LS_PREFIX+key); return v==null ? null : {key, value:v, shared:false}; }
  catch(e){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, value); return {key, value, shared:false}; }
  catch(e){ return null; }
}
function lsDelete(key){
  try{ localStorage.removeItem(LS_PREFIX+key); return {key, deleted:true, shared:false}; }
  catch(e){ return null; }
}
const Store = {
  async loadPrefs(){
    try{ const r = await window.storage.get('app-prefs', false); return r && r.value ? JSON.parse(r.value) : null; }
    catch(e){ try{ const r = lsGet('app-prefs'); return r && r.value ? JSON.parse(r.value) : null; }catch(e2){ return null; } }
  },
  async savePrefs(p){
    try{ await window.storage.set('app-prefs', JSON.stringify(p), false); }
    catch(e){ lsSet('app-prefs', JSON.stringify(p)); }
  },
  async listTournaments(){
    try{
      const r = await window.storage.get('tournaments-index', false);
      return r && r.value ? JSON.parse(r.value) : [];
    }catch(e){
      const r = lsGet('tournaments-index');
      return r && r.value ? JSON.parse(r.value) : [];
    }
  },
  async saveIndex(list){
    try{ await window.storage.set('tournaments-index', JSON.stringify(list), false); }
    catch(e){ lsSet('tournaments-index', JSON.stringify(list)); }
  },
  async loadTournament(id){
    try{
      const r = await window.storage.get('tournament:'+id, false);
      return r && r.value ? JSON.parse(r.value) : null;
    }catch(e){
      const r = lsGet('tournament:'+id);
      return r && r.value ? JSON.parse(r.value) : null;
    }
  },
  async saveTournament(t){
    try{
      await window.storage.set('tournament:'+t.id, JSON.stringify(t), false);
    }catch(e){
      lsSet('tournament:'+t.id, JSON.stringify(t));
    }
    try{
      const list = await Store.listTournaments();
      const idx = list.findIndex(x=>x.id===t.id);
      const entry = {id:t.id, name:t.name, sport:t.sport, updatedAt:Date.now(), teams:t.teams.length};
      if(idx>=0) list[idx]=entry; else list.push(entry);
      await Store.saveIndex(list);
    }catch(e){ showToast('Save failed'); }
  },
  async deleteTournament(id){
    try{ await window.storage.delete('tournament:'+id, false); }catch(e){ lsDelete('tournament:'+id); }
    try{
      const list = (await Store.listTournaments()).filter(x=>x.id!==id);
      await Store.saveIndex(list);
    }catch(e){}
  },
  async listTemplates(){
    try{
      const r = await window.storage.get('templates-index', false);
      return r && r.value ? JSON.parse(r.value) : [];
    }catch(e){
      const r = lsGet('templates-index');
      return r && r.value ? JSON.parse(r.value) : [];
    }
  },
  async saveTemplateIndex(list){
    try{ await window.storage.set('templates-index', JSON.stringify(list), false); }
    catch(e){ lsSet('templates-index', JSON.stringify(list)); }
  },
  async saveTemplate(id, name, sport, settings){
    try{
      await window.storage.set('template:'+id, JSON.stringify({name, sport, settings}), false);
    }catch(e){
      lsSet('template:'+id, JSON.stringify({name, sport, settings}));
    }
    try{
      const list = await Store.listTemplates();
      const idx = list.findIndex(x=>x.id===id);
      const entry = {id, name, sport};
      if(idx>=0) list[idx]=entry; else list.push(entry);
      await Store.saveTemplateIndex(list);
    }catch(e){ showToast('Could not save template'); }
  },
  async loadTemplate(id){
    try{
      const r = await window.storage.get('template:'+id, false);
      return r && r.value ? JSON.parse(r.value) : null;
    }catch(e){
      const r = lsGet('template:'+id);
      return r && r.value ? JSON.parse(r.value) : null;
    }
  },
  async deleteTemplate(id){
    try{ await window.storage.delete('template:'+id, false); }catch(e){ lsDelete('template:'+id); }
    try{
      const list = (await Store.listTemplates()).filter(x=>x.id!==id);
      await Store.saveTemplateIndex(list);
    }catch(e){}
  },
  /* Shared (cross-user) storage for league sharing by code. Uses window.storage's shared
     flag when available (works across different people inside the same Claude sandbox);
     falls back to plain localStorage otherwise, which is NOT actually shared across
     devices/browsers \u2014 sharing-by-code only really works inside the Claude environment. */
  async saveShared(code, tournament){
    try{ await window.storage.set('shared-league:'+code, JSON.stringify(tournament), true); }
    catch(e){ lsSet('shared-league:'+code, JSON.stringify(tournament)); }
  },
  async loadShared(code){
    try{
      const r = await window.storage.get('shared-league:'+code, true);
      return r && r.value ? JSON.parse(r.value) : null;
    }catch(e){
      const r = lsGet('shared-league:'+code);
      return r && r.value ? JSON.parse(r.value) : null;
    }
  }
};

      ]
    }
  };
}

  return {

function mergeSettingsOverride(target, override){
  Object.keys(override).forEach(k=>{
    const v = override[k];
    if(v && typeof v==='object' && !Array.isArray(v) && target[k] && typeof target[k]==='object' && !Array.isArray(target[k])){
      mergeSettingsOverride(target[k], v);
    } else {
      target[k] = Array.isArray(v) ? JSON.parse(JSON.stringify(v)) : v;
    }
  });
  return target;
}
function applyTemplateSettings(t, templateKey){
  if(!templateKey || templateKey==='none') return;
  const tpl = BUILTIN_TEMPLATES[templateKey];
  if(tpl){ mergeSettingsOverride(t.settings, tpl.settings); return; }
  return null;
}
async function applyCustomTemplateById(t, id){
  const tpl = await Store.loadTemplate(id);
  if(tpl && tpl.settings) mergeSettingsOverride(t.settings, tpl.settings);
}

  App.dataVersion++;

function migrateSettings(t){
  const s=t.settings;
  if(!s.seriesScheduling) s.seriesScheduling = { enabled:false, seriesLength:3, remainderHandling:'extendSeries', homeAwayPattern:'' };
  if(!s.divisionConference) s.divisionConference = {};
  if(!s.teamBranding) s.teamBranding = {enabled:false};
  if(s.randomize && s.randomize.useSkillLevels==null) s.randomize.useSkillLevels = false;
  if(s.randomize && s.randomize.skillBlowoutStrength==null) s.randomize.skillBlowoutStrength = 60;
  if(s.randomize && s.randomize.skillInfluence==null) s.randomize.skillInfluence = 50;
  if(s.scheduleFairness==null) s.scheduleFairness = 'random';
  if(t.teams) t.teams.forEach(tm=>{ if(tm.skillLevel==null) tm.skillLevel=500; });
  if(!t.legacy) t.legacy = { enabled:false, seasons:[], teamCareer:{}, manualSeasons:[] };
  if(!t.legacy.manualSeasons) t.legacy.manualSeasons = [];
  if(!t.rivalries) t.rivalries = [];
  if(!s.relegation) s.relegation = {enabled:false, numMoving:2, playoff:{enabled:false, promoTeams:4, promoGamesToWin:1, promoHomeAway:'1', relegTeams:4, relegGamesToWin:1, relegHomeAway:'1'}};
  if(s.relegation && !s.relegation.playoff) s.relegation.playoff = {enabled:false, promoTeams:4, promoGamesToWin:1, promoHomeAway:'1', relegTeams:4, relegGamesToWin:1, relegHomeAway:'1'};
  if(!t.relegationPlayoffBrackets) t.relegationPlayoffBrackets = {};
  if(!s.subPlayoffs) s.subPlayoffs = {enabled:false, basis:'division', countsAsRegularSeason:false, uniform:true, uniformConfig:{teamsCount:4, gamesToWin:1, homeAway:'1', thirdPlace:false, playoffEnabled:true}, configs:{}};
  if(s.subPlayoffs && s.subPlayoffs.countsAsRegularSeason==null) s.subPlayoffs.countsAsRegularSeason = false;
  if(s.subPlayoffs && s.subPlayoffs.uniformConfig && s.subPlayoffs.uniformConfig.playoffEnabled==null) s.subPlayoffs.uniformConfig.playoffEnabled = true;
  if(s.subPlayoffs && s.subPlayoffs.configs){ Object.values(s.subPlayoffs.configs).forEach(cfg=>{ if(cfg.playoffEnabled==null) cfg.playoffEnabled = true; }); }
  if(!t.subPlayoffBrackets) t.subPlayoffBrackets = {};
  if(!s.perGroupScheduling) s.perGroupScheduling = {enabled:false, configs:{}};
  if(!s.tiebreakerGame) s.tiebreakerGame = {enabled:false, scope:'any'};
  if(s.standingsColumns && s.standingsColumns.divRecord==null) s.standingsColumns.divRecord = false;
  if(s.standingsColumns && s.standingsColumns.homeRec==null) s.standingsColumns.homeRec = false;
  if(s.standingsColumns && s.standingsColumns.awayRec==null) s.standingsColumns.awayRec = false;
  if(s.playoffsOnly==null) s.playoffsOnly = false;
  if(s.playoffs){
    if(s.playoffs.victoryScreenEnabled==null) s.playoffs.victoryScreenEnabled = true;
    if(s.playoffs.showRaceImpact==null) s.playoffs.showRaceImpact = true;
    if(s.playoffs.reseedEachRound==null) s.playoffs.reseedEachRound = false;
    if(s.playoffs.bracketFormat==null) s.playoffs.bracketFormat = 'single';
    if(s.playoffs.thirdPlaceGame==null) s.playoffs.thirdPlaceGame = false;
    if(!s.playoffs.losersRounds || !s.playoffs.losersRounds.length) s.playoffs.losersRounds = [{name:"Losers Round", mode:'bestof', gamesToWin:1, numGames:2, homeAway:"1-1", lowerSeedHostsFirst:false}];
    (s.playoffs.rounds||[]).forEach(r=>{
      if(!r.mode) r.mode='bestof';
      if(r.lowerSeedHostsFirst==null) r.lowerSeedHostsFirst=false;
    });
  }
}

async function joinByCode(){
  const el = document.getElementById('joinCode');
  const code = (el.value||'').trim().toUpperCase();
  if(!code){ showToast('Enter a code first'); return; }
  const shared = await Store.loadShared(code);
  if(!shared){ showToast('No league found with that code'); return; }
  migrateSettings(shared);
  let role = 'viewer';
  if(shared.access){
    if(shared.access.ownerDeviceId===App.deviceId) role='owner';
    else if(shared.access.roles[App.deviceId]) role=shared.access.roles[App.deviceId];
  }
  if(role==='viewer'){
    if(!shared.access) shared.access = {ownerDeviceId:null, roles:{}, requests:[]};
    if(!shared.access.requests.find(r=>r.deviceId===App.deviceId)){
      const name = (prompt('Enter your name so the owner can grant you access:')||'').trim() || 'Anonymous';
      shared.access.requests.push({deviceId:App.deviceId, name, requestedAt:Date.now()});
      try{ await Store.saveShared(code, shared); }catch(e){}
    }
  }
  App.myRole = role;
  App.current = shared; App.view='tournament'; App.tab='settings';
  resetAppCaches(); App.oddsCache=null; App.standingsCache=null; App.htmlCache=null; App.tierCache=null; App.titleSettledCache=null;
  render();
  showToast(role==='viewer' ? 'Joined as view-only \u2014 ask the owner to grant you access' : `Joined as ${role}`);
}
async function refreshFromShared(){
  const t=App.current;
  if(!t || !t.shareCode) return;
  const shared = await Store.loadShared(t.shareCode);
  if(!shared){ showToast('Could not refresh \u2014 no shared copy found'); return; }
  migrateSettings(shared);
  let role = 'viewer';
  if(shared.access){
    if(shared.access.ownerDeviceId===App.deviceId) role='owner';
    else if(shared.access.roles[App.deviceId]) role=shared.access.roles[App.deviceId];
  }
  App.myRole = role;
  App.current = shared;
  resetAppCaches(); App.oddsCache=null; App.standingsCache=null; App.htmlCache=null; App.tierCache=null; App.titleSettledCache=null;
  render();
  showToast('Refreshed from the shared copy');
}
function enableSharingForTournament(){
  const t=App.current;
  if(App.myRole!=='owner') return;
  if(!t.shareCode){
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    t.shareCode = Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  }
  if(!t.access) t.access = {ownerDeviceId:App.deviceId, roles:{}, requests:[]};
  scheduleSave();
  publishSharedCopy();
  renderTab();
  showToast('Share code generated');
}
function publishSharedCopy(){
  const t=App.current;
  if(!t || !t.shareCode) return;
  Store.saveShared(t.shareCode, t);
  showToast('Shared copy updated');
}
function grantAccess(deviceId, role, requestIdx){
  if(App.myRole!=='owner') return;
  const access=App.current.access;
  access.roles[deviceId]=role;
  access.requests.splice(requestIdx,1);
  scheduleSave(); publishSharedCopy(); renderTab();
}
function denyAccess(requestIdx){
  if(App.myRole!=='owner') return;
  App.current.access.requests.splice(requestIdx,1);
  scheduleSave(); publishSharedCopy(); renderTab();
}
function setAccessRole(deviceId, role){
  if(App.myRole!=='owner') return;
  App.current.access.roles[deviceId]=role;
  scheduleSave(); publishSharedCopy(); renderTab();
}
function removeAccess(deviceId){
  if(App.myRole!=='owner') return;
  delete App.current.access.roles[deviceId];
  scheduleSave(); publishSharedCopy(); renderTab();
}
function copyShareCode(){
  const t=App.current;
  if(!t.shareCode) return;
  try{ navigator.clipboard && navigator.clipboard.writeText(t.shareCode); showToast('Code copied'); }
  catch(e){ showToast('Code: '+t.shareCode); }
}
function renderSharingCard(){
  const t=App.current;
  if(App.myRole!=='owner'){
    return `<div class="card">
      <h3>Sharing & Access</h3>
      <div class="muted">You're viewing this league with <strong>${esc(App.myRole)}</strong> access${App.myRole==='viewer'?' \u2014 changes you make won\u2019t be saved.':'.'}</div>
      ${t.shareCode?`<button class="btn small" style="margin-top:6px;" onclick="refreshFromShared()">\ud83d\udd04 Refresh from owner's latest copy</button>`:''}
    </div>`;
  }
  const access = t.access || (t.access={ownerDeviceId:App.deviceId, roles:{}, requests:[]});
  return `<div class="card">
    <h3>Sharing & Access</h3>
    <div class="col">
      ${t.shareCode? `
        <div class="row" style="align-items:center;"><label style="margin:0;">Share code:</label><strong style="font-size:16px;letter-spacing:2px;">${esc(t.shareCode)}</strong><button class="btn small" onclick="copyShareCode()">Copy</button></div>
        <div class="muted" style="font-size:11px;">Give this code to anyone you want to share the league with. It only works between people using this app inside the same Claude environment \u2014 it won't sync for someone who downloaded this as a standalone file.</div>
        <button class="btn small" onclick="publishSharedCopy()">\ud83d\udd04 Push latest changes to the shared copy</button>
      ` : `<button class="btn primary" onclick="enableSharingForTournament()">Generate a share code</button>`}
      ${t.shareCode && access.requests.length? `
        <h4 style="margin-top:10px;">Access requests</h4>
        ${access.requests.map((r,i)=>`
          <div class="row card" style="padding:6px 10px;align-items:center;">
            <span style="flex:1;">${esc(r.name)}</span>
            <button class="btn small good" onclick="grantAccess('${r.deviceId}','viewer',${i})">Grant viewer</button>
            <button class="btn small primary" onclick="grantAccess('${r.deviceId}','operator',${i})">Grant operator</button>
            <button class="btn small danger" onclick="denyAccess(${i})">Deny</button>
          </div>
        `).join('')}
      `:''}
      ${t.shareCode && Object.keys(access.roles).length? `
        <h4 style="margin-top:10px;">People with access</h4>
        ${Object.entries(access.roles).map(([devId,role])=>`
          <div class="row card" style="padding:6px 10px;align-items:center;">
            <span style="flex:1;font-family:monospace;font-size:11px;">${esc(devId.slice(0,10))}\u2026</span>
            <select onchange="setAccessRole('${devId}',this.value)">
              <option value="viewer" ${role==='viewer'?'selected':''}>Viewer</option>
              <option value="operator" ${role==='operator'?'selected':''}>Operator (can edit scores)</option>
            </select>
            <button class="btn small danger" onclick="removeAccess('${devId}')">Remove</button>
          </div>
        `).join('')}
      `:''}
      <div class="muted" style="font-size:11px;margin-top:6px;">Operators can make the same edits you can. This is a lightweight access system \u2014 it identifies people by their browser, not a real login, so someone who clears their browser data or switches devices will show up as a new person and need access granted again.</div>
    </div>
  </div>`;
}

function subPlayoffConfigFields(mode, groupName){
  const sp=App.current.settings.subPlayoffs;
  const cfg = mode==='uniform' ? sp.uniformConfig : (sp.configs[groupName] || (sp.configs[groupName]={teamsCount:4,gamesToWin:1,homeAway:'1',thirdPlace:false,playoffEnabled:true}));
  if(cfg.playoffEnabled==null) cfg.playoffEnabled=true;
  const path = mode==='uniform' ? `App.current.settings.subPlayoffs.uniformConfig` : `App.current.settings.subPlayoffs.configs['${esc(groupName).replace(/'/g,"\\'")}']`;
  return `
    <div class="row" style="margin-top:6px;align-items:center;">
      <label class="row" style="align-items:center;margin:0;"><input type="checkbox" ${cfg.playoffEnabled?'checked':''} onchange="${path}.playoffEnabled=this.checked;scheduleSave();renderTab();"> ${mode==='uniform'?'Enable this playoff':'Give '+esc(groupName)+' a playoff'}</label>
    </div>
    ${cfg.playoffEnabled?`
    <div class="row" style="margin-top:6px;">
      <label style="margin:0;">Teams in:</label><input type="number" min="2" style="width:70px;" value="${cfg.teamsCount}" onchange="${path}.teamsCount=+this.value;scheduleSave();">
      <label style="margin:0;">Games to win a round:</label><input type="number" min="1" style="width:60px;" value="${cfg.gamesToWin}" onchange="${path}.gamesToWin=+this.value;scheduleSave();">
      <label style="margin:0;">Home/away pattern:</label><input style="width:110px;" value="${esc(cfg.homeAway)}" onchange="${path}.homeAway=this.value;scheduleSave();">
      <label class="row" style="align-items:center;margin:0;"><input type="checkbox" ${cfg.thirdPlace?'checked':''} onchange="${path}.thirdPlace=this.checked;scheduleSave();"> 3rd place game</label>
    </div>` : `<div class="muted" style="font-size:11px;">${mode==='uniform'?'No conference/division playoffs will be seeded anywhere.':esc(groupName)+' goes straight from the regular season to the main playoffs with no tournament of its own.'}</div>`}`;
}
function getPerGroupConfig(divName){
  const s=App.current.settings;
  if(!s.perGroupScheduling.configs[divName]){
    s.perGroupScheduling.configs[divName] = {
      gamesPerTeam: s.gamesPerTeam,
      divisionGamesPerTeam: s.divisionGamesPerTeam,
      conferenceGamesPerTeam: s.conferenceGamesPerTeam,
      seriesScheduling: {enabled:false, seriesLength:3, remainderHandling:'extendSeries', homeAwayPattern:''}
    };
  }
  return s.perGroupScheduling.configs[divName];
}

function syncDivisionConference(){
  const s=App.current.settings;
  if(!s.divisionConference) s.divisionConference={};
  const validConfs = new Set(s.conferenceNames);
  const validDivs = new Set(s.divisionNames);
  Object.keys(s.divisionConference).forEach(d=>{ if(!validDivs.has(d)) delete s.divisionConference[d]; });
  s.divisionNames.forEach(d=>{
    if(!s.divisionConference[d] || !validConfs.has(s.divisionConference[d])){
      s.divisionConference[d] = s.conferenceNames[0] || '';
    }
  });
  if(s.useConferences && App.current.teams){
    App.current.teams.forEach(tm=>{ if(tm.division && s.divisionConference[tm.division]) tm.conference = s.divisionConference[tm.division]; });

function addBulkTeams(){
  const lines=document.getElementById('bulkTeams').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const s=App.current.settings; const chosenDiv=document.getElementById('bulkDiv').value;
  const DASH_RE = /\s+[-\u2013\u2014]\s+/;
  let autoIdx=0;
  lines.forEach((line)=>{
    let name=line, div=null;
    const m = line.split(DASH_RE);
    if(m.length>=2){
      const possibleDiv = m[m.length-1].trim();
      const matchedDiv = s.divisionNames.find(d=>d.toLowerCase()===possibleDiv.toLowerCase());
      if(matchedDiv){ name = m.slice(0,-1).join(' - ').trim(); div = matchedDiv; }
    }
    if(!div) div = chosenDiv || s.divisionNames[autoIdx % s.divisionNames.length];
    if(!chosenDiv && !DASH_RE.test(line)) autoIdx++;
    const conf = s.useConferences ? (s.divisionConference[div]||'') : '';
    App.current.teams.push({id:uid('team'), name, division:div, conference:conf, skillLevel:500});
  });
  document.getElementById('bulkTeams').value='';
  scheduleSave(); renderTab();
}
function bulkAddColors(){
  const DASH_RE = /\s+[-\u2013\u2014]\s+/;
  const lines=document.getElementById('bulkColors').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const t=App.current;
  let matched=0, unmatched=[];
  lines.forEach(line=>{
    const parts=line.split(DASH_RE);
    if(parts.length<2) return;
    const name=parts[0].trim(), color=parts[parts.length-1].trim();
    const tm=t.teams.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!tm){ unmatched.push(name); return; }
    tm.color = /^#/.test(color) ? color : ('#'+color);
    matched++;
  });
  document.getElementById('bulkColors').value='';
  if(matched){ scheduleSave(); renderTab(); }
  showToast(matched? `Set colors for ${matched} team${matched===1?'':'s'}${unmatched.length?` (${unmatched.length} not found)`:''}` : 'No matching teams found \u2014 check the names');
}

    if(isNaN(skill)) return;
    const tm=t.teams.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!tm){ unmatched.push(name); return; }
    tm.skillLevel = clamp(Math.round(skill),1,1000);
    matched++;
  });
  document.getElementById('bulkSkills').value='';
  if(matched){ scheduleSave(); renderTab(); }
  showToast(matched? `Set skill levels for ${matched} team${matched===1?'':'s'}${unmatched.length?` (${unmatched.length} not found)`:''}` : 'No matching teams found \u2014 check the names');
}
function handleLogoFileUpload(inputEl, teamId){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(file.size > 3*1024*1024){ showToast('Image too large \u2014 please pick something under 3MB'); inputEl.value=''; return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    if(teamId){ setTeamLogo(teamId, reader.result); }
    else { App.pendingNewTeamLogo = reader.result; showToast('Logo attached \u2014 will be saved with this team'); }
  };
  reader.onerror = ()=> showToast('Could not read that image');
  reader.readAsDataURL(file);
}

function randomizeDivisions(){
  const s=App.current.settings, teams=App.current.teams.slice();
  for(let i=teams.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [teams[i],teams[j]]=[teams[j],teams[i]]; }
  teams.forEach((tm,i)=>{
    tm.division = s.divisionNames[i % s.divisionNames.length];
    if(s.useConferences) tm.conference = (s.divisionConference&&s.divisionConference[tm.division]) || '';
  });
  scheduleSave(); renderTab(); showToast('Divisions randomized');
}

function confirmAction(message, onYes){
  const id = 'confirmBtn_'+uid('c');
  window['__confirmCb_'+id] = onYes;
  openModal(`
    <div class="modal-head"><h3 style="margin:0;">Please confirm</h3><button class="xbtn" onclick="closeModal()">\u2715</button></div>

function makeDraggable(box, handle){
  if(!handle) return;
  let sx,sy,ox,oy,dragging=false;
  handle.addEventListener('mousedown',(e)=>{
    if(e.target.classList.contains('xbtn')) return;
    dragging=true; sx=e.clientX; sy=e.clientY;
    const r=box.getBoundingClientRect(); ox=r.left; oy=r.top;
    box.style.position='fixed'; box.style.margin='0'; box.style.left=ox+'px'; box.style.top=oy+'px';
    document.onmousemove=(ev)=>{
      if(!dragging) return;
      box.style.left=clamp(ox+(ev.clientX-sx),0,window.innerWidth-100)+'px';
      box.style.top=clamp(oy+(ev.clientY-sy),0,window.innerHeight-60)+'px';
    };
    document.onmouseup=()=>{ dragging=false; document.onmousemove=null; document.onmouseup=null; };
  });
}

function getFilteredScheduleGames(skipWeekFilter){
  const t=App.current;
  let games = t.games.filter(g=>!g.isPlayoff);
  const f=App.scheduleFilter;
  if(f.team) games = games.filter(g=>g.home===f.team||g.away===f.team);
  if(f.week && !skipWeekFilter) games = games.filter(g=>String(g.week)===String(f.week));
  if(f.division) games = games.filter(g=>{
    const h=t.teams.find(x=>x.id===g.home), a=t.teams.find(x=>x.id===g.away);
    return (h&&h.division===f.division) || (a&&a.division===f.division);
  });
  if(App.scheduleFilterUnplayed) games = games.filter(g=>g.homeScore==null);
  if(App.rivalryOnly) games = games.filter(g=>rivalryFor(g.home,g.away));
  if(f.search){
    const q=f.search.toLowerCase();
    games = games.filter(g=>{
      const h=teamName(g.home).toLowerCase(), a=teamName(g.away).toLowerCase();
      return h.includes(q)||a.includes(q)||(h+' vs '+a).includes(q);
    });
  }
  return games;
}

function renderScheduleBody(fmt, games){
  if(fmt==='date') return renderScheduleByDate(games);

  if(fmt==='conference') return renderScheduleByGroup(games, 'conference');
  if(fmt==='matchup') return renderHeadToHeadPicker(g=>!g.isPlayoff);
  const weeks = [...new Set(games.map(g=>g.week))].sort((a,b)=>a-b);
  return weeks.length? weeks.map(w=>`
      <div class="card" style="padding:0;overflow:hidden;">

function renderScheduleList(games){
  if(!games.length) return `<div class="empty">No games yet. Generate a schedule or add games manually.</div>`;
  const sorted = games.slice().sort((a,b)=>(a.week||0)-(b.week||0));
  return `<div class="card" style="padding:0;overflow:hidden;"><div>${sorted.map(g=>gameRow(g)).join('')}</div></div>`;
}
function renderScheduleByGroup(games, kind){
  const t=App.current, s=t.settings;
  const names = kind==='division' ? s.divisionNames : s.conferenceNames;
  const keyFn = kind==='division' ? (tm=>tm.division) : (tm=>tm.conference);
  const groups = {}; names.forEach(n=>groups[n]=[]);
  const other=[];
  games.forEach(g=>{
    const h=teamById(g.home), a=teamById(g.away);
    if(h && a && keyFn(h)===keyFn(a) && groups[keyFn(h)]) groups[keyFn(h)].push(g);
    else other.push(g);
  });
  let html = names.map(n=>{
    const list = groups[n].slice().sort((a,b)=>(a.week||0)-(b.week||0));
    if(!list.length) return '';
    return `<div class="card" style="padding:0;overflow:hidden;"><h4 style="padding:10px 12px 0 12px;">${esc(n)}</h4><div>${list.map(g=>gameRow(g)).join('')}</div></div>`;
  }).join('');
  if(other.length){
    const list = other.slice().sort((a,b)=>(a.week||0)-(b.week||0));
    html += `<div class="card" style="padding:0;overflow:hidden;"><h4 style="padding:10px 12px 0 12px;">${kind==='division'?'Cross-division':'Cross-conference'} games</h4><div>${list.map(g=>gameRow(g)).join('')}</div></div>`;
  }
  return html || `<div class="empty">No games yet. Generate a schedule or add games manually.</div>`;
}
/* Shared "look up two teams, see every meeting between them" widget \u2014 used in the

   State is shared across all three (App.h2hFilter) since only one tab is visible at a

function renderHeadToHeadPicker(poolFilterFn){

  </div>`;

function renderScheduleByDate(games){
  if(!games.length) return `<div class="empty">No games yet. Generate a schedule or add games manually.</div>`;
  const dated = games.filter(g=>g.date).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  const undated = games.filter(g=>!g.date).sort((a,b)=>a.week-b.week);
  let html='';
  if(dated.length){
    html += `<div class="card" style="padding:0;overflow:hidden;"><h4 style="padding:10px 12px 0 12px;">Upcoming by date</h4><div>${dated.map(g=>gameRow(g)).join('')}</div></div>`;
  }
  if(undated.length){
    html += `<div class="card" style="padding:0;overflow:hidden;"><h4 style="padding:10px 12px 0 12px;">No date set</h4><div>${undated.map(g=>gameRow(g)).join('')}</div></div>`;
  }
  return html;
}
function getGameOfTheWeek(){
  const t=App.current;
  const regGames = t.games.filter(g=>!g.isPlayoff);
  const upcoming = regGames.filter(g=>g.homeScore==null);
  if(!upcoming.length) return null;
  const nextWeek = Math.min(...upcoming.map(g=>g.week));
  const candidates = upcoming.filter(g=>g.week===nextWeek);
  let best=null, bestScore=-1;
  candidates.forEach(g=>{
    const hRec = computeRecord(g.home, regGames), aRec = computeRecord(g.away, regGames);
    const score = hRec.pct + aRec.pct;
    if(score>bestScore){ bestScore=score; best=g; }
  });
  return best;
}

function getTeamRecordsMap(){
  const t=App.current;
  if(!App._recordsCache || App._recordsCache.version!==App.dataVersion){
    const regGames = t.games.filter(isRegularSeasonGame);
    const map={};
    t.teams.forEach(tm=>{ map[tm.id]=formatRecord(computeRecord(tm.id, regGames)); });
    App._recordsCache = {version:App.dataVersion, map};
  }
  return App._recordsCache.map;
}
function gameRow(g){
  const sel = App.selectedGames.has(g.id);
  const played = g.homeScore!=null;
  const homeWon = played && g.homeScore>g.awayScore;
  const awayWon = played && g.awayScore>g.homeScore;
  const s=App.current.settings;
  const homeTm=teamById(g.home), awayTm=teamById(g.away);
  let scopeTag='';
  if(g.isTiebreakerGame){
    scopeTag = ` \u00b7 <span class="pill">Tiebreaker game</span>`;
  } else if(!g.isPlayoff && homeTm && awayTm){
    if(homeTm.division && homeTm.division===awayTm.division) scopeTag = ` \u00b7 <span class="pill">Division: ${esc(homeTm.division)}</span>`;
    else if(s.useConferences && homeTm.conference && homeTm.conference===awayTm.conference) scopeTag = ` \u00b7 <span class="pill">Conference: ${esc(homeTm.conference)}</span>`;
    else scopeTag = ` \u00b7 <span class="pill">Non-conference</span>`;
  }
  const recMap = g.isPlayoff ? null : getTeamRecordsMap();
  const awayRec = recMap ? ` <span class="muted">(${recMap[g.away]||'0-0'})</span>` : '';
  const homeRec = recMap ? ` <span class="muted">(${recMap[g.home]||'0-0'})</span>` : '';
  const rv = rivalryFor(g.home, g.away);
  const rvPill = rv ? ` <span class="pill rival-pill">🔥 ${esc(rv.name||'Rivalry')}</span>` : '';
  return `<div class="gamerow2${rv?' rival-game':''}" style="${sel?'background:rgba(79,140,255,.08);':''}">
    <div class="toprow">
      <label onclick="event.stopPropagation();" style="margin:0;"><input type="checkbox" ${sel?'checked':''} onchange="toggleSelectRow('${g.id}',this)"></label>
      <span class="meta" style="flex:1;text-align:center;">${g.isPlayoff?`<span class="pill">Game ${g.gameNum||1}</span> `:''}${g.date?esc(g.date)+' \u00b7 ':''}${g.time?esc(g.time):''}${g.location?(g.time?' \u00b7 ':'')+esc(g.location):''}${g.neutralSite?' \u00b7 Neutral':''}${scopeTag}${rvPill}</span>
      ${g.isPlayoff?seriesScorePill(g):''}<button class="btn small" title="Score this game on the scoreboard" aria-label="Score on scoreboard" onclick="event.stopPropagation();openScoreboard('${g.id}')">📺</button><span class="status ${played?'status-final':''}" style="width:auto;">${gameStatus(g)}</span>
    </div>
    <div onclick="openGameModal('${g.id}')" style="cursor:pointer;">
      <div class="teamline ${awayWon?'winner':''}${teamFadeStyle(g.away)?' tc':''}" style="${teamFadeStyle(g.away,0.45)}"><span>${teamBadgeHtml(g.away)}${esc(teamName(g.away))}${awayRec} <span class="muted">(away)</span></span><span>${played?g.awayScore:''}</span></div>
      <div class="teamline ${homeWon?'winner':''}${teamFadeStyle(g.home)?' tc':''}" style="${teamFadeStyle(g.home,0.45)}"><span>${teamBadgeHtml(g.home)}${esc(teamName(g.home))}${homeRec} <span class="muted">(home)</span></span><span>${played?g.homeScore:''}</span></div>
    </div>
  </div>`;
}
