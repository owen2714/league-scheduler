/* ---- per-division schedule generation (each division can have its own volume + series settings) ---- */
function generatePerGroupSchedule(){
  const t=App.current, s=t.settings;
  if(t.teams.length<2){ showToast('Add at least 2 teams first'); return; }
  const teams=t.teams;
  const pairKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
  const targetOf={}, divTargetOf={}, confTargetOf={};
  teams.forEach(tm=>{
    const cfg=getPerGroupConfig(tm.division);
    targetOf[tm.id]=cfg.gamesPerTeam||0;
    divTargetOf[tm.id]=Math.min(cfg.divisionGamesPerTeam||0, targetOf[tm.id]);
    confTargetOf[tm.id]= s.useConferences ? Math.min(cfg.conferenceGamesPerTeam||0, targetOf[tm.id]) : 0;
  });
  const gameCount={}, divCount={}, confCount={}, homeCount={};
  teams.forEach(tm=>{ gameCount[tm.id]=0; divCount[tm.id]=0; confCount[tm.id]=0; homeCount[tm.id]=0; });
  const pairCount={};
  const newGames=[];
  const teamBusyWeeks={}; teams.forEach(tm=>teamBusyWeeks[tm.id]=new Set());
  const teamNextFreeWeek={}; teams.forEach(tm=>teamNextFreeWeek[tm.id]=1);
  const weekGameCounts={}; let maxWeekSoFar=0;

  // Phase 1: for divisions whose own config enables series scheduling, generate their
  // in-division games as series first (same shape as generateSeriesSchedule, but scoped to
  // just that division's teams and using that division's own settings), reserving weeks
  // as we go so phase 2 can slot single games around them without double-booking anyone.
  s.divisionNames.forEach(divName=>{
    const cfg = getPerGroupConfig(divName);
    if(!cfg.seriesScheduling.enabled) return;
    const divTeams = teams.filter(tm=>tm.division===divName);
    if(divTeams.length<2) return;
    const sc = cfg.seriesScheduling;
    const seriesLen = Math.max(1, sc.seriesLength||3);
    const pattern = (sc.homeAwayPattern||'').split('-').map(x=>+x).filter(n=>n>0);
    const localCount={}; divTeams.forEach(tm=>localCount[tm.id]=0);
    const localPairCount={};
    function pickOpp(tm){
      const cands = divTeams.filter(o=>o.id!==tm.id && localCount[o.id] < divTargetOf[o.id]);
      if(!cands.length) return null;
      cands.sort((a,b)=>{
        const pa=localPairCount[pairKey(tm.id,a.id)]||0, pb=localPairCount[pairKey(tm.id,b.id)]||0;
        if(pa!==pb) return pa-pb;
        return localCount[a.id]-localCount[b.id];
      });
      return cands[0];
    }
    const seriesList=[];
    let guard=0;
    while(guard++<divTeams.length*40){
      const left = divTeams.filter(x=>localCount[x.id] < divTargetOf[x.id]);
      if(!left.length) break;
      const tm = left.sort((a,b)=>localCount[a.id]-localCount[b.id])[0];
      const remaining = divTargetOf[tm.id]-localCount[tm.id];
      if(remaining<=0) continue;
      const opp = pickOpp(tm);
      if(!opp){ localCount[tm.id]=divTargetOf[tm.id]; continue; }
      let len = Math.min(seriesLen, remaining, divTargetOf[opp.id]-localCount[opp.id]);
      if(len<=0) continue;
      const leftoverAfter = remaining-len;
      if(sc.remainderHandling==='extendSeries' && leftoverAfter>0 && leftoverAfter<seriesLen){
        len = Math.min(remaining, divTargetOf[opp.id]-localCount[opp.id]);
      }
      seriesList.push({a:tm.id,b:opp.id,games:len});
      localCount[tm.id]+=len; localCount[opp.id]+=len;
      const pk=pairKey(tm.id,opp.id); localPairCount[pk]=(localPairCount[pk]||0)+len;
    }
    const merged={};
    seriesList.forEach(sr=>{ const k=pairKey(sr.a,sr.b); if(!merged[k]) merged[k]={a:sr.a,b:sr.b,games:0}; merged[k].games+=sr.games; });
    const finalSeries = Object.values(merged);
    if(s.shuffleScheduleOrder){ for(let i=finalSeries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [finalSeries[i],finalSeries[j]]=[finalSeries[j],finalSeries[i]]; } }
    function findStart(aId,bId,len){
      let w=Math.max(teamNextFreeWeek[aId], teamNextFreeWeek[bId]);
      while(true){
        let ok=true;
        for(let k=0;k<len;k++){ if(teamBusyWeeks[aId].has(w+k)||teamBusyWeeks[bId].has(w+k)){ ok=false; break; } }
        if(ok) return w;
        w++; if(w>5000) return w;
      }
    }
    finalSeries.forEach(sr=>{
      const start = findStart(sr.a, sr.b, sr.games);
      for(let k=0;k<sr.games;k++){ teamBusyWeeks[sr.a].add(start+k); teamBusyWeeks[sr.b].add(start+k); weekGameCounts[start+k]=(weekGameCounts[start+k]||0)+1; if(start+k>maxWeekSoFar) maxWeekSoFar=start+k; }
      teamNextFreeWeek[sr.a]=Math.max(teamNextFreeWeek[sr.a], start+sr.games);
      teamNextFreeWeek[sr.b]=Math.max(teamNextFreeWeek[sr.b], start+sr.games);
      const homeIsAFirst = homeCount[sr.a] <= homeCount[sr.b];
      for(let k=0;k<sr.games;k++){
        let aIsHome;
        if(pattern.length){
          let idx=k, blockIdx=0, cum=0;
          while(cum+pattern[blockIdx%pattern.length]<=idx){ cum+=pattern[blockIdx%pattern.length]; blockIdx++; if(blockIdx>1000) break; }
          aIsHome = (blockIdx%2===0)===homeIsAFirst;
        } else { aIsHome = (k%2===0)===homeIsAFirst; }
        const home = aIsHome? sr.a: sr.b, away = aIsHome? sr.b: sr.a;
        homeCount[home]++;
        newGames.push({id:uid('g'), week:start+k, home, away, homeScore:null, awayScore:null, ot:false, otPointsHome:0, otPointsAway:0, pk:false, time:'', location:'', date:'', neutralSite:false, isPlayoff:false, seriesId:null, isDivisionGame:true});
      }
      gameCount[sr.a]+=sr.games; gameCount[sr.b]+=sr.games;
      divCount[sr.a]+=sr.games; divCount[sr.b]+=sr.games;
    });
  });
  // Snapshot of how many games each team already has from phase 1's series, used to seed
  // the round-based week assignment below so newly-added single games continue the same
  // lockstep progress instead of restarting from zero.
  const gamesAssignedSoFar = {}; teams.forEach(tm=>gamesAssignedSoFar[tm.id]=gameCount[tm.id]);

  // Phase 2: everything else (division games for non-series divisions, conference games, and
  // any-opponent fill-in games) via the same greedy pairing approach as the global generator,
  // just driven by each team's own per-division targets instead of one global number.
  const chosen=[];
  function tryAdd(pair){
    if(gameCount[pair.a]>=targetOf[pair.a] || gameCount[pair.b]>=targetOf[pair.b]) return false;
    chosen.push(pair);
    gameCount[pair.a]++; gameCount[pair.b]++;
    if(pair.sameDiv){ divCount[pair.a]++; divCount[pair.b]++; }
    if(pair.sameConf){ confCount[pair.a]++; confCount[pair.b]++; }
    const pk=pairKey(pair.a,pair.b); pairCount[pk]=(pairCount[pk]||0)+1;
    return true;
  }
  let guard=0;
  while(guard++<5000){
    let progressed=false;
    for(const tm of teams){
      if(divCount[tm.id]>=divTargetOf[tm.id] || gameCount[tm.id]>=targetOf[tm.id]) continue;
      const opts = teams.filter(o=>o.id!==tm.id && o.division===tm.division && divCount[o.id]<divTargetOf[o.id] && gameCount[o.id]<targetOf[o.id]);
      if(!opts.length) continue;
      opts.sort((a,b)=>{
        const pa=pairCount[pairKey(tm.id,a.id)]||0, pb=pairCount[pairKey(tm.id,b.id)]||0;
        if(pa!==pb) return pa-pb;
        return divCount[a.id]-divCount[b.id];
      });
      if(tryAdd({a:tm.id,b:opts[0].id,sameDiv:true,sameConf:s.useConferences&&tm.conference===opts[0].conference})) progressed=true;
    }
    if(!progressed) break;
  }
  if(s.useConferences){
    guard=0;
    while(guard++<5000){
      let progressed=false;
      for(const tm of teams){
        if(confCount[tm.id]>=confTargetOf[tm.id] || gameCount[tm.id]>=targetOf[tm.id]) continue;
        const opts=teams.filter(o=>o.id!==tm.id && o.conference===tm.conference && o.division!==tm.division && confCount[o.id]<confTargetOf[o.id] && gameCount[o.id]<targetOf[o.id]);
        if(!opts.length) continue;
        opts.sort((a,b)=>{
          const pa=pairCount[pairKey(tm.id,a.id)]||0, pb=pairCount[pairKey(tm.id,b.id)]||0;
          if(pa!==pb) return pa-pb;
          return confCount[a.id]-confCount[b.id];
        });
        if(tryAdd({a:tm.id,b:opts[0].id,sameDiv:false,sameConf:true})) progressed=true;
      }
      if(!progressed) break;
    }
  }
  guard=0;
  while(guard++<8000){
    let progressed=false;
    for(const tm of teams){
      if(gameCount[tm.id]>=targetOf[tm.id]) continue;
      const opts=teams.filter(o=>o.id!==tm.id && gameCount[o.id]<targetOf[o.id]);
      if(!opts.length) continue;
      opts.sort((a,b)=>{
        const pa=pairCount[pairKey(tm.id,a.id)]||0, pb=pairCount[pairKey(tm.id,b.id)]||0;
        if(pa!==pb) return pa-pb;
        return gameCount[a.id]-gameCount[b.id];
      });
      const opp=opts[0];
      if(tryAdd({a:tm.id,b:opp.id,sameDiv:tm.division===opp.division,sameConf:s.useConferences&&tm.conference===opp.conference})) progressed=true;
    }
    if(!progressed) break;
  }
  if(s.shuffleScheduleOrder){ for(let i=chosen.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [chosen[i],chosen[j]]=[chosen[j],chosen[i]]; } }
  const pairGroups={};
  chosen.forEach(pair=>{ const k=pairKey(pair.a,pair.b); (pairGroups[k]=pairGroups[k]||[]).push(pair); });
  Object.values(pairGroups).forEach(group=>{
    const a=group[0].a,b=group[0].b,n=group.length;
    let aHome=Math.floor(n/2), bHome=n-aHome;
    if(n%2===1 && homeCount[a]>homeCount[b]){ aHome--; bHome++; }
    let assignedA=0;
    group.forEach(pair=>{ if(assignedA<aHome){ pair.home=a; pair.away=b; assignedA++; } else { pair.home=b; pair.away=a; } });
    homeCount[a]+=aHome; homeCount[b]+=bHome;
  });
  // Round-based lockstep assignment (same approach as the global generator): each round
  // is built most-behind-team-first so single games fill in around the series blocks from
  // phase 1 while keeping everyone's total progress in sync, instead of just grabbing
  // whichever week currently happens to be least full.
  assignGamesInRounds(chosen, gamesAssignedSoFar, (id,r)=>teamBusyWeeks[id].has(r), (id,r)=>{ teamBusyWeeks[id].add(r); if(r>maxWeekSoFar) maxWeekSoFar=r; });
  const singleGames = chosen.map(pair=>({id:uid('g'), week:pair.week, home:pair.home, away:pair.away, homeScore:null, awayScore:null, ot:false, otPointsHome:0, otPointsAway:0, pk:false, time:'', location:'', neutralSite:false, isPlayoff:false, seriesId:null, isDivisionGame:pair.sameDiv}));
  // Best-effort "everyone plays the last week" repair \u2014 only ever moves a single
  // (non-series) game, since relocating one game out of a series would break its
  // consecutive-week structure. Uses teamBusyWeeks (which already reflects every team's
  // series AND single-game commitments) to know who's genuinely free to move into the
  // final week, so it can never double-book a team that's already there via a series.
  if(maxWeekSoFar>0){
    const lastWeekTeams = new Set();
    teams.forEach(tm=>{ if(teamBusyWeeks[tm.id].has(maxWeekSoFar)) lastWeekTeams.add(tm.id); });
    teams.forEach(tm=>{
      if(lastWeekTeams.has(tm.id)) return;
      const cands = singleGames.filter(g=>(g.home===tm.id||g.away===tm.id) && g.week!==maxWeekSoFar).sort((a,b)=>b.week-a.week);
      for(const g of cands){
        const other = g.home===tm.id?g.away:g.home;
        if(!lastWeekTeams.has(tm.id) && !lastWeekTeams.has(other)){
          teamBusyWeeks[tm.id].delete(g.week); teamBusyWeeks[other].delete(g.week);
          g.week = maxWeekSoFar;
          teamBusyWeeks[tm.id].add(maxWeekSoFar); teamBusyWeeks[other].add(maxWeekSoFar);
          lastWeekTeams.add(tm.id); lastWeekTeams.add(other);
          break;
        }
      }
    });
  }
  newGames.push(...singleGames);
  t.games = t.games.filter(g=>g.isPlayoff).concat(newGames);
  scheduleSave(); renderTab();
  const totalWeeks = Math.max(...newGames.map(g=>g.week), 0);
  showToast(`Generated ${newGames.length} games across ${totalWeeks} weeks (per-division scheduling)`);
}

/* ---- schedule generation (round-robin-ish, respects division/conf quotas) ---- */
function autoGenerateSchedule(){
  const t=App.current, s=t.settings;
  if(t.teams.length<2){ showToast('Add at least 2 teams first'); return; }
  const teams=t.teams;
  const pairsNeeded=[];
  for(let i=0;i<teams.length;i++){
    for(let j=i+1;j<teams.length;j++){
      const a=teams[i], b=teams[j];
      pairsNeeded.push({a:a.id,b:b.id, sameDiv:a.division===b.division, sameConf:s.useConferences && a.conference===b.conference});
    }
  }
  const target = s.gamesPerTeam || 10;
  const divTarget = Math.min(s.divisionGamesPerTeam||0, target);
  const confTarget = s.useConferences ? Math.min(s.conferenceGamesPerTeam||0, target) : 0;
  const gameCount = {}; teams.forEach(tm=>gameCount[tm.id]=0);
  const divCount = {}; teams.forEach(tm=>divCount[tm.id]=0);
  const confCount = {}; teams.forEach(tm=>confCount[tm.id]=0);
  const homeCount = {}; teams.forEach(tm=>homeCount[tm.id]=0);
  const pairCount = {};
  const pairKey = (a,b) => a<b ? a+'|'+b : b+'|'+a;

  const fairnessOn = s.scheduleFairness==='balanced' && s.randomize.useSkillLevels;
  const skillOf = (id)=>{ const tm=teamById(id); return (tm&&tm.skillLevel!=null)?tm.skillLevel:500; };
  const tierOf = {}; let tierCount = 1;
  const tierTarget = {};
  const tierFaced = {};
  if(fairnessOn){
    const sorted = teams.slice().sort((a,b)=>skillOf(b.id)-skillOf(a.id));
    tierCount = Math.max(1, Math.min(4, teams.length));
    const tierSize = Math.ceil(sorted.length/tierCount);
    sorted.forEach((tm,i)=>{ tierOf[tm.id] = Math.min(tierCount-1, Math.floor(i/tierSize)); });
    teams.forEach(tm=>{
      tierTarget[tm.id]={}; tierFaced[tm.id]={};
      const otherTotal = teams.length-1;
      for(let ti=0; ti<tierCount; ti++){
        const tierMembers = teams.filter(o=>tierOf[o.id]===ti && o.id!==tm.id).length;
        tierTarget[tm.id][ti] = otherTotal>0 ? target*tierMembers/otherTotal : 0;
        tierFaced[tm.id][ti] = 0;
      }
    });
  }
  function fairnessCompare(teamId, aId, bId){
    if(!fairnessOn) return 0;
    const needA = tierTarget[teamId][tierOf[aId]] - tierFaced[teamId][tierOf[aId]];
    const needB = tierTarget[teamId][tierOf[bId]] - tierFaced[teamId][tierOf[bId]];
    return needB - needA;
  }
  function passOrder(){
    if(!fairnessOn) return teams;
    const copy = teams.slice();
    for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
    return copy;
  }

  const chosen = [];
  function tryAdd(pair, repeatOk){
    if(gameCount[pair.a]>=target || gameCount[pair.b]>=target) return false;
    if(pair.sameDiv && divCount[pair.a]>=divTarget && divCount[pair.b]>=divTarget && !repeatOk) return false;
    chosen.push(pair);
    if(fairnessOn){ tierFaced[pair.a][tierOf[pair.b]]++; tierFaced[pair.b][tierOf[pair.a]]++; }
    gameCount[pair.a]++; gameCount[pair.b]++;
    if(pair.sameDiv){ divCount[pair.a]++; divCount[pair.b]++; }
    if(pair.sameConf){ confCount[pair.a]++; confCount[pair.b]++; }
    const pk=pairKey(pair.a,pair.b); pairCount[pk]=(pairCount[pk]||0)+1;
    return true;
  }
  let guard=0;
  while(guard++<5000){
    let progressed=false;
    for(const tm of passOrder()){
      if(divCount[tm.id] >= divTarget || gameCount[tm.id]>=target) continue;
      const opts = teams.filter(o=>o.id!==tm.id && o.division===tm.division && divCount[o.id]<divTarget && gameCount[o.id]<target);
      if(!opts.length) continue;
      opts.sort((a,b)=>{
        if(fairnessOn){ const fc=fairnessCompare(tm.id,a.id,b.id); if(fc!==0) return fc; }
        const pa=pairCount[pairKey(tm.id,a.id)]||0, pb=pairCount[pairKey(tm.id,b.id)]||0;
        if(pa!==pb) return pa-pb;
        return divCount[a.id]-divCount[b.id];
      });
      const opp=opts[0];
      if(tryAdd({a:tm.id,b:opp.id,sameDiv:true,sameConf:s.useConferences&&tm.conference===opp.conference},true)) progressed=true;
    }
    if(!progressed) break;
  }
  if(s.useConferences && confTarget>0){
    guard=0;
    while(guard++<5000){
      let progressed=false;
      for(const tm of passOrder()){
        if(confCount[tm.id]>=confTarget || gameCount[tm.id]>=target) continue;
        const opts=teams.filter(o=>o.id!==tm.id && o.conference===tm.conference && o.division!==tm.division && confCount[o.id]<confTarget && gameCount[o.id]<target);
        if(!opts.length) continue;
        opts.sort((a,b)=>{
          if(fairnessOn){ const fc=fairnessCompare(tm.id,a.id,b.id); if(fc!==0) return fc; }
          const pa=pairCount[pairKey(tm.id,a.id)]||0, pb=pairCount[pairKey(tm.id,b.id)]||0;
          if(pa!==pb) return pa-pb;
          return confCount[a.id]-confCount[b.id];
        });
        const opp=opts[0];
        if(tryAdd({a:tm.id,b:opp.id,sameDiv:false,sameConf:true},true)) progressed=true;
      }
      if(!progressed) break;
    }
  }
  guard=0;
  while(guard++<8000){
    let progressed=false;
    for(const tm of passOrder()){
      if(gameCount[tm.id]>=target) continue;
      const opts=teams.filter(o=>o.id!==tm.id && gameCount[o.id]<target);
      if(!opts.length) continue;
      opts.sort((a,b)=>{
        if(fairnessOn){ const fc=fairnessCompare(tm.id,a.id,b.id); if(fc!==0) return fc; }
        const pa=pairCount[pairKey(tm.id,a.id)]||0, pb=pairCount[pairKey(tm.id,b.id)]||0;
        if(pa!==pb) return pa-pb;
        return gameCount[a.id]-gameCount[b.id];
      });
      const opp=opts[0];
      if(tryAdd({a:tm.id,b:opp.id,sameDiv:tm.division===opp.division,sameConf:s.useConferences&&tm.conference===opp.conference},true)) progressed=true;
    }
    if(!progressed) break;
  }
  if(s.shuffleScheduleOrder){
    for(let i=chosen.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [chosen[i],chosen[j]]=[chosen[j],chosen[i]]; }
  }
  // Fair home/away: split every pair's total meetings as evenly as possible between
  // home and away (2 meetings = 1 home/1 away each; an odd total gives the extra home
  // game to whichever team has fewer home games overall so far, not to whoever's array-first).
  const pairGroups = {};
  chosen.forEach(pair=>{ const k=pairKey(pair.a,pair.b); (pairGroups[k]=pairGroups[k]||[]).push(pair); });
  Object.values(pairGroups).forEach(group=>{
    const a=group[0].a, b=group[0].b, n=group.length;
    let aHome = Math.floor(n/2), bHome = n-aHome;
    if(n%2===1 && homeCount[a] > homeCount[b]){ aHome--; bHome++; }
    let assignedA=0;
    group.forEach(pair=>{
      if(assignedA<aHome){ pair.home=a; pair.away=b; assignedA++; }
      else { pair.home=b; pair.away=a; }
    });
    homeCount[a]+=aHome; homeCount[b]+=bHome;
  });
  // Round-by-round week assignment: build each week as a maximal, most-behind-first
  // matching (see assignGamesInRounds) so every team's cumulative games-played stays in
  // lockstep across the season \u2014 nobody sits idle for weeks while others rack up games
  // \u2014 and each round is packed as full as possible, keeping week sizes even too.
  const teamRoundCount = {}; teams.forEach(tm=>teamRoundCount[tm.id]=0);
  const busyByTeamWeek = {}; teams.forEach(tm=>busyByTeamWeek[tm.id]=new Set());
  assignGamesInRounds(chosen, teamRoundCount, (id,r)=>busyByTeamWeek[id].has(r), (id,r)=>busyByTeamWeek[id].add(r));
  const newGames = chosen.map(pair=>({id:uid('g'), week:pair.week, home:pair.home, away:pair.away, homeScore:null, awayScore:null, ot:false, otPointsHome:0, otPointsAway:0, pk:false, time:'', location:'', neutralSite:false, isPlayoff:false, seriesId:null, isDivisionGame:pair.sameDiv}));
  const totalWeeks = Math.max(...newGames.map(g=>g.week), 0);
  ensureLastWeekFull(newGames, totalWeeks);
  t.games = t.games.filter(g=>g.isPlayoff).concat(newGames);
  scheduleSave(); renderTab();
  showToast(`Generated ${newGames.length} games across ${Math.max(...newGames.map(g=>g.week),0)} weeks`);
}

function assignGamesInRounds(pairs, teamCountAssigned, isBusy, markBusy, maxRounds){
  let round = 1;
  let remaining = pairs.slice();
  let guard = 0;
  while(remaining.length && guard++ < (maxRounds||8000)){
    remaining.sort((p1,p2)=> (teamCountAssigned[p1.a]+teamCountAssigned[p1.b]) - (teamCountAssigned[p2.a]+teamCountAssigned[p2.b]));
    const usedThisRound = new Set();
    const stillRemaining = [];
    for(const p of remaining){
      if(usedThisRound.has(p.a) || usedThisRound.has(p.b) || isBusy(p.a,round) || isBusy(p.b,round)){
        stillRemaining.push(p);
        continue;
      }
      p.week = round;
      usedThisRound.add(p.a); usedThisRound.add(p.b);
      markBusy(p.a, round); markBusy(p.b, round);
      teamCountAssigned[p.a] = (teamCountAssigned[p.a]||0)+1;
      teamCountAssigned[p.b] = (teamCountAssigned[p.b]||0)+1;
    }
    remaining = stillRemaining;
    round++;
  }
  return round-1;
}
function ensureLastWeekFull(games, totalWeeks){
  if(totalWeeks<=0) return games;
  const lastWeekTeams = new Set();
  games.forEach(g=>{ if(g.week===totalWeeks){ lastWeekTeams.add(g.home); lastWeekTeams.add(g.away); } });
  const allTeamIds = [...new Set(games.flatMap(g=>[g.home,g.away]))];
  allTeamIds.forEach(teamId=>{
    if(lastWeekTeams.has(teamId)) return;
    const candidates = games.filter(g=>(g.home===teamId||g.away===teamId) && g.week!==totalWeeks).sort((a,b)=>b.week-a.week);
    for(const g of candidates){
      const other = g.home===teamId?g.away:g.home;
      if(!lastWeekTeams.has(teamId) && !lastWeekTeams.has(other)){
        g.week = totalWeeks;
        lastWeekTeams.add(teamId); lastWeekTeams.add(other);
        break;
      }
    }
  });
  return games;
}

function generateSeriesSchedule(){
  const t=App.current, s=t.settings, sc=s.seriesScheduling;
  const teams=t.teams;
  if(teams.length<2){ showToast('Add at least 2 teams first'); return; }
  const target = s.gamesPerTeam || 10;
  const seriesLen = Math.max(1, sc.seriesLength||3);
  const pattern = (sc.homeAwayPattern||'').split('-').map(x=>+x).filter(n=>n>0);

  const gameCount={}; teams.forEach(tm=>gameCount[tm.id]=0);
  const pairGameCount={};
  const pairKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
  const seriesList=[];

  const fairnessOn = s.scheduleFairness==='balanced' && s.randomize.useSkillLevels;
  const skillOfSeries = (id)=>{ const tm=teamById(id); return (tm&&tm.skillLevel!=null)?tm.skillLevel:500; };
  const leagueAvgSkillSeries = fairnessOn ? teams.reduce((sum,tm)=>sum+skillOfSeries(tm.id),0)/teams.length : 500;
  const oppSkillSumSeries = {}; teams.forEach(tm=>oppSkillSumSeries[tm.id]=0);

  function pickOpponent(tm){
    const candidates = teams.filter(o=>o.id!==tm.id && gameCount[o.id]<target);
    if(!candidates.length) return null;
    candidates.sort((a,b)=>{
      const aSameDiv = a.division===tm.division?0:1, bSameDiv=b.division===tm.division?0:1;
      if(aSameDiv!==bSameDiv) return aSameDiv-bSameDiv;
      const aSameConf = (s.useConferences && a.conference===tm.conference)?0:1, bSameConf=(s.useConferences && b.conference===tm.conference)?0:1;
      if(aSameConf!==bSameConf) return aSameConf-bSameConf;
      const pa=pairGameCount[pairKey(tm.id,a.id)]||0, pb=pairGameCount[pairKey(tm.id,b.id)]||0;
      if(pa!==pb) return pa-pb;
      if(fairnessOn){
        const n = gameCount[tm.id]||0;
        const avgA=(oppSkillSumSeries[tm.id]+skillOfSeries(a.id))/(n+1), avgB=(oppSkillSumSeries[tm.id]+skillOfSeries(b.id))/(n+1);
        const fc = Math.abs(avgA-leagueAvgSkillSeries) - Math.abs(avgB-leagueAvgSkillSeries);
        if(fc!==0) return fc;
      }
      return gameCount[a.id]-gameCount[b.id];
    });
    return candidates[0];
  }

  let guard=0;
  while(guard++<teams.length*30){
    const candidatesLeft = teams.filter(x=>gameCount[x.id]<target);
    if(!candidatesLeft.length) break;
    const tm = candidatesLeft.sort((a,b)=>gameCount[a.id]-gameCount[b.id])[0];
    const remainingForTeam = target - gameCount[tm.id];
    if(remainingForTeam<=0) continue;
    const opp = pickOpponent(tm);
    if(!opp){ gameCount[tm.id]=target; continue; }
    let thisLen = Math.min(seriesLen, remainingForTeam, target-gameCount[opp.id]);
    if(thisLen<=0) continue;
    const leftoverAfter = remainingForTeam - thisLen;
    if(sc.remainderHandling==='extendSeries' && leftoverAfter>0 && leftoverAfter<seriesLen){
      thisLen = Math.min(remainingForTeam, target-gameCount[opp.id]);
    }
    seriesList.push({a:tm.id, b:opp.id, games:thisLen});
    if(fairnessOn){ oppSkillSumSeries[tm.id]+=skillOfSeries(opp.id); oppSkillSumSeries[opp.id]+=skillOfSeries(tm.id); }
    gameCount[tm.id]+=thisLen; gameCount[opp.id]+=thisLen;
    pairGameCount[pairKey(tm.id,opp.id)] = (pairGameCount[pairKey(tm.id,opp.id)]||0) + thisLen;
  }

  const mergedByPair = {};
  seriesList.forEach(sr=>{
    const k = pairKey(sr.a, sr.b);
    if(!mergedByPair[k]) mergedByPair[k] = {a:sr.a, b:sr.b, games:0};
    mergedByPair[k].games += sr.games;
  });
  const finalSeriesList = Object.values(mergedByPair);

  if(s.shuffleScheduleOrder){
    for(let i=finalSeriesList.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [finalSeriesList[i],finalSeriesList[j]]=[finalSeriesList[j],finalSeriesList[i]]; }
  }

  const teamNextFreeWeek={}; teams.forEach(tm=>teamNextFreeWeek[tm.id]=1);
  const teamBusyWeeks={}; teams.forEach(tm=>teamBusyWeeks[tm.id]=new Set());
  function findSeriesStart(aId,bId,len){
    let w = Math.max(teamNextFreeWeek[aId], teamNextFreeWeek[bId]);
    while(true){
      let ok=true;
      for(let k=0;k<len;k++){ if(teamBusyWeeks[aId].has(w+k) || teamBusyWeeks[bId].has(w+k)){ ok=false; break; } }
      if(ok) return w;
      w++;
      if(w>5000) return w;
    }
  }
  const homeCount={}; teams.forEach(tm=>homeCount[tm.id]=0);
  const newGames=[];
  finalSeriesList.forEach(sr=>{
    const startWeek = findSeriesStart(sr.a, sr.b, sr.games);
    for(let k=0;k<sr.games;k++){ teamBusyWeeks[sr.a].add(startWeek+k); teamBusyWeeks[sr.b].add(startWeek+k); }
    teamNextFreeWeek[sr.a]=Math.max(teamNextFreeWeek[sr.a], startWeek+sr.games);
    teamNextFreeWeek[sr.b]=Math.max(teamNextFreeWeek[sr.b], startWeek+sr.games);
    const homeIsAFirst = homeCount[sr.a] <= homeCount[sr.b];
    const homeTm=teams.find(x=>x.id===sr.a), awayTm=teams.find(x=>x.id===sr.b);
    const isDivisionGame = homeTm.division===awayTm.division;
    for(let k=0;k<sr.games;k++){
      let aIsHome;
      if(pattern.length){
        let idx=k, blockIdx=0, cum=0;
        while(cum+pattern[blockIdx%pattern.length]<=idx){ cum+=pattern[blockIdx%pattern.length]; blockIdx++; if(blockIdx>1000) break; }
        aIsHome = (blockIdx%2===0) === homeIsAFirst;
      } else {
        aIsHome = (k%2===0) === homeIsAFirst;
      }
      const home = aIsHome? sr.a : sr.b, away = aIsHome? sr.b : sr.a;
      homeCount[home]++;
      newGames.push({id:uid('g'), week:startWeek+k, home, away, homeScore:null, awayScore:null, ot:false, otPointsHome:0, otPointsAway:0, pk:false, time:'', location:'', date:'', neutralSite:false, isPlayoff:false, seriesId:null, isDivisionGame});
    }
  });
  const totalWeeks = Math.max(...newGames.map(g=>g.week), 0);
  t.games = t.games.filter(g=>g.isPlayoff).concat(newGames);
  scheduleSave(); renderTab();
  showToast(`Generated ${newGames.length} games in ${finalSeriesList.length} series across ${totalWeeks} weeks`);
}

function submitBulkSchedule(){

function matchupStages(teamIdA, teamIdB, gameForOdds, seriesId){
  const t=App.current, G=App.prefs.perf.game;
  const isPlayoffGame = (gameForOdds && gameForOdds.isPlayoff) || !!seriesId;
  const noReleg = !t.settings.relegation.enabled;
  const pk = App.prefs.perf.simQuality+JSON.stringify(G.outcomes);
  const base = 'mu:'+teamIdA+':'+teamIdB+':'+(gameForOdds?gameForOdds.id:'')+':'+(seriesId||'')+':';
  const stages=[];
  // Cheap sections first, simulation-based ones last, so the window fills in top to bottom.
  if(G.stats) stages.push(()=>cachedHtml(base+'stats', ()=>{
    const regGames = t.games.filter(isRegularSeasonGame);
    if(seriesId){
      const playoffGames = t.games.filter(x=>x.isPlayoff);
      const seriesGames = t.games.filter(x=>x.seriesId===seriesId);
      return statCompareBlockHtml(teamIdA, teamIdB, regGames, 'Regular season stats')
        + statCompareBlockHtml(teamIdA, teamIdB, playoffGames, 'Playoff stats (all rounds)')
        + statCompareBlockHtml(teamIdA, teamIdB, seriesGames, 'This series')
        + statCompareBlockHtml(teamIdA, teamIdB, t.games, 'Combined (regular + playoffs)');
    }
    return statCompareBlockHtml(teamIdA, teamIdB, regGames, 'Stat comparison');
  }));
  if(G.sos) stages.push(()=>cachedHtml(base+'sos', ()=>{
    const regGames = t.games.filter(isRegularSeasonGame);
    const sosA = avgOppWinPct(regGames.filter(g=>g.home===teamIdA||g.away===teamIdA).map(g=>g.home===teamIdA?g.away:g.home));
    const sosB = avgOppWinPct(regGames.filter(g=>g.home===teamIdB||g.away===teamIdB).map(g=>g.home===teamIdB?g.away:g.home));
    return `<div class="row" style="font-size:12.5px;margin-top:4px;"><span class="muted">Strength of schedule \u2014 ${esc(teamName(teamIdA))}: ${sosA.toFixed(3)} \u00b7 ${esc(teamName(teamIdB))}: ${sosB.toFixed(3)}</span></div>`;
  }));
  if(G.h2h) stages.push(()=>cachedHtml(base+'h2h', ()=>{
    const regGames = t.games.filter(isRegularSeasonGame);
    const prior = regGames.filter(g=>((g.home===teamIdA&&g.away===teamIdB)||(g.home===teamIdB&&g.away===teamIdA)) && g.homeScore!=null);
    return `<h4 style="margin-top:12px;">Previous matchups this season</h4>
    ${prior.length? `<div class="col">${prior.map(g=>`<div class="row card" style="padding:6px 10px;cursor:pointer;" onclick="closeModal();openGameModal('${g.id}')">
        <span class="muted" style="width:44px;">Wk ${g.week}</span>
        <span style="flex:1;">${esc(teamName(g.away))} @ ${esc(teamName(g.home))}</span>
        <span>${g.awayScore} - ${g.homeScore}${g.ot?' OT':''}${g.pk?' PK':''}</span>
      </div>`).join('')}</div>` : '<div class="muted">No previous matchups this season.</div>'}`;
  }));
  if(G.outlook && !isPlayoffGame && noReleg) stages.push(()=>cachedHtml(base+'outlook'+pk, ()=>{
    const o = simulateOutlookPair(teamIdA, teamIdB, adaptiveSims(150));
    return `<h4 style="margin-top:12px;">${t.settings.playoffs.enabled?'Playoff outlook':'Title outlook'} (right now)</h4>
    <table class="odds-table"><thead>${outlookHeaderHtml()}</thead><tbody>
      ${outlookRowHtml(esc(teamName(teamIdA)), o.a)}
      ${outlookRowHtml(esc(teamName(teamIdB)), o.b)}
    </tbody></table>`;
  }));
  if(G.raceImpact && gameForOdds && !isPlayoffGame && t.settings.playoffs.showRaceImpact!==false && noReleg)
    stages.push(()=>cachedHtml(base+'race'+pk, ()=>finalWeekImpactText(gameForOdds)));
  if(G.scenarios && gameForOdds && !isPlayoffGame && noReleg)
    stages.push(()=>gameOddsScenarioTable(gameForOdds));
  return stages;
}
function buildFullMatchupFacts(teamIdA, teamIdB, gameForOdds, seriesId){
  return matchupStages(teamIdA, teamIdB, gameForOdds, seriesId).map(f=>f()).join('');
}

function computeHomeWinPct(s, homeId, awayId){
  const base = s.randomize.homeWinPct;
  if(!s.randomize.useSkillLevels) return base;
  const th = teamById(homeId), ta = teamById(awayId);
  const skillH = (th && th.skillLevel!=null) ? th.skillLevel : 500;
  const skillA = (ta && ta.skillLevel!=null) ? ta.skillLevel : 500;
  const diff = skillH - skillA;
  const logisticPct = 100/(1+Math.pow(10, -diff/400));
  // Skill influence (1-100): how much the skill gap actually moves the win probability
  // away from a coin flip. 1 = games are decided almost entirely by chance regardless of
  // skill; 100 = the full skill-implied probability applies, same as before this setting
  // existed. Blending happens around 50 (a coin flip), then home-field advantage is
  // layered on top exactly as it was.
  const influence = clamp((s.randomize.skillInfluence!=null ? s.randomize.skillInfluence : 50)/100, 0.01, 1);
  const blended = 50 + (logisticPct-50)*influence;
  return clamp(base + (blended-50), 1, 99);
}
function skillAwareScorePair(s, homeId, awayId, homeWins){
  const th=teamById(homeId), ta=teamById(awayId);
  const skillH=(th&&th.skillLevel!=null)?th.skillLevel:500, skillA=(ta&&ta.skillLevel!=null)?ta.skillLevel:500;
  const gap = clamp(Math.abs(skillH-skillA)/999, 0, 1);
  const range = Math.max(1, s.randomize.scoreMax - s.randomize.scoreMin);
  const strength = (s.randomize.skillBlowoutStrength!=null? s.randomize.skillBlowoutStrength : 70)/100;
  const shapedGap = Math.pow(gap, 1.3);
  const s1=randomScoreValue(s), s2=randomScoreValue(s);
  let winnerScore=Math.max(s1,s2), loserScore=Math.min(s1,s2);
  const extraBoost = Math.round(range * shapedGap * strength * Math.random());
  if(extraBoost>0){
    winnerScore = clamp(winnerScore + Math.round(extraBoost*0.4), s.randomize.scoreMin, s.randomize.scoreMax);
    loserScore = clamp(loserScore - Math.round(extraBoost*0.6), s.randomize.scoreMin, winnerScore);
  }
  return homeWins ? {h:winnerScore, a:loserScore} : {h:loserScore, a:winnerScore};
}
function pickWeighted(weightsObj){
  const entries = Object.entries(weightsObj);
  if(!entries.length) return null;
  const total = entries.reduce((sum,[,w])=>sum+(+w||0),0);
  if(total<=0) return null;
  let r = Math.random()*total;
  for(const [v,w] of entries){
    r -= (+w||0);
    if(r<=0) return +v;
  }
  return +entries[entries.length-1][0];
}
function randomScoreValue(s){
  const r=s.randomize;
  let attempts=0, val;
  do{
    if(r.weighted && Object.keys(r.weights).length){
      val = pickWeighted(r.weights);
      if(val==null) val = Math.floor(Math.random()*(r.scoreMax-r.scoreMin+1))+r.scoreMin;
    } else {
      val = Math.floor(Math.random()*(r.scoreMax-r.scoreMin+1))+r.scoreMin;
    }
    attempts++;
  } while(r.disallowedScores.includes(val) && attempts<50);
  return val;
}
function randomOTValue(s){
  const r=s.randomize;
  if(r.otWeighted && Object.keys(r.otWeights).length){
    const v = pickWeighted(r.otWeights);
    if(v!=null) return v;
  }
  const min=r.otMin||0, max=Math.max(min,r.otMax||1);
  return Math.floor(Math.random()*(max-min+1))+min;
}
function computeRandomScore(g, s){
  const p=s.playoffs;
  const otAllowed = g.isPlayoff? p.otEnabledPlayoffs : p.otEnabledRegular;
  const pkAllowed = g.isPlayoff? p.shootoutEnabledPlayoffs : p.shootoutEnabledRegular;
  const allowTies = g.isPlayoff ? false : s.allowTiesRegular;
  const homeWins = Math.random()*100 < computeHomeWinPct(s, g.home, g.away);
  let h,a;
  if(s.randomize.useSkillLevels){ const pair=skillAwareScorePair(s, g.home, g.away, homeWins); h=pair.h; a=pair.a; }
  else { h=randomScoreValue(s); a=randomScoreValue(s); }
  let ot=false, pk=false, otPointsHome=0, otPointsAway=0;
  if(h===a){
    if(allowTies && otAllowed){
      ot=true;
      otPointsHome=randomOTValue(s);
      otPointsAway=randomOTValue(s);
      h+=otPointsHome; a+=otPointsAway;
    } else if(allowTies){
    } else if(otAllowed){
      ot=true;
      if(s.randomize.otSuddenDeath){
        const pts=randomOTValue(s)||1;
        if(homeWins){ otPointsHome=pts; } else { otPointsAway=pts; }
      } else {
        otPointsHome=randomOTValue(s);
        otPointsAway=randomOTValue(s);
      }
      h+=otPointsHome; a+=otPointsAway;
      if(h===a){
        if(pkAllowed){ pk=true; }
        if(homeWins){ h+=1; otPointsHome+=1; } else { a+=1; otPointsAway+=1; }
      }
    } else {
      if(homeWins) h+=1; else a+=1;
    }
  } else if(!allowTies){
    if(homeWins && h<a){ [h,a]=[a,h]; }
    else if(!homeWins && a<h){ [h,a]=[a,h]; }
  }
  return {h,a,ot,pk,otPointsHome,otPointsAway};
}
function isLastSeriesGame(g, sObj){
  const total = sObj.mode==='aggregate' ? Math.max(1, sObj.numGames||2) : sObj.gamesToWin*2-1;
  return (g.gameNum||1) >= total;
}
function seriesAggregateExcluding(sObj, excludeGameId){
  const t=App.current;
  let aPts=0,bPts=0;
  t.games.forEach(g=>{
    if(g.seriesId!==sObj.id || g.id===excludeGameId || g.homeScore==null) return;
    const aIsHome=g.home===sObj.teamA;
    aPts += aIsHome?g.homeScore:g.awayScore;
    bPts += aIsHome?g.awayScore:g.homeScore;
  });
  return {aPts,bPts};
}
function computeRandomScoreForPlayoffGame(g, s, sObj){
  if(!sObj || sObj.mode!=='aggregate') return computeRandomScore(g, s);
  const p=s.playoffs;
  const otAllowed = p.otEnabledPlayoffs;
  const pkAllowed = p.shootoutEnabledPlayoffs;
  let h,a;
  if(s.randomize.useSkillLevels){
    const preHomeWins = Math.random()*100 < computeHomeWinPct(s, g.home, g.away);
    const pair=skillAwareScorePair(s, g.home, g.away, preHomeWins); h=pair.h; a=pair.a;
  } else { h=randomScoreValue(s); a=randomScoreValue(s); }
  let ot=false, pk=false, otPointsHome=0, otPointsAway=0;
  if(isLastSeriesGame(g, sObj)){
    const prior = seriesAggregateExcluding(sObj, g.id);
    const aIsHome = g.home===sObj.teamA;
    let aggA = prior.aPts + (aIsHome?h:a), aggB = prior.bPts + (aIsHome?a:h);
    if(aggA===aggB){
      const homeWins = Math.random()*100 < computeHomeWinPct(s, g.home, g.away);
      if(otAllowed){
        ot=true;
        if(s.randomize.otSuddenDeath){
          const pts=randomOTValue(s)||1;
          if(homeWins){ otPointsHome=pts; } else { otPointsAway=pts; }
        } else {
          otPointsHome=randomOTValue(s); otPointsAway=randomOTValue(s);
        }
        h+=otPointsHome; a+=otPointsAway;
        aggA = prior.aPts + (aIsHome?h:a); aggB = prior.bPts + (aIsHome?a:h);
        if(aggA===aggB){
          if(pkAllowed) pk=true;
          if(homeWins){ h+=1; otPointsHome+=1; } else { a+=1; otPointsAway+=1; }
        }
      } else {
        if(homeWins) h+=1; else a+=1;
      }
    }
  }
  return {h,a,ot,pk,otPointsHome,otPointsAway};
}
function randomizeOneGame(gameId){
  const t=App.current, g=t.games.find(x=>x.id===gameId), s=t.settings;

}
function randomizeSelected(){
  if(!App.selectedGames.size){ showToast('Select some games first'); return; }
  const t=App.current, s=t.settings;
  const selectedIds = new Set(App.selectedGames);
  const bySeries = {};
  const standalone = [];
  selectedIds.forEach(id=>{
    const g=t.games.find(x=>x.id===id); if(!g) return;
    if(g.isPlayoff && g.seriesId && !g.isSubPlayoff){ (bySeries[g.seriesId]=bySeries[g.seriesId]||[]).push(g); }
    else standalone.push(g);
  });
  standalone.forEach(g=>{
    const r=computeRandomScore(g,s);
    g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk;
    g.otPointsHome = r.ot ? r.otPointsHome : 0;
    g.otPointsAway = r.ot ? r.otPointsAway : 0;
  });
  Object.keys(bySeries).forEach(seriesId=>{
    const sObj = t.playoffBracket && t.playoffBracket.series.find(x=>x.id===seriesId);
    if(!sObj || !sObj.teamA || !sObj.teamB) return;
    const existingWinner = seriesWinnerId(sObj);
    if(existingWinner){
      t.games = t.games.filter(g=>g.seriesId!==seriesId);
      sObj.gameIds=[];
      generateSeriesGames(sObj);
    }
    const allSeriesGames = t.games.filter(g=>g.seriesId===seriesId).sort((a,b)=>a.gameNum-b.gameNum);
    for(const g of allSeriesGames){
      if(g.homeScore!=null) continue;
      if(!existingWinner && !selectedIds.has(g.id)) break;
      if(sObj.mode!=='aggregate'){
        const rec=seriesRecord(sObj);
        if(rec.aWins>=sObj.gamesToWin || rec.bWins>=sObj.gamesToWin) break;
      }
      const r=computeRandomScoreForPlayoffGame(g,s,sObj);
      g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk;
      g.otPointsHome = r.ot ? r.otPointsHome : 0;
      g.otPointsAway = r.ot ? r.otPointsAway : 0;
    }
  });
  Object.keys(bySeries).forEach(pruneDecidedSeriesGames);
  scheduleSave(); renderTab();
  showToast('Randomized selected games');
}

/* ================================ RECORDS / STANDINGS CALC ================================ */
function isTiebreakerGamePlayed(aId,bId){
  return App.current.games.find(g=>g.isTiebreakerGame && g.homeScore!=null && ((g.home===aId&&g.away===bId)||(g.home===bId&&g.away===aId)));
}
function tiebreakerGameResult(aId,bId){
  const g=isTiebreakerGamePlayed(aId,bId);
  if(!g) return 0;
  const aScore = g.home===aId?g.homeScore:g.awayScore, bScore=g.home===aId?g.awayScore:g.homeScore;
  if(aScore>bScore) return 1; if(bScore>aScore) return -1; return 0;
}
function isRegularSeasonGame(g){
  if(!g.isPlayoff) return true;
  const s=App.current.settings;
  return !!(g.isSubPlayoff && s.subPlayoffs && s.subPlayoffs.countsAsRegularSeason);
}
function computeRecord(teamId, games){
  const s=App.current.settings.scoring;
  let w=0,l=0,tt=0,otw=0,otl=0,pkw=0,pkl=0,pf=0,pa=0,points=0;
  const results=[];
  games.forEach(g=>{
    if(g.isTiebreakerGame) return;   // tiebreaker games never count toward records
    if(g.homeScore==null||g.awayScore==null) return;
    if(g.home!==teamId && g.away!==teamId) return;
    const isHome=g.home===teamId;
    const my=isHome?g.homeScore:g.awayScore, opp=isHome?g.awayScore:g.homeScore;
    pf+=my; pa+=opp;
    if(my>opp){
      if(g.pk){ pkw++; points+=s.pkWin; results.push('W'); }
      else if(g.ot){ otw++; points+=s.otWin; results.push('W'); }
      else { w++; points+=s.win; results.push('W'); }
    } else if(my<opp){
      if(g.pk){ pkl++; points+=s.pkLoss; results.push('L'); }
      else if(g.ot){ otl++; points+=s.otLoss; results.push('L'); }
      else { l++; points+=s.loss; results.push('L'); }
    } else {
      tt++; points+=s.tie; results.push('T');
    }
  });
  const totalDecided=w+l+tt+otw+otl+pkw+pkl;
  const pct = totalDecided? ((w+otw+pkw) + tt*0.5) / totalDecided : 0;
  return {w:w+otw+pkw, l:l+otl+pkl, t:tt, otw,otl,pkw,pkl, pf, pa, diff:pf-pa, pct, points, results, gp:totalDecided};
}
function formatRecord(rec){
  const fmt = App.current.settings.recordFormat && App.current.settings.recordFormat.length ? App.current.settings.recordFormat : ['w','l','t'];
  const includeOTW = fmt.includes('otw'), includeOTL = fmt.includes('otl');
  const regW = includeOTW ? rec.w - rec.otw - rec.pkw : rec.w;
  const regL = includeOTL ? rec.l - rec.otl - rec.pkl : rec.l;
  const vals = {w:regW, l:regL, t:rec.t, otw:rec.otw+rec.pkw, otl:rec.otl+rec.pkl};
  return fmt.map(k=>vals[k]).join('-');
}
function headToHeadWinPct(teamId, oppIds, games){
  let w=0,tot=0;
  games.forEach(g=>{
    if(g.homeScore==null || g.isTiebreakerGame) return;
    const ids=[g.home,g.away];
    if(!ids.includes(teamId)) return;
    const opp = g.home===teamId?g.away:g.home;
    if(!oppIds.includes(opp)) return;
    tot++;
    const my=g.home===teamId?g.homeScore:g.awayScore, o=g.home===teamId?g.awayScore:g.homeScore;
    if(my>o) w++; else if(my===o) w+=0.5;
  });
  return tot? w/tot : 0.5;
}
/* =====================================================================
   Tiebreaker engine: many criteria, mini-league head-to-head, tiebreaker games
   (which never count toward records), and manual "you pick who moves on".
   ===================================================================== */
function betterSeedTeamId(aId, bId){
  const t=App.current;
  const rows=standingsRows(t.teams, t.games, false);
  const ia=rows.findIndex(r=>r.team.id===aId), ib=rows.findIndex(r=>r.team.id===bId);
  if(ia<0) return bId; if(ib<0) return aId;
  return ia<ib ? aId : bId;
}
function ensureTeamLot(tm){
  if(tm.lot==null) tm.lot=Math.random();
  return tm.lot;
}
/* Builds the per-team stat rows plus a comparator for the configured tiebreaker list.
   cmp(r1,r2) < 0 means r1 ranks ahead. `skip` is an optional Set of criteria to ignore. */
function buildStandingRows(teams, allGames, includePlayoffs, includeCountedSubPlayoffs){
  const t=App.current, s=t.settings, tb=s.tiebreakers;
  const games = includePlayoffs? allGames : allGames.filter(g=> includeCountedSubPlayoffs ? isRegularSeasonGame(g) : !g.isPlayoff);
  const regGames = games.filter(g=>!g.isTiebreakerGame);
  const tbGames = games.filter(g=>g.isTiebreakerGame && g.homeScore!=null && g.awayScore!=null);
  const byTeam = {};
  regGames.forEach(g=>{ (byTeam[g.home]=byTeam[g.home]||[]).push(g); (byTeam[g.away]=byTeam[g.away]||[]).push(g); });
  const rows = teams.map(tm=>({team:tm, ...computeRecord(tm.id, byTeam[tm.id]||[])}));
  const rowOf={}; rows.forEach(r=>{ rowOf[r.team.id]=r; });
  const recOf = id => rowOf[id] || computeRecord(id, byTeam[id]||[]);
  const lazy={};
  const memo=(name,fn)=> (name in lazy) ? lazy[name] : (lazy[name]=fn());
  const sameDiv=(g)=>{ const h=teamById(g.home), a=teamById(g.away); return h&&a&&h.division===a.division; };
  const sameConf=(g)=>{ const h=teamById(g.home), a=teamById(g.away); return h&&a&&h.conference&&h.conference===a.conference; };
  const subsetRecs=(pred)=>{
    const by={};
    regGames.forEach(g=>{ if(!pred(g)) return; (by[g.home]=by[g.home]||[]).push(g); (by[g.away]=by[g.away]||[]).push(g); });
    const out={}; rows.forEach(r=>{ out[r.team.id]=computeRecord(r.team.id, by[r.team.id]||[]); });
    return out;
  };
  const h2hMap = ()=> memo('h2h', ()=>{
    const m={};
    regGames.forEach(g=>{
      if(g.homeScore==null) return;
      const a=g.home,b=g.away;
      m[a]=m[a]||{}; m[b]=m[b]||{};
      m[a][b]=m[a][b]||{w:0,tot:0}; m[b][a]=m[b][a]||{w:0,tot:0};

const TIE_SKIP = new Set(['extraGame','manualPick','lots','alphabetical']);
function computeTieGroups(){
  const t=App.current, s=t.settings;
  const pools = s.relegation.enabled ? s.divisionNames.map(n=>({name:n, teams:t.teams.filter(x=>x.division===n)})) : [{name:'', teams:t.teams}];
  const out=[];
  pools.forEach(pool=>{
    if(pool.teams.length<2) return;
    const B=buildStandingRows(pool.teams, t.games, false);
    const rows=B.rows.filter(r=>r.gp>0);
    rows.sort((a,b)=>B.cmp(a,b,TIE_SKIP) || a.team.name.localeCompare(b.team.name));
    let i=0;
    while(i<rows.length){
      let j=i+1;
      while(j<rows.length && B.cmp(rows[i],rows[j],TIE_SKIP)===0) j++;
      if(j-i>=2){
        const grp=rows.slice(i,j);
        // already settled? every adjacent pair is separated once game results / manual picks are applied
        const probe=grp.slice().sort((a,b)=>B.cmp(a,b,new Set(['lots','alphabetical'])) || a.team.name.localeCompare(b.team.name));
        let resolved=true;
        for(let k=0;k<probe.length-1;k++){ if(B.cmp(probe[k],probe[k+1],new Set(['lots','alphabetical']))===0){ resolved=false; break; } }
        out.push({pool:pool.name, start:i+1, rows:grp, order:probe.map(r=>r.team.id), resolved});
      }
      i=j;
    }
  });
  return out;
}

function teamFadeStyle(teamId, strength){

  const tm=teamById(teamId); if(!tm || !tm.color) return '';
  const a=hexRgba(tm.color, strength||0.5); if(!a) return '';
  return `background-image:linear-gradient(90deg, ${a} 0%, ${hexRgba(tm.color,0.16)} 52%, rgba(0,0,0,0) 88%);box-shadow:inset 4px 0 0 ${tm.color};`;
}
function teamRecordLines(teamId){
  const t=App.current, s=t.settings;
  const tm=teamById(teamId); if(!tm) return '';
  const reg=t.games.filter(isRegularSeasonGame);
  const parts=[`<span>${formatRecord(computeRecord(teamId, reg))}</span>`];
  if(s.useConferences && tm.conference){
    const cg=reg.filter(g=>{ const h=teamById(g.home), a=teamById(g.away); return h&&a&&h.conference===tm.conference&&a.conference===tm.conference; });
    parts.push(`<span>Conf ${formatRecord(computeRecord(teamId, cg))}</span>`);
  }
  if((s.divisionNames||[]).length>1 && tm.division){
    const dg=reg.filter(g=>{ const h=teamById(g.home), a=teamById(g.away); return h&&a&&h.division===tm.division&&a.division===tm.division; });
    parts.push(`<span>Div ${formatRecord(computeRecord(teamId, dg))}</span>`);
  }
  return parts.join('<span class="sb-dot">\u00b7</span>');
}
/* ---------- placement, seeds and the game-night scoreboard card ---------- */
function teamPlacement(teamId){
  const t=App.current, s=t.settings, tm=teamById(teamId);
  if(!tm) return {};
  const rows=cachedLeagueRows(), out={};
  const lg=rows.findIndex(r=>r.team.id===teamId);
  if(lg>=0 && hasPlayedRegularGame()) out.league=lg+1;
  if(hasPlayedRegularGame()){
    if((s.divisionNames||[]).length>1 && tm.division){
      const d=rows.filter(r=>r.team.division===tm.division).findIndex(r=>r.team.id===teamId);
      if(d>=0){ out.div=d+1; out.divName=tm.division; }
    }
    if(s.useConferences && tm.conference){
      const c=rows.filter(r=>r.team.conference===tm.conference).findIndex(r=>r.team.id===teamId);
      if(c>=0){ out.conf=c+1; out.confName=tm.conference; }
    }
  }
  return out;
}
function gameSeeds(g){
  if(!g || !g.isPlayoff || !g.seriesId) return {};
  const {sObj}=findSeriesAnyBracket(g.seriesId);
  if(!sObj) return {};
  const m={};
  if(sObj.teamA && sObj.seedA) m[sObj.teamA]=sObj.seedA;
  if(sObj.teamB && sObj.seedB) m[sObj.teamB]=sObj.seedB;
  return m;
}
function placementText(teamId){
  const p=teamPlacement(teamId), parts=[];
  if(p.div) parts.push(`${ordinal(p.div)} in ${esc(p.divName)}`);
  if(p.conf) parts.push(`${ordinal(p.conf)} in ${esc(p.confName)}`);
  if(!parts.length && p.league) parts.push(`${ordinal(p.league)} overall`);
  return parts.join(' \u00b7 ');
}
function sbTagText(teamId, g){
  const seeds=gameSeeds(g), parts=[];
  if(seeds[teamId]) parts.push('#'+seeds[teamId]+' seed');
  const p=teamPlacement(teamId);
  if(p.div) parts.push(ordinal(p.div)+' '+p.divName);
  if(p.conf) parts.push(ordinal(p.conf)+' '+p.confName);
  if(!parts.length && p.league) parts.push(ordinal(p.league)+' overall');
  return parts.join(' \u00b7 ');
}
function periodScoresFor(g){
  const ps=g.periodScores;
  if(g.homeScore==null || !ps || !ps.away || !ps.home) return null;
  const sa=ps.away.reduce((a,b)=>a+(+b||0),0), sh=ps.home.reduce((a,b)=>a+(+b||0),0);
  const adj=ps.pk?1:0;
  if(Math.abs(sa-g.awayScore)>adj || Math.abs(sh-g.homeScore)>adj) return null;   // scores were edited by hand afterwards
  return ps;
}
function lineScoreCard(g){
  const ps=periodScoresFor(g);
  let labels, away, home;
  if(ps){ labels=ps.labels||ps.away.map((x,i)=>String(i+1)); away=ps.away; home=ps.home; }
  else if(g.homeScore!=null && g.ot && (g.otPointsHome||g.otPointsAway)){
    labels=['Reg','OT']; away=[g.awayScore-(g.otPointsAway||0), g.otPointsAway||0]; home=[g.homeScore-(g.otPointsHome||0), g.otPointsHome||0];
  } else return '';
  const abbr=id=>{ const w=String(teamName(id)).trim().split(/\s+/); return (w.length>1?w.map(x=>x[0]).join('')+w[w.length-1].slice(1):w[0]).slice(0,3).toUpperCase(); };
  const row=(id,arr,total)=>`<tr><td class="ls-t">${teamBadgeHtml(id)}${esc(abbr(id))}</td>${arr.map(v=>`<td>${v}</td>`).join('')}<td class="ls-tot">${total}</td></tr>`;
  return `<div class="ls-wrap"><table class="ls-tbl"><thead><tr><th></th>${labels.map(l=>`<th>${esc(l)}</th>`).join('')}<th>T</th></tr></thead><tbody>${row(g.away,away,g.awayScore)}${row(g.home,home,g.homeScore)}</tbody></table></div>`;
}
function scoreboardHtml(g, ppgAway, ppgHome, awayRecAway, homeRecAtHome){
  const played=g.homeScore!=null, awayWon=played&&g.awayScore>g.homeScore, homeWon=played&&g.homeScore>g.awayScore;
  const seeds=gameSeeds(g);
  const row=(id, side, score, won, extra)=>{
    const place=placementText(id), seed=seeds[id];
    return `<div class="sb-team${won?' won':''}${played&&!won&&g.homeScore!==g.awayScore?' lost':''}" style="${teamFadeStyle(id,0.6)}">
      <div class="sb-lead">${seed?`<span class="sb-seed" title="Playoff seed">${seed}</span>`:''}</div>
      <div class="sb-id">
        <div class="sb-name">${teamBadgeHtml(id)}${esc(teamName(id))} <span class="sb-side">${side}</span></div>
        <div class="sb-rec">${teamRecordLines(id)}</div>
        ${place?`<div class="sb-place">${place}</div>`:''}
        <div class="sb-sub">${extra}</div>
      </div>
      <div class="sb-score">${won?'<span class="sb-arrow">\u25c0</span>':''}${played?score:'\u2013'}</div>
    </div>`;
  };
  return `<div class="scoreboard">
    ${row(g.away,'AWAY',g.awayScore,awayWon,`PPG ${ppgAway} \u00b7 Away ${formatRecord(awayRecAway)}`)}
    ${row(g.home,'HOME',g.homeScore,homeWon,`PPG ${ppgHome} \u00b7 Home ${formatRecord(homeRecAtHome)}`)}
    ${lineScoreCard(g)}
  </div>`;
}

function tbSign(n){ return (n>0?'+':'')+n; }
function tbDecisiveDetail(key,a,b,clusterIds){
  const t=App.current, A=esc(a.team.name), Bn=esc(b.team.name);
  const lab=TIEBREAKER_LABELS[key]||key;
  const games=t.games.filter(g=>!g.isPlayoff && !g.isTiebreakerGame && g.homeScore!=null);
  const vs=(x,y)=>{ let w=0,l=0,tt=0; games.forEach(g=>{ if(!((g.home===x&&g.away===y)||(g.home===y&&g.away===x))) return; const my=g.home===x?g.homeScore:g.awayScore, op=g.home===x?g.awayScore:g.homeScore; if(my>op) w++; else if(my<op) l++; else tt++; }); return {w,l,tt}; };
  const mini=(r)=>{ const set=new Set(clusterIds); return computeRecord(r.team.id, games.filter(g=>set.has(g.home)&&set.has(g.away))); };
  let d='';
  switch(key){
    case 'points': d=`${a.points} vs ${b.points} points`; break;
    case 'pointDiff': d=`${tbSign(a.diff)} vs ${tbSign(b.diff)} differential`; break;
    case 'pointsFor': d=`${a.pf} vs ${b.pf} scored`; break;
    case 'pointsAgainst': d=`${a.pa} vs ${b.pa} allowed`; break;
    case 'winPct': d=`${(a.pct*100).toFixed(1)}% vs ${(b.pct*100).toFixed(1)}%`; break;
    case 'wins': d=`${a.w} vs ${b.w} wins`; break;
    case 'regWins': d=`${a.w-a.otw-a.pkw} vs ${b.w-b.otw-b.pkw} regulation wins`; break;
    case 'row': d=`${a.w-a.pkw} vs ${b.w-b.pkw} regulation/OT wins`; break;
    case 'fewestLosses': d=`${a.l} vs ${b.l} losses`; break;
    case 'headToHead': { const r=vs(a.team.id,b.team.id); d=`${esc(a.team.name)} ${r.w}\u2013${r.l}${r.tt?'\u2013'+r.tt:''} head-to-head`; break; }
    case 'h2hPoints': { const x=mini(a),y=mini(b); d=`${x.points} vs ${y.points} points among the tied teams`; break; }
    case 'h2hDiff': { const x=mini(a),y=mini(b); d=`${tbSign(x.diff)} vs ${tbSign(y.diff)} among the tied teams`; break; }
    case 'h2hFor': { const x=mini(a),y=mini(b); d=`${x.pf} vs ${y.pf} scored among the tied teams`; break; }
    case 'h2hWins': { const x=mini(a),y=mini(b); d=`${x.w} vs ${y.w} wins among the tied teams`; break; }
    case 'extraGame': d='tiebreaker game'; break;
    case 'manualPick': d='picked by you'; break;
    case 'lots': d='drawing of lots'; break;
    case 'skill': d=`${a.team.skillLevel||0} vs ${b.team.skillLevel||0} rating`; break;
    case 'alphabetical': d='alphabetical'; break;
    default: d='';
  }
  return {lab, d};
}
function tiebreakerPoolCard(title, teams){
  const t=App.current, tb=t.settings.tiebreakers;
  if(teams.length<2) return '';
  const B=buildStandingRows(teams, t.games, false);
  const rows=B.rows.slice().sort((x,y)=>B.cmp(x,y) || x.team.name.localeCompare(y.team.name));
  const first=tb[0];
  // clusters = neighbours level on the first criterion
  const clusters=[]; let cur=[rows[0]];
  for(let i=1;i<rows.length;i++){
    const tied = first && Math.abs(B.cmpKey(first, rows[i-1], rows[i], 0))<1e-9 && rows[i].gp>0 && rows[i-1].gp>0;
    if(tied) cur.push(rows[i]); else { clusters.push(cur); cur=[rows[i]]; }
  }
  clusters.push(cur);
  const ties=clusters.filter(c=>c.length>1);
  if(!hasPlayedRegularGame()) return '';
  const body=ties.length ? ties.map(c=>{
    const start=rows.indexOf(c[0])+1, end=start+c.length-1, ids=c.map(r=>r.team.id);
    const steps=[]; let unresolved=false;
    for(let i=0;i<c.length-1;i++){
      const a=c[i], b=c[i+1]; let by=null;
      for(let k=0;k<tb.length;k++){ const d=B.cmpKey(tb[k],a,b,k); if(Math.abs(d)>1e-9){ by=tb[k]; break; } }
      if(!by){ unresolved=true; steps.push(`<div class="tbstep warn"><span class="tbpos">${start+i}</span><span><strong>${esc(a.team.name)}</strong> over ${esc(b.team.name)} \u2014 <em>still level on every criterion</em>, placed alphabetically</span></div>`); }
      else { const info=tbDecisiveDetail(by,a,b,ids); steps.push(`<div class="tbstep"><span class="tbpos">${start+i}</span><span><strong>${esc(a.team.name)}</strong> over ${esc(b.team.name)} \u2014 decided by <span class="tbkey">${esc(info.lab)}</span>${info.d?` <span class="muted">(${info.d})</span>`:''}</span></div>`); }
    }
    const pts=c[0].points;
    return `<div class="tbcluster${unresolved?' open':''}">
      <div class="tbhead"><strong>${c.length} teams level on ${esc(TIEBREAKER_LABELS[first]||first)}</strong> <span class="muted">(${start===end?ordinal(start):ordinal(start)+' to '+ordinal(end)}${first==='points'?', '+pts+' pts':''})</span>${unresolved?'<span class="pill tbwarn">needs a decision</span>':'<span class="pill tbok">settled</span>'}</div>
      <div class="muted" style="font-size:11.5px;margin-bottom:4px;">${c.map(r=>teamBadgeHtml(r.team.id)+esc(r.team.name)).join(' \u00b7 ')}</div>
      ${steps.join('')}
      <div class="tbpos2"><span class="muted">Final order:</span> ${c.map((r,i)=>`${start+i}. ${esc(r.team.name)}${tiebreakMark(r.team.id)}`).join('  \u2192  ')}</div>
    </div>`;
  }).join('') : '<div class="muted">No ties right now \u2014 every team is separated by '+esc(TIEBREAKER_LABELS[first]||first)+'.</div>';
  return `<div class="card"><h4>${esc(title)}</h4>${body}</div>`;
}
