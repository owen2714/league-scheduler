function computeHomeWinPct(s, homeId, awayId){
  const base = s.randomize.homeWinPct;
  if(!s.randomize.useSkillLevels) return base;
  const th = teamById(homeId), ta = teamById(awayId);
  const skillH = (th && th.skillLevel!=null) ? th.skillLevel : 500;
  const skillA = (ta && ta.skillLevel!=null) ? ta.skillLevel : 500;
  const diff = skillH - skillA;
  const logisticPct = 100/(1+Math.pow(10, -diff/400));
  // Skill influence (1-100): how much the skill gap actually moves the win probability
  // away from a coin flip. 1 = games are decided almost entirely by chance regardless of
  // skill; 100 = the full skill-implied probability applies, same as before this setting
  // existed. Blending happens around 50 (a coin flip), then home-field advantage is
  // layered on top exactly as it was.
  const influence = clamp((s.randomize.skillInfluence!=null ? s.randomize.skillInfluence : 50)/100, 0.01, 1);
  const blended = 50 + (logisticPct-50)*influence;
  return clamp(base + (blended-50), 1, 99);
}
function skillAwareScorePair(s, homeId, awayId, homeWins){
  const th=teamById(homeId), ta=teamById(awayId);
  const skillH=(th&&th.skillLevel!=null)?th.skillLevel:500, skillA=(ta&&ta.skillLevel!=null)?ta.skillLevel:500;
  const gap = clamp(Math.abs(skillH-skillA)/999, 0, 1);
  const range = Math.max(1, s.randomize.scoreMax - s.randomize.scoreMin);
  const strength = (s.randomize.skillBlowoutStrength!=null? s.randomize.skillBlowoutStrength : 70)/100;
  const shapedGap = Math.pow(gap, 1.3);
  const s1=randomScoreValue(s), s2=randomScoreValue(s);
  let winnerScore=Math.max(s1,s2), loserScore=Math.min(s1,s2);
  const extraBoost = Math.round(range * shapedGap * strength * Math.random());
  if(extraBoost>0){
    winnerScore = clamp(winnerScore + Math.round(extraBoost*0.4), s.randomize.scoreMin, s.randomize.scoreMax);
    loserScore = clamp(loserScore - Math.round(extraBoost*0.6), s.randomize.scoreMin, winnerScore);
  }
  return homeWins ? {h:winnerScore, a:loserScore} : {h:loserScore, a:winnerScore};
}
function pickWeighted(weightsObj){
  const entries = Object.entries(weightsObj);
  if(!entries.length) return null;
  const total = entries.reduce((sum,[,w])=>sum+(+w||0),0);
  if(total<=0) return null;
  let r = Math.random()*total;
  for(const [v,w] of entries){
    r -= (+w||0);
    if(r<=0) return +v;
  }
  return +entries[entries.length-1][0];
}
function randomScoreValue(s){
  const r=s.randomize;
  let attempts=0, val;
  do{
    if(r.weighted && Object.keys(r.weights).length){
      val = pickWeighted(r.weights);
      if(val==null) val = Math.floor(Math.random()*(r.scoreMax-r.scoreMin+1))+r.scoreMin;
    } else {
      val = Math.floor(Math.random()*(r.scoreMax-r.scoreMin+1))+r.scoreMin;
    }
    attempts++;
  } while(r.disallowedScores.includes(val) && attempts<50);
  return val;
}
function randomOTValue(s){
  const r=s.randomize;
  if(r.otWeighted && Object.keys(r.otWeights).length){
    const v = pickWeighted(r.otWeights);
    if(v!=null) return v;
  }
  const min=r.otMin||0, max=Math.max(min,r.otMax||1);
  return Math.floor(Math.random()*(max-min+1))+min;
}
function computeRandomScore(g, s){
  const p=s.playoffs;
  const otAllowed = g.isPlayoff? p.otEnabledPlayoffs : p.otEnabledRegular;
  const pkAllowed = g.isPlayoff? p.shootoutEnabledPlayoffs : p.shootoutEnabledRegular;
  const allowTies = g.isPlayoff ? false : s.allowTiesRegular;
  const homeWins = Math.random()*100 < computeHomeWinPct(s, g.home, g.away);
  let h,a;
  if(s.randomize.useSkillLevels){ const pair=skillAwareScorePair(s, g.home, g.away, homeWins); h=pair.h; a=pair.a; }
  else { h=randomScoreValue(s); a=randomScoreValue(s); }
  let ot=false, pk=false, otPointsHome=0, otPointsAway=0;
  if(h===a){
    if(allowTies && otAllowed){
      ot=true;
      otPointsHome=randomOTValue(s);
      otPointsAway=randomOTValue(s);
      h+=otPointsHome; a+=otPointsAway;
    } else if(allowTies){
    } else if(otAllowed){
      ot=true;
      if(s.randomize.otSuddenDeath){
        const pts=randomOTValue(s)||1;
        if(homeWins){ otPointsHome=pts; } else { otPointsAway=pts; }
      } else {
        otPointsHome=randomOTValue(s);
        otPointsAway=randomOTValue(s);
      }
      h+=otPointsHome; a+=otPointsAway;
      if(h===a){
        if(pkAllowed){ pk=true; }
        if(homeWins){ h+=1; otPointsHome+=1; } else { a+=1; otPointsAway+=1; }
      }
    } else {
      if(homeWins) h+=1; else a+=1;
    }
  } else if(!allowTies){
    if(homeWins && h<a){ [h,a]=[a,h]; }
    else if(!homeWins && a<h){ [h,a]=[a,h]; }
  }
  return {h,a,ot,pk,otPointsHome,otPointsAway};
}
function isLastSeriesGame(g, sObj){
  const total = sObj.mode==='aggregate' ? Math.max(1, sObj.numGames||2) : sObj.gamesToWin*2-1;
  return (g.gameNum||1) >= total;
}
function seriesAggregateExcluding(sObj, excludeGameId){
  const t=App.current;
  let aPts=0,bPts=0;
  t.games.forEach(g=>{
    if(g.seriesId!==sObj.id || g.id===excludeGameId || g.homeScore==null) return;
    const aIsHome=g.home===sObj.teamA;
    aPts += aIsHome?g.homeScore:g.awayScore;
    bPts += aIsHome?g.awayScore:g.homeScore;
  });
  return {aPts,bPts};
}
function computeRandomScoreForPlayoffGame(g, s, sObj){
  if(!sObj || sObj.mode!=='aggregate') return computeRandomScore(g, s);
  const p=s.playoffs;
  const otAllowed = p.otEnabledPlayoffs;
  const pkAllowed = p.shootoutEnabledPlayoffs;
  let h,a;
  if(s.randomize.useSkillLevels){
    const preHomeWins = Math.random()*100 < computeHomeWinPct(s, g.home, g.away);
    const pair=skillAwareScorePair(s, g.home, g.away, preHomeWins); h=pair.h; a=pair.a;
  } else { h=randomScoreValue(s); a=randomScoreValue(s); }
  let ot=false, pk=false, otPointsHome=0, otPointsAway=0;
  if(isLastSeriesGame(g, sObj)){
    const prior = seriesAggregateExcluding(sObj, g.id);
    const aIsHome = g.home===sObj.teamA;
    let aggA = prior.aPts + (aIsHome?h:a), aggB = prior.bPts + (aIsHome?a:h);
    if(aggA===aggB){
      const homeWins = Math.random()*100 < computeHomeWinPct(s, g.home, g.away);
      if(otAllowed){
        ot=true;
        if(s.randomize.otSuddenDeath){
          const pts=randomOTValue(s)||1;
          if(homeWins){ otPointsHome=pts; } else { otPointsAway=pts; }
        } else {
          otPointsHome=randomOTValue(s); otPointsAway=randomOTValue(s);
        }
        h+=otPointsHome; a+=otPointsAway;
        aggA = prior.aPts + (aIsHome?h:a); aggB = prior.bPts + (aIsHome?a:h);
        if(aggA===aggB){
          if(pkAllowed) pk=true;
          if(homeWins){ h+=1; otPointsHome+=1; } else { a+=1; otPointsAway+=1; }
        }
      } else {
        if(homeWins) h+=1; else a+=1;
      }
    }
  }
  return {h,a,ot,pk,otPointsHome,otPointsAway};
}
function randomizeOneGame(gameId){
  const t=App.current, g=t.games.find(x=>x.id===gameId), s=t.settings;
  let sObj=null;
  if(g.isPlayoff && g.seriesId){ const found=findSeriesAnyBracket(g.seriesId); sObj=found.sObj; }

  const otHomeInput=document.getElementById('gmOTHome'); if(otHomeInput) otHomeInput.value=r.otPointsHome||'';
  const otAwayInput=document.getElementById('gmOTAway'); if(otAwayInput) otAwayInput.value=r.otPointsAway||'';
}
function randomizeSelected(){
  if(!App.selectedGames.size){ showToast('Select some games first'); return; }
  const t=App.current, s=t.settings;
  const selectedIds = new Set(App.selectedGames);
  const bySeries = {};
  const standalone = [];
  selectedIds.forEach(id=>{
    const g=t.games.find(x=>x.id===id); if(!g) return;
    if(g.isPlayoff && g.seriesId && !g.isSubPlayoff){ (bySeries[g.seriesId]=bySeries[g.seriesId]||[]).push(g); }
    else standalone.push(g);
  });
  standalone.forEach(g=>{
    const r=computeRandomScore(g,s);
    g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk;
    g.otPointsHome = r.ot ? r.otPointsHome : 0;
    g.otPointsAway = r.ot ? r.otPointsAway : 0;
  });
  Object.keys(bySeries).forEach(seriesId=>{
    const sObj = t.playoffBracket && t.playoffBracket.series.find(x=>x.id===seriesId);
    if(!sObj || !sObj.teamA || !sObj.teamB) return;
    const existingWinner = seriesWinnerId(sObj);
    if(existingWinner){
      t.games = t.games.filter(g=>g.seriesId!==seriesId);
      sObj.gameIds=[];
      generateSeriesGames(sObj);
    }
    const allSeriesGames = t.games.filter(g=>g.seriesId===seriesId).sort((a,b)=>a.gameNum-b.gameNum);
    for(const g of allSeriesGames){
      if(g.homeScore!=null) continue;
      if(!existingWinner && !selectedIds.has(g.id)) break;
      if(sObj.mode!=='aggregate'){
        const rec=seriesRecord(sObj);
        if(rec.aWins>=sObj.gamesToWin || rec.bWins>=sObj.gamesToWin) break;
      }
      const r=computeRandomScoreForPlayoffGame(g,s,sObj);
      g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk;
      g.otPointsHome = r.ot ? r.otPointsHome : 0;
      g.otPointsAway = r.ot ? r.otPointsAway : 0;
    }
  });
  Object.keys(bySeries).forEach(pruneDecidedSeriesGames);
  scheduleSave(); renderTab();
  showToast('Randomized selected games');
}

/* ================================ RECORDS / STANDINGS CALC ================================ */
function isTiebreakerGamePlayed(aId,bId){
  return App.current.games.find(g=>g.isTiebreakerGame && g.homeScore!=null && ((g.home===aId&&g.away===bId)||(g.home===bId&&g.away===aId)));
}
function tiebreakerGameResult(aId,bId){
  const g=isTiebreakerGamePlayed(aId,bId);
  if(!g) return 0;
  const aScore = g.home===aId?g.homeScore:g.awayScore, bScore=g.home===aId?g.awayScore:g.homeScore;
  if(aScore>bScore) return 1; if(bScore>aScore) return -1; return 0;
}
function isRegularSeasonGame(g){
  if(!g.isPlayoff) return true;
  const s=App.current.settings;
  return !!(g.isSubPlayoff && s.subPlayoffs && s.subPlayoffs.countsAsRegularSeason);
}
function computeRecord(teamId, games){
  const s=App.current.settings.scoring;
  let w=0,l=0,tt=0,otw=0,otl=0,pkw=0,pkl=0,pf=0,pa=0,points=0;
  const results=[];
  games.forEach(g=>{
    if(g.homeScore==null||g.awayScore==null) return;
    if(g.home!==teamId && g.away!==teamId) return;
    const isHome=g.home===teamId;
    const my=isHome?g.homeScore:g.awayScore, opp=isHome?g.awayScore:g.homeScore;
    pf+=my; pa+=opp;
    if(my>opp){
      if(g.pk){ pkw++; points+=s.pkWin; results.push('W'); }
      else if(g.ot){ otw++; points+=s.otWin; results.push('W'); }
      else { w++; points+=s.win; results.push('W'); }
    } else if(my<opp){
      if(g.pk){ pkl++; points+=s.pkLoss; results.push('L'); }
      else if(g.ot){ otl++; points+=s.otLoss; results.push('L'); }
      else { l++; points+=s.loss; results.push('L'); }
    } else {
      tt++; points+=s.tie; results.push('T');
    }
  });
  const totalDecided=w+l+tt+otw+otl+pkw+pkl;
  const pct = totalDecided? ((w+otw+pkw) + tt*0.5) / totalDecided : 0;
  return {w:w+otw+pkw, l:l+otl+pkl, t:tt, otw,otl,pkw,pkl, pf, pa, diff:pf-pa, pct, points, results, gp:totalDecided};
}
function formatRecord(rec){
  const fmt = App.current.settings.recordFormat && App.current.settings.recordFormat.length ? App.current.settings.recordFormat : ['w','l','t'];
  const includeOTW = fmt.includes('otw'), includeOTL = fmt.includes('otl');
  const regW = includeOTW ? rec.w - rec.otw - rec.pkw : rec.w;
  const regL = includeOTL ? rec.l - rec.otl - rec.pkl : rec.l;
  const vals = {w:regW, l:regL, t:rec.t, otw:rec.otw+rec.pkw, otl:rec.otl+rec.pkl};
  return fmt.map(k=>vals[k]).join('-');
}
function headToHeadWinPct(teamId, oppIds, games){
  let w=0,tot=0;
  games.forEach(g=>{
    if(g.homeScore==null) return;
    const ids=[g.home,g.away];
    if(!ids.includes(teamId)) return;
    const opp = g.home===teamId?g.away:g.home;
    if(!oppIds.includes(opp)) return;
    tot++;
    const my=g.home===teamId?g.homeScore:g.awayScore, o=g.home===teamId?g.awayScore:g.homeScore;
    if(my>o) w++; else if(my===o) w+=0.5;
  });
  return tot? w/tot : 0.5;
}
function betterSeedTeamId(aId, bId){
  const t=App.current, s=t.settings;
  const games = t.games.filter(g=>!g.isPlayoff);
  const tb = s.tiebreakers;
  const recA = computeRecord(aId, games), recB = computeRecord(bId, games);
  for(const key of tb){
    let d=0;
    if(key==='points') d = recA.points - recB.points;
    else if(key==='pointDiff') d = recA.diff - recB.diff;
    else if(key==='pointsFor') d = recA.pf - recB.pf;
    else if(key==='pointsAgainst') d = recB.pa - recA.pa;
    else if(key==='winPct') d = recA.pct - recB.pct;
    else if(key==='wins') d = recA.w - recB.w;
    else if(key==='strengthOfSchedule'){
      const sosA = avgOppWinPct(games.filter(g=>g.home===aId||g.away===aId).map(g=>g.home===aId?g.away:g.home));
      const sosB = avgOppWinPct(games.filter(g=>g.home===bId||g.away===bId).map(g=>g.home===bId?g.away:g.home));
      d = sosA - sosB;
    }
    else if(key==='divisionRecord'){
      const divGames = games.filter(g=>{
        const h=t.teams.find(x=>x.id===g.home), a=t.teams.find(x=>x.id===g.away);
        return h&&a&&h.division===a.division;
      });
      d = computeRecord(aId,divGames).pct - computeRecord(bId,divGames).pct;
    } else if(key==='conferenceRecord' && s.useConferences){
      const confGames = games.filter(g=>{
        const h=t.teams.find(x=>x.id===g.home), a=t.teams.find(x=>x.id===g.away);
        return h&&a&&h.conference&&h.conference===a.conference;
      });
      d = computeRecord(aId,confGames).pct - computeRecord(bId,confGames).pct;
    } else if(key==='headToHead'){
      d = headToHeadWinPct(aId,[bId],games) - headToHeadWinPct(bId,[aId],games);
    } else if(key==='extraGame'){
      d = tiebreakerGameResult(aId,bId);
    }
    if(Math.abs(d)>1e-9) return d>0 ? aId : bId;
  }
  const ta=t.teams.find(x=>x.id===aId), tb2=t.teams.find(x=>x.id===bId);
  return (ta && tb2 && ta.name.localeCompare(tb2.name)<0) ? aId : bId;
}
function standingsRows(teams, allGames, includePlayoffs, includeCountedSubPlayoffs){
  const games = includePlayoffs? allGames : allGames.filter(g=> includeCountedSubPlayoffs ? isRegularSeasonGame(g) : !g.isPlayoff);
  // Pre-bucket games per team ONCE (O(games)) instead of every team's computeRecord call
  // re-scanning the whole games array (O(teams*games)). This is the single biggest cost in
  // this function, and it's called repeatedly inside Monte Carlo simulation loops and every
  // time a game/standings screen opens, so keeping it fast here matters a lot.
  const gamesByTeam = {};
  games.forEach(g=>{
    (gamesByTeam[g.home]=gamesByTeam[g.home]||[]).push(g);
    (gamesByTeam[g.away]=gamesByTeam[g.away]||[]).push(g);
  });
  const rows = teams.map(tm=>({team:tm, ...computeRecord(tm.id, gamesByTeam[tm.id]||[])}));
  const tb = App.current.settings.tiebreakers;

  let divPct=null;
  if(tb.includes('divisionRecord')){
    divPct={};
    const divGamesByTeam={};
    games.forEach(g=>{
      const h=teamById(g.home), a=teamById(g.away);
      if(h&&a&&h.division===a.division){
        (divGamesByTeam[g.home]=divGamesByTeam[g.home]||[]).push(g);
        (divGamesByTeam[g.away]=divGamesByTeam[g.away]||[]).push(g);
      }
    });
    rows.forEach(r=>{ divPct[r.team.id]=computeRecord(r.team.id, divGamesByTeam[r.team.id]||[]).pct; });
  }
  let confPct=null;
  if(tb.includes('conferenceRecord') && App.current.settings.useConferences){
    confPct={};
    const confGamesByTeam={};
    games.forEach(g=>{
      const h=teamById(g.home), a=teamById(g.away);
      if(h&&a&&h.conference&&h.conference===a.conference){
        (confGamesByTeam[g.home]=confGamesByTeam[g.home]||[]).push(g);
        (confGamesByTeam[g.away]=confGamesByTeam[g.away]||[]).push(g);
      }
    });
    rows.forEach(r=>{ confPct[r.team.id]=computeRecord(r.team.id, confGamesByTeam[r.team.id]||[]).pct; });
  }
  let h2h=null;
  if(tb.includes('headToHead')){
    h2h={};
    games.forEach(g=>{
      if(g.homeScore==null) return;
      const a=g.home,b=g.away;
      h2h[a]=h2h[a]||{}; h2h[b]=h2h[b]||{};
      h2h[a][b]=h2h[a][b]||{w:0,tot:0}; h2h[b][a]=h2h[b][a]||{w:0,tot:0};
      h2h[a][b].tot++; h2h[b][a].tot++;
      if(g.homeScore>g.awayScore) h2h[a][b].w++;
      else if(g.awayScore>g.homeScore) h2h[b][a].w++;
      else { h2h[a][b].w+=0.5; h2h[b][a].w+=0.5; }
    });
  }
  const h2hPct = (a,b) => (h2h && h2h[a] && h2h[a][b] && h2h[a][b].tot) ? h2h[a][b].w/h2h[a][b].tot : 0.5;

  let sosMap=null;
  if(tb.includes('strengthOfSchedule')){
    sosMap={};
    // Opponents' records also come straight out of the same gamesByTeam index, so this
    // whole block is O(games) instead of O(teams * games) it used to be.
    rows.forEach(r=>{
      const oppIds = (gamesByTeam[r.team.id]||[]).map(g=>g.home===r.team.id?g.away:g.home);
      if(!oppIds.length){ sosMap[r.team.id]=0; return; }
      const pcts = oppIds.map(id=>computeRecord(id, gamesByTeam[id]||[]).pct);
      sosMap[r.team.id] = pcts.reduce((a,b)=>a+b,0)/pcts.length;
    });
  }

  rows.sort((r1,r2)=>{
    for(const key of tb){
      let d=0;
      if(key==='points') d=r2.points-r1.points;
      else if(key==='pointDiff') d=r2.diff-r1.diff;
      else if(key==='pointsFor') d=r2.pf-r1.pf;
      else if(key==='pointsAgainst') d=r1.pa-r2.pa;
      else if(key==='winPct') d=r2.pct-r1.pct;
      else if(key==='wins') d=r2.w-r1.w;
      else if(key==='strengthOfSchedule') d=(sosMap[r2.team.id]||0)-(sosMap[r1.team.id]||0);
      else if(key==='divisionRecord') d = (divPct[r2.team.id]||0) - (divPct[r1.team.id]||0);
      else if(key==='conferenceRecord') d = (confPct?(confPct[r2.team.id]||0):0) - (confPct?(confPct[r1.team.id]||0):0);
      else if(key==='headToHead') d = h2hPct(r2.team.id,r1.team.id) - h2hPct(r1.team.id,r2.team.id);
      else if(key==='extraGame') d = -tiebreakerGameResult(r1.team.id, r2.team.id);
      if(Math.abs(d)>1e-9) return d;
    }
    // Inside a Monte Carlo batch, break a genuine tie randomly (fresh coin flip per sim)
    // rather than always favoring the same team alphabetically \u2014 otherwise, whenever a
    // scenario is symmetric enough to produce exact ties (e.g. no skill weighting on),
    // one team would win that tiebreak in literally every simulated run, skewing its
    // odds up and everyone else's down for no real reason. Real, single-shot standings
    // display still breaks ties alphabetically for a stable, predictable table.
    return App._simTiebreakMode ? (Math.random()-0.5) : r1.team.name.localeCompare(r2.team.name);
  });
  return rows;
}

function computeClinchElimForPoolRows(teamId, rows, spotCount, remCount){
  const s=App.current.settings;
  if(spotCount<=0 || !rows.length) return {eliminated:true, clinched:false};
  const me = rows.find(r=>r.team.id===teamId);
  if(!me) return {eliminated:false, clinched:false};
  if(rows.length<=spotCount) return {eliminated:false, clinched:true};

  const anyRemaining = rows.some(r=>(remCount[r.team.id]||0)>0);
  if(!anyRemaining){
    const idx = rows.findIndex(r=>r.team.id===teamId);
    return { eliminated: idx>=spotCount, clinched: idx<spotCount };
  }

  const maxPtsPerWin = Math.max(s.scoring.win,s.scoring.otWin,s.scoring.pkWin);
  const myMax = me.points + (remCount[teamId]||0)*maxPtsPerWin;
  const myMin = me.points;
  const others = rows.filter(r=>r.team.id!==teamId);
  const aheadOfMe = others.filter(r=>r.points > myMax).length;
  const eliminated = aheadOfMe >= spotCount;
  const couldPassMe = others.filter(r => (r.points + (remCount[r.team.id]||0)*maxPtsPerWin) >= myMin).length;
  const clinched = couldPassMe < spotCount;
  return {eliminated, clinched};
}
function computeRemainingCountMap(gamesOverride){
  const t=App.current;
  const allGames = gamesOverride || t.games;
  const remaining = allGames.filter(g=>!g.isPlayoff && g.homeScore==null);
  const remCount={}; t.teams.forEach(tm=>remCount[tm.id]=0);
  remaining.forEach(g=>{ if(remCount[g.home]!=null) remCount[g.home]++; if(remCount[g.away]!=null) remCount[g.away]++; });
  return remCount;
}
function computeClinchElimMap(gamesOverride){
  const t=App.current, s=t.settings, p=s.playoffs;
  const allGames = gamesOverride || t.games;
  const map={};
  const none=()=>({clinched:false,eliminated:false});
  if(!p.enabled){ t.teams.forEach(tm=>map[tm.id]=none()); return map; }
  const remCount = computeRemainingCountMap(allGames);
  const rowsFor = (pool)=> standingsRows(pool, allGames, false);
  if(p.basis==='league'){
    const rows = rowsFor(t.teams);
    t.teams.forEach(tm=>{ map[tm.id]=computeClinchElimForPoolRows(tm.id, rows, p.teamsCount, remCount); });
    return map;
  }
  const keyFn = p.basis==='division' ? (x=>x.division) : (x=>x.conference);
  const groupNames = p.basis==='division'? s.divisionNames : s.conferenceNames;
  const wc = p.wildcardCount||0, per = p.perGroupCount||0;
  const groupRows={};
  groupNames.forEach(n=>{ groupRows[n]=rowsFor(t.teams.filter(x=>keyFn(x)===n)); });
  let mode='group';   // same rules computeMadeSet uses to decide who gets in
  if(p.wildcardScope==='league') mode='league';
  else if(p.wildcardScope==='conference' && p.basis==='division' && s.useConferences) mode='conference';

  if(mode==='group' || wc===0){
    groupNames.forEach(n=>{
      const rows=groupRows[n];
      rows.forEach(r=>{ map[r.team.id]=computeClinchElimForPoolRows(r.team.id, rows, per+wc, remCount); });
    });
  } else {
    /* Wildcards are shared across a bigger pool (a conference or the whole league).
       Only guarantees are used, so a letter never appears early:
       - IN  : the team is certain to finish in its group's automatic spots, OR fewer than
               (auto spots + wildcard spots) teams in the pool can still finish ahead of it.
       - OUT : the team can no longer win an automatic spot AND at least (every auto spot in the
               pool + the wildcard spots) teams are already certain to finish ahead of it. */
    const pools = mode==='league'
      ? [{teams:t.teams, groups:groupNames}]
      : s.conferenceNames.map(conf=>({
          teams:t.teams.filter(x=>x.conference===conf),
          groups:s.divisionNames.filter(d=>(s.divisionConference||{})[d]===conf)
        }));
    pools.forEach(pl=>{
      const poolRows = rowsFor(pl.teams);
      const autoTotal = per * pl.groups.length;
      pl.groups.forEach(gn=>{
        const rows=groupRows[gn];
        rows.forEach(r=>{
          const id=r.team.id;
          const autoInfo = computeClinchElimForPoolRows(id, rows, per, remCount);
          const poolIn  = computeClinchElimForPoolRows(id, poolRows, per+wc, remCount);
          const poolOut = computeClinchElimForPoolRows(id, poolRows, autoTotal+wc, remCount);
          map[id]={ clinched: autoInfo.clinched || poolIn.clinched, eliminated: autoInfo.eliminated && poolOut.eliminated };
        });
      });
    });
  }
  t.teams.forEach(tm=>{ if(!map[tm.id]) map[tm.id]=none(); });
  return map;
}
function computeTitleClinchMap(scope){
  const t=App.current, s=t.settings;
  const map={};
  const remCount = computeRemainingCountMap();
  const maxPtsPerWin = Math.max(s.scoring.win,s.scoring.otWin,s.scoring.pkWin);
  let groups;
  if(scope==='league') groups=[t.teams];
  else if(scope==='conference') groups = s.conferenceNames.map(c=>t.teams.filter(x=>x.conference===c));
  else groups = s.divisionNames.map(d=>t.teams.filter(x=>x.division===d));
  groups.forEach(pool=>{
    if(!pool.length) return;
    if(pool.length===1){ map[pool[0].id]=true; return; }
    const rows = standingsRows(pool, t.games, false);
    const leader = rows[0];
    const anyRemaining = rows.some(r=>(remCount[r.team.id]||0)>0);
    if(!anyRemaining){ map[leader.team.id]=true; return; }
    const myMin = leader.points;
    const others = rows.filter(r=>r.team.id!==leader.team.id);
    map[leader.team.id] = others.every(r => (r.points + (remCount[r.team.id]||0)*maxPtsPerWin) < myMin);
  });
  return map;
}
function computeStandingsSimMaps(){
  const t=App.current, s=t.settings;
  const sims = adaptiveSims(350);
  const madeCount={}, divWinCount={}, confWinCount={}, leagueWinCount={}, byeCount={};
  t.teams.forEach(tm=>{ madeCount[tm.id]=0; divWinCount[tm.id]=0; confWinCount[tm.id]=0; leagueWinCount[tm.id]=0; byeCount[tm.id]=0; });
  App._simTiebreakMode=true;
  for(let i=0;i<sims;i++){
    const simGames = simClone(t.games);
    simGames.forEach(g=>{
      if(g.homeScore!=null) return;
      const r = computeRandomScore(g, s);
      g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk;
    });
    const leagueRows = standingsRows(t.teams, simGames, false);
    if(s.playoffs.enabled){
      const madeSet = computeMadeSet(leagueRows, simGames);
      madeSet.forEach(id=>{ if(madeCount[id]!=null) madeCount[id]++; });
      computeByeRecipients(madeSet, simGames).forEach(id=>{ if(byeCount[id]!=null) byeCount[id]++; });
    }
    s.divisionNames.forEach(d=>{
      const divRows = standingsRows(t.teams.filter(x=>x.division===d), simGames, false);
      if(divRows[0]) divWinCount[divRows[0].team.id]++;
    });
    if(s.useConferences){
      s.conferenceNames.forEach(c=>{
        const confRows = standingsRows(t.teams.filter(x=>x.conference===c), simGames, false);
        if(confRows[0]) confWinCount[confRows[0].team.id]++;
      });
    }
    if(leagueRows[0]) leagueWinCount[leagueRows[0].team.id]++;
  }
  App._simTiebreakMode=false;
  return {sims, madeCount, divWinCount, confWinCount, leagueWinCount, byeCount};
}
/* Clinch letters are purely mathematical now: a letter only shows once a spot is guaranteed
   no matter how every remaining game goes. No simulation is involved, so this is also fast. */
function computeByeClinchMaps(){
  const t=App.current, s=t.settings, p=s.playoffs;
  const res={clinched:{}, out:{}, analytic:false};
  if(!p.enabled){ t.teams.forEach(tm=>{ res.out[tm.id]=true; }); res.analytic=true; return res; }
  const leagueWide = p.basis==='league' && !(s.useConferences && p.mergeBracket) && p.seedingBy!=='division' && p.seedingBy!=='conference';
  if(leagueWide){
    res.analytic=true;
    const n=Math.min(p.teamsCount||0, t.teams.length);
    let size=1; while(size<n) size*=2;
    const numByes = n>0 ? size-n : 0;
    if(numByes<=0){ t.teams.forEach(tm=>{ res.out[tm.id]=true; }); return res; }
    const rows=standingsRows(t.teams, t.games, false);
    const rem=computeRemainingCountMap();
    t.teams.forEach(tm=>{
      const info=computeClinchElimForPoolRows(tm.id, rows, numByes, rem);
      if(info.clinched) res.clinched[tm.id]=true;
      if(info.eliminated) res.out[tm.id]=true;
    });
    return res;
  }
  // Bracket layouts where the number of byes depends on who qualifies: only settle it once the regular season is over.
  const regGames=t.games.filter(g=>!g.isPlayoff);
  if(regGames.length && regGames.every(g=>g.homeScore!=null)){
    const leagueRows=standingsRows(t.teams, t.games, false);
    const madeSet=computeMadeSet(leagueRows, regGames);
    const rec=computeByeRecipients(madeSet, regGames);
    t.teams.forEach(tm=>{ if(rec.includes(tm.id)) res.clinched[tm.id]=true; else res.out[tm.id]=true; });
  }
  return res;
}
function ensureStandingsCache(){
  const t=App.current, s=t.settings;
  if(!App.standingsCache || App.standingsCache.version!==App.dataVersion){
    const clinchMap={}, titleLeagueMap={}, titleConfMap = s.useConferences?{}:null, titleDivMap={}, byeMap={}, byeOutMap={};
    let byeAnalytic=true;
    if(!hasPlayedRegularGame()){
      // Nothing has been played yet, so nothing can be clinched.
      t.teams.forEach(tm=>{ clinchMap[tm.id]={clinched:false,eliminated:false}; });
    } else {
      const a = computeClinchElimMap();
      const tl = computeTitleClinchMap('league');
      const tc = s.useConferences ? computeTitleClinchMap('conference') : null;
      const td = computeTitleClinchMap('division');
      const bm = computeByeClinchMaps();
      byeAnalytic = bm.analytic;
      const divSize={}, confSize={};
      t.teams.forEach(tm=>{ divSize[tm.division]=(divSize[tm.division]||0)+1; if(tm.conference) confSize[tm.conference]=(confSize[tm.conference]||0)+1; });
      t.teams.forEach(tm=>{
        clinchMap[tm.id] = a[tm.id] || {clinched:false,eliminated:false};
        // A title in a group of one team isn't worth a letter.
        titleLeagueMap[tm.id] = t.teams.length>1 && !!tl[tm.id];
        if(titleConfMap) titleConfMap[tm.id] = (confSize[tm.conference]||0)>1 && !!(tc && tc[tm.id]);
        titleDivMap[tm.id] = (divSize[tm.division]||0)>1 && !!td[tm.id];
        byeMap[tm.id] = !!bm.clinched[tm.id];
        byeOutMap[tm.id] = !!bm.out[tm.id];
      });
    }
    App.standingsCache = { version: App.dataVersion, clinchMap, titleLeagueMap, titleConfMap, titleDivMap, byeMap, byeOutMap, byeAnalytic };
  }
  return App.standingsCache;
}
/* Purely analytical "can this team still possibly win scope X's title" check, mirroring
   computeClinchElimForPoolRows' worst-case guarantee but for the single top spot instead
   of a playoff cutoff. Cached per scope per dataVersion so callers (like the "games that
   don't matter" scanner below, which checks this for both teams of every unplayed game)
   don't recompute it over and over. */
function ensureTitleSettledCache(){
  const t=App.current, s=t.settings;
  if(!App.titleSettledCache || App.titleSettledCache.version!==App.dataVersion){
    const remCount = computeRemainingCountMap();
    function buildFor(scope, groups){
      const clinchMap = computeTitleClinchMap(scope);
      const elimMap = {};
      groups.forEach(pool=>{
        if(!pool.length) return;
        const rows = standingsRows(pool, t.games, false);
        pool.forEach(tm=>{ elimMap[tm.id] = computeClinchElimForPoolRows(tm.id, rows, 1, remCount).eliminated; });
      });
      return {clinchMap, elimMap};
    }
    const league = buildFor('league', [t.teams]);
    const conference = s.useConferences ? buildFor('conference', s.conferenceNames.map(c=>t.teams.filter(x=>x.conference===c))) : null;
    const division = buildFor('division', s.divisionNames.map(d=>t.teams.filter(x=>x.division===d)));
    App.titleSettledCache = {version:App.dataVersion, league, conference, division};
  }
  return App.titleSettledCache;
}
function isTitleSettled(teamId, scope){
  const cache = ensureTitleSettledCache();
  const entry = scope==='league'?cache.league : scope==='conference'?cache.conference : cache.division;
  if(!entry) return true;
  return !!entry.clinchMap[teamId] || !!entry.elimMap[teamId];
}
/* A team has "nothing at stake" only when its playoff qualification (if playoffs are on)
   AND every title it could chase (league / conference / division) are ALL already
   mathematically settled \u2014 either locked in for certain or truly impossible \u2014 so no
   single remaining result, including this one, could change any of it. Purely analytical
   throughout; nothing here is inferred from a Monte Carlo sample. */
function hasNothingAtStake(teamId){
  const s=App.current.settings;
  if(s.relegation.enabled) return false;
  if(s.playoffs.enabled){
    const info = clinchElimInfo(teamId);
    const berthSettled = info.clinched || info.eliminated;
    if(!berthSettled) return false;
    // Bye: moot once eliminated (there's no bye to chase). Otherwise, byes depend on final
    // seeding structure in ways that are hard to prove airtight the same way a playoff
    // berth can be, so this uses the same combined analytical+simulation read as the "B"
    // standings letter as a good-faith best estimate rather than a hard guarantee.
    if(!info.eliminated){
      if(!byeSettledFor(teamId)) return false;
    }
  }
  // Division / conference / league titles: purely analytical, either already clinched or
  // mathematically impossible. These can take a while to resolve for teams still in the
  // hunt for one \u2014 that's correct, not a bug: if a game could still affect who wins a
  // title, it does matter, even once the playoff picture itself is settled.
  if(!isTitleSettled(teamId, 'league')) return false;
  if(s.useConferences && !isTitleSettled(teamId, 'conference')) return false;
  if(!isTitleSettled(teamId, 'division')) return false;
  return true;
}
function computeByeMap(){
  const t=App.current, s=t.settings, p=s.playoffs;
  const map={};
  if(!p.enabled) return map;
  const regGames = t.games.filter(g=>!g.isPlayoff);
  const anyRemaining = regGames.some(g=>g.homeScore==null);
  if(anyRemaining) return map;
  const leagueRows = standingsRows(t.teams, t.games, false);
  const madeSet = computeMadeSet(leagueRows, regGames);
  computeByeRecipients(madeSet, regGames).forEach(id=>map[id]=true);
  return map;
}
function getsBye(teamId){
  return !!ensureStandingsCache().byeMap[teamId];
}
function clinchElimInfo(teamId){
  return ensureStandingsCache().clinchMap[teamId] || {clinched:false, eliminated:false};
}
function titleClinched(teamId, scope){
  const cache=ensureStandingsCache();
  if(scope==='league') return !!cache.titleLeagueMap[teamId];
  if(scope==='conference') return cache.titleConfMap ? !!cache.titleConfMap[teamId] : false;
  return !!cache.titleDivMap[teamId];
}
function scenarioText(teamId){
  const t=App.current, s=t.settings;
  const info=clinchElimInfo(teamId);
  if(info.clinched) return 'Has already clinched a playoff spot.';
  if(info.eliminated) return 'Eliminated \u2014 no path to the playoffs remains.';
  const remaining = t.games.filter(g=>!g.isPlayoff && g.homeScore==null && (g.home===teamId||g.away===teamId));
  if(!remaining.length) return 'Season complete \u2014 waiting on other results.';
  const withOpp = remaining.map(g=>{
    const oppId = g.home===teamId?g.away:g.home;
    const oppRec = computeRecord(oppId, t.games.filter(x=>!x.isPlayoff));
    return {oppId, pct:oppRec.pct};
  }).sort((a,b)=>b.pct-a.pct);
  const toughest = withOpp[0], easiest = withOpp[withOpp.length-1];
  let text = `Needs strong results from its final ${remaining.length} game(s) to secure a spot`;
  if(toughest) text += ` \u2014 a win over ${esc(teamName(toughest.oppId))} would be the biggest swing`;
  if(easiest && easiest.oppId!==toughest.oppId) text += `, and it should aim to beat ${esc(teamName(easiest.oppId))} regardless`;
  return text+'.';
}

/* ---- relegation clinch/simulation ---- */
function computeTierClinchMaps(){
  const t=App.current, s=t.settings;
  const promotedMap={}, relegatedMap={}, tierChampMap={};
  if(!s.relegation.enabled) return {promotedMap, relegatedMap, tierChampMap};
  const remCount = computeRemainingCountMap();
  s.divisionNames.forEach((tierName, tierIdx)=>{
    const pool = t.teams.filter(x=>x.division===tierName);
    const rows = standingsRows(pool, t.games, false);
    const numMoving = s.relegation.numMoving||0;
    if(tierIdx>0) rows.forEach(r=>{ promotedMap[r.team.id]=computeClinchElimForPoolRows(r.team.id, rows, numMoving, remCount).clinched; });
    if(tierIdx<s.divisionNames.length-1){
      const reversedRows = rows.slice().reverse();
      rows.forEach(r=>{ relegatedMap[r.team.id]=computeClinchElimForPoolRows(r.team.id, reversedRows, numMoving, remCount).clinched; });
    }
    if(rows.length){
      const leader=rows[0];
      const anyRemaining = rows.some(r=>(remCount[r.team.id]||0)>0);
      const maxPtsPerWin = Math.max(s.scoring.win,s.scoring.otWin,s.scoring.pkWin);
      if(!anyRemaining) tierChampMap[leader.team.id]=true;
      else { const others=rows.filter(r=>r.team.id!==leader.team.id); tierChampMap[leader.team.id]=others.every(r=>(r.points+(remCount[r.team.id]||0)*maxPtsPerWin) < leader.points); }
    }
  });
  return {promotedMap, relegatedMap, tierChampMap};
}
function computeTierSimMaps(){
  const t=App.current, s=t.settings;
  const sims = adaptiveSims(300);
  const promoCount={}, relegCount={}, champCount={};
  t.teams.forEach(tm=>{ promoCount[tm.id]=0; relegCount[tm.id]=0; champCount[tm.id]=0; });
  App._simTiebreakMode=true;
  for(let i=0;i<sims;i++){
    const simGames = simClone(t.games);
    simGames.forEach(g=>{ if(g.homeScore!=null) return; const r=computeRandomScore(g,s); g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk; });
    s.divisionNames.forEach((tierName,tierIdx)=>{
      const pool=t.teams.filter(x=>x.division===tierName);
      const rows=standingsRows(pool, simGames, false);
      const numMoving=s.relegation.numMoving||0;
      if(tierIdx>0) rows.slice(0,numMoving).forEach(r=>promoCount[r.team.id]++);
      if(tierIdx<s.divisionNames.length-1) rows.slice(Math.max(0,rows.length-numMoving)).forEach(r=>relegCount[r.team.id]++);
      if(rows[0]) champCount[rows[0].team.id]++;
    });
  }
  App._simTiebreakMode=false;
  return {sims, promoCount, relegCount, champCount};
}
function ensureTierCache(){
  const t=App.current;
  if(!t.settings.relegation.enabled) return null;
  if(!App.tierCache || App.tierCache.version!==App.dataVersion){
    const promotedMap={}, relegatedMap={}, champMap={};
    if(hasPlayedRegularGame()){
      const a=computeTierClinchMaps();
      const size={}; t.teams.forEach(tm=>{ size[tm.division]=(size[tm.division]||0)+1; });
      t.teams.forEach(tm=>{
        promotedMap[tm.id]=!!a.promotedMap[tm.id];
        // Same principle as playoff elimination: only shown once it's mathematically certain.
        relegatedMap[tm.id]=!!a.relegatedMap[tm.id];
        champMap[tm.id]=(size[tm.division]||0)>1 && !!a.tierChampMap[tm.id];
      });
    }
    App.tierCache = {version:App.dataVersion, promotedMap, relegatedMap, champMap};
  }
  return App.tierCache;
}
function ensureTierOdds(){
  const t=App.current;
  if(!App.tierOddsCache || App.tierOddsCache.version!==App.dataVersion){
    const sim=computeTierSimMaps();
    const promoOddsMap={}, relegOddsMap={}, champOddsMap={};
    t.teams.forEach(tm=>{
      promoOddsMap[tm.id]=Math.round(100*sim.promoCount[tm.id]/sim.sims);
      relegOddsMap[tm.id]=Math.round(100*sim.relegCount[tm.id]/sim.sims);
      champOddsMap[tm.id]=Math.round(100*sim.champCount[tm.id]/sim.sims);
    });
    App.tierOddsCache = {version:App.dataVersion, promoOddsMap, relegOddsMap, champOddsMap};
  }
  return App.tierOddsCache;
}

function generateTiebreakerGames(){
  const t=App.current, s=t.settings;
  if(!s.tiebreakerGame.enabled){ showToast('Enable the extra-game tiebreaker in Settings first'); return; }
  const rows = standingsRows(t.teams, t.games, false);
  let created=0;
  const maxWeek = Math.max(0,...t.games.filter(g=>!g.isPlayoff).map(g=>g.week||0));
  const tied=(r1,r2)=> r1.points===r2.points && r1.pf===r2.pf && r1.pa===r2.pa;
  function maybeCreate(a,b){
    if(isTiebreakerGamePlayed(a.team.id,b.team.id)) return;
    if(t.games.find(g=>g.isTiebreakerGame && g.homeScore==null && ((g.home===a.team.id&&g.away===b.team.id)||(g.home===b.team.id&&g.away===a.team.id)))) return;
    t.games.push({id:uid('g'), week:maxWeek+1, home:a.team.id, away:b.team.id, homeScore:null, awayScore:null, ot:false, otPointsHome:0, otPointsAway:0, pk:false, time:'', location:'', neutralSite:false, isPlayoff:false, isTiebreakerGame:true, seriesId:null});
    created++;
  }
  if(s.tiebreakerGame.scope==='league'){
    if(rows.length>=2 && tied(rows[0],rows[1])) maybeCreate(rows[0],rows[1]);
  } else if(s.tiebreakerGame.scope==='playoff' && s.playoffs.enabled && s.playoffs.basis==='league'){
    const n=s.playoffs.teamsCount;
    if(rows[n-1] && rows[n] && tied(rows[n-1],rows[n])) maybeCreate(rows[n-1],rows[n]);
  } else {
    for(let i=0;i<rows.length-1;i++){ if(tied(rows[i],rows[i+1])) maybeCreate(rows[i],rows[i+1]); }
  }
  scheduleSave(); renderTab();
  showToast(created? `Created ${created} tiebreaker game(s) \u2014 check the Schedule tab` : 'No qualifying tie found right now');
}

/* ================================ STANDINGS TAB ================================ */
function renderStandings(){

const TIEBREAKER_COLUMN_MAP = {points:'pts', pointDiff:'diff', pointsFor:'pf', pointsAgainst:'pa', winPct:'pct', wins:'w', divisionRecord:'divRecord'};
function orderColumnsByTiebreakers(colDefs){
  const tb = App.current.settings.tiebreakers;
  const priority = {};
  tb.forEach((key,i)=>{ const col = TIEBREAKER_COLUMN_MAP[key]; if(col && !(col in priority)) priority[col]=i; });
  return colDefs.map((c,i)=>({c,i})).sort((x,y)=>{
    const px = x.c[0] in priority ? priority[x.c[0]] : Infinity;
    const py = y.c[0] in priority ? priority[y.c[0]] : Infinity;
    if(px!==py) return px-py;
    return x.i-y.i;
  }).map(x=>x.c);
}
function renderStandingsBody(){
  const t=App.current, s=t.settings;
  const cols = s.standingsColumns;
  const colDefs = orderColumnsByTiebreakers([
    ['pts','Pts'],['compact','Rec'],['gp','GP'],['w','W'],['l','L'],['t','T'],['otw','OTW'],['otl','OTL'],['pkw','PKW'],['pkl','PKL'],
    ['pf','PF'],['pa','PA'],['diff','Diff'],['pct','Pct'],['divRecord','Div'],['homeRec','Home'],['awayRec','Away'],['streak','Strk'],['gb','GB']
  ].filter(([k])=>cols[k]||k==='gb'||k==='pts'||k==='gp'||k==='compact'));
  recordFirst(colDefs);   // record always leads the stat columns
  function divisionRecordText(teamId){
    const tm=t.teams.find(x=>x.id===teamId);
    if(!tm) return '-';
    const divGames = t.games.filter(g=>{
      if(g.isPlayoff) return false;
      const h=t.teams.find(x=>x.id===g.home), a=t.teams.find(x=>x.id===g.away);
      return h && a && h.division===tm.division && a.division===tm.division;
    });
    return formatRecord(computeRecord(teamId, divGames));
  }

  function tableFor(teams, title, cutoffCount, tierDivisionName){
    const baseRows = standingsRows(teams, t.games, false, s.subPlayoffs.countsAsRegularSeason);
    let rows = baseRows.slice();
    const naturalOrder = !App.standingsSort.key;
    if(App.standingsSort.key){
      rows.sort((a,b)=>{
        const val=(r)=>{
          if(App.standingsSort.key==='compact') return r.w;
          if(App.standingsSort.key==='pts') return r.points;
          if(App.standingsSort.key==='pct') return r.pct;
          if(App.standingsSort.key==='streak') return r.results.length;
          if(App.standingsSort.key==='gb') return -gbOf(r,baseRows);
          return r[App.standingsSort.key];
        };
        return (val(b)-val(a))*App.standingsSort.dir;
      });
    }
    function gbOf(r, refRows){
      const leader=refRows[0]; if(!leader) return 0;
      const gb = ((leader.w-r.w)+(r.l-leader.l))/2;
      return Math.max(0, gb);
    }
    const thLabel=(k,l)=>{
      const sorted = App.standingsSort.key===k;
      const cls = sorted ? (App.standingsSort.dir===1?'sorted-asc':'sorted-desc') : 'sortable';
      return `<th class="${cls}" onclick="sortStandings('${k}')">${l}</th>`;
    };
    const showCutoff = naturalOrder && cutoffCount>0 && cutoffCount<rows.length;
    let tierIdx=-1, numMoving=0;
    if(s.relegation.enabled && tierDivisionName!=null){
      tierIdx = s.divisionNames.indexOf(tierDivisionName);
      numMoving = s.relegation.numMoving||0;
    }
    return `<div class="card" style="overflow-x:auto;">
      <h4>${title}</h4>
      <table>
        <thead><tr><th class="team-cell">Team</th>${colDefs.map(([k,l])=>thLabel(k,l)).join('')}</tr></thead>
        <tbody>
          ${rows.map((r,idx)=>{
            const i = baseRows.findIndex(x=>x.team.id===r.team.id);
            let letters='';
            if(!App.prefs.perf.standingsLetters){ /* letters turned off in Speed settings */ }
            else if(s.relegation.enabled && tierIdx>=0){
              const tc = ensureTierCache();
              if(tc){
                if(tc.champMap[r.team.id]) letters+='<span class="letter Z">Z</span>';
                if(tc.promotedMap[r.team.id]) letters+='<span class="letter P">P</span>';
                if(tc.relegatedMap[r.team.id]) letters+='<span class="letter E">E</span>';
              }
            } else {
              if(titleClinched(r.team.id,'league')) letters+='<span class="letter Z">Z</span>';
              if(s.useConferences && titleClinched(r.team.id,'conference')) letters+='<span class="letter Y">Y</span>';
              if(titleClinched(r.team.id,'division')) letters+='<span class="letter X">X</span>';
              const info = s.playoffs.enabled ? clinchElimInfo(r.team.id) : {clinched:false,eliminated:false};
              if(info.clinched) letters+='<span class="letter P">P</span>';
              if(s.playoffs.enabled && getsBye(r.team.id)) letters+='<span class="letter B">B</span>';
              if(info.eliminated) letters+='<span class="letter E">E</span>';
            }
            const gb = gbOf(r, baseRows);
            const cutoffRow = showCutoff && idx===cutoffCount ? `<tr class="cutoff-row"><td colspan="${colDefs.length+1}" style="padding:0;border-bottom:2px dashed var(--accent2);"></td></tr>` : '';
            return `${cutoffRow}<tr>
              <td class="team-cell" style="cursor:pointer;" onclick="openTeamModal('${r.team.id}')">${i+1}. ${teamBadgeHtml(r.team.id)}${esc(r.team.name)}${letters}</td>
              ${colDefs.map(([k])=>{
                if(k==='pts') return `<td><strong>${r.points}</strong></td>`;
                if(k==='gp') return `<td>${r.gp}</td>`;
                if(k==='compact') return `<td>${formatRecord(r)}</td>`;
                if(k==='pct') return `<td>${r.pct.toFixed(3)}</td>`;
                if(k==='streak') return `<td>${streakOf(r.results)}</td>`;
                if(k==='diff') return `<td>${r.diff>0?'+':''}${r.diff}</td>`;
                if(k==='gb') return `<td>${gb===0?'-':gb}</td>`;
                if(k==='divRecord') return `<td>${divisionRecordText(r.team.id)}</td>`;
                if(k==='homeRec') return `<td>${formatRecord(computeRecord(r.team.id, t.games.filter(g=>isRegularSeasonGame(g) && g.home===r.team.id)))}</td>`;
                if(k==='awayRec') return `<td>${formatRecord(computeRecord(r.team.id, t.games.filter(g=>isRegularSeasonGame(g) && g.away===r.team.id)))}</td>`;
                return `<td>${r[k]}</td>`;
              }).join('')}
            </tr>`;
          }).join('') || `<tr><td colspan="${colDefs.length+1}" class="muted">No teams</td></tr>`}
        </tbody>
      </table>
      ${showCutoff?'<div class="muted" style="font-size:10.5px;margin-top:4px;">Dashed line marks the current playoff cutoff.</div>':''}
    </div>`;
  }
  function streakOf(results){
    if(!results.length) return '-';
    const last=results[results.length-1]; let n=0;
    for(let i=results.length-1;i>=0;i--){ if(results[i]===last) n++; else break; }
    return last+n;
  }

  if(s.relegation.enabled){
    return s.divisionNames.map((d,di)=>tableFor(t.teams.filter(x=>x.division===d), d, 0, d) + renderRelegationPlayoffSection(d, di)).join('');
  }
  if(App.standingsScope==='league') return tableFor(t.teams,'League standings', s.playoffs.enabled && s.playoffs.basis==='league' ? s.playoffs.teamsCount : 0);
  if(App.standingsScope==='conference'){
    const cutoff = s.playoffs.enabled && s.playoffs.basis==='conference' ? s.playoffs.perGroupCount : 0;
    return s.conferenceNames.map(c=>tableFor(t.teams.filter(x=>x.conference===c), c, cutoff)).join('');
  }
  if(App.standingsScope==='division'){
    const cutoff = s.playoffs.enabled && s.playoffs.basis==='division' ? s.playoffs.perGroupCount : 0;
    return s.divisionNames.map(d=>tableFor(t.teams.filter(x=>x.division===d), d, cutoff)).join('');
  }
  if(App.standingsScope==='wildcard'){
    const p=s.playoffs;
    if(p.basis==='league'){
      return `<div class="empty">With "top teams \u2014 league" as the playoff basis, there's no separate wildcard race \u2014 the League standings tab's cutoff line already shows exactly who's in.</div>`;
    }
    const names = p.basis==='conference' && s.useConferences ? s.conferenceNames : s.divisionNames;
    const keyFn = p.basis==='conference' ? (x=>x.conference) : (x=>x.division);

    if(p.wildcardScope==='group'){
      return names.map(grp=>{
        const pool=t.teams.filter(x=>keyFn(x)===grp);
        const rows=standingsRows(pool,t.games,false,s.subPlayoffs.countsAsRegularSeason);
        return `<div class="card" style="overflow-x:auto;"><h4>${esc(grp)}</h4>${wildcardTables(rows, p.perGroupCount, p.wildcardCount)}</div>`;
      }).join('');
    }

    let raceBlock;
    if(p.wildcardScope==='conference' && p.basis==='division' && s.useConferences){
      raceBlock = s.conferenceNames.map(conf=>{
        const confDivisions = s.divisionNames.filter(d=>(s.divisionConference||{})[d]===conf);
        const autoIds=new Set();
        confDivisions.forEach(d=>{
          const rows=standingsRows(t.teams.filter(x=>x.division===d), t.games, false, s.subPlayoffs.countsAsRegularSeason);
          rows.slice(0,p.perGroupCount).forEach(r=>autoIds.add(r.team.id));
        });
        const confRows = standingsRows(t.teams.filter(x=>x.conference===conf), t.games, false, s.subPlayoffs.countsAsRegularSeason).filter(r=>!autoIds.has(r.team.id));
        return `<div class="card" style="overflow-x:auto;"><h4>${esc(conf)} wildcard race</h4>${wildcardTables(confRows, 0, p.wildcardCount)}</div>`;
      }).join('');
    } else {
      const autoIds = new Set();
      names.forEach(grp=>{
        const rows=standingsRows(t.teams.filter(x=>keyFn(x)===grp),t.games,false,s.subPlayoffs.countsAsRegularSeason);
        rows.slice(0,p.perGroupCount).forEach(r=>autoIds.add(r.team.id));
      });
      const leagueRows = standingsRows(t.teams, t.games, false, s.subPlayoffs.countsAsRegularSeason).filter(r=>!autoIds.has(r.team.id));
      raceBlock = `<div class="card" style="overflow-x:auto;"><h4>League-wide wildcard race</h4>${wildcardTables(leagueRows, 0, p.wildcardCount)}</div>`;
    }
    return raceBlock;
  }
  return '';
}
function wildcardTables(rows, autoCount, wildcardCount){
  const s=App.current.settings, cols=s.standingsColumns;
  const colDefs = orderColumnsByTiebreakers([
    ['gp','GP'],['w','W'],['l','L'],['t','T'],['otw','OTW'],['otl','OTL'],['pkw','PKW'],['pkl','PKL'],
    ['pf','PF'],['pa','PA'],['diff','Diff'],['pct','Pct']
  ].filter(([k])=>cols[k]||k==='gp'));
  function cell(r,k){
    if(k==='pct') return r.pct.toFixed(3);
    if(k==='diff') return (r.diff>0?'+':'')+r.diff;
    return r[k];
  }
  const hunt = rows.slice(autoCount);
  const cutoff = hunt[Math.min(wildcardCount, hunt.length)-1] || hunt[hunt.length-1];
  const huntTbl = hunt.length ? `
    <div class="muted" style="font-size:11px;margin-top:8px;">Wildcard hunt \u2014 top ${wildcardCount} get in</div>
    <table><thead><tr><th class="team-cell">Team</th><th>Rec</th><th>Pts</th><th>Behind cutoff</th>${colDefs.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead>
    <tbody>${hunt.map((r,i)=>{
      const behind = cutoff? r.points-cutoff.points : 0;
      return `<tr><td class="team-cell" style="cursor:pointer;" onclick="openTeamModal('${r.team.id}')">${i+1}. ${esc(r.team.name)} ${i<wildcardCount?'<span class="pill">in</span>':''}</td><td>${formatRecord(r)}</td><td>${r.points}</td><td>${i<wildcardCount?'-':(behind>=0?'+':'')+behind}</td>${colDefs.map(([k])=>`<td>${cell(r,k)}</td>`).join('')}</tr>`;
    }).join('')}</tbody></table>` : '<div class="muted">No teams outside the automatic qualifiers.</div>';
  return huntTbl;
}

function rankTeamsForSim(teams, seedingBy, simGames){
  const t=App.current, s=t.settings;
  if(!teams.length) return [];
  const overallRows = standingsRows(t.teams, simGames, false);
  const overallOrder = {}; overallRows.forEach((r,i)=>overallOrder[r.team.id]=i);
  if(seedingBy==='division'){
    const byDiv={};
    s.divisionNames.forEach(d=> byDiv[d]=standingsRows(t.teams.filter(x=>x.division===d), simGames, false));
    return teams.slice().sort((a,b)=>{
      const ra=(byDiv[a.division]||[]).findIndex(r=>r.team.id===a.id);
      const rb=(byDiv[b.division]||[]).findIndex(r=>r.team.id===b.id);
      if(ra!==rb) return ra-rb;
      return overallOrder[a.id]-overallOrder[b.id];
    }).map(x=>x.id);
  }
  if(seedingBy==='conference' && s.useConferences){
    const byConf={};
    s.conferenceNames.forEach(c=> byConf[c]=standingsRows(t.teams.filter(x=>x.conference===c), simGames, false));
    return teams.slice().sort((a,b)=>{
      const ra=(byConf[a.conference]||[]).findIndex(r=>r.team.id===a.id);
      const rb=(byConf[b.conference]||[]).findIndex(r=>r.team.id===b.id);
      if(ra!==rb) return ra-rb;
      return overallOrder[a.id]-overallOrder[b.id];
    }).map(x=>x.id);
  }
  return teams.slice().sort((a,b)=>overallOrder[a.id]-overallOrder[b.id]).map(x=>x.id);
}
function computeByeRecipients(madeSet, simGames){
  const t=App.current, s=t.settings, p=s.playoffs;
  const qualified = t.teams.filter(tm=>madeSet.has(tm.id));
  if(!qualified.length) return [];
  let groups;
  if(s.useConferences && p.mergeBracket){
    const byKey = p.separateSeedBy==='division' ? (x=>x.division) : (x=>x.conference);
    const names = p.separateSeedBy==='division' ? s.divisionNames : s.conferenceNames;
    groups = names.map(name=>qualified.filter(x=>byKey(x)===name)).filter(g=>g.length>0);
  } else {
    groups = [qualified];
  }
  const result=[];
  groups.forEach(groupTeams=>{
    const ranked = rankTeamsForSim(groupTeams, p.seedingBy, simGames);
    const n=ranked.length;
    let size=1; while(size<n) size*=2;
    const numByes = size-n;
    if(numByes>0) ranked.slice(0,numByes).forEach(id=>result.push(id));
  });
  return result;
}
function computeOddsData(){
  const t=App.current, s=t.settings, P=App.prefs.perf, oc=P.oddsCols;
  const remaining = t.games.filter(g=>!g.isPlayoff && g.homeScore==null);
  const wantMade = s.playoffs.enabled && oc.playoff, wantBye = s.playoffs.enabled && oc.bye;
  const wantDiv = !!oc.division, wantConf = s.useConferences && oc.conference, wantLeague = !!oc.league;
  const anySim = wantMade || wantBye || wantDiv || wantConf || wantLeague;
  const sims = adaptiveSims(300);
  const madeCount={}, divCount={}, confCount={}, leagueCount={}, byeCount={};
  t.teams.forEach(tm=>{ madeCount[tm.id]=0; divCount[tm.id]=0; confCount[tm.id]=0; leagueCount[tm.id]=0; byeCount[tm.id]=0; });
  if(anySim){
    App._simTiebreakMode=true;
    try{
      for(let i=0;i<sims;i++){
        const simGames = simClone(t.games);
        simGames.forEach(g=>{
          if(g.homeScore!=null) return;
          const r = computeRandomScore(g, s);
          g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk;
        });
        const leagueRows = (wantMade||wantBye||wantLeague) ? standingsRows(t.teams, simGames, false) : null;
        let madeSet=null;
        if(wantMade || wantBye){
          madeSet = computeMadeSet(leagueRows, simGames);
          if(wantMade) madeSet.forEach(id=>madeCount[id]++);
        }
        if(wantDiv){
          s.divisionNames.forEach(d=>{
            const divRows = standingsRows(t.teams.filter(x=>x.division===d), simGames, false);
            if(divRows[0]) divCount[divRows[0].team.id]++;
          });
        }
        if(wantConf){
          s.conferenceNames.forEach(c=>{
            const confRows = standingsRows(t.teams.filter(x=>x.conference===c), simGames, false);
            if(confRows[0]) confCount[confRows[0].team.id]++;
          });
        }
        if(wantLeague && leagueRows[0]) leagueCount[leagueRows[0].team.id]++;
        if(wantBye) computeByeRecipients(madeSet, simGames).forEach(id=>{ if(byeCount[id]!=null) byeCount[id]++; });
      }
    } finally { App._simTiebreakMode=false; }
  }
  const rows = standingsRows(t.teams, t.games, false);
  const leftMap={}; remaining.forEach(g=>{ leftMap[g.home]=(leftMap[g.home]||0)+1; leftMap[g.away]=(leftMap[g.away]||0)+1; });
  const pc=(n)=>Math.round(100*n/sims);
  const oddsRows = rows.map(r=>({
    teamId:r.team.id, teamName:r.team.name, points:r.points, left:leftMap[r.team.id]||0,
    pct: wantMade?pc(madeCount[r.team.id]):null,
    divPct: wantDiv?pc(divCount[r.team.id]):null,
    confPct: wantConf?pc(confCount[r.team.id]):null,
    leaguePct: wantLeague?pc(leagueCount[r.team.id]):null,
    byePct: wantBye?pc(byeCount[r.team.id]):null
  }));
  let scenarioBlocks=[];
  if(P.clinchScenarios && s.playoffs.enabled){
    scenarioBlocks = rows.map(r=>{
      const left = leftMap[r.team.id]||0;
      if(left>4 || left===0) return null;
      const info = clinchElimInfo(r.team.id);
      if(info.clinched || info.eliminated) return null;
      const nextGame = remaining.filter(g=>g.home===r.team.id||g.away===r.team.id).sort((a,b)=>a.week-b.week)[0];
      return {teamId:r.team.id, teamName:r.team.name, nextGame};
    }).filter(Boolean);
  }
  let sosRows=[];
  if(P.sos){
    const pctMap=regPctMap();
    const avg=(ids)=> ids.length ? ids.reduce((a,id)=>a+(pctMap[id]||0),0)/ids.length : 0;
    sosRows = t.teams.map(tm=>{
      const all = t.games.filter(g=>!g.isPlayoff && (g.home===tm.id||g.away===tm.id));
      const sosAll = avg(all.map(g=>g.home===tm.id?g.away:g.home));
      const oppIdsRem = remaining.filter(g=>g.home===tm.id||g.away===tm.id).map(g=>g.home===tm.id?g.away:g.home);
      const sosRem = avg(oppIdsRem);
      const oppPcts = oppIdsRem.map(id=>({id,pct:pctMap[id]||0})).sort((a,b)=>b.pct-a.pct);
      const hardest = oppPcts[0]?teamName(oppPcts[0].id):'-';
      const easiest = oppPcts[oppPcts.length-1]?teamName(oppPcts[oppPcts.length-1].id):'-';
      return {teamId:tm.id, teamName:tm.name, sosAll, sosRem, hardest, easiest};
    });
  }
  return {version:App.dataVersion, oddsRows, sosRows, scenarioBlocks};
}

/* Monte Carlo sizing: instead of a few hard-coded size thresholds (which cause sudden
   cliffs in accuracy right at the boundary), scale continuously against an actual cost
   estimate for one simulation \u2014 mainly the number of still-unplayed games that need a
   random result, plus a smaller per-team cost for re-sorting standings each pass. A
   fixed "budget" of total simulated-game-units caps the real wall-clock work regardless
   of league size, so small leagues stay at full requested accuracy (cheap either way)
   and huge leagues degrade smoothly rather than falling off a cliff. */
function adaptiveSims(base){
  const t=App.current;
  if(!t) return base;
  const q = ({fast:0.25, balanced:0.6, accurate:1})[App.prefs.perf.simQuality] || 0.6;
  const n = t.teams.length || 1;
  const remaining = t.games.filter(g=>!g.isPlayoff && g.homeScore==null).length;
  const costPerSim = Math.max(1, remaining) + n*0.3;
  const budget = 160000*q;
  const sims = Math.round(budget / costPerSim);
  return Math.max(12, Math.min(Math.round(base*q), sims));
}
function avgOppWinPct(oppIds){
  if(!oppIds.length) return 0;
  const map = regPctMap();
  return oppIds.reduce((a,id)=>a+(map[id]||0),0)/oppIds.length;
}
function simulateOutlook(teamId, sims, forcedGameId, forcedOutcome){
  sims = sims || adaptiveSims(150);
  const t=App.current, s=t.settings;
  const tm=t.teams.find(x=>x.id===teamId);
  if(!tm) return {playoffs:null, division:null, conference:null, league:null, bye:null};
  let makePlayoffs=0, winDivision=0, winConference=0, winLeague=0, gotBye=0;
  App._simTiebreakMode=true;
  for(let i=0;i<sims;i++){
    const simGames = simClone(t.games);
    simGames.forEach(g=>{
      if(g.homeScore!=null) return;
      if(forcedGameId && g.id===forcedGameId){
        if(forcedOutcome==='home'){ g.homeScore=1; g.awayScore=0; g.ot=false; }
        else if(forcedOutcome==='away'){ g.homeScore=0; g.awayScore=1; g.ot=false; }
        else if(forcedOutcome==='home_ot'){ g.homeScore=2; g.awayScore=1; g.ot=true; }
        else if(forcedOutcome==='away_ot'){ g.homeScore=1; g.awayScore=2; g.ot=true; }
        else if(forcedOutcome==='tie'){ g.homeScore=1; g.awayScore=1; g.ot=false; }
        else { g.homeScore=1; g.awayScore=0; g.ot=false; }
        return;
      }
      const r = computeRandomScore(g, s);
      g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk;
    });
    const leagueRows = standingsRows(t.teams, simGames, false);
    if(s.playoffs.enabled){
      const madeSet = computeMadeSet(leagueRows, simGames);
      if(madeSet.has(teamId)) makePlayoffs++;
      if(computeByeRecipients(madeSet, simGames).includes(teamId)) gotBye++;
    }
    const divRows = standingsRows(t.teams.filter(x=>x.division===tm.division), simGames, false);
    if(divRows[0] && divRows[0].team.id===teamId) winDivision++;
    if(s.useConferences){
      const confRows = standingsRows(t.teams.filter(x=>x.conference===tm.conference), simGames, false);
      if(confRows[0] && confRows[0].team.id===teamId) winConference++;
    }
    if(leagueRows[0] && leagueRows[0].team.id===teamId) winLeague++;
  }
  App._simTiebreakMode=false;
  return {
    playoffs: s.playoffs.enabled ? Math.round(100*makePlayoffs/sims) : null,
    division: Math.round(100*winDivision/sims),
    conference: s.useConferences ? Math.round(100*winConference/sims) : null,
    league: Math.round(100*winLeague/sims),
    bye: s.playoffs.enabled ? Math.round(100*gotBye/sims) : null
  };
}
/* Same simulation as simulateOutlook, but for two teams at once out of ONE shared batch of
   random seasons instead of two independent batches. gameOddsScenarioTable and the matchup
   "outlook" block used to call simulateOutlook twice per scenario (once for each team) even
   though both calls were simulating the exact same random season and just reading a
   different team's result out of it \u2014 this halves that redundant work. */
function simulateOutlookPair(teamIdA, teamIdB, sims, forcedGameId, forcedOutcome){
  sims = sims || adaptiveSims(150);
  const t=App.current, s=t.settings;
  const tmA=t.teams.find(x=>x.id===teamIdA), tmB=t.teams.find(x=>x.id===teamIdB);
  const blank=()=>({playoffs:null, division:null, conference:null, league:null, bye:null});
  if(!tmA && !tmB) return {a:blank(), b:blank()};
  const cA={playoffs:0,division:0,conference:0,league:0,bye:0};
  const cB={playoffs:0,division:0,conference:0,league:0,bye:0};
  const sameDivision = tmA && tmB && tmA.division===tmB.division;
  const sameConference = tmA && tmB && s.useConferences && tmA.conference===tmB.conference;
  App._simTiebreakMode=true;
  for(let i=0;i<sims;i++){
    const simGames = simClone(t.games);
    simGames.forEach(g=>{
      if(g.homeScore!=null) return;
      if(forcedGameId && g.id===forcedGameId){
        if(forcedOutcome==='home'){ g.homeScore=1; g.awayScore=0; g.ot=false; }
        else if(forcedOutcome==='away'){ g.homeScore=0; g.awayScore=1; g.ot=false; }
        else if(forcedOutcome==='home_ot'){ g.homeScore=2; g.awayScore=1; g.ot=true; }
        else if(forcedOutcome==='away_ot'){ g.homeScore=1; g.awayScore=2; g.ot=true; }
        else if(forcedOutcome==='tie'){ g.homeScore=1; g.awayScore=1; g.ot=false; }
        else { g.homeScore=1; g.awayScore=0; g.ot=false; }
        return;
      }
      const r = computeRandomScore(g, s);
      g.homeScore=r.h; g.awayScore=r.a; g.ot=r.ot; g.pk=r.pk;
    });
    const leagueRows = standingsRows(t.teams, simGames, false);
    let madeSet=null, byeRecipients=null;
    if(s.playoffs.enabled){
      madeSet = computeMadeSet(leagueRows, simGames);
      byeRecipients = computeByeRecipients(madeSet, simGames);
      if(tmA && madeSet.has(teamIdA)) cA.playoffs++;
      if(tmB && madeSet.has(teamIdB)) cB.playoffs++;
      if(tmA && byeRecipients.includes(teamIdA)) cA.bye++;
      if(tmB && byeRecipients.includes(teamIdB)) cB.bye++;
    }
    if(tmA){
      const divRowsA = standingsRows(t.teams.filter(x=>x.division===tmA.division), simGames, false);
      if(divRowsA[0] && divRowsA[0].team.id===teamIdA) cA.division++;
      if(sameDivision && divRowsA[0] && divRowsA[0].team.id===teamIdB) cB.division++;
      if(s.useConferences){
        const confRowsA = standingsRows(t.teams.filter(x=>x.conference===tmA.conference), simGames, false);
        if(confRowsA[0] && confRowsA[0].team.id===teamIdA) cA.conference++;
        if(sameConference && confRowsA[0] && confRowsA[0].team.id===teamIdB) cB.conference++;
      }
    }
    if(tmB && !sameDivision){
      const divRowsB = standingsRows(t.teams.filter(x=>x.division===tmB.division), simGames, false);
      if(divRowsB[0] && divRowsB[0].team.id===teamIdB) cB.division++;
    }
    if(tmB && s.useConferences && !sameConference){
      const confRowsB = standingsRows(t.teams.filter(x=>x.conference===tmB.conference), simGames, false);
      if(confRowsB[0] && confRowsB[0].team.id===teamIdB) cB.conference++;
    }
    if(leagueRows[0]){
      if(tmA && leagueRows[0].team.id===teamIdA) cA.league++;
      if(tmB && leagueRows[0].team.id===teamIdB) cB.league++;
    }
  }
  App._simTiebreakMode=false;
  function finalize(c, tm){
    if(!tm) return blank();
    return {
      playoffs: s.playoffs.enabled ? Math.round(100*c.playoffs/sims) : null,
      division: Math.round(100*c.division/sims),
      conference: s.useConferences ? Math.round(100*c.conference/sims) : null,
      league: Math.round(100*c.league/sims),
      bye: s.playoffs.enabled ? Math.round(100*c.bye/sims) : null
    };
  }
  return {a: finalize(cA, tmA), b: finalize(cB, tmB)};
}
function outlookRowHtml(label, o){
  const s=App.current.settings;
  const poCols = s.playoffs.enabled ? `<td>${o.playoffs}%</td><td>${o.bye!=null?o.bye:0}%</td>` : '';
  return `<tr><td class="team-cell">${label}</td>${poCols}<td>${o.division}%</td>${o.conference!=null?`<td>${o.conference}%</td>`:''}<td>${o.league}%</td></tr>`;
}
function outlookHeaderHtml(){
  const s=App.current.settings;
  const poCols = s.playoffs.enabled ? '<th>Make playoffs</th><th>Get a bye</th>' : '';
  return `<tr><th class="team-cell"></th>${poCols}<th>Win division</th>${s.useConferences?'<th>Win conference</th>':''}<th>Win league</th></tr>`;
}
function scoringLegendHtml(){
  const sc=App.current.settings.scoring;
  const parts=[`Win ${sc.win}`,`Loss ${sc.loss}`];
  if(sc.tie) parts.push(`Tie ${sc.tie}`);
  parts.push(`OT win ${sc.otWin}`, `OT loss ${sc.otLoss}`);
  if(sc.pkWin!==sc.otWin || sc.pkLoss!==sc.otLoss) parts.push(`Shootout/PK win ${sc.pkWin}`, `Shootout/PK loss ${sc.pkLoss}`);
  return `<div class="muted" style="font-size:11px;margin:4px 0;">Standings points used for these odds: ${parts.join(' \u00b7 ')}</div>`;
}
function teamOutlookTable(teamId){
  if(App.current.settings.relegation.enabled) return '';
  const cacheKey = 'outlook:'+teamId;
  if(!App.htmlCache) App.htmlCache={};
  const cached = App.htmlCache[cacheKey];
  if(cached && cached.version===App.dataVersion) return cached.html;
  const o = simulateOutlook(teamId, adaptiveSims(150));
  const title = App.current.settings.playoffs.enabled ? 'Playoff outlook' : 'Title outlook';
  const html = `<h4 style="margin-top:12px;">${title}</h4>${scoringLegendHtml()}
  <table class="odds-table"><thead>${outlookHeaderHtml()}</thead><tbody>${outlookRowHtml('Right now', o)}</tbody></table>`;
  App.htmlCache[cacheKey] = {version:App.dataVersion, html};
  return html;
}
function gameOddsScenarioTable(g){
  const t=App.current, s=t.settings, oc=App.prefs.perf.game.outcomes;
  if(g.homeScore!=null || !g.home || !g.away) return '';
  const otOn = (g.isPlayoff ? s.playoffs.otEnabledPlayoffs : s.playoffs.otEnabledRegular) && (s.scoring.win!==s.scoring.otWin || s.scoring.loss!==s.scoring.otLoss);
  const tieOn = !g.isPlayoff && s.allowTiesRegular;
  const wantHome=!!oc.homeWin, wantAway=!!oc.awayWin, wantOT=!!oc.ot && otOn, wantTie=!!oc.tie && tieOn;
  if(!wantHome && !wantAway && !wantOT && !wantTie) return '';
  return cachedHtml('oddsTable:'+g.id+':'+App.prefs.perf.simQuality+':'+[wantHome,wantAway,wantOT,wantTie].join(''), ()=>{
    const n30 = adaptiveSims(100);
    const hn=esc(teamName(g.home)), an=esc(teamName(g.away));
    let rows='';
    if(wantHome){
      const p = simulateOutlookPair(g.home, g.away, n30, g.id, 'home');
      rows += outlookRowHtml(hn+' wins', p.a) + outlookRowHtml(an+' loses', p.b);
    }
    if(wantAway){
      const p = simulateOutlookPair(g.home, g.away, n30, g.id, 'away');
      rows += outlookRowHtml(hn+' loses', p.a) + outlookRowHtml(an+' wins', p.b);
    }
    if(wantOT){
      const pH = simulateOutlookPair(g.home, g.away, n30, g.id, 'home_ot');
      const pA = simulateOutlookPair(g.home, g.away, n30, g.id, 'away_ot');
      rows += outlookRowHtml(hn+' wins in OT', pH.a) + outlookRowHtml(hn+' loses in OT', pA.a)
            + outlookRowHtml(an+' wins in OT', pA.b) + outlookRowHtml(an+' loses in OT', pH.b);
    }
    if(wantTie){
      const p = simulateOutlookPair(g.home, g.away, n30, g.id, 'tie');
      rows += outlookRowHtml(hn+' \u2014 tie', p.a) + outlookRowHtml(an+' \u2014 tie', p.b);
    }
    return `<h4 style="margin-top:14px;">If this game goes each way</h4>${scoringLegendHtml()}
    <table class="odds-table"><thead>${outlookHeaderHtml()}</thead><tbody>${rows}</tbody></table>`;
  });
}
function finalWeekImpactText(g){
  const t=App.current, oc=App.prefs.perf.game.outcomes;
  if(!t.settings.playoffs.enabled || g.homeScore!=null || !g.home || !g.away) return '';
  if(!oc.homeWin && !oc.awayWin) return '';
  const regGames = t.games.filter(isRegularSeasonGame);
  const contenders = t.teams.filter(tm=>{
    const info = clinchElimInfo(tm.id);
    return !info.clinched && !info.eliminated;
  });
  if(!contenders.length) return '';
  function classify(forcedWinner){
    const simGames = regGames.map(x=> x.id===g.id ? {...x, homeScore: forcedWinner==='home'?1:0, awayScore: forcedWinner==='home'?0:1} : x);
    const map = computeClinchElimMap(simGames);
    const inList=[], outList=[];
    contenders.forEach(tm=>{
      const info = map[tm.id] || {clinched:false,eliminated:false};
      if(info.clinched) inList.push(tm.name);
      else if(info.eliminated) outList.push(tm.name);
    });
    return {inList, outList};
  }
  const ifHome = oc.homeWin ? classify('home') : null;
  const ifAway = oc.awayWin ? classify('away') : null;
  const has = r => r && (r.inList.length || r.outList.length);
  if(!has(ifHome) && !has(ifAway)) return '';
  function line(winnerName, res){
    const parts=[];
    if(res.inList.length) parts.push(`<strong>${res.inList.map(esc).join(', ')}</strong> would clinch a playoff spot`);
    if(res.outList.length) parts.push(`<strong>${res.outList.map(esc).join(', ')}</strong> would be eliminated`);
    return `<div class="muted" style="font-size:12.5px;">If ${esc(winnerName)} wins: ${parts.length?parts.join('; '):'no change to the playoff picture'}</div>`;
  }
  return `<h4 style="margin-top:14px;">Playoff race impact</h4>
  <div class="col">${ifHome?line(teamName(g.home), ifHome):''}${ifAway?line(teamName(g.away), ifAway):''}</div>`;
}
function computeMadeSet(rows, games){
  const p=App.current.settings.playoffs, t=App.current, s=App.current.settings;
  const made=new Set();
  if(p.basis==='league'){
    rows.slice(0,p.teamsCount).forEach(r=>made.add(r.team.id));
  } else {
    const names = p.basis==='division'? s.divisionNames : s.conferenceNames;
    const keyFn = p.basis==='division'? (x=>x.division) : (x=>x.conference);
    names.forEach(name=>{
      const groupRows = standingsRows(t.teams.filter(x=>keyFn(x)===name), games, false);
      groupRows.slice(0,p.perGroupCount).forEach(r=>made.add(r.team.id));
    });
    if(p.wildcardScope==='league'){
      const remaining = rows.filter(r=>!made.has(r.team.id));
      remaining.slice(0,p.wildcardCount).forEach(r=>made.add(r.team.id));
    } else if(p.wildcardScope==='conference' && p.basis==='division' && s.useConferences){
      s.conferenceNames.forEach(conf=>{
        const confTeams = t.teams.filter(x=>x.conference===conf);
        const confRows = standingsRows(confTeams, games, false).filter(r=>!made.has(r.team.id));
        confRows.slice(0,p.wildcardCount).forEach(r=>made.add(r.team.id));
      });
    } else {
      names.forEach(name=>{
        const groupRows = standingsRows(t.teams.filter(x=>keyFn(x)===name), games, false);
        const rest = groupRows.filter(r=>!made.has(r.team.id));
        rest.slice(0,p.wildcardCount).forEach(r=>made.add(r.team.id));
      });
    }
  }
  return made;
}

          <select onchange="App.playoffFilter.round=this.value;renderTab();"><option value="">All rounds</option>${[...new Set(t.playoffBracket.series.map(s2=>s2.roundName))].map(rn=>`<option ${App.playoffFilter.round===rn?'selected':''}>${esc(rn)}</option>`).join('')}</select>

          <select onchange="App.playoffFilter.gameNum=this.value;renderTab();"><option value="">All game numbers</option>${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${String(App.playoffFilter.gameNum)===String(n)?'selected':''}>Game ${n} of series</option>`).join('')}</select>
          <label class="row" style="align-items:center;"><input type="checkbox" ${App.playoffFilterUnplayed?'checked':''} onchange="App.playoffFilterUnplayed=this.checked;renderTab();"> Unplayed only</label>
        </div>
        <div class="row" style="margin-top:8px;">
          <button class="btn small" onclick="selectAllPlayoffGames()">Select all shown</button>
          <button class="btn small" onclick="App.selectedGames=new Set();renderTab();">Clear selection</button>
          <button class="btn warn" onclick="randomizeSelected()">\ud83c\udfb2 Randomize selected (${App.selectedGames.size})</button>
        </div>
      </div>
      ${renderPlayoffGamesByRound()}
    ` : `<div class="empty">No playoff bracket yet \u2014 auto-seed or set teams manually.</div>`}
    ${hasBracket ? renderHeadToHeadPicker(g=>g.isPlayoff && !g.isSubPlayoff && !g.isRelegationPlayoff) : ''}
  </div>`;
}
function renderPlayoffGamesByRound(){
  const t=App.current;
  const games = filteredPlayoffGames();
  const roundOrder = [...new Set(t.playoffBracket.series.sort((a,b)=>a.round-b.round).map(s=>s.roundName))];
  const seriesOrderIndex = {}; t.playoffBracket.series.forEach((s,i)=>{ seriesOrderIndex[s.id]=i; });
  const byRound = {};
  games.forEach(g=>{
    const sr=t.playoffBracket.series.find(x=>x.id===g.seriesId);
    const rn = sr?sr.roundName:'Other';
    (byRound[rn]=byRound[rn]||[]).push(g);
  });
  Object.keys(byRound).forEach(rn=>{
    byRound[rn].sort((a,b)=>{
      const ia = seriesOrderIndex[a.seriesId]!=null?seriesOrderIndex[a.seriesId]:999999;
      const ib = seriesOrderIndex[b.seriesId]!=null?seriesOrderIndex[b.seriesId]:999999;
      if(ia!==ib) return ia-ib;
      return (a.gameNum||0)-(b.gameNum||0);
    });
  });
  const rounds = roundOrder.filter(rn=>byRound[rn] && byRound[rn].length);
  if(!rounds.length) return `<div class="empty">No playoff games match this filter yet.</div>`;
  return rounds.map(rn=>`
    <div class="card" style="padding:0;overflow:hidden;">
      <h4 style="padding:10px 12px 0 12px;">${esc(rn)}</h4>
      <div class="week-actions">
        <button class="btn small" onclick="selectAllInRound('${esc(rn).replace(/'/g,"\\'")}')">Select all</button>
        <button class="btn small" onclick="clearAllInRound('${esc(rn).replace(/'/g,"\\'")}')">Clear all</button>
      </div>
      <div>${byRound[rn].map(g=>gameRow(g)).join('')}</div>
    </div>
  `).join('') + `<div class="card"><button class="btn warn" onclick="randomizeSelected()">\ud83c\udfb2 Randomize selected (${App.selectedGames.size})</button></div>`;
}
function selectAllInRound(roundName){
  const t=App.current;
  filteredPlayoffGames().forEach(g=>{
    const sr=t.playoffBracket.series.find(x=>x.id===g.seriesId);
    if(sr && sr.roundName===roundName) App.selectedGames.add(g.id);
  });
  renderTab();
}
function clearAllInRound(roundName){
  const t=App.current;
  filteredPlayoffGames().forEach(g=>{
    const sr=t.playoffBracket.series.find(x=>x.id===g.seriesId);
    if(sr && sr.roundName===roundName) App.selectedGames.delete(g.id);
  });
  renderTab();
}
function applyZoom(){ const el=document.getElementById('bracketInner'); if(el) el.style.transform=`scale(${App.bracketZoom})`; }
function toggleFullscreenBracket(){ App.bracketFull=!App.bracketFull; renderTab(); }

function filteredPlayoffGames(){
  const t=App.current, f=App.playoffFilter;
  let games = t.games.filter(g=>g.isPlayoff && !g.isSubPlayoff);
  if(f.round) games=games.filter(g=>{ const sr=t.playoffBracket.series.find(x=>x.id===g.seriesId); return sr&&sr.roundName===f.round; });
  if(f.conf) games=games.filter(g=>{ const sr=t.playoffBracket.series.find(x=>x.id===g.seriesId); return sr&&sr.confLabel===f.conf; });
  if(f.gameNum) games=games.filter(g=>String(g.gameNum)===String(f.gameNum));
  if(App.playoffFilterUnplayed) games=games.filter(g=>g.homeScore==null);
  return games;
}
function selectAllPlayoffGames(){ filteredPlayoffGames().forEach(g=>App.selectedGames.add(g.id)); renderTab(); }

function rankedQualified(teams, seedingBy){
  const t=App.current, s=t.settings;
  if(!teams.length) return teams;
  const overallRows = standingsRows(t.teams, t.games, false);
  const overallOrder = {}; overallRows.forEach((r,i)=>overallOrder[r.team.id]=i);
  if(seedingBy==='division'){
    const byDiv={};
    s.divisionNames.forEach(d=> byDiv[d] = standingsRows(t.teams.filter(x=>x.division===d), t.games, false));
    return teams.slice().sort((a,b)=>{
      const ra=(byDiv[a.division]||[]).findIndex(r=>r.team.id===a.id);
      const rb=(byDiv[b.division]||[]).findIndex(r=>r.team.id===b.id);
      if(ra!==rb) return ra-rb;
      return overallOrder[a.id]-overallOrder[b.id];
    });
  }
  if(seedingBy==='conference' && s.useConferences){
    const byConf={};
    s.conferenceNames.forEach(c=> byConf[c] = standingsRows(t.teams.filter(x=>x.conference===c), t.games, false));
    return teams.slice().sort((a,b)=>{
      const ra=(byConf[a.conference]||[]).findIndex(r=>r.team.id===a.id);
      const rb=(byConf[b.conference]||[]).findIndex(r=>r.team.id===b.id);
      if(ra!==rb) return ra-rb;
      return overallOrder[a.id]-overallOrder[b.id];
    });
  }
  return teams.slice().sort((a,b)=>overallOrder[a.id]-overallOrder[b.id]);
}

function autoSeedPlayoffs(){
  const t=App.current, p=t.settings.playoffs, set=t.settings;
  const regGames = t.games.filter(g=>!g.isPlayoff);
  let madeSet;
  if(p.basis==='league'){
    madeSet = new Set(standingsRows(t.teams,t.games,false).slice(0,p.teamsCount).map(r=>r.team.id));
  } else {
    madeSet = computeMadeSet(standingsRows(t.teams,t.games,false), regGames);
  }
  const qualified = t.teams.filter(tm=>madeSet.has(tm.id));
  if(qualified.length<2){ showToast('Not enough qualifying teams yet'); return; }

  let groups;
  if(set.useConferences && p.mergeBracket){
    const byKey = p.separateSeedBy==='division' ? (x=>x.division) : (x=>x.conference);
    const names = p.separateSeedBy==='division' ? set.divisionNames : set.conferenceNames;
    groups = names.map(name=>{
      const groupQualified = qualified.filter(x=>byKey(x)===name);
      return {label:name, teams: rankedQualified(groupQualified, p.seedingBy)};
    }).filter(g=>g.teams.length>0);
  } else {
    groups = [{label:'League', teams: rankedQualified(qualified, p.seedingBy)}];
  }
  if(!groups.length){ showToast('Not enough qualifying teams yet'); return; }
  buildBracketFromGroups(groups);
  scheduleSave(); renderTab(); showToast('Bracket seeded from regular season');
}
